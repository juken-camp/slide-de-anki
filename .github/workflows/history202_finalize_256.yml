                  keys=list(audit[0]); writer=csv.DictWriter(fh,fieldnames=keys); writer.writeheader();writer.writerows(audit)
              with (REPORT/'priority-historical-content-review.csv').open('w',encoding='utf-8-sig',newline='') as fh:
                  writer=csv.DictWriter(fh,fieldnames=['id','caption','reason']);writer.writeheader();writer.writerows(records)
              report={
                'total_materials':256,'manifest_unchanged_ids':True,
                'image_paths_and_stored_WebP_valid':256,
                'all_raster_bytes_untouched':True,
                'changes':dict(counters),
                'license_statuses_after':dict(statuses),
                'additional_uses_of_identical_images':sum(max(0,len(v)-1) for v in image_hashes.values()),
                'known_historical_content_review_flags':len(records),
                'historical_materials_all_certified':False,
                'still_need_rights_check':sum(statuses[x] for x in ('source_page_review_needed','permission_review_required','unspecified')),
                'prior_manifest_fingerprint':original_fingerprint,
                'warning':'License metadata, improved labels, and longer explanations are NOT proof that a pictured artifact is historically accurate. No historical image replacement was attempted.'
              }
              (REPORT/'summary.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              MANIFEST.write_text(material_out,encoding='utf-8')
              print(json.dumps(report,ensure_ascii=False,indent=2))

          if __name__=='__main__':main()
          PY
      - name: Commit only the updated current material manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- history202/real-materials.json
          if git diff --cached --quiet; then
            echo 'No additional metadata differences'
          else
            git commit -m 'Improve all 256 history material labels, source rights and concise descriptions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload per-item material-quality report
