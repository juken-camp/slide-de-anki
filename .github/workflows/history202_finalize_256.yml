name: History 202 - batch metadata and explanation quality improvement
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history202-final-materials-metadata
  cancel-in-progress: false
jobs:
  improve-all-256:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update only verified rights labels, material classes and short explanations
        shell: bash
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          """Apply non-destructive History 202 material metadata improvements to CURRENT checkout.

          This changes metadata/explanations only. It never modifies any raster file, user chat,
          chapter, speaker, ID, or the source. Failing preconditions abort the update.
          """
          import csv
          import json
          import hashlib
          import os
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          BASE=Path('history202')
          MANIFEST=BASE/'real-materials.json'
          INDEX=BASE/'local-images.json'
          REPORT=Path('history202_material_batch_report')
          GENERIC='写真・絵画など（出典ページで種類を確認）'
          TYPE_MAP={'h01-real-01': '古代遺跡の現在の写真', 'h01-real-02': '古代都市遺跡の現在の写真', 'h02-real-03': '縄文土器（現存する出土品の写真）', 'h02-real-04': '土偶（現存する出土品の写真）', 'h02-real-05': '銅鐸（現存する出土品の写真）', 'h03-real-32': '平安時代の自筆日記（現存原本の写真）', 'wmc-hideyoshi': '人物肖像画（制作年代は別途確認）', 'wmc-saigo': '没後に描かれた人物肖像版画', 'wmc-nobunaga': '人物肖像画（制作年代は別途確認）', 'wmc-shotoku': '後世の伝承肖像（実際の容貌は不明）', 'wmc-yoritomo': '伝・源頼朝肖像画（人物比定に諸説）', 'h05-real-27': '江戸時代の人物肖像画', 'wmc-yoshimune': '人物肖像画（制作年代は別途確認）', 'wmc-yoshinobu': '近代の人物写真', 'h06-real-28': '幕末に撮影された人物写真', 'wmc-iinaosuke': '人物肖像（制作年代は別途確認）', 'wmc-itagaki': '人物写真（撮影年代は別途確認）', 'wmc-okuma': '近代の人物写真', 'wmc-yoshidashoin': '人物肖像（制作年代は別途確認）', 'h07-real-29': '明治時代の人物写真（1900年）', 'wmc-hara': '近代の人物写真', 'wmc-inukai': '近代の人物写真', 'wmc-sato': '昭和時代の人物写真', 'wmc-shigeru': '昭和時代の人物写真', 'h09-real-08': '江戸時代の測量地図（現存資料）', 'wmc-fukuzawa': '明治時代の人物写真', 'wmc-motoori': '江戸時代の自画像', 'wmc-yoshino': '大正時代の人物写真', 'wmc-lincoln': '19世紀の人物肖像（媒体は要確認）', 'wmc-luther': '宗教改革期の人物肖像画', 'wmc-sunyatsen': '近代の人物写真', 'wmc-wilson': '20世紀前半の人物写真', 'h16-real-09': '明治時代の工場写真', 'h16-real-10': '明治時代の工場内部写真', 'h17-real-11': '1946年の憲法文書（原本画像）', 'h18-real-12': '関ヶ原の戦いを描いた屏風絵', 'h18-real-34': '1877年の西南戦争を題材とする風刺画', 'wmc-sinojapanese': '日清戦争を伝える画像（撮影年代と形式の再確認が必要）', 'h21-real-35': '南北戦争当時の戦場スケッチ', 'h22-real-36': '1789年の事件を題材とする版画', 'h23-real-13': '江戸時代の貿易船を描いた絵', 'h23-real-14': '江戸時代の長崎・出島を描いた絵', 'h24-real-15': '開国を描いた版画（制作年代は別途確認）', 'h24-real-38': '1895年の条約文書（清側署名本）', 'wmc-portsmouth': '1905年の会議写真', 'wmc-securitytreaty': '1960年の調印式写真', 'wmc-anglojapanese': '日英同盟に関する文書（原本・複製の別は要確認）', 'wmc-koreaannex': '1910年の条約文書（原本として伝わる資料）', 'h26-real-16': '古代の金印（現存品の写真）', 'h27-real-17': '飛鳥文化の寺院建築（現在の写真）', 'h27-real-18': '寺院建築（後世に再建された建物の写真）', 'h27-real-19': '古代仏像（現存品の写真）', 'h27-real-20': '古典文学を描く絵巻（現存作品の写真）', 'h27-real-21': '元寇を題材とする絵巻（現存作品の写真）', 'h27-real-22': '室町文化の建築（再建後の写真）', 'h27-real-23': '室町文化の建築（現在の写真）', 'h27-real-24': '江戸時代の浮世絵（版画作品の画像）', 'h29-real-25': '1776年の独立宣言を示す文書画像', 'h29-real-26': '1789年の人権宣言を示す図像・文書', 'h30-real-39': '被爆した建築の現在の写真', 'wmc-feb26': '1936年の事件を伝える写真', 'wmc-mayfourth': '1919年の学生運動を伝える写真', 'term-cover-ch02-04': '飛鳥文化の寺院建築（現在の写真）', 'term-cover-ch02-06': '古典文学を描く絵巻（現存作品の写真）', 'term-cover-ch02-07': '元寇を題材とする絵巻（現存作品の写真）', 'term-cover-ch02-09': '室町文化の建築（現在の写真）', 'term-cover-ch02-10': '人物肖像画（制作年代は別途確認）', 'term-cover-ch02-11': '人物肖像画（制作年代は別途確認）', 'term-cover-ch02-12': '江戸時代の人物肖像画', 'term-cover-ch03-06': '室町文化の建築（再建後の写真）', 'term-cover-ch04-02': '寺院建築（後世に再建された建物の写真）', 'term-cover-ch10-10': '幕末の開国を描いた版画', 'term-cover-ch13-01': '平安時代の自筆日記（現存原本の写真）', 'term-cover-ch14-01': '人物肖像画（制作年代は別途確認）', 'term-cover-ch26-06': '元寇を題材とする絵巻（現存作品の写真）', 'term-cover-ch28-01': '平安時代の自筆日記（現存原本の写真）', 'term-cover-ch30-02': '江戸時代の長崎・出島を描いた絵', 'term-cover-ch30-03': '幕末の開国を描いた版画'}
          EXPLANATION_PATCHES={'authentic-2026-003': {'previous': '古代ギリシャのアテネの神殿。柱が並ぶ姿や都市国家アテネの文化を思い浮かべよう。', 'replacement': 'アテネのパルテノン神殿は、古代ギリシャの女神アテナをまつった建物です。写真は現在の遺跡の姿。都市国家アテネの文化と、太い柱が並ぶつくりに注目しましょう。'}, 'h01-real-01': {'previous': 'ギザのピラミッドの実景。王の強い力を示す建造物として覚えよう。', 'replacement': 'エジプトのギザに残るピラミッドは、古代の王たちの墓として造られました。写真は現在の遺跡です。巨大な石を積んで建設できたことから、王の力と当時の技術がわかります。'}, 'h01-real-02': {'previous': 'モヘンジョダロの発掘遺跡。整った都市のしくみを示す。', 'replacement': 'モヘンジョダロはインダス文明の都市遺跡です。写真の大浴場跡には大きな水槽があります。何に使ったかははっきりしていません。道路や排水設備が整った計画的な都市だったことも特徴です。'}, 'authentic-2026-007': {'previous': '江戸幕府5代将軍・徳川綱吉。生類憐みの令とセットで覚える。', 'replacement': '徳川綱吉は江戸幕府の5代将軍です。1680年代から出された「生類憐みの令」で知られます。肖像画と、動物の命を大切にする政策を結びつけて覚えましょう。'}, 'h06-real-28': {'previous': '幕末に撮影された坂本龍馬の写真。薩長同盟の仲立ちなどの出来事と結びつけよう。', 'replacement': '坂本龍馬は幕末に活躍した土佐出身の人物です。1866年の薩長同盟の成立を助けたことで知られます。写真は本人が生きていた時代のもので、幕末が写真の残る時代だったこともわかります。'}, 'wmc-itagaki': {'previous': '板垣退助の肖像写真です。自由民権運動の中心人物として覚えるときに役立ちます。', 'replacement': '板垣退助は、国民が政治に参加できるよう求める自由民権運動を進めた人物です。1874年の民撰議院設立建白書、1881年の自由党と結びつけて覚えましょう。'}, 'wmc-yoshidashoin': {'previous': '吉田松陰を伝える画像です。幕末の思想家・教育者としての存在感をつかめます。', 'replacement': '吉田松陰は幕末に長州で松下村塾を開き、若者たちに学びの大切さを説きました。伊藤博文など後の明治政府で活躍する人物も学びました。肖像は制作年代を原資料で確認する必要があります。'}, 'wmc-sato': {'previous': '高度経済成長期の首相・佐藤栄作の写真です。沖縄返還と合わせて印象づけられます。', 'replacement': '佐藤栄作は戦後の日本の内閣総理大臣です。1972年の沖縄返還は佐藤内閣の時代に実現しました。沖縄がアメリカの施政権の下に置かれていた時期と結びつけて覚えましょう。'}, 'wmc-shigeru': {'previous': '戦後日本の再出発を支えた吉田茂の写真です。戦後政治の顔として覚えやすくなります。', 'replacement': '吉田茂は第二次世界大戦後の日本の首相です。1951年のサンフランシスコ平和条約の調印に関わりました。日本が独立を回復していく流れと、人物の写真を結びつけましょう。'}, 'wmc-yoshino': {'previous': '民本主義で知られる吉野作造の肖像です。大正デモクラシーの理解に役立ちます。', 'replacement': '吉野作造は大正時代の思想家です。1916年に、政治では人々の幸せや意見を大切にする「民本主義」を説きました。大正デモクラシーを支えた人物として覚えましょう。'}, 'authentic-2026-034': {'previous': '鉄道開業後の新橋停車場を描いた錦絵。明治に鉄道が社会へ広まった様子を表す。', 'replacement': '新橋停車場を描いた錦絵です。日本では1872年に新橋〜横浜間で鉄道が開業しました。これは当時の様子を絵で伝える資料であり、開業式の写真ではありません。'}, 'h16-real-09': {'previous': '殖産興業を示す明治時代の工場写真。官営模範工場として有名。', 'replacement': '富岡製糸場は1872年に操業を始めた官営の模範工場です。明治政府が産業を育てる「殖産興業」を進めた例です。写真に写る建物と、生糸を外国へ輸出したことを結びつけましょう。'}, 'h16-real-10': {'previous': '生糸生産の工場内部の当時の写真。近代工業化と労働の様子がわかる。', 'replacement': '富岡製糸場では、繭から生糸をつくる作業が行われました。内部の写真は明治時代の工場の設備や働く人々を考える手がかりです。工場名と「殖産興業」をセットで覚えましょう。'}, 'h17-real-11': {'previous': '日本国憲法の原本。1946年公布・1947年施行を区別して覚えよう。', 'replacement': '日本国憲法は1946年に公布され、1947年に施行されました。写真は憲法の文書を伝える資料です。国民主権・基本的人権の尊重・平和主義という三つの原則を確認しましょう。'}, 'h18-real-34': {'previous': '西郷隆盛らと明治政府の対立を描いた当時の外国人向け風刺画。写真ではなく風刺画。', 'replacement': '1877年の西南戦争では、西郷隆盛を中心とする士族が明治政府と戦いました。この資料は当時の風刺画で、実際の戦場写真ではありません。人物の描かれ方にも注目しましょう。'}, 'h23-real-13': {'previous': '江戸時代初期の朱印船を描いた史料。幕府の許可証・朱印状で東南アジアと貿易した。', 'replacement': '江戸時代の初め、幕府の許可を示す朱印状を持つ船は東南アジアなどへ渡って貿易しました。画像は当時の朱印船を描いた絵です。鎖国が進む前の海外との交流を表しています。'}, 'h24-real-38': {'previous': '1895年の日清戦争後に結ばれた下関条約の清側の原資料。日本側の署名本と区別。', 'replacement': '1895年、日清戦争の講和で下関条約が結ばれました。画像は清側に伝わる条約の署名本です。日本が遼東半島などを得た後、三国干渉を受ける流れまで続けて覚えましょう。'}, 'authentic-2026-030': {'previous': '江戸の元禄文化を代表する菱川師宣の美人画。振り返る女性の姿が目印。', 'replacement': '菱川師宣の『見返り美人図』は、江戸時代の女性を振り返る姿で描いた作品です。浮世絵の発達に関わる元禄文化の資料として、作者名と作品名をセットで覚えましょう。'}, 'h27-real-17': {'previous': '飛鳥文化の代表的な寺院。中国・朝鮮半島から伝わった技術や仏教との関係に注目。', 'replacement': '法隆寺の金堂と五重塔は、奈良県斑鳩町に残る古い木造建築です。飛鳥文化では仏教が広まり、中国や朝鮮半島の影響を受けました。写真は建物の現在の姿です。'}, 'h27-real-18': {'previous': '天平文化の代表的建築。聖武天皇が仏教の力で国を守ろうとしたことと結び付く。', 'replacement': '東大寺の大仏は、聖武天皇が仏教の力で国を守ろうとした政策と結びつきます。写真の大仏殿は奈良時代そのままの建物ではなく、後世に再建されたものです。'}, 'h27-real-20': {'previous': '『源氏物語』に基づく絵巻。平安の国風文化で生まれた文学を後世の絵巻が表している。', 'replacement': '『源氏物語』は紫式部が平安時代に書いた物語です。この『源氏物語絵巻』は、その場面を後の時代に絵で表した作品です。文章と絵巻が同じ時代の制作ではない点に注意しましょう。'}, 'h27-real-24': {'previous': '江戸後期の化政文化を代表する浮世絵。葛飾北斎の作品。', 'replacement': '葛飾北斎の『神奈川沖浪裏』は、江戸時代後期の浮世絵です。大きな波と富士山が特徴。歌川広重の『東海道五十三次』と並ぶ化政文化の作品として作者を区別しましょう。'}, 'h30-real-39': {'previous': '1945年8月6日の原爆投下の被害を伝える建物。写真は戦後に撮られた現在の姿。', 'replacement': '1945年8月6日に広島へ原子爆弾が投下されました。原爆ドームは爆心地近くに残った建物で、写真は戦後の姿です。長崎への投下は同じ年の8月9日でした。'}, 'wmc-feb26': {'previous': '二・二六事件の写真です。軍部の力が強まる時代の不安定さを実感できる資料です。', 'replacement': '二・二六事件は1936年に陸軍の青年将校らが起こした反乱です。写真は当時の反乱部隊を伝えるもの。1932年の五・一五事件と年号や関係者を混同しないようにしましょう。'}, 'authentic-2026-continued-043': {'previous': '古代メソポタミアの神殿建築。写真は現在の遺跡の姿で、復元・修復された部分もある。', 'replacement': 'ジッグラトは古代メソポタミアで建てられた階段状の神殿建築です。写真は現在の遺跡で、一部は修復されています。エジプトのピラミッドとは目的も形も違います。'}, 'authentic-2026-continued-047': {'previous': '奈良時代に発行された貨幣。中心に四角い穴があり、文字が彫られている。', 'replacement': '和同開珎は708年に発行された銅銭です。中央に四角い穴があり、四文字が刻まれています。奈良時代の貨幣として有名ですが、日本で最初につくられた貨幣と断定しないようにしましょう。'}, 'authentic-2026-continued-049': {'previous': '福沢諭吉らが書いた『学問のすゝめ』の初版。明治の新しい学びを示す重要資料。', 'replacement': '福沢諭吉らが書いた『学問のすゝめ』は1872年から刊行されました。身分にかかわらず学ぶ大切さを説いた本です。画像はその初版の紙面で、人物の肖像写真ではありません。'}, 'authentic-2026-continued-074': {'previous': '飛鳥文化を代表する玉虫厨子の絵。仏教の考えを絵で表現した古代の貴重な文化財。', 'replacement': '玉虫厨子は飛鳥時代の仏教美術です。装飾にはお釈迦様の教えを伝える絵が描かれています。写真は現存する文化財の一部で、当時の建物を写した写真ではありません。'}, 'authentic-2026-continued-077': {'previous': '鎌倉時代につくられた大きな阿弥陀如来像。奈良の東大寺大仏とは時代も場所も異なる。', 'replacement': '鎌倉の大仏は、鎌倉時代につくられた阿弥陀如来の大きな像です。奈良・東大寺の大仏とは時代も場所も異なります。写真は現在残る実物を撮影したものです。'}, 'authentic-2026-continued-078': {'previous': '禅宗建築の代表例。鎌倉文化で広まった武士と禅のつながりを理解しよう。', 'replacement': '円覚寺舎利殿は鎌倉の禅宗建築を伝える国宝です。屋根の形や木組みに中国から伝わった建築様式の影響が見られます。写真は現在残る建物を写したものです。'}, 'authentic-2026-continued-081': {'previous': '戦国末期の京都の町の様子を描いた屏風。桃山文化へつながる華やかな屏風絵の代表例。', 'replacement': '狩野永徳の『洛中洛外図屏風』（上杉本）は、戦国時代の京都の町や人々の暮らしを描きました。金色の雲や細かな建物が目印で、当時の都市の様子を考える資料です。'}, 'authentic-2026-continued-082': {'previous': '墨の濃淡を生かした水墨画。東山文化の時代に活躍した雪舟の代表作。', 'replacement': '雪舟の『破墨山水図』は、墨の濃さとにじみで山や木を表した水墨画です。1495年の作品で、室町時代の東山文化を代表します。作者・技法・時代を結びつけましょう。'}, 'authentic-2026-continued-084': {'previous': '島原・天草一揆での原城の戦いを伝える歴史絵図。文字や部隊の配置を読み取る資料。', 'replacement': '原城は、1637〜1638年の島原・天草一揆で一揆勢が立てこもった城です。絵図は戦いの配置を伝える資料ですが、描かれた内容の正確さは制作時期とあわせて考える必要があります。'}, 'authentic-2026-continued-085': {'previous': '田中角栄と周恩来らが署名した文書。1972年に日本と中国が国交を正常化した。', 'replacement': '1972年、日本と中国は日中共同声明を発表し、国交を正常化しました。画像はその署名文書の資料です。1978年の日中平和友好条約とは年号と文書の種類が違います。'}, 'law-buke': {'previous': '江戸幕府が大名を統制する法度。現存する写本であり、1615年の原本と断定しない。', 'replacement':