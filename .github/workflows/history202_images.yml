name: Download History 202 authentic images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image support
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and validate actual historical images
        run: python history202/download_materials.py
      - name: Show verified download totals
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('history202')
          report=json.loads((root/'image-download-report.json').read_text())
          print('Downloaded:', report['downloaded'], 'of', report['total'])
          print('Failed:', len(report['failed']))
          for item in report['failed']:
              print(item['id'], item['error'][:250])
          PY
      - name: Commit verified downloaded images and index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history202/authentic_images/ history202/local-images.json history202/image-download-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store verified authentic history 202 materials locally'
            git push
          fi
      - name: Upload failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history202-download-report
          path: history202/image-download-report.json
          if-no-files-found: ignore
