name: History 202 - correct eight priority historical source cards
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history202-priority8-safe-metadata
  cancel-in-progress: false
jobs:
  update-8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update eight historically checked records only
        shell: bash
        run: |
          cat > /tmp/history202_priority8_update.py <<'PY'
          #!/usr/bin/env python3
          """Source-grounded, metadata-only corrections for 8 priority History 202 cards.
          
          Reads the repository's CURRENT manifest; never ships an older manifest or touches images/UI.
          No unverified archival page is promoted to an original scan.
          """
          import json
          import os
          import tempfile
          from pathlib import Path
          
          ROOT = Path('history202')
          MANIFEST = ROOT / 'real-materials.json'
          INDEX = ROOT / 'local-images.json'
          OUT = Path('history202_priority8_results')
          OUT.mkdir(parents=True, exist_ok=True)
          
          # Published source links are included for each corrected historical claim.
          UPDATES = {
              'verified-konden-743': {
                  'explanation': '743年（天平15年）、新しく開いた田を、一定の面積まで長く自分の土地にできるようにしました。これが墾田永年私財法です。以前の三世一身法とは違い、期限後も国に返さなくてよいことが大きな変化です。写真の『令義解』は別の法律の解説書であり、墾田法の原文ではありません。',
                  'primarySourceUrl': 'https://commons.wikimedia.org/wiki/File:NAJDA-137-0106_続日本紀_巻15-16.pdf',
                  'primarySourceCitation': '『続日本紀』巻第十五・天平十五年五月の詔。国立公文書館所蔵の明暦3年（1657年）刊本『続日本紀 巻15-16』が参照先。該当ページは未確定。',
                  'educationalReviewStatus': 'correct_volume_identified_exact_page_not_verified',
                  'review': '墾田法は『続日本紀』巻15にある。以前のPDF「続日本紀15」は資料の冊番号で巻第十五とは別。画像は『令義解』のまま維持し、正しい巻の該当ページが見つかるまで差し替え禁止。',
              },
              'verified-konden-ch15': {
                  'explanation': '743年（天平15年）の墾田永年私財法は、新しく開いた田の私有を期限なしで認める制度です。三世一身法との違いが重要で、後の荘園の発達にもつながりました。この画像の『令義解』は別の律令の解説書です。墾田法の本文は『続日本紀』巻第十五に記されています。',
                  'primarySourceUrl': 'https://commons.wikimedia.org/wiki/File:NAJDA-137-0106_続日本紀_巻15-16.pdf',
                  'primarySourceCitation': '国立公文書館所蔵『続日本紀 巻15-16』（明暦3年刊本）。史実は『続日本紀』巻第十五、743年の詔。該当するPDFページは未確定。',
                  'educationalReviewStatus': 'correct_volume_identified_exact_page_not_verified',
                  'review': '見出しの『巻15-16』とPDFの本文を照合する必要がある。743年の勅令そのものの原本が残っているとの誤認は避ける。『令義解』の画像は原文ではないと明記。',
              },
              'authentic-2026-continued-056': {
                  'caption': '山城の国一揆の会合場所・平等院（現在の写真）',
                  'explanation': '1485年、山城国の地元の武士や農民が集まり、争いを続ける畠山氏の軍を追い出す動きが起きました。1485年12月11日の集会と、1486年2月13日に平等院で話し合ったことが『大乗院寺社雑事記』に記されています。写真は現在の平等院で、一揆当時の写真や日記の原文ではありません。',
                  'primarySourceUrl': 'https://www.digital.archives.go.jp/file/3694662?page=2',
                  'primarySourceCitation': '国立公文書館『大乗院寺社雑事記』第101冊（文明17年10～12月）、第102冊（文明18年正月～3月）。1485年12月11日／1486年2月13日条。',
                  'educationalReviewStatus': 'primary_source_book_range_verified_exact_page_not_verified',
                  'review': '国立公文書館の冊別目録で対象年月を確認。以前の第101冊PDF p.6、第102冊PDF p.6はいずれも該当条文の一致が確定していないため採用しない。平等院の現代写真と明示して維持。',
              },
              'verified-antimonopoly-context': {
                  'caption': '戦後の財閥解体を伝える1946年の写真（独占禁止法の関連資料）',
                  'explanation': '戦後の日本では、大企業の集まりが経済を支配しすぎないように改革が進められました。写真は1946年に財閥家族の資産が差し押さえられた場面です。翌1947年4月14日に公布された独占禁止法は、企業どうしの自由で公平な競争を守るための法律。この写真は法律の原文ではありません。',
                  'primarySourceUrl': 'https://www.archives.go.jp/ayumi/kobetsu/s22_1947_03.html',
                  'primarySourceCitation': '国立公文書館「独占禁止法が制定される」（類03072）・法律第54号の御署名原本の案内。1947年4月14日公布。',
                  'educationalReviewStatus': 'related_1946_photo_primary_1947_law_identified_but_not_yet_raster',
                  'review': '画像は1946年の財閥資産接収写真で、1947年独占禁止法の原文画像ではない。国立公文書館に公布時の閣議書と御署名原本があることを確認。画像本文と二次利用条件を確かめるまで自動差し替えしない。',
              },
              'law-keian': {
                  'explanation': '『慶安の御触書』は、かつて「1649年に江戸幕府が全国の農民へ出した決まり」と教えられました。しかし現在は、そのような全国向けの幕府法令が当時出されたという証拠がなく、後の時代に広まった文書と考えられています。古い教科書の説明をそのまま覚えないようにしましょう。画像も1649年の幕府原本と確認できたものではありません。',
                  'educationalReviewStatus': 'historical_misidentification_corrected_article_image_unverified',
                  'researchSourceUrl': 'https://www.teikokushoin.co.jp/faq/detail/952/',
                  'researchSourceCitation': '帝国書院「教科書に『慶安の触書』が載っていないのはなぜですか。」／山本英二『慶安の触書は出されたか』（2002年）／岐阜県歴史資料館所蔵・1830年岩村藩の刊本。',
                  'researchSourceAdditionalUrl': 'https://www.pref.gifu.lg.jp/page/2743.html',
                  'review': '近年の歴史研究では1649年の全国向け幕府法令とはみなされない傾向。出典ページの画像が文書の原本と一致するかは未確認のため、原本・実物の断定を避ける。',
              },
              'law-bunkoku': {
                  'explanation': '戦国大名は、自分の領地を治めるために独自の決まり「分国法」を作りました。今川氏親の『今川仮名目録』（1526年）はその代表例です。家臣や土地の争いをどう扱うかなどを定めています。画像は後世に伝わった写本の表紙で、当時の条文を直接写したページではありません。',
                  'educationalReviewStatus': 'later_copy_cover_exact_leaf_unverified',
                  'review': '『今川仮名目録』は1526年。現行の写真は後世の写本の表紙として説明。条文のページや制定当時の原本ではないため、原資料本文と混同しない。',
              },
              'period-1887-korea-fishing': {
                  'caption': 'ジョルジュ・ビゴー『魚釣り遊び』（1887年の風刺画）',
                  'explanation': '1887年2月15日、フランス人画家ジョルジュ・ビゴーが雑誌『トバエ』の創刊号に描いた風刺画です。魚は朝鮮を表し、日本と清が釣り上げようとする一方、ロシアが横取りをねらっています。1894年の日清戦争が起こる前から、朝鮮をめぐって国どうしが争っていたことがわかります。実際の戦場を写した写真ではありません。',
                  'type': '1887年の政治風刺画（ジョルジュ・ビゴー『魚釣り遊び』）',
                  'license': 'Public domain（1887年公開の著作物。Wikimedia CommonsでPDと記載）',
                  'licenseUrl': 'https://creativecommons.org/publicdomain/mark/1.0/',
                  'licenseStatus': 'source_page_verified',
                  'credit': 'Georges Ferdinand Bigot／『トバエ』第1号（1887年2月15日）／川崎市市民ミュージアム資料・Wikimedia Commons',
                  'review': 'Wikimedia Commons出典ページの作者・刊行日・雑誌名・PD表示を照合。風刺画であり日清戦争の実際の戦場写真ではない。',
              },
              'period-1898-china-carving': {
                  'caption': '中国を列強が分け合う1898年のフランスの風刺画',
                  'explanation': '1898年1月16日、フランスの新聞『ル・プティ・ジュルナル』の付録に載った風刺画。机の上の大きなケーキは中国を表し、イギリス・ドイツ・ロシア・フランス・日本が分けようとしています。うしろの清の役人は止められません。中国で列強が勢力を広げたことを覚える資料で、1895年の三国干渉の会議写真ではありません。',
                  'type': '1898年1月16日のフランスの風刺画（アンリ・メイエ画）',
                  'license': 'Public domain（1898年刊、作者1899年没。Wikimedia CommonsでPDと記載）',
                  'licenseUrl': 'https://creativecommons.org/publicdomain/mark/1.0/',
                  'licenseStatus': 'source_page_verified',
                  'credit': 'Henri Meyer／Le Petit Journal, supplément, 1898年1月16日／フランス国立図書館・Wikimedia Commons',
                  'review': 'Wikimedia Commons記載の原誌・掲載日・作者・パブリックドメイン表示を照合。登場する国は英独露仏日。1895年三国干渉の実際の会議ではない。',
              },
          }
          
          def main():
              manifest = json.loads(MANIFEST.read_text('utf-8'))
              mapping = json.loads(INDEX.read_text('utf-8'))
              items=manifest['items']
              assert len(items)==256, '256 entries expected'
              assert len({i['id'] for i in items})==256, 'duplicate IDs found'
              assert len(mapping)==256 and set(mapping)=={i['id'] for i in items}, 'path index mismatch'
              ids={i['id'] for i in items}
              assert set(UPDATES).issubset(ids), 'target entry missing; refusing partial rewrite'
              changes=[]
              for item in items:
                  if item['id'] not in UPDATES:
                      continue
                  old={k:item.get(k) for k in UPDATES[item['id']]}
                  updates={k:v for k,v in UPDATES[item['id']].items() if item.get(k)!=v}
                  if updates:
                      item.update(updates)
                      changes.append({'id':item['id'], 'fields':list(updates), 'before':old, 'after':updates})
              # Validate no ID, mapping or image path was altered. This file has NO image writes.
              assert set(mapping)=={i['id'] for i in items}
              report={'updated_entry_count':len(changes),'changes':changes,
                      'unchanged_image_files':256,'new_unverified_original_images_published':0,
                      'attention':'The 743, 1485-86 and 1947 source documents are linked but not substituted before exact page and reuse are confirmed.'}
              (OUT/'history202_priority8_result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n','utf-8')
              if changes:
                  with tempfile.NamedTemporaryFile(mode='w',encoding='utf-8',dir=ROOT,
                                               prefix='.priority8-',suffix='.json',delete=False) as f:
                      tmp=Path(f.name)
                      json.dump(manifest,f,ensure_ascii=False,indent=2)
                      f.write('\n')
                  try:
                      assert len(json.loads(tmp.read_text('utf-8'))['items'])==256
                      os.replace(tmp,MANIFEST)
                  finally:
                      tmp.unlink(missing_ok=True)
              print(json.dumps({'updated_entries':len(changes),'ids':[c['id'] for c in changes],
                               'image_changes':0,'next':'manual verification of three primary-source scan pages'},ensure_ascii=False,indent=2))
          
          if __name__=='__main__':
              main()
          PY
          python /tmp/history202_priority8_update.py
      - name: Commit changed manifest only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- history202/real-materials.json
          if ! git diff --cached --quiet; then
            git commit -m 'Improve eight priority historical source cards and verify two 19th-century illustrations'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'All eight records were already updated; no change needed.'
          fi
      - name: Upload exact changed-field report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history202-priority8-change-report
          path: history202_priority8_results/
          if-no-files-found: warn
