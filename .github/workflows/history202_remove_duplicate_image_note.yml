name: History 202 - remove duplicated photo explanations
on:
  push:
    paths:
      - '.github/workflows/history202_remove_duplicate_image_note.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history202-remove-duplicate-image-note
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Remove only the redundant notes under images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('history202/room.js')
          original = p.read_text(encoding='utf-8')
          lines = original.splitlines(keepends=True)
          style_lines = [i for i, line in enumerate(lines) if line.startswith('const h202StudyPhotoStyle=')]
          old_block = '\n'.join([
              "  const studyNote=document.createElement('span');",
              "  studyNote.className='h202-real-image-learning-point';",
              "  studyNote.textContent='この資料で覚えること：'+String(m.explanation||'').trim();",
              '  bubble.append(photo,caption,studyNote);',
          ])
          new_block = '  bubble.append(photo,caption);'
          if not style_lines and old_block not in original and new_block in original:
              content = original
              print('Already fixed; no change required.')
          else:
              if len(style_lines) != 1 or original.count(old_block) != 1:
                  raise SystemExit('Unexpected room.js content: refuse to change anything')
              del lines[style_lines[0]]
              content = ''.join(lines)
              if content.count(old_block) != 1:
                  raise SystemExit('Unexpected photo block after style removal')
              content = content.replace(old_block, new_block, 1)
              if 'h202-real-image-learning-point' in content or 'この資料で覚えること：' in content:
                  raise SystemExit('Duplicate explanatory UI still found')
              if content.count(new_block) != 1:
                  raise SystemExit('Photo renderer mismatch')
              if 'function selectExplanation(m,b)' not in content or "explainText.textContent=m.explanation||''" not in content:
                  raise SystemExit('Tap-to-explain behavior not present')
              p.write_text(content, encoding='utf-8')
              print('Removed inline image explanations, kept image captions and tap explanations.')
          PY
      - name: Validate JavaScript and changed file list
        run: |
          node --check history202/room.js
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed in ([],['history202/room.js']),f'Unexpected edits: {changed}'
          PY
      - name: Commit only history202/room.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- history202/room.js
          if git diff --cached --quiet; then
            echo 'Already fixed. Nothing to commit.'
          else
            git commit -m 'Remove duplicate text shown under history images'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
