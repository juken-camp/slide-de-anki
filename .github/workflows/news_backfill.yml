name: 過去７日分のニュースを追加
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        date: ['2026-10-20', '2026-10-21', '2026-10-22', '2026-10-23', '2026-10-24', '2026-10-25', '2026-10-26']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: その日の記事からニュースを作る
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION_DATE: ${{ matrix.date }}
        run: python scripts/generate_news.py --date "$EDITION_DATE" --skip-existing
      - name: 生成結果の控えを保存
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ matrix.date }}
          path: news/daily/${{ matrix.date }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: ニュースを保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/daily
          if ! git diff --cached --quiet; then
            git commit -m 'Add archived news'
            git pull --rebase origin main
            git push
          fi
