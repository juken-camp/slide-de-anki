name: 今日のニュース
on:
  schedule:
    # JST 06:17, 07:17, 08:17. Completed editions are skipped.
    - cron: '17 21,22,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 7分野のニュースとテーマを作成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_news.py --skip-existing
      - name: 生成したニュースを保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/daily
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily news: complete seven fields'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
