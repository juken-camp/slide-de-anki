name: Shared chat scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared_chat_scheduler.yml'
permissions:
  id-token: write
concurrency:
  group: shared-chat-scheduler
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Advance shared chat
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          audience = 'nekopon-shared-chat-scheduler'
          phase = 'github_identity'
          try:
              request = urllib.request.Request(
                  os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + audience,
                  headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(request, timeout=15) as response:
                  token = json.load(response)['value']
              phase = 'application'
              request = urllib.request.Request(
                  'https://slide-de-anki.vercel.app/api/shared-chat-scheduler',
                  data=b'{}', method='POST',
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.load(response)
              print('Scheduler completed:', {k:result.get(k) for k in ('published','generated','notified')})
          except Exception as error:
              print('Scheduler failed:', phase, type(error).__name__, getattr(error, 'code', ''), file=sys.stderr)
              if hasattr(error, 'read'):
                  try:
                      print('Server error:', json.loads(error.read(2048)).get('error', 'unknown'), file=sys.stderr)
                  except Exception:
                      pass
              sys.exit(1)
          PY

# Scheduler diagnostics contain only non-sensitive error categories.
