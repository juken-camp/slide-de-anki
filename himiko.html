   root.style.setProperty('--embedded-bg-x',(-rect.left)+'px');

}

function himikoUi(neko,cyber){return document.documentElement.dataset.persona==='cyber'?cyber:neko;}
function himikoGuideCopy(text){
 return text.replace(/([^。]+)。/g,(_,sentence)=>{
  if(document.documentElement.dataset.persona!=='cyber')return sentence.replace(/だ$/,'')+'にゃ。';
  return sentence+(/だ$/.test(sentence)?'ぜ':/[るたいうくぐすつぬぶむ]$/.test(sentence)?'ぜ':'だぜ')+'。';
 });
}

const CHARACTERS = [{"id":80,"name":"ハンムラビ王","period":"バビロニア（紀元前18世紀頃）","emoji":"⚖️","tag":"世界史","tagColor":"#92400E","catchphrase":"約4000年前、法律を石に刻んだ王様","color":"#B45309","accent":"#FDE68A","bio":"人によって、けんかや盗みへの罰が変わったら困ってしまう。昔のバビロニアの王ハンムラビは、暮らしの決まりを集めた「ハンムラビ法典」を大きな石に刻んだ。「目には目を」で有名だが、何でも仕返ししてよいという意味ではない。受けた被害に合わせて罰を決める考え方だった。ただし、人の身分によって罰が違うなど、今の法律とは違う点もあった。","greeting":"ハンムラビ法典を残した王じゃ。「目には目を」という決まりを聞いたことがあるかな？ どんな社会の法律だったか、一緒に考えてみるか。","qs":["「目には目を」って本当にそういう意味なの？","法律を文字に書くとなぜ良いの？","メソポタミア文明ってどんな文明なの？","ハンムラビ法典が後の法律に与えた影響は？","現代の法律にハンムラビ法典の考え方は残っているの？"]},{"id":81,"name":"釈迦（ブッダ）","period":"古代インド（紀元前463年頃〜紀元前383年頃）","emoji":"🪷","tag":"世界史","tagColor":"#047857","catchphrase":"王子の生活を離れ、人の苦しみと向き合った","color":"#059669","accent":"#6EE7B7","bio":"お金があっても、人は病気になり、年を取り、大切な人と別れる。この苦しみから、どうすれば救われるのか。インドの釈迦は王子の生活を離れ、その答えを探したと伝わる。欲しがりすぎず、自分を苦しめすぎない生き方を説いた。この教えから生まれたのが仏教だ。教えは中国や朝鮮半島を通って、日本にも広まった。","isNarrator":true,"greeting":"釈迦は王子の身分を捨てて悟りを求めました。その生涯と、仏教がなぜアジア全体に広まったか、一緒に学びましょう。","qs":["釈迦はなぜ王子の身分を捨てて出家したの？","仏教・キリスト教・イスラム教の三大宗教のちがいは？","仏教はどうやってアジア全体に広まったの？","日本の仏教は釈迦の教えとどうちがうの？","仏教の「中道」って日常生活にどう活かせるの？"]},{"id":34,"name":"孔子","period":"中国・春秋時代（紀元前551〜479年）","emoji":"📖","tag":"世界史","tagColor":"#0E7490","catchphrase":"思いやりを教えた、儒教のもとになる先生","color":"#0891B2","accent":"#A5F3FC","bio":"国どうしの争いが続く中国で、孔子は人が仲よく暮らす道を考えた。大切にしたのは、人を思いやる心の「仁」と、人との付き合い方を整える「礼」だ。国を治める人こそ、よい手本になるべきだと教えた。各地を旅して多くの弟子を育て、その言葉は『論語』にまとめられた。孔子の教えをもとにした儒教は、日本の政治や教育にも大きな影響を与えた。","greeting":"「学びて思わざれば則ち罔し」——学んでも考えなければ意味がない。何を学びに来た？","qs":["「仁」って一言で言うとどういう意味なの？","儒教は仏教やキリスト教とどうちがうの？","儒教がなぜ東アジア全体に広まったの？","日本の歴史で儒教はどんな影響を与えたの？","論語の中で誰にでも役立つ教えはどれ？"]},{"id":83,"name":"ペリクレス","period":"ギリシャ（紀元前495年頃〜429年）","emoji":"🗽","tag":"世界史","tagColor":"#0284C7","catchphrase":"みんなで決める政治を、アテネで育てた","color":"#0EA5E9","accent":"#BAE6FD","bio":"昔のギリシャには、アテネという都市を中心とする国があった。ペリクレスは、市民が話し合いに参加する民主政治を発展させた政治家だ。政治の仕事にお金を出すなど、豊かでない市民も参加しやすくした。ただし、女性や奴隷などは政治に参加できなかった。パルテノン神殿の建設も進め、アテネの文化が栄える時代を支えた。","greeting":"「我々は美を愛するが浪費しない、知を愛するが軟弱ではない」——アテネの黄金時代の話をしよう。","qs":["アテネの民主政治ってどんなしくみだったの？","ポリスって何なの？","パルテノン神殿はなぜ建てられたの？","スパルタとアテネはどうちがったの？","アテネの民主政と現代の民主主義はどこがちがうの？"]},{"id":82,"name":"ソクラテス","period":"ギリシャ（紀元前470年頃〜399年）","emoji":"🏛️","tag":"世界史","tagColor":"#6D28D9","catchphrase":"「本当にそう？」と問い続けた先生","color":"#7C3AED","accent":"#DDD6FE","bio":"知っているつもりでも、説明しようとすると言葉にできない。古代ギリシャのソクラテスは、人々と話しながら「正しいこととは何か」などと問い続けた。自分が知らないと気づくことが、学ぶ出発点だと考えたのだ。しかし、その活動をよく思わない人もいて、裁判で死刑にされた。自分では本を残さず、考え方は弟子たちの本で伝わっている。","greeting":"知っているつもりのことほど、問い直してみると面白い。何がわかり、何がわからないのか、一緒に確かめてみよう。","qs":["「無知の知」ってどういう意味なの？","古代ギリシャの民主政ってどんな政治なの？","ソクラテスはなぜ死刑になったの？","ギリシャ文明が後の世界に与えた影響は？","ソクラテスの「問答法」って今の勉強法に使えるの？"]},{"id":67,"name":"アレクサンドロス大王","period":"マケドニア（紀元前356〜323年）","emoji":"🗺️","tag":"世界史","tagColor":"#D97706","catchphrase":"32歳で亡くなるまでに、巨大な国を築いた王","color":"#F59E0B","accent":"#FDE68A","bio":"若くしてマケドニアの王になったアレクサンドロスは、軍を率いて東へ進んだ。大国ペルシャを倒し、インドまで攻め進んで、広い地域を治めた。しかし、32歳で亡くなり、大きな国はその後に分かれてしまう。遠い地域どうしがつながり、ギリシャと東方の文化が混ざり合った。この文化をヘレニズム文化という。","greeting":"マケドニアから東へ進み、広い領域を征服した。だが、戦争の話だけでは終わらない。人や文化がどう行き来したのかも、聞いてほしい。","qs":["ヘレニズム文化ってどんな文化なの？","東西の文化が混ざることで何が生まれたの？","アレクサンドロスの帝国がすぐ分裂した理由は？","ヘレニズムが後のローマやイスラム文化に与えた影響は？","わずか32歳で死んだのに歴史に名が残る理由は？"]},{"id":33,"name":"始皇帝","period":"中国・秦（紀元前259〜210年）","emoji":"🐉","tag":"世界史","tagColor":"#92400E","catchphrase":"ばらばらだった中国を、一つにまとめた皇帝","color":"#B45309","accent":"#FDE68A","bio":"昔の中国では、いくつもの国が争っていた。その戦いに勝ち、紀元前221年に中国を一つにまとめたのが秦の始皇帝だ。文字やお金、長さや重さの決まりをそろえ、広い国を動かしやすくした。万里の長城をつなぐ工事なども進めたが、人々には重い負担がかかった。始皇帝が亡くなったあと、各地で反乱が起こり、秦は短い間で滅びた。","greeting":"初めて「皇帝」と名乗った者じゃ。バラバラだった中国を一つにまとめた。その意味、わかるか？","qs":["文字や貨幣を統一するとなぜ国がまとまるの？","万里の長城はなんのために作ったの？","「皇帝」という称号はどうして生まれたの？","秦はなぜ統一後すぐに滅んだの？","焚書坑儒って何をしたの？"]},{"id":68,"name":"カエサル","period":"ローマ（紀元前100〜44年）","emoji":"🏛️","tag":"世界史","tagColor":"#92400E","catchphrase":"ローマで大きな力を持ち、仲間に殺された","color":"#B45309","accent":"#FDE68A","bio":"古代ローマで、カエサルは戦いに勝って人気を集めた。やがて国内の争いにも勝ち、政治を動かす大きな力を握る。しかし、一人に力が集まりすぎることを恐れた人々に殺されてしまった。その後も争いは続き、ローマは皇帝が治める国へと変わる。カエサルの生涯は、ローマの政治が大きく変わる分かれ目にあった。","greeting":"ガリアへ遠征し、ローマで大きな権力を握った。私は皇帝ではなく終身独裁官だ。共和政が揺れ動いた時代の話をしよう。","qs":["ローマ共和政から帝政へはどう変わったの？","地中海世界でローマが繁栄できた理由は？","「ブルータス、お前もか」は史実なの？","ローマ文明が後のヨーロッパ社会に与えた影響は？","カエサルの「暦の改革」って今のカレンダーと関係あるの？"]},{"id":75,"name":"イエス・キリスト","period":"ユダヤ（紀元前4年頃〜紀元後30年頃）","emoji":"✝️","tag":"世界史","tagColor":"#7C3AED","catchphrase":"「周りの人を愛そう」と教えた、キリスト教の出発点","color":"#7C3AED","accent":"#DDD6FE","bio":"ローマが治めていた地域で、イエスは貧しい人や病気の人にも語りかけた。神を信じる心と、周りの人を愛することを大切にしたのだ。しかし、やがて十字架にかけられて処刑された。弟子たちは、イエスがよみがえったと信じて教えを広めた。これがキリスト教として広がり、後に世界の多くの人が信じる宗教になった。","isNarrator":true,"greeting":"「汝の隣人を愛せよ」——イエス・キリストのこの言葉がどうやって世界を変えたか、歴史として一緒に学びましょう。","qs":["キリスト教はどうやって世界中に広まったの？","ユダヤ教・キリスト教・イスラム教はどんな関係があるの？","十字軍ってキリスト教とどう関係があるの？","キリスト教がヨーロッパの歴史に与えた影響は？","クリスマスやイースターはもともとどんな意味があるの？"]},{"id":1,"name":"卑弥呼","period":"弥生時代（3世紀頃）","emoji":"🌙","tag":"日本史","tagColor":"#7C3AED","catchphrase":"争っていた国々をまとめた、邪馬台国の女王","color":"#7C3AED","accent":"#DDD6FE","bio":"今の日本に小さな国がたくさんあったころ、国々の間で争いが続いていた。そこで女王に選ばれたのが、邪馬台国の卑弥呼だ。中国の記録によると、神に祈る力で人々をまとめたという。中国の魏に使いを送り、「親魏倭王」の称号も受けた。ただし、日本には当時の記録が少なく、邪馬台国がどこにあったかも、今なお意見が分かれている。","greeting":"……久しぶりに声をかけてくれる方がいますね。邪馬台国を治めた女王よ。何を知りたいですか？","qs":["邪馬台国って結局どこにあったの？","なぜ女王が国を治めていたの？","魏に使いを送ることには、どんな利点があったの？","「親魏倭王」の称号にはどんな意味があるの？","卑弥呼のことが書いてある『魏志倭人伝』ってどんな本なの？"]},{"id":61,"name":"雄略天皇","period":"古墳時代（5世紀後半）","emoji":"🗡️","tag":"日本史","tagColor":"#92400E","catchphrase":"約1500年前、刀に名を残したと考えられる大王","color":"#B45309","accent":"#FDE68A","bio":"まだ日本が「大王」と呼ばれる王に治められていたころの人物だ。中国の記録に出てくる「倭の五王」のうち、武という王は雄略天皇だと考えられている。古墳から見つかった鉄剣などにある「ワカタケル大王」の名も、雄略天皇を指すとされる。後の物語だけでなく、外国の記録や出土品から、昔の日本の姿を探る手がかりになる人物だ。","greeting":"後の世に見つかった鉄剣には、ワカタケル大王の名がある。それが朕にあたると考えられておる。文字と古墳を手がかりに、古代の国を見てみるか。","qs":["稲荷山古墳の鉄剣がなぜ歴史的に重要なの？","古墳はなぜ造られたの？","ヤマト王権ってどんな国だったの？","古墳時代から飛鳥時代へはどう変わったの？","ワカタケル大王の鉄剣はどうやって発見されたの？"]},{"id":35,"name":"ムハンマド","period":"アラビア半島（570年頃〜632年）","emoji":"☪️","tag":"世界史","tagColor":"#047857","catchphrase":"商人から、イスラム教を広める人へ","color":"#065F46","accent":"#6EE7B7","bio":"アラビア半島で商人として働いていたムハンマドは、神の言葉を受けたと伝え、教えを広め始めた。唯一の神アッラーを信じ、貧しい人を助けることなどを説いた。しかし、反対する人たちとの争いでメッカを離れた。622年のこの移住をヒジュラという。やがてメッカに戻り、教えはイスラム教として広い地域へ伝わった。","isNarrator":true,"greeting":"メッカからメディナへの移住をきっかけに、どのように共同体が発展したのでしょう。ムハンマドの生涯と、イスラム教の広まりを学びましょう。","qs":["イスラム教はどうやって急速に広まったの？","アラビア数字やアルコールはイスラム文化から来たって本当？","イスラム帝国がなぜ文化的に発展できたの？","イスラム教・キリスト教・仏教の広まり方のちがいは？","ヒジュラ（聖遷）がイスラム暦の始まりになった理由は？"]},{"id":2,"name":"聖徳太子","period":"飛鳥時代（574〜622年）","emoji":"🏯","tag":"日本史","tagColor":"#7C3AED","catchphrase":"天皇を中心にした国づくりを進めた","color":"#8B5CF6","accent":"#C4B5FD","bio":"力のある一族が政治を動かしていたころ、聖徳太子は推古天皇を助けたと伝わる。家柄だけでなく能力も大切にする冠位十二階や、役人の心構えを示す十七条の憲法で知られる。仏教を大切にし、中国の隋にも使いを送った。外国から学びながら、天皇を中心とする国づくりを進めた人物だ。ただし、生涯には後に生まれた伝説も多い。","greeting":"「和を以て貴しとなす」——この言葉を聞いたことがあるかな？国づくりに込めた想いから話しましょうか。","qs":["遣隋使を送ったのはなぜ？","冠位十二階は何を変えた制度なの？","十七条の憲法は何を大切にしたの？","厩戸王と聖徳太子の伝説はどうちがうの？","聖徳太子が一万円札だったのはなぜ？"]},{"id":3,"name":"中大兄皇子","period":"飛鳥時代（626〜672年）","emoji":"⚔️","tag":"日本史","tagColor":"#B91C1C","catchphrase":"蘇我氏を倒し、天皇中心の国づくりへ","color":"#DC2626","accent":"#FCA5A5","bio":"政治を実際に動かす力を持つ蘇我氏に対し、中大兄皇子は中臣鎌足と手を組んだ。645年に蘇我入鹿を倒し、その後、天皇を中心に政治の仕組みを変えていった。この改革の流れが大化の改新だ。後に天智天皇となり、人々の戸籍をつくるなど国の仕組みを整えた。朝鮮半島での戦いに敗れたあとは、外国の攻撃に備える守りも強めた。","greeting":"蘇我氏を倒したあの日——645年のことは今でも鮮明に覚えている。大化の改新、聞いていくか？","qs":["蘇我氏の何がそんなに問題だったの？","大化の改新って具体的に何を変えたの？","公地公民ってどういう意味なの？","天智天皇と天武天皇はどうちがうの？","「大化」という元号が日本最初の元号って本当？"]},{"id":57,"name":"行基","period":"奈良時代（668〜749年）","emoji":"🙏","tag":"日本史","tagColor":"#047857","catchphrase":"橋や池をつくり、人々を助けたお坊さん","color":"#059669","accent":"#6EE7B7","bio":"行基は、人々に仏教を教えながら、暮らしを助ける仕事もしたお坊さんだ。橋をかけたり、水をためる池をつくったりして、多くの人に慕われた。初めは朝廷から活動を止められたが、後にはその力を認められる。聖武天皇の大仏づくりにも協力し、多くの人の力を集めた。祈るだけでなく、自分で動いて人を助けた人物だ。","greeting":"お堂の中でお経を読むより、外へ出て民の暮らしを助けたかった。橋もため池も、仏の道と思っていました。","qs":["なぜ僧が橋や道路を作ったの？","奈良時代の民衆の生活はどんな感じだったの？","行基はなぜ最初は朝廷に禁止されたの？","行基・鑑真・最澄・空海の4人はどうちがうの？","「行基図」は行基本人が作った地図なの？"]},{"id":84,"name":"鑑真","period":"中国（唐）→日本・奈良時代（688〜763年）","emoji":"⛵","tag":"日本史","tagColor":"#047857","catchphrase":"何度失敗しても、日本へ渡るのをあきらめなかった","color":"#059669","accent":"#6EE7B7","bio":"日本に仏教の正式な決まりを伝えてほしい。そう頼まれた中国のお坊さん鑑真は、海を渡ろうとした。しかし、船の事故などで何度も失敗し、途中で目も見えなくなった。それでもあきらめず、753年、ついに日本へ着いた。日本で僧になるための正しい儀式を伝え、奈良に唐招提寺を開いた。","greeting":"5度失敗し、目も見えなくなった——それでも日本へ渡ることをやめなかった。なぜそこまでしたのか、話しましょう。","qs":["なぜ6度も挑戦したの？","戒律（受戒）を伝えることがなぜそんなに大切だったの？","唐招提寺はどんなお寺なの？","行基・鑑真・最澄・空海の4人はどうちがうの？","鑑真が伝えたのは仏教だけじゃないって本当？"]},{"id":4,"name":"聖武天皇","period":"奈良時代（701〜756年）","emoji":"🦌","tag":"日本史","tagColor":"#047857","catchphrase":"大仏の力で、国の不安をしずめたかった天皇","color":"#059669","accent":"#6EE7B7","bio":"奈良時代、病気が広がり、作物も育たず、争いまで起きた。聖武天皇は、仏教の力で国を守ろうと考えた。各地に国分寺と国分尼寺を建てるよう命じ、奈良の東大寺では巨大な大仏づくりを進めた。たくさんの人が力を合わせ、大仏は752年に完成の式を迎えた。大仏には、苦しい時代を乗り越えたいという願いが込められている。","greeting":"大仏を造ったのは「ぜいたくがしたかった」からではない——その理由、話してもよいか？","qs":["大仏を造ることで本当に国を守れると思ったの？","国分寺を全国に置いた狙いは？","奈良時代はどんな問題が多かったの？","正倉院に入っているものって何なの？","東大寺の大仏はどれくらいの大きさで何人で造ったの？"]},{"id":96,"name":"桓武天皇","period":"奈良〜平安時代（737〜806年）","emoji":"🏙️","tag":"日本史","tagColor":"#B45309","catchphrase":"都を京都に移し、平安時代を始めた天皇","color":"#D97706","accent":"#FDE68A","bio":"奈良の都では、大きな寺が政治にも強い力を持っていた。桓武天皇は新しい場所で政治を立て直そうとし、794年に平安京へ都を移した。これが平安時代の始まりだ。東北にも軍を送り、坂上田村麻呂を活躍させた。ただし、都づくりや戦いは人々の重い負担にもなった。後には、大きな工事や戦いをやめる判断もした。","greeting":"奈良から長岡京へ、そして平安京へ都を移した。なぜそこまでして遷都にこだわったか、聞くか？","qs":["なぜ奈良から平安京に都を移したの？","坂上田村麻呂はどんな人物なの？","律令制ってどんな仕組みで、なぜ立て直しが必要だったの？","平安京遷都が日本の歴史に与えた影響は？","平安京は今の京都のどのあたりにあるの？"]},{"id":58,"name":"最澄","period":"平安時代（767〜822年）","emoji":"🏔️","tag":"日本史","tagColor":"#6D28D9","catchphrase":"比叡山で、人を育てる仏教を広めた","color":"#7C3AED","accent":"#DDD6FE","bio":"最澄は中国の唐へ渡り、仏教を学んだ。帰国すると、比叡山の延暦寺を拠点に天台宗を広めた。国や人々のために働くお坊さんを育てようとしたのだ。昔からの寺に頼らず、僧になるための儀式を行える場所を比叡山につくることも目指した。その願いは死後に認められ、比叡山からは後の仏教を動かす多くの人物が育った。","greeting":"比叡山に灯した一つの光が、後に法然・親鸞・道元・日蓮を生んだ。天台宗と日本仏教の歴史、聞いてみてください。","qs":["天台宗ってどんな教えなの？","なぜ平安時代に新しい仏教が必要とされたの？","比叡山延暦寺が後の歴史に与えた影響は？","行基・鑑真・最澄・空海の4人はどうちがうの？","「一隅を照らす」という最澄の言葉はどういう意味？"]},{"id":62,"name":"空海","period":"平安時代（774〜835年）","emoji":"⛩️","tag":"日本史","tagColor":"#4C1D95","catchphrase":"中国で学び、高野山に真言宗を広めた","color":"#6D28D9","accent":"#C4B5FD","bio":"空海は中国の唐へ渡り、仏教の教えや儀式を学んだ。帰国後は真言宗を広め、高野山に金剛峯寺を開いた。言葉だけでなく、祈りの言葉や手の形、仏の絵なども大切にした。字の名人としても知られ、学ぶ機会の少ない人のために学校も開いた。仏教だけにとどまらず、教育や人々の暮らしにも力を尽くした人物だ。","greeting":"「弘法筆を択ばず」——書の話でも密教の話でも、なんでも聞いてください。高野山から語りましょう。","qs":["真言宗（密教）ってどんな教えなの？","高野山はどんな場所なの？","空海が「弘法大師」と呼ばれる理由は？","行基・鑑真・最澄・空海の4人はどうちがうの？","「弘法も筆の誤り」のことわざの由来は？"]},{"id":5,"name":"藤原道長","period":"平安時代（966〜1028年）","emoji":"🌕","tag":"日本史","tagColor":"#D97706","catchphrase":"娘を天皇の妻にして、政治の力を握った","color":"#F59E0B","accent":"#FDE68A","bio":"平安時代、藤原道長は娘たちを次々と天皇の妻にした。娘が産んだ子が天皇になると、自分は天皇の祖父になる。こうして天皇の身近な立場から、政治に強い力を持った。「この世をば」で始まる有名な歌には、欠けるところのない満月に自分の成功を重ねている。藤原氏が天皇の親族として政治を動かす、摂関政治が栄えた時代の人物だ。","greeting":"「この世をばわが世とぞ思ふ望月の……」——まあ、少し自慢が過ぎたかもしれないね。摂関政治の話をしようか。","qs":["摂関政治ってどうやって権力を握る仕組みなの？","娘を天皇の后にするとなぜ力が持てるの？","平安貴族の暮らしって実際どんな感じ？","なぜ摂関政治は武士に取って代わられたの？","「この世をばわが世とぞ思ふ」の歌の全文とその意味は？"]},{"id":6,"name":"紫式部","period":"平安時代（970年頃〜1019年頃）","emoji":"📜","tag":"日本史","tagColor":"#6D28D9","catchphrase":"宮中の恋や悩みを、『源氏物語』に描いた","color":"#7C3AED","accent":"#DDD6FE","bio":"紫式部は、天皇の妻に仕えながら『源氏物語』を書いた。主人公の光源氏を中心に、恋や別れ、人の心の揺れを描いた長い物語だ。平安時代の華やかな暮らしだけでなく、思いどおりにならない悲しさも伝わってくる。中国の言葉で書かれた本をよく学んだ人でもあった。物語は約1000年をこえて、今も世界で読まれている。","greeting":"宮廷で交わされる言葉には、いろいろな気持ちが隠れています。『源氏物語』でも平安の暮らしでも、気になることを聞いてください。","qs":["かな文字はどうやって生まれたの？","『源氏物語』はどんなところがすごいの？","国風文化って唐の文化と何がちがうの？","平安時代に女性の作家が多かったのはなぜ？","紫式部と清少納言にはどんなちがいがあるの？"]},{"id":72,"name":"平清盛","period":"平安時代末期（1118〜1181年）","emoji":"⚓","tag":"日本史","tagColor":"#B91C1C","catchphrase":"武士の力で政治の中心へ進んだ、平氏のリーダー","color":"#DC2626","accent":"#FCA5A5","bio":"平清盛は、朝廷の争いで勝って力をつけた。1167年には、武士として初めて政治の最高の役職である太政大臣になった。娘を天皇の妻にし、平氏の一族を大事な役職につけたほか、中国の宋との品物の売り買いである貿易にも力を入れた。しかし、平氏ばかりが力を持つことに不満も高まる。清盛の死後、平氏は源氏との戦いに敗れて滅びた。","greeting":"武士の身で太政大臣——朝廷のど真ん中に乗り込んだ。「平家にあらずんば人にあらず」とまで言われた全盛期の話をしよう。","qs":["武士が政治の中心に出てきた流れを教えて","日宋貿易ってどんな貿易で何が変わったの？","保元の乱・平治の乱ってどんな争いなの？","平氏が滅んだ理由は何なの？","「平家にあらずんば人にあらず」は本当に清盛の言葉なの？"]},{"id":97,"name":"法然","period":"鎌倉時代（1133〜1212年）","emoji":"🙏","tag":"日本史","tagColor":"#047857","catchphrase":"「南無阿弥陀仏」で救われる、と教えた","color":"#059669","accent":"#6EE7B7","bio":"難しいお経を読んだり、厳しい修行をしたりできない人は救われないのか。法然は、身分や学問に関係なく、人々が救われる道を伝えようとした。「南無阿弥陀仏」と念仏を唱えることを大切にする浄土宗を開いたのだ。教えは多くの人に広まったが、昔からの寺などに反対され、遠い土地へ追いやられたこともあった。","greeting":"難しい修行ができない人にも、仏の救いへの道を伝えたい。私は念仏を唱える教えを説きました。当時の人々が何を求めていたか、一緒に考えてみましょう。","qs":["念仏を唱えるだけで救われるって何が新しかったの？","浄土宗と浄土真宗はどうちがうの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","鎌倉時代になぜ新しい仏教がたくさん生まれたの？","法然が比叡山を出て新しい宗派を作った理由は？"]},{"id":7,"name":"源頼朝","period":"鎌倉時代（1147〜1199年）","emoji":"🏹","tag":"日本史","tagColor":"#1E40AF","catchphrase":"戦いに勝ち、鎌倉に武士の政治をつくった","color":"#1D4ED8","accent":"#BFDBFE","bio":"源頼朝は、若いころ平氏に敗れ、伊豆で暮らしていた。やがて仲間を集めて立ち上がり、弟の義経たちの活躍で平氏を倒した。鎌倉を拠点に、土地を守る代わりに武士が働く関係をつくり、守護や地頭を各地に置いた。1192年には征夷大将軍になった。武士が中心となる政治、鎌倉幕府の仕組みを築いた人物だ。","greeting":"なぜ京都ではなく鎌倉に幕府を開いたのか——そこから話すと、武家政治の本質が見えてくる。","qs":["なぜ京都じゃなく鎌倉に幕府を開いたの？","御恩と奉公ってどんな仕組みなの？","守護と地頭はそれぞれ何をする役職なの？","貴族の政治と武士の政治は何がちがうの？","鎌倉幕府の成立は1185年？1192年？どっちが正しいの？"]},{"id":8,"name":"北条政子","period":"鎌倉時代（1157〜1225年）","emoji":"👑","tag":"日本史","tagColor":"#9D174D","catchphrase":"夫の死後も幕府を支えた、「尼将軍」","color":"#BE185D","accent":"#FBCFE8","bio":"北条政子は、源頼朝と結婚し、鎌倉幕府の誕生を支えた。頼朝が亡くなったあとも、幕府の中で強い力を持ち、「尼将軍」と呼ばれた。1221年、後鳥羽上皇が幕府を倒そうとした承久の乱では、武士たちに頼朝から受けた恩を思い出すよう呼びかけたと伝わる。幕府はこの戦いに勝ち、朝廷に対する力をさらに強めた。","greeting":"「尼将軍」と呼ばれている。承久の乱のあの演説——あれが幕府を救ったと言われているけど、あなたはどう思う？","qs":["承久の乱ってそもそもなぜ起きたの？","あの演説で御家人たちに何を訴えたの？","北条氏がなぜ幕府の実権を握れたの？","承久の乱の後、朝廷と幕府の関係はどう変わったの？","「尼将軍」と呼ばれるほど強かった女性は他にいるの？"]},{"id":85,"name":"源義経","period":"平安〜鎌倉時代（1159〜1189年）","emoji":"⚔️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"平氏を倒した英雄が、兄に追われる身になった","color":"#1D4ED8","accent":"#BFDBFE","bio":"源義経は、兄の頼朝のもとで平氏と戦った。一ノ谷や屋島などで勝ち、1185年の壇ノ浦の戦いで平氏を滅ぼした。しかし、朝廷との関わり方などをめぐって頼朝と仲が悪くなる。追われる身となって東北の平泉へ逃げたが、最後はそこで命を落とした。戦いで大活躍した一方、悲しい最期を迎えた人物として、物語にも多く描かれた。","greeting":"壇ノ浦で平氏を滅ぼした——でも兄・頼朝は私を許さなかった。武士の世の始まりと、その悲劇を話そう。","qs":["壇ノ浦の戦いってどんな戦いだったの？","なぜ兄の頼朝に追われたの？","義経はなぜそんなに人気があるの？","平氏と源氏の戦いはなぜ起きたの？","「判官びいき」という言葉は義経から来ているの？"]},{"id":36,"name":"チンギス・ハン","aliases":["チンギス・カン","チンギス=ハン","チンギス＝ハン"],"period":"モンゴル（1162年頃〜1227年）","emoji":"🏹","tag":"世界史","tagColor":"#B91C1C","catchphrase":"草原の人々をまとめ、モンゴル帝国をつくった","color":"#DC2626","accent":"#FCA5A5","bio":"モンゴルの草原では、多くの集団が争っていた。チンギス・ハンは仲間を増やし、1206年にそれらをまとめてモンゴル帝国を開いた。馬に乗る強い軍で、中国や中央アジアへ攻め進んだ。遠い地域どうしがつながる一方、多くの町が壊され、人命も失われた。子や孫の時代には、帝国はユーラシア大陸の広い範囲へ広がった。","greeting":"草原の覇者じゃ！なぜモンゴルがあそこまで強かったか——馬と弓だけじゃないぞ。聞くがよい。","qs":["モンゴル軍がなぜそんなに強かったの？","東西の交易路を開いたことで世界はどう変わったの？","元寇はなぜ二度とも失敗したの？","モンゴル帝国が滅んだ理由は何なの？","チンギス・ハンの本名は何なの？"]},{"id":98,"name":"親鸞","period":"鎌倉時代（1173〜1262年）","emoji":"🌸","tag":"日本史","tagColor":"#047857","catchphrase":"悩みのある普通の人も救われる、と教えた","color":"#059669","accent":"#6EE7B7","bio":"親鸞は、法然のもとで念仏の教えを学んだ。人は欲や悩みを簡単には捨てられない。そんな人こそ、阿弥陀仏の救いを信じることが大切だと説いた。結婚して家族と暮らしながら、人々に教えを伝えた人物でもある。その教えをもとに、後に浄土真宗が広まった。難しい修行のできる人だけでなく、普通の暮らしをする人にも届く教えだった。","greeting":"人は、自分の弱さとどう向き合えばよいのでしょう。「悪人正機」は悪いことを勧める教えではありません。意味を一つずつ考えてみませんか。","qs":["「悪人正機」ってどういう意味なの？","浄土真宗と浄土宗はどうちがうの？","親鸞がなぜ僧なのに結婚したの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","「歎異抄」ってどんな本なの？"]},{"id":86,"name":"北条泰時","period":"鎌倉時代（1183〜1242年）","emoji":"📜","tag":"日本史","tagColor":"#1E40AF","catchphrase":"武士のもめごとのため、法律をまとめた","color":"#1D4ED8","accent":"#BFDBFE","bio":"鎌倉時代には、土地をめぐる武士どうしの争いが多かった。幕府の政治を率いた北条泰時は、裁判の目安をはっきりさせようとした。1232年にまとめたのが、御成敗式目という武士の法律だ。これまでの武士の習慣や、筋が通っているかどうかを大切にした。担当者の気分で決めるのを防ぎ、武士の社会に合った決まりを示した。","greeting":"武士の世なのに、武士のための法律がなかった——それが不思議だった。御成敗式目を作った話をしよう。","qs":["御成敗式目って何を定めた法律なの？","執権政治ってどんな仕組みなの？","武士社会で法律が必要になった理由は？","承久の乱の後、武士の立場はどう変わったの？","御成敗式目は何条あって、どんなことが書いてあるの？"]},{"id":99,"name":"道元","period":"鎌倉時代（1200〜1253年）","emoji":"🧘","tag":"日本史","tagColor":"#047857","catchphrase":"座って心と体を整える、坐禅を大切にした","color":"#059669","accent":"#6EE7B7","bio":"道元は、本当の仏教を学ぼうと中国へ渡った。帰国後は、姿勢を整えて静かに座る「坐禅」を大切にし、曹洞宗を広めた。願いをかなえるためだけに座るのではなく、座ることそのものに意味があると考えた。福井に永平寺を開き、弟子たちを育てた。食事づくりや掃除など、毎日の暮らしも大切な修行だと教えた。","greeting":"「而今の山水は、古仏の道現成なり」——難しく聞こえるけど、今この瞬間に全てがある。座禅と禅の話をしましょう。","qs":["只管打坐ってどういう意味なの？","禅宗って念仏の宗派とどうちがうの？","宋に渡って何を学んだの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","「只管打坐」と「南無阿弥陀仏」は何がちがうの？"]},{"id":9,"name":"フビライ・ハン","period":"モンゴル・元（1215〜1294年）","emoji":"🏕️","tag":"世界史","tagColor":"#B45309","catchphrase":"元を治め、日本にも二度攻めてきた皇帝","color":"#D97706","accent":"#FDE68A","bio":"チンギス・ハンの孫であるフビライは、中国を治める国「元」を築いた。南宋を倒し、中国全体を支配した皇帝だ。日本にも従うよう求め、1274年と1281年に大軍を送った。これが元寇だ。日本の武士の抵抗や暴風雨などで、日本を従わせることはできなかった。元の時代には、アジアとヨーロッパの間で人や品物の行き来が盛んになった。","greeting":"大元の皇帝じゃ。海を越えた日本への遠征は、思うようには進まなかった。風だけでなく、兵や食料を運ぶ難しさにも目を向けてみるか。","qs":["元寇は何年に何回起きたの？","日本への遠征が失敗した背景は何なの？","元寇の後なぜ鎌倉幕府は御家人の信頼を失ったの？","モンゴル帝国ってどれくらい広かったの？","フビライ・ハンはなぜ3度目の日本遠征をしなかったの？"]},{"id":100,"name":"日蓮","period":"鎌倉時代（1222〜1282年）","emoji":"🔥","tag":"日本史","tagColor":"#B91C1C","catchphrase":"国も人も救いたい、と法華経の教えを広めた","color":"#DC2626","accent":"#FCA5A5","bio":"地震や食料不足が続く鎌倉時代、日蓮は仏教で人々や国を救おうと考えた。法華経というお経を大切にし、「南無妙法蓮華経」と唱える教えを広めた。これが日蓮宗のもとになった。他の教えや政治を厳しく批判したため、遠い島へ送られるなどの苦難も経験した。それでも教えを伝えることを続けた。","greeting":"私は法華経を重んじ、国や人々の暮らしをどう安定させるかを訴えた。当時の社会の不安と、私の教えのつながりを話そう。","qs":["法華経ってどんな経典なの？","日蓮はなぜ幕府に弾圧されたの？","日蓮宗が他の鎌倉仏教とちがう点は何なの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","「立正安国論」で日蓮は何を訴えたの？"]},{"id":60,"name":"一遍","period":"鎌倉時代（1239〜1289年）","emoji":"🎴","tag":"日本史","tagColor":"#B45309","catchphrase":"各地を旅し、踊りながら念仏を広めた","color":"#D97706","accent":"#FDE68A","bio":"一遍は、一つの寺にとどまらず、各地を旅して念仏を広めた。人々に「南無阿弥陀仏」と書いた札を配り、念仏を唱えるようすすめた。踊りながら唱える「踊念仏」も広まり、人々が集まった。財産や持ち物へのこだわりを捨て、自らも旅を続けた人物だ。その教えを受け継ぐ人々の集まりは、時宗と呼ばれるようになった。","greeting":"全国を旅しながら「南無阿弥陀仏」を広め続けた。鎌倉時代になぜあれほど新しい仏教が生まれたか、考えたことある？","qs":["鎌倉時代に新しい仏教がたくさん生まれたのはなぜ？","踊り念仏って何なの？","法然・親鸞・道元・日蓮・一遍のちがいを教えて","念仏で救われるという考え方は何が新しかったの？","一遍が描かれた「一遍上人絵伝」ってどんな作品なの？"]},{"id":76,"name":"マルコ・ポーロ","period":"イタリア（1254〜1324年）","emoji":"🗺️","tag":"世界史","tagColor":"#D97706","catchphrase":"遠い中国の話を、ヨーロッパに伝えた旅人","color":"#F59E0B","accent":"#FDE68A","bio":"マルコ・ポーロは、イタリアのベネチアからアジアへ旅した商人だ。中国の元を訪れ、フビライに仕えたと伝えられる。帰国後に語った旅の話は『東方見聞録』として広まった。日本についても、金が豊かな国だと紹介したが、本人が日本に来たわけではない。その本は、当時のヨーロッパの人々に遠いアジアへの関心を抱かせた。","greeting":"ヴェネツィアからモンゴル帝国まで——何年もかけて旅した。フビライ・ハンの宮廷で見たものを話そうか。","qs":["『東方見聞録』がヨーロッパ人に与えた衝撃は何だったの？","なぜモンゴル帝国時代に東西交流が盛んになったの？","マルコ・ポーロの旅がコロンブスに影響を与えたって本当？","元の時代の中国はどんな社会だったの？","日本のことを「黄金の国ジパング」と書いたのは本当なの？"]},{"id":59,"name":"後醍醐天皇","period":"鎌倉〜室町時代（1288〜1339年）","emoji":"👘","tag":"日本史","tagColor":"#9D174D","catchphrase":"鎌倉幕府を倒したが、武士の不満を招いた天皇","color":"#BE185D","accent":"#FBCFE8","bio":"後醍醐天皇は、天皇が中心となる政治を取り戻そうとした。一度は遠い島へ送られたが、あきらめず、武士の力を借りて1333年に鎌倉幕府を倒した。新しく始めた政治を建武の新政という。しかし、土地やほうびの決め方に武士の不満が高まり、足利尊氏と対立した。京都を離れて吉野へ移り、天皇が二つの側に分かれる南北朝時代になった。","greeting":"武士の世を終わらせ、天皇が直接政治を行う時代を取り戻そうとした。なぜ失敗したか、聞きたいか？","qs":["建武の新政ってどんな改革だったの？","なぜ建武の新政は短命に終わったの？","足利尊氏との対立はなぜ起きたの？","南北朝の対立ってどういう状況が60年近く続いたの？","後醍醐天皇が隠岐に流されたのに脱出できた理由は？"]},{"id":87,"name":"足利尊氏","period":"鎌倉〜室町時代（1305〜1358年）","emoji":"🏹","tag":"日本史","tagColor":"#D97706","catchphrase":"後醍醐天皇と別れ、室町幕府を開いた","color":"#F59E0B","accent":"#FDE68A","bio":"足利尊氏は、もとは鎌倉幕府の側の武士だったが、後醍醐天皇を助けて幕府を倒した。しかし、その後の政治に武士の不満が高まると、天皇と対立した。京都に別の天皇を立て、1338年に征夷大将軍となって室町幕府を開いた。後醍醐天皇も吉野で自分こそ正しい天皇だと主張し、二つの朝廷が争う時代が続いた。","greeting":"後醍醐天皇に背いた——でも武士の時代を守るためだった。室町幕府をどう開いたか、話そう。","qs":["なぜ後醍醐天皇に反旗を翻したの？","室町幕府と鎌倉幕府はどうちがうの？","南北朝の動乱ってどんな状況だったの？","室町幕府が安定するまでになぜ時間がかかったの？","足利尊氏と新田義貞はどんな関係だったの？"]},{"id":10,"name":"足利義満","period":"室町時代（1358〜1408年）","emoji":"🎭","tag":"日本史","tagColor":"#B45309","catchphrase":"金閣を建て、南北朝を一つにまとめた将軍","color":"#D97706","accent":"#FDE68A","bio":"室町幕府の3代将軍、足利義満は、長く争っていた南朝と北朝を1392年に一つにまとめた。力のある武士たちをおさえ、幕府の力も強めた。中国の明とは、正式な貿易船だと示す札を使う「勘合貿易」を始めた。京都に金閣を建てたことでも知られる。金色の建物には、義満の豊かさと大きな力が表れている。","greeting":"金閣寺、勘合貿易、南北朝統一——どれから聞く？全部わしの仕事じゃぞ。","qs":["勘合貿易って普通の貿易と何がちがうの？","南北朝がなぜ60年近くも続いたの？","金閣寺と銀閣寺はどうちがうの？","北山文化と東山文化、それぞれの特徴は？","足利義満が「日本国王」と名乗った理由は？"]},{"id":11,"name":"雪舟","period":"室町時代（1420〜1506年）","emoji":"🖌️","tag":"日本史","tagColor":"#047857","catchphrase":"墨の濃さだけで、山や川を描いた名人","color":"#059669","accent":"#6EE7B7","bio":"雪舟は、室町時代のお坊さんであり、絵の名人でもあった。中国の明へ渡り、絵や本物の山々を見て学んだ。帰国後は、墨の濃さや薄さを生かす水墨画で、日本の風景も描いた。黒い墨だけなのに、山の遠さや水の流れまで感じられる。長い巻物に四季の景色を描いた作品などを残し、日本の水墨画を大きく発展させた。","greeting":"墨と静けさ——水墨画はそこから始まる。絵と文化のこと、聞いてみてください。","qs":["水墨画って普通の絵と何がちがうの？","明に渡って何を学んだの？","東山文化にはどんな特徴があるの？","書院造って現代の和室とどんな関係があるの？","雪舟が涙でネズミの絵を描いた伝説は本当なの？"]},{"id":37,"name":"コロンブス","period":"イタリア→スペイン（1451〜1506年）","emoji":"🧭","tag":"世界史","tagColor":"#0284C7","catchphrase":"アジアを目指して西へ進み、アメリカに着いた","color":"#0EA5E9","accent":"#BAE6FD","bio":"ヨーロッパから西へ船で進めば、アジアへ着けるのではないか。コロンブスはそう考え、スペインの支援で大西洋を渡った。1492年にカリブ海の島へ着いたが、そこをアジアだと思っていた。先住民はすでに暮らしており、誰もいない土地を見つけたわけではない。その航海の後、ヨーロッパによるアメリカの征服が進み、先住民は大きな被害を受けた。","greeting":"1492年——西に向かって大西洋を渡り、「新大陸」に辿り着いた。ただし、そこには既に人が住んでいた。","qs":["なぜヨーロッパ人は大航海に出るようになったの？","大航海時代は世界をどう変えたの？","先住民の視点から見ると「発見」はどういう意味になるの？","スペインとポルトガルはどう世界を分け合ったの？","コロンブスは最後までインドに着いたと思っていたの？"]},{"id":77,"name":"レオナルド・ダ・ヴィンチ","period":"イタリア（1452〜1519年）","emoji":"🎨","tag":"世界史","tagColor":"#6D28D9","catchphrase":"『モナ・リザ』も機械の研究も手がけた","color":"#7C3AED","accent":"#DDD6FE","bio":"レオナルド・ダ・ヴィンチは、ルネサンスの時代のイタリアで活躍した。『モナ・リザ』や『最後の晩餐』を描いた画家だが、関心は絵だけではなかった。人の体を調べ、空を飛ぶ機械なども考え、ノートにたくさんの図を残した。物事をよく見て、仕組みを知ろうとしたのだ。芸術と科学の両方に取り組んだ人物として知られる。","greeting":"絵を描き、解剖し、飛ぶ機械を考えた——全部同じ「なぜ？」という問いから始まった。ルネサンスの精神を話そう。","qs":["ルネサンスってどんな文化運動なの？","芸術と科学を同時に追求できた理由は何なの？","ルネサンスはなぜイタリアで始まったの？","ルネサンスが近代社会に与えた影響は？","ダ・ヴィンチのノートには何が書いてあるの？"]},{"id":88,"name":"マゼラン","period":"ポルトガル→スペイン（1480年頃〜1521年）","emoji":"🌏","tag":"世界史","tagColor":"#0284C7","catchphrase":"世界一周につながる航海を始めた船長","color":"#0EA5E9","accent":"#BAE6FD","bio":"マゼランは、アジアへ向かう新しい海の道を探し、スペインから西へ出発した。南アメリカの南を通り、広い太平洋を渡った。しかし、本人は途中のフィリピンで戦いに巻き込まれ、亡くなった。残った仲間たちが1522年にスペインへ帰り、船での世界一周を初めて成し遂げた。地球を船で回れることを、実際の航海で示したのだ。","greeting":"地球を西に向かって一周する——誰もやったことがないことに挑んだ。大航海時代の話をしよう。","qs":["マゼランの死後、世界一周は誰が達成したの？","なぜポルトガルからスペインに乗り換えたの？","大航海時代に命がけで航海した理由は何なの？","マゼランとコロンブスの航海はどうちがうの？","マゼラン海峡はなぜ「マゼラン」の名がついたの？"]},{"id":38,"name":"ルター","period":"ドイツ（1483〜1546年）","emoji":"📖","tag":"世界史","tagColor":"#6D28D9","catchphrase":"教会のやり方に疑問を投げかけた","color":"#7C3AED","accent":"#DDD6FE","bio":"お金を払って札を買えば、罪への罰が軽くなる。そんな教会のやり方に、ルターは疑問を持った。1517年に意見を示したことが、宗教改革の大きなきっかけとなる。聖書の教えと、神を信じる心を大切にすべきだと説いた。聖書をドイツ語に訳し、普通の人にも読めるようにした。こうした動きから、プロテスタントと呼ばれる教会が生まれた。","greeting":"「聖書だけが権威だ」——そう言ってローマ教会に立ち向かった。宗教改革が世界をどう変えたか話そう。","qs":["免罪符って何なの？","宗教改革はヨーロッパ社会にどんな変化をもたらしたの？","カトリックとプロテスタントはどうちがうの？","宗教改革が近代国家の誕生とどう関係あるの？","ルターの宗教改革が活版印刷と関係あるって本当？"]},{"id":12,"name":"織田信長","period":"戦国〜安土桃山時代（1534〜1582年）","emoji":"🔥","tag":"日本史","tagColor":"#B91C1C","catchphrase":"天下統一の流れを大きく進めた武将","color":"#DC2626","accent":"#FCA5A5","bio":"各地の武将が争う戦国時代、織田信長は1560年の桶狭間の戦いで今川義元を破り、名を広めた。鉄砲を活用し、商売をしやすくする楽市・楽座も進めた。京都から足利義昭を追い出し、室町幕府を終わらせた人物でもある。しかし、天下統一の途中、1582年に家臣の明智光秀に攻められ、本能寺で命を落とした。","greeting":"「天下布武」——刀と銃と経済、全部使ったぞ。何を聞く？","qs":["長篠の戦いで鉄砲をどう使ったの？","楽市楽座って何が「楽」なの？","信長はなぜ「革命児」と呼ばれるの？","本能寺の変はなぜ起きたの？","信長・秀吉・家康の性格を表す「ホトトギス」の句って何？"]},{"id":13,"name":"豊臣秀吉","period":"安土桃山時代（1537〜1598年）","emoji":"🌟","tag":"日本史","tagColor":"#D97706","catchphrase":"低い身分から、全国をまとめる天下人へ","color":"#F59E0B","accent":"#FDE68A","bio":"豊臣秀吉は、農民の家に生まれたともいわれる、低い身分の出身だ。織田信長に仕えて出世し、信長が倒れると明智光秀を破った。1590年には天下統一を成し遂げる。田畑の広さや収穫量を調べる太閤検地、農民などから武器を集める刀狩で、国の仕組みを整えた。一方、朝鮮へ二度大軍を送り、現地と日本の人々に大きな被害をもたらした。","greeting":"天下をまとめるには、戦だけでは足りぬ。田畑を調べ、国の仕組みを整えたのじゃ。太閤検地でも刀狩りでも、気になることを聞いてくれ！","qs":["太閤検地って何をどう調べたの？","刀狩りは何のために行ったの？","朝鮮への侵略はどんな影響を与えたの？","農民出身でなぜここまで出世できたの？","秀吉が「黄金の茶室」を作った理由は何なの？"]},{"id":14,"name":"徳川家康","period":"江戸時代（1543〜1616年）","emoji":"🏯","tag":"日本史","tagColor":"#1E40AF","catchphrase":"人質の子ども時代から、約260年続く幕府の始まりへ","color":"#1D4ED8","accent":"#BFDBFE","bio":"徳川家康は、若いころ他の大名のもとで人質として暮らした。苦しい時代を経て力をつけ、秀吉が亡くなると天下をめぐる争いの中心になった。1600年の関ヶ原の戦いに勝ち、1603年に江戸幕府を開いた。その後、大坂の陣で豊臣氏を滅ぼした。家康が築いた仕組みは受け継がれ、徳川家の幕府は約260年続いた。","greeting":"戦に勝つことと、争いの後も続く仕組みを作ることは別じゃ。江戸幕府が長く続いた理由を、わしの時代と後の将軍の時代に分けて話そうか。","qs":["家光が制度化した参勤交代はどんな仕組みなの？","関ヶ原の戦いはどんな意味を持つの？","武家諸法度って何を禁止したの？","幕藩体制ってどんな仕組みなの？","江戸幕府が260年も続いた最大の理由は何だと思う？"]},{"id":103,"name":"ガリレオ・ガリレイ","period":"イタリア（1564〜1642年）","emoji":"🔭","tag":"世界史","tagColor":"#0284C7","catchphrase":"望遠鏡で空を見て、地球が動く説を支えた","color":"#0EA5E9","accent":"#BAE6FD","bio":"ガリレオは望遠鏡を工夫し、月の表面や木星のまわりの衛星を観察した。地球を中心にすべてが回る、という当時の考えでは説明しにくい発見だった。太陽のまわりを地球が回る地動説を支持したが、教会から問題視され、裁判にかけられた。昔からの考えを信じるだけでなく、観察や実験で確かめる姿勢を大切にした人物だ。","greeting":"空を観察すると、それまで当たり前だと思われた考えに疑問が生まれた。地動説や望遠鏡の話から、科学で確かめるとは何かを考えてみよう。","qs":["地動説と天動説はどうちがうの？","地動説をめぐる宗教裁判はどんなものだったの？","観察や実験を重視することはなぜ大切なの？","科学革命はヨーロッパ社会をどう変えたの？","ガリレオの望遠鏡はどれくらいの性能だったの？"]},{"id":90,"name":"ロック","period":"イギリス（1632〜1704年）","emoji":"📝","tag":"世界史","tagColor":"#6D28D9","catchphrase":"国民を守らない政府は、変えてよいと考えた","color":"#7C3AED","accent":"#DDD6FE","bio":"王様の命令には、何でも従うべきなのか。イギリスのロックは、人には生まれながらに命や自由、財産を守られる権利があると考えた。政府の役目は、その権利を守ることだ。政府が約束を破るなら、人々には政府を変える権利があると説いた。こうした考えは、アメリカの独立や、その後の民主政治にも影響を与えた。","greeting":"「人間は生まれながらに自由・平等・財産を持つ権利がある」——この考えがアメリカ独立宣言に直接つながった。","qs":["自然権ってどういう考え方なの？","社会契約論ってどういう意味なの？","ロックの考えがアメリカ独立にどう影響したの？","ロック・ルソー・モンテスキューはどう役割がちがうの？","ロックの考えは現代の人権とどうつながるの？"]},{"id":89,"name":"松尾芭蕉","period":"江戸時代（1644〜1694年）","emoji":"🐸","tag":"日本史","tagColor":"#047857","catchphrase":"旅の景色や気持ちを、短い言葉にした俳人","color":"#059669","accent":"#6EE7B7","bio":"松尾芭蕉は、江戸時代に俳諧を深めた人物だ。おもしろさだけでなく、静かな景色や心の動きも、短い言葉で表した。「古池や蛙飛びこむ水の音」はよく知られる一句だ。各地を旅し、東北や北陸を訪ねた旅をもとに『おくのほそ道』を残した。わずかな言葉から、音や景色、気持ちまで想像させる作品を生んだ。","greeting":"「古池や蛙飛び込む水の音」——たった17文字に宇宙を込める。俳句と奥の細道の話を聞いてください。","qs":["俳句の五・七・五はどう数えるの？","奥の細道の旅はどんな旅だったの？","元禄文化ってどんな文化なの？","俳句が武士じゃなく庶民の文化になった理由は？","「奥の細道」の旅は何日間・何kmくらいだったの？"]},{"id":101,"name":"徳川綱吉","period":"江戸時代（1646〜1709年）","emoji":"🐕","tag":"日本史","tagColor":"#1E40AF","catchphrase":"犬などの命を守る決まりを出した将軍","color":"#1D4ED8","accent":"#BFDBFE","bio":"江戸幕府の5代将軍、徳川綱吉は、学問や礼儀を大切にした。命を大切にするため、犬をはじめ動物などを守る「生類憐みの令」を出した。しかし、決まりを守る負担や厳しい罰で、人々が困ることもあった。綱吉の時代には町人の暮らしが豊かになり、京都や大坂などの上方を中心に元禄文化が栄えた。","greeting":"「犬将軍」と笑われたが——わしが目指したのは儒学で人々の心を豊かにする政治じゃ。元禄時代の話を聞いてくれ。","qs":["生類憐みの令ってどんな法律なの？","元禄文化ってどんな文化なの？","儒学を奨励することで何を変えようとしたの？","江戸幕府の将軍はどうやって政治をしていたの？","生類憐みの令は本当に犬だけを守る法律だったの？"]},{"id":15,"name":"近松門左衛門","period":"江戸時代（1653〜1725年）","emoji":"🎭","tag":"日本史","tagColor":"#9D174D","catchphrase":"町の人の恋や悩みを、舞台の物語にした","color":"#BE185D","accent":"#FBCFE8","bio":"近松門左衛門は、江戸時代に人形浄瑠璃や歌舞伎の台本を書いた。人形浄瑠璃は、人形の動きと語り、音楽で物語を伝える芝居だ。『曽根崎心中』などでは、恋する気持ちと、家や社会の決まりの間で苦しむ人を描いた。遠い昔の英雄だけでなく、町に暮らす普通の人も物語の中心になった。元禄文化を代表する作家の一人だ。","greeting":"「虚実の皮膜」——現実とフィクションの境界に芸術は宿る。江戸の文化、話しましょうか。","qs":["元禄文化ってどんな文化なの？","人形浄瑠璃って今で言う何に近いの？","なぜ江戸時代に庶民文化が発展したの？","化政文化と元禄文化はどうちがうの？","近松門左衛門が書いた「曽根崎心中」はどんな話なの？"]},{"id":102,"name":"新井白石","period":"江戸時代（1657〜1725年）","emoji":"📚","tag":"日本史","tagColor":"#6D28D9","catchphrase":"将軍を助け、お金や貿易を立て直した学者","color":"#7C3AED","accent":"#DDD6FE","bio":"江戸幕府のお金の使い方や、外国との付き合い方をどうするか。学者の新井白石は将軍を助け、政治を立て直そうとした。質のよい金貨や銀貨に戻し、外国へ金銀が出すぎないよう貿易を制限した。この政治を正徳の治という。歴史の本や自分の人生を振り返る本も書き、外国人から世界の様子を聞いて学んだ。","greeting":"学問で政治を変えられる——そう信じて将軍のそばで改革を進めた。江戸時代の政治の仕組み、話しましょう。","qs":["正徳の治ってどんな改革だったの？","江戸時代の三大改革を教えて","儒学が江戸時代の政治にどう影響したの？","長崎貿易の改革はなぜ必要だったの？","新井白石の「正徳の治」は享保の改革とどうちがうの？"]},{"id":91,"name":"モンテスキュー","period":"フランス（1689〜1755年）","emoji":"⚖️","tag":"世界史","tagColor":"#6D28D9","catchphrase":"政治の力を三つに分け、暴走を防ごうとした","color":"#7C3AED","accent":"#DDD6FE","bio":"一人の王様が、法律も裁判もすべて決めたらどうなるか。フランスのモンテスキューは、政治の力が一か所に集まる危険を考えた。法律をつくる力、政治を実行する力、裁判をする力を分け、互いに行きすぎを防ぐ仕組みを説いた。これが三権分立の考え方だ。『法の精神』という本にまとめ、今の日本などの政治にも影響を与えた。","greeting":"権力を一か所に集めると必ず腐敗する——だから三つに分けるべきだ。三権分立の話をしよう。","qs":["三権分立ってなぜ必要なの？","日本の政治でも三権分立は使われているの？","啓蒙思想って何なの？","ロック・ルソー・モンテスキューはどう役割がちがうの？","三権分立は日本でどのように実現されているの？"]},{"id":40,"name":"ルソー","period":"フランス（1712〜1778年）","emoji":"📝","tag":"世界史","tagColor":"#6D28D9","catchphrase":"政治の主人公は国民だ、と考えた","color":"#7C3AED","accent":"#DDD6FE","bio":"王様だけで国のことを決めてよいのか。ルソーは、政治を決めるもとの力は人々にあるという国民主権を説いた。人々が約束を結び、みんなのための社会をつくると考えたのだ。考えをまとめた本が『社会契約論』だ。子どもの育ち方についても考え、教育の本を書いた。その思想は、フランス革命などに大きな影響を与えた。","greeting":"「人間は生まれながらに自由である。しかしいたるところで鎖につながれている」——自由と革命の話をしよう。","qs":["啓蒙思想って何なの？","「人民主権」ってどういう意味なの？","ルソーの考えがフランス革命にどう影響したの？","モンテスキュー・ロックとルソーはどうちがうの？","ルソーのいう自由は、何でもしてよいという意味なの？"]},{"id":17,"name":"本居宣長","period":"江戸時代（1730〜1801年）","emoji":"📖","tag":"日本史","tagColor":"#6D28D9","catchphrase":"日本の古い言葉と心を、長い年月をかけて調べた","color":"#7C3AED","accent":"#DDD6FE","bio":"江戸時代、外国から来た教えだけでなく、日本の古い考え方も知ろうという国学が広まった。本居宣長は、昔の言葉を一つずつ調べ、『古事記』の意味を読み解いた。約35年かけて『古事記伝』をまとめた人物だ。医者として働きながら研究を続け、『源氏物語』についても、人がしみじみ感じる「もののあはれ」を大切にして読んだ。","greeting":"「もののあわれ」——日本人の心の奥にある美しい感受性を、源氏物語から見つけた。","qs":["国学ってどんな学問なの？","「もののあわれ」って一言で言うとどういう意味なの？","国学が明治維新にどう影響したの？","蘭学と国学はなぜ同時代に発展したの？","本居宣長の「古事記伝」は完成までに何年かかったの？"]},{"id":39,"name":"ワシントン","period":"アメリカ（1732〜1799年）","emoji":"🦅","tag":"世界史","tagColor":"#0284C7","catchphrase":"アメリカ独立の戦いを率いた、初代大統領","color":"#0EA5E9","accent":"#BAE6FD","bio":"北アメリカの人々は、イギリスに税を取られる一方、政治に意見を届けにくいことに不満を持った。ワシントンは独立戦争で軍を率い、厳しい戦いを勝ち抜いた。独立後はアメリカの初代大統領となり、新しい国の仕組みを整えた。二期で大統領を退いたが、本人は奴隷を所有しており、自由を掲げた国にも自由がすべての人に認められたわけではなかった。","greeting":"「代表なくして課税なし」——そのひとことがアメリカ独立の火をつけた。民主主義の誕生を話そう。","qs":["なぜイギリスの植民地が独立しようとしたの？","独立宣言で何が宣言されたの？","民主主義ってどんな考え方なの？","アメリカ独立がフランス革命に与えた影響は？","ワシントンが大統領を2期で辞めた理由は何なの？"]},{"id":16,"name":"杉田玄白","period":"江戸時代（1733〜1817年）","emoji":"📚","tag":"日本史","tagColor":"#047857","catchphrase":"体の中のつくりを学び、『解体新書』を出した","color":"#059669","accent":"#6EE7B7","bio":"杉田玄白は、人の体の中を調べる場に立ち会い、オランダの医学書の図が正確なことに驚いた。日本に伝わっていた説明とは違っていたのだ。そこで仲間たちと、難しいオランダ語の本を日本語に訳した。1774年に出版されたのが『解体新書』だ。外国の言葉を通じて学ぶ蘭学が、日本で広まる大きなきっかけになった。","greeting":"本の図が、実際に見た体の様子とよく合っていた。その驚きが翻訳の出発点です。前野良沢ら仲間と取り組んだ『解体新書』の話をしましょう。","qs":["蘭学ってどんな学問なの？","仲間と『解体新書』を訳すのはなぜ大変だったの？","江戸時代に医学がなぜ発展したの？","国学と蘭学はどうちがうの？","「蘭学事始」にはどんな苦労話が書いてあるの？"]},{"id":41,"name":"ナポレオン","period":"フランス（1769〜1821年）","emoji":"⚔️","tag":"世界史","tagColor":"#1E40AF","catchphrase":"革命後のフランスで力をつけ、皇帝になった","color":"#1D4ED8","accent":"#BFDBFE","bio":"フランス革命の後、国内では政治の争いが続いていた。軍人のナポレオンは戦いで活躍し、人々の支持を集めて政治の力を握った。1804年には皇帝となり、法律をまとめたナポレオン法典をつくった。ヨーロッパの広い地域へ軍を進めたが、ロシアへの遠征に失敗するなどして力を失った。最後は遠い島へ送られ、そこで亡くなった。","greeting":"革命後のフランスで力を握り、やがて皇帝となった。法律を整えたことも、戦争が広がったことも含めて、私の時代を見てほしい。","qs":["フランス革命はなぜ起きたの？","ナポレオン法典って何を定めたの？","なぜモスクワ遠征は失敗したの？","ナポレオンがヨーロッパ各国にもたらしたものは？","ナポレオンの身長が低いという話は本当なの？"]},{"id":43,"name":"リンカーン","period":"アメリカ（1809〜1865年）","emoji":"🇺🇸","tag":"世界史","tagColor":"#B91C1C","catchphrase":"奴隷制に反対し、分かれたアメリカをまとめた","color":"#DC2626","accent":"#FCA5A5","bio":"アメリカでは、人を持ち物のように扱う奴隷制をめぐって、南部と北部の対立が深まった。リンカーンが大統領になると、南部が国から離れようとし、1861年に南北戦争が始まった。戦争中に奴隷解放宣言を出し、国が分かれるのを防ごうとした。北部の勝利直後に殺されたが、奴隷制をなくす大きな流れを進めた。","greeting":"「人民の、人民による、人民のための政治」——民主主義をひとことで言うならこれだ。南北戦争の話をしよう。","qs":["南北戦争ってなぜ起きたの？","奴隷制度ってなぜアメリカに存在したの？","奴隷解放宣言はどんな意味を持つの？","リンカーン暗殺はなぜ起きたの？","奴隷解放宣言を出した背景を教えて？"]},{"id":104,"name":"ダーウィン","period":"イギリス（1809〜1882年）","emoji":"🦕","tag":"世界史","tagColor":"#047857","catchphrase":"生き物は長い時間をかけて変わる、と考えた","color":"#059669","accent":"#6EE7B7","bio":"ダーウィンは船で各地を旅し、動植物や化石を調べた。同じような生き物でも、場所によって少し違う。その観察から、生き物は長い年月の間に変わってきたと考えた。環境に合う特徴を持つものが子孫を残しやすい、という自然選択を説いたのだ。1859年に『種の起源』を出し、生き物の歴史の考え方を大きく変えた。","greeting":"航海で集めた観察や資料を、長い時間をかけて考えた。生き物はなぜ多様なのか。自然選択という考え方から、一緒にたどってみよう。","qs":["進化論ってどういう考え方なの？","自然選択ってどういう意味なの？","進化論が当時の社会に与えた衝撃は何なの？","ガラパゴスで何を発見したの？","進化論を発表するまでに20年以上かかった理由は？"]},{"id":44,"name":"ビスマルク","period":"ドイツ（1815〜1898年）","emoji":"🏰","tag":"世界史","tagColor":"#92400E","catchphrase":"いくつもの国に分かれたドイツをまとめた","color":"#B45309","accent":"#FDE68A","bio":"19世紀のドイツは、まだ多くの国に分かれていた。プロイセンの政治家ビスマルクは、軍を強くし、戦争を通じて統一を進めた。1871年にドイツ帝国が成立すると、その政治を率いた。強い進め方から「鉄血宰相」と呼ばれる。一方で、働く人のための保険の仕組みを整え、統一後はヨーロッパの国々との関係にも気を配った。","greeting":"「現在の大問題は演説や多数決ではなく、鉄と血によって解決される」——ドイツ統一の話をしよう。","qs":["ドイツが統一されるまでにどんな戦争があったの？","ビスマルクの外交がヨーロッパの平和を保った仕組みは？","普仏戦争ってどんな戦争なの？","ドイツ統一が第一次世界大戦につながった理由は？","ビスマルク体制が崩れたことが第一次世界大戦につながったの？"]},{"id":42,"name":"マルクス","period":"ドイツ（1818〜1883年）","emoji":"✊","tag":"世界史","tagColor":"#B91C1C","catchphrase":"働く人が貧しいのはなぜか、と社会を調べた","color":"#DC2626","accent":"#FCA5A5","bio":"工場が増えて豊かな人が生まれる一方、長時間働いても貧しい人がいた。マルクスは、なぜこの差が生まれるのかを調べた。工場や土地などを持つ人に富が集まる、資本主義の仕組みを批判したのだ。働く人々が社会を変え、生産に使うものを共同で持つ社会を目指した。『資本論』などにまとめた考えは、後の社会主義運動に大きな影響を与えた。","greeting":"「万国の労働者よ、団結せよ」——産業革命が生んだ格差に、哲学で立ち向かった。","qs":["産業革命って具体的に何が変わったの？","資本主義の何が問題だとマルクスは考えたの？","社会主義と共産主義はどうちがうの？","マルクスの思想がソ連・中国にどう影響したの？","マルクスの思想が現代でもまだ議論される理由は？"]},{"id":92,"name":"西郷隆盛","period":"幕末〜明治時代（1828〜1877年）","emoji":"🌋","tag":"日本史","tagColor":"#B91C1C","catchphrase":"明治の国づくりを進めたが、最後は政府と戦った","color":"#DC2626","accent":"#FCA5A5","bio":"薩摩藩の西郷隆盛は、長州藩と手を組んで江戸幕府を倒す動きを進めた。江戸では勝海舟と話し合い、大きな戦いを避けて城を受け取った。明治政府でも働いたが、朝鮮への対応をめぐって仲間と意見が分かれ、政府を去った。1877年には不満を持つ士族に担がれ、西南戦争で政府と戦った。敗れた末に命を落とした。","greeting":"「敬天愛人」——天を敬い、人を愛せよ。維新を成し遂げながら、なぜ新政府と戦ったか、話そう。","qs":["薩長同盟はどうやって成立したの？","廃刀令や徴兵令はなぜ武士の反感を買ったの？","西南戦争はなぜ起きたの？","西郷隆盛がいまも人気がある理由は何なの？","西郷隆盛の銅像がなぜ上野公園にあるの？"]},{"id":93,"name":"大久保利通","period":"幕末〜明治時代（1830〜1878年）","emoji":"🏛️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"工場や産業を育て、明治の国づくりを進めた","color":"#1D4ED8","accent":"#BFDBFE","bio":"薩摩藩出身の大久保利通は、江戸幕府を倒す動きに加わった。明治政府では、外国に負けない国をつくろうと、工場や交通などを整えた。国が産業を育てる殖産興業を進めた人物だ。一方、急な改革に不満を持つ人も多かった。かつての仲間、西郷隆盛とも対立し、西南戦争の翌年に襲われて亡くなった。","greeting":"感情で動けば国は滅ぶ——明治の日本に必要なのは冷静な設計だった。近代国家の作り方を話そう。","qs":["岩倉使節団はなぜ欧米へ行ったの？","殖産興業ってどんな政策なの？","西郷隆盛と大久保利通はなぜ対立したの？","明治政府が最初に力を入れたことは何なの？","大久保利通が暗殺された「紀尾井坂の変」って何？"]},{"id":20,"name":"福沢諭吉","period":"明治時代（1835〜1901年）","emoji":"💡","tag":"日本史","tagColor":"#D97706","catchphrase":"学ぶことの大切さを広めた、『学問のすゝめ』の人","color":"#F59E0B","accent":"#FDE68A","bio":"福沢諭吉は、江戸時代の終わりに外国語を学び、アメリカやヨーロッパも訪れた。そこで知った社会の仕組みを、日本の人々にわかりやすく紹介した。『学問のすゝめ』では、自分で考えて生きるために学ぶことが大切だと説いた。身分よりも学びや働きを重んじ、慶應義塾を育てた。この学校は今の慶應義塾大学につながる。","greeting":"「天は人の上に人を造らず、人の下に人を造らず」——この言葉の本当の意味、知ってるかい？","qs":["文明開化って具体的に何が変わったの？","「天は人の上に人を造らず」の続きの意味は何なの？","なぜ学問が明治時代に必要とされたの？","福沢諭吉がお札になった理由は何なの？","福沢諭吉の「脱亜論」ってどんな内容なの？"]},{"id":18,"name":"坂本龍馬","period":"幕末（1836〜1867年）","emoji":"🌊","tag":"日本史","tagColor":"#0284C7","catchphrase":"敵どうしだった薩摩と長州をつないだ","color":"#0EA5E9","accent":"#BAE6FD","bio":"土佐藩出身の坂本龍馬は、日本を変えようと藩の外へ出て活動した。船や外国の知識を学び、商売も政治も進める仲間を集めた。仲の悪かった薩摩藩と長州藩の間を取り持ち、1866年の薩長同盟を助けた。幕府が政治の権限を天皇に返す大政奉還を求める動きにも関わったが、新しい時代を見届ける前に京都で殺された。","greeting":"幕府だ藩だとかいう前に、日本全体のことを考えなきゃ——そう思って動いた。何を聞く？","qs":["薩長同盟ってなぜ必要だったの？","大政奉還ってどんな意味があるの？","龍馬はなぜ暗殺されたの？","幕末の志士たちは何を目指していたの？","坂本龍馬の「船中八策」って何を提案したの？"]},{"id":94,"name":"板垣退助","period":"明治時代（1837〜1919年）","emoji":"✊","tag":"日本史","tagColor":"#9D174D","catchphrase":"国民の声を政治に届けようとした","color":"#BE185D","accent":"#FBCFE8","bio":"明治政府では、一部の人が政治を決めることへの不満が高まっていた。政府を去った板垣退助は、国民が選んだ代表の集まる議会を開くよう求めた。これが自由民権運動の大きな流れになる。自由党もつくり、人々の権利を広げようとした。演説中に襲われても生き延び、その後も政治活動を続けた。","greeting":"「板垣死すとも自由は死せず」——岐阜で刺されたときそう叫んだと言われる。国民の権利を勝ち取る戦いを話そう。","qs":["自由民権運動ってどんな運動なの？","民選議院設立建白書って何を求めたの？","国会はいつ・どうやって作られたの？","伊藤博文と板垣退助はどうちがうの？","「板垣死すとも自由は死せず」は本当に言ったの？"]},{"id":21,"name":"伊藤博文","period":"明治時代（1841〜1909年）","emoji":"📜","tag":"日本史","tagColor":"#1E40AF","catchphrase":"憲法づくりを進めた、日本の初代総理大臣","color":"#1D4ED8","accent":"#BFDBFE","bio":"伊藤博文は長州藩の出身で、若いころイギリスへ渡って外国を学んだ。明治政府では、国の政治の仕組みづくりを進め、1885年に初代内閣総理大臣となった。ヨーロッパの憲法を調べ、1889年に発布された大日本帝国憲法の作成を率いた。その後、韓国への日本の支配を進める立場にもなり、1909年に安重根に撃たれて亡くなった。","greeting":"プロイセンの憲法を参考に——日本独自の憲法を作るためにヨーロッパへ渡った。","qs":["大日本帝国憲法はどの国の憲法を参考にしたの？","内閣制度ってなぜ必要だったの？","自由民権運動と憲法制定はどう関係あるの？","伊藤博文が安重根に暗殺された背景は？","大日本帝国憲法と日本国憲法はどこがちがうの？"]},{"id":95,"name":"陸奥宗光","period":"明治時代（1844〜1897年）","emoji":"🤝","tag":"日本史","tagColor":"#0284C7","catchphrase":"不平等な条約を、一歩変えた外交官","color":"#0EA5E9","accent":"#BAE6FD","bio":"外国人が日本で罪を犯しても、日本の裁判で裁けない。幕末に結んだ不平等条約には、そんな決まりがあった。外務大臣の陸奥宗光は、外国との話し合いを重ねた。1894年、イギリスとの条約を改め、領事裁判権をなくすことに成功した。実際になくなるのは1899年だ。日本が長く求めた条約改正を、大きく前に進めた人物だ。","greeting":"条約改正は、一つの権利を取り戻せば全部終わり、という話ではない。領事裁判権と関税自主権を分けるところから、外交の歩みを話そう。","qs":["不平等条約ってどんな内容だったの？","治外法権ってどういう意味なの？","条約改正がなぜそんなに難しかったの？","日清戦争はなぜ起きてどんな結果になったの？","ノルマントン号事件が条約改正にどう影響したの？"]},{"id":19,"name":"明治天皇","period":"明治時代（1852〜1912年）","emoji":"🌸","tag":"日本史","tagColor":"#B91C1C","catchphrase":"江戸から明治へ、大きく変わる時代の天皇","color":"#DC2626","accent":"#FCA5A5","bio":"明治天皇が即位したころ、江戸幕府は終わり、天皇を中心とする新しい政府が生まれた。都は京都から東京へ移り、身分や税、軍隊、学校などの仕組みも大きく変わった。大日本帝国憲法のもとでは、天皇が国を治める中心とされた。政治は多くの政府の人々が進めており、明治天皇一人がすべてを決めたわけではない。","isNarrator":true,"greeting":"「富国強兵・殖産興業」——明治政府が掲げたスローガンで、日本はわずか数十年で列強の仲間入りをしました。明治時代の話を学びましょう。","qs":["五箇条の御誓文で何が約束されたの？","廃藩置県はなぜ必要だったの？","大日本帝国憲法と日本国憲法はどうちがうの？","日清・日露戦争はなぜ起きてどう終わったの？","五箇条の御誓文と日本国憲法の精神はつながっているの？"]},{"id":24,"name":"夏目漱石","period":"明治〜大正時代（1867〜1916年）","emoji":"📝","tag":"日本史","tagColor":"#6D28D9","catchphrase":"人の心の迷いを描いた、『こころ』の作家","color":"#7C3AED","accent":"#DDD6FE","bio":"夏目漱石は英語の教師として働き、イギリスへ留学した。その後、『吾輩は猫である』で作家として注目された。猫の目で人間を見るおもしろい作品から、人を信じる難しさを描く『こころ』まで、多くの小説を残した。社会が変わる中で、人はどう生きればよいのか。登場人物の悩みを通して、その問いを描いた。","greeting":"小説には、すぐ答えの出ない人間の悩みが出てくる。『坊っちゃん』でも『こころ』でも、明治という時代でも、気になるところから話そう。","qs":["『こころ』のテーマは何なの？","近代化の中で「個人の孤独」がなぜ生まれたの？","明治時代の文学はなぜ西洋の影響を受けたの？","夏目漱石と森鴎外はどうちがうの？","漱石がロンドン留学で精神的に苦しんだ理由は？"]},{"id":46,"name":"ガンジー","period":"インド（1869〜1948年）","emoji":"🕊️","tag":"世界史","tagColor":"#047857","catchphrase":"暴力を使わず、インドの独立を求めた","color":"#059669","accent":"#6EE7B7","bio":"ガンジーは南アフリカで差別を受け、人々の権利のために活動した。インドへ戻ると、イギリスの支配に対し、暴力を使わず、協力しない方法で抵抗した。塩を自由につくれない決まりに抗議して海まで歩くなど、多くの人を動かした。1947年にインドは独立したが、宗教の違いによる争いも起き、ガンジーは翌年に殺された。","greeting":"不当な決まりに、暴力を使わずどう抵抗するか。私は、その道を人々と探った。塩の行進やインド独立の話から始めようか。","qs":["塩の行進ってどんな抵抗運動なの？","非暴力で植民地支配に勝てると信じた理由は？","インドがイギリスの植民地になった経緯は？","ガンジーの思想が世界の独立運動に与えた影響は？","ガンジーの「非暴力」は現代の社会運動にどう影響しているの？"]},{"id":45,"name":"レーニン","period":"ロシア（1870〜1924年）","emoji":"✊","tag":"世界史","tagColor":"#B91C1C","catchphrase":"「戦争をやめよう」と呼びかけ、ロシアで革命を起こした","color":"#DC2626","accent":"#FCA5A5","bio":"第一次世界大戦中のロシアでは、戦争が長引き、食べ物も足りなくなった。皇帝が倒れたあとも苦しみが続く中、レーニンは「平和を」「農民に土地を」と人々に呼びかけた。1917年のロシア革命で仲間と政府を倒し、政治の中心になった。土地や工場などを共同で持つ社会主義を目指し、後にソ連が生まれた。一方、反対する人々を力でおさえつけた。","greeting":"「一歩前進、二歩後退」——ロシア革命は直線ではなかった。世界初の社会主義国家をどう作ったか話そう。","qs":["ロシア革命ってなぜ起きたの？","ソビエト連邦ってどんな国だったの？","社会主義国家と資本主義国家はどうちがうの？","ロシア革命が世界に与えた衝撃は何だったの？","レーニンの死後、ソ連はどう変わったの？"]},{"id":50,"name":"チャーチル","period":"イギリス（1874〜1965年）","emoji":"🇬🇧","tag":"世界史","tagColor":"#1E40AF","catchphrase":"ナチスに負けない、とイギリスを率いた首相","color":"#1D4ED8","accent":"#BFDBFE","bio":"第二次世界大戦で、ナチス・ドイツがヨーロッパへ攻め広がった。1940年にイギリスの首相になったチャーチルは、ドイツに負けて従うことはしないと訴えた。空からの激しい攻撃を受ける中でも、演説で国民を励まし、アメリカなどと協力した。戦後は、ヨーロッパが東西に分かれていく状況を「鉄のカーテン」という言葉で表した。","greeting":"ナチス・ドイツとの戦争で、イギリスは厳しい選択を迫られた。戦いの経過でも、演説でも、戦後の冷戦でも、気になることを聞いてくれ。","qs":["なぜイギリスはナチスに屈しなかったの？","連合国ってどの国が入っていたの？","冷戦の「鉄のカーテン」という言葉はどこから来たの？","第二次世界大戦後の世界秩序はどう変わったの？","チャーチルの演説がなぜ戦争の流れを変えたの？"]},{"id":23,"name":"野口英世","period":"明治〜大正時代（1876〜1928年）","emoji":"🔬","tag":"日本史","tagColor":"#047857","catchphrase":"幼い日の大やけどを乗り越え、世界で病気を研究した","color":"#059669","accent":"#6EE7B7","bio":"野口英世は、幼いころの大やけどで左手が不自由になった。後に手術で回復したことをきっかけに、医師を目指した。アメリカへ渡り、病気を起こす細菌を研究したが、最後はアフリカで黄熱の研究中に自らも感染して亡くなった。当時は高く評価された一方、黄熱についての説など、後に誤りとわかった研究もある。努力も失敗も残した研究者だ。","greeting":"貧乏で、手に障害があって、でも諦めなかった。努力の話、聞いてほしい。","qs":["野口英世はどんな研究をしたの？","明治時代になぜ科学・医学が急発展したの？","貧困から世界的科学者になれた理由は何なの？","野口英世はなぜ黄熱病の研究でアフリカへ行ったの？","野口英世がお札の人物に選ばれた理由は？"]},{"id":22,"name":"与謝野晶子","period":"明治〜昭和時代（1878〜1942年）","emoji":"🌺","tag":"日本史","tagColor":"#9D174D","catchphrase":"弟に「死なないで」と訴えた歌人","color":"#BE185D","accent":"#FBCFE8","bio":"与謝野晶子は、短歌集『みだれ髪』で、自分の思いや恋する気持ちを力強く表した。日露戦争のときには、戦地へ行った弟に向けて「君死にたまふことなかれ」と呼びかける詩を書いた。国のために死ぬことが立派とされた時代に、家族の命を思う気持ちを示したのだ。女性の教育や社会での生き方についても意見を発信した。","greeting":"「君死にたまふことなかれ」——弟に向けたこの歌は、国家と個人の間で引き裂かれた女性の叫びでもあった。","qs":["日露戦争の時代の日本社会ってどんな雰囲気だったの？","反戦詩を書くことは当時どれだけ危険だったの？","明治時代の女性の地位はどんな感じだったの？","与謝野晶子の歌が現代に伝えるものは何なの？","与謝野晶子の「みだれ髪」はなぜ当時衝撃的だったの？"]},{"id":27,"name":"吉田茂","period":"昭和時代（1878〜1967年）","emoji":"🕊️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"戦後の日本を率い、独立の回復を進めた首相","color":"#1D4ED8","accent":"#BFDBFE","bio":"第二次世界大戦に負けた日本は、連合国に管理される占領の時代を迎えた。吉田茂は首相として、アメリカと協力しながら国の立て直しを進めた。1951年にサンフランシスコ平和条約へ署名し、翌年、日本は独立を回復した。同時に日米安全保障条約も結んだ。安全をアメリカとの関係に頼り、経済の回復を重視した人物だ。","greeting":"戦後の日本を、どのように立て直すか。それは外交と暮らしの両方に関わる問題じゃ。平和条約でも経済復興でも、聞いてみるがよい。","qs":["サンフランシスコ平和条約で何が決まったの？","日米安保条約ってどんな内容なの？","GHQの占領政策で日本はどう変わったの？","朝鮮戦争が日本の復興にどう関係したの？","「吉田ドクトリン」って具体的にどんな方針なの？"]},{"id":51,"name":"ルーズベルト","period":"アメリカ（1882〜1945年）","emoji":"🦅","tag":"世界史","tagColor":"#0284C7","catchphrase":"不景気と世界大戦に向き合ったアメリカ大統領","color":"#0EA5E9","accent":"#BAE6FD","bio":"世界恐慌で仕事を失う人が増えたアメリカで、ルーズベルトは1933年に大統領になった。国がお金を使って仕事をつくるなど、ニューディール政策を進めた。第二次世界大戦では、日本の真珠湾攻撃の後、ドイツや日本と戦うアメリカを率いた。イギリスやソ連などと協力したが、戦争が終わる前の1945年に亡くなった。","greeting":"「恐れるべきものは恐れ自身だ」——大恐慌の時代、アメリカ国民にそう語りかけた。","qs":["ニューディール政策って何をしたの？","大恐慌はなぜ起きたの？","ヤルタ会談で何が決まったの？","第二次世界大戦後の国連はどうやって作られたの？","ニューディール政策と日本の高度経済成長は似ているの？"]},{"id":26,"name":"東条英機","period":"昭和時代（1884〜1948年）","emoji":"⚔️","tag":"日本史","tagColor":"#B91C1C","catchphrase":"太平洋戦争が始まったときの総理大臣","color":"#DC2626","accent":"#FCA5A5","bio":"日中戦争が続き、アメリカとの関係も悪くなる中、東条英機は1941年に首相となった。同年12月、日本は真珠湾などを攻撃し、太平洋戦争が始まった。軍人でもある東条は、戦争中の政治で大きな役割を持ったが、戦況が悪くなって退陣した。敗戦後、東京裁判で戦争の責任を問われ、死刑となった。","isExplainer":true,"greeting":"太平洋戦争開戦の背景——なぜ日本がアメリカと戦争することになったのか、その歴史的経緯を一緒に学びましょう。","qs":["なぜ日本はアメリカに宣戦布告したの？","軍国主義ってどうやって日本を支配したの？","東京裁判ってどんな裁判だったの？","太平洋戦争で日本はなぜ負けたの？","太平洋戦争の開戦と終戦はどこで決められたの？"]},{"id":25,"name":"平塚らいてう","period":"明治〜昭和時代（1886〜1971年）","emoji":"✊","tag":"日本史","tagColor":"#9D174D","catchphrase":"「女性も自分らしく生きたい」と声を上げた","color":"#BE185D","accent":"#FBCFE8","bio":"女性は家を守り、男性に従うもの。そんな考えが強かった時代に、平塚らいてうは女性が自分の考えを表す場をつくった。1911年、仲間と雑誌『青鞜』を始め、「元始、女性は太陽であった」と訴えた。女性が政治に関わる権利や、母親への支援も求めた。女性の声が届きにくかった社会を変えようと活動した人物だ。","greeting":"「元始、女性は太陽であった」——まず自分の中の太陽を取り戻すことから始まる。","qs":["大正デモクラシーってどんな運動なの？","明治・大正時代の女性の権利はどうだったの？","「青鞜」という雑誌は何を訴えていたの？","女性が参政権を得たのはいつ、なぜなの？","「新しい女」という言葉はどういう意味だったの？"]},{"id":49,"name":"ヒトラー","period":"ドイツ（1889〜1945年）","emoji":"⚠️","tag":"世界史","tagColor":"#B91C1C","catchphrase":"独裁と侵略を進め、多くの命を奪った","color":"#DC2626","accent":"#FCA5A5","bio":"不景気や第一次世界大戦後の不満が広がるドイツで、ヒトラーはナチスを率いて力をつけた。1933年に首相となると、反対する人の自由を奪い、一人に権力を集めた。1939年のポーランド侵攻は、第二次世界大戦の始まりとなった。ユダヤ人への差別を進め、約600万人を組織的に殺害するなど、計り知れない被害をもたらした。","isExplainer":true,"greeting":"歴史の中で最も重要な反面教師——なぜ民主主義国家ドイツでナチズムが生まれたのか。この問いは現代にも直結します。一緒に学びましょう。","qs":["なぜドイツ国民がヒトラーを支持したの？","ホロコーストってどんな事件なの？","民主主義はなぜナチズムを止められなかったの？","第二次世界大戦はどうやって始まって終わったの？","ナチスの台頭から学べる民主主義の弱点って何？"]},{"id":52,"name":"毛沢東","period":"中国（1893〜1976年）","emoji":"🐉","tag":"世界史","tagColor":"#B91C1C","catchphrase":"中国共産党を率い、新しい中国をつくった","color":"#DC2626","accent":"#FCA5A5","bio":"毛沢東は、中国共産党を率い、農民の力も集めて勢力を広げた。日本との戦争や国民党との内戦を経て、1949年に中華人民共和国の成立を宣言した。その後は、土地や工場などを国や集団で持つ社会を目指した。しかし、急な政策で多くの人が飢え、文化大革命では人々が攻撃され、社会が大きく混乱した。","isExplainer":true,"greeting":"「革命は客を招いてご飯を食べることではない」——毛沢東のこの言葉が示す時代。中華人民共和国の建国と文化大革命の歴史を一緒に学びましょう。","qs":["中華人民共和国はどうやって建国されたの？","国共内戦ってどんな戦いだったの？","文化大革命はなぜ起きてどんな影響があったの？","中国と台湾の関係はどう生まれたの？","「大躍進政策」はなぜ失敗したの？"]},{"id":28,"name":"昭和天皇","period":"昭和時代（1901〜1989年）","emoji":"🕊️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"戦争と敗戦を経て、「象徴」となった天皇","color":"#1D4ED8","accent":"#BFDBFE","bio":"昭和天皇の時代、日本は中国との戦争を広げ、やがて太平洋戦争に入った。1945年、昭和天皇の声を録音した放送で、国民に敗戦が伝えられた。戦前の憲法では天皇が国を治める中心だったが、戦後の日本国憲法では、日本と国民のまとまりを表す「象徴」となった。政治を決める権限を持たず、国の行事などを行う立場に変わった。","isNarrator":true,"greeting":"1945年8月15日の玉音放送——昭和天皇の声が初めてラジオで流れたあの日、何が起きたのかを一緒に学びましょう。","qs":["玉音放送ってどんな内容だったの？","日本が太平洋戦争に負けた理由は？","象徴天皇制ってどういう意味なの？","GHQの占領政策で日本はどう変わったの？","人間宣言って何を宣言したの？"]},{"id":53,"name":"田中角栄","period":"昭和時代（1918〜1993年）","emoji":"🗾","tag":"日本史","tagColor":"#0E7490","catchphrase":"「小学校卒の総理」と呼ばれ、中国との国交も結んだ","color":"#0891B2","accent":"#A5F3FC","bio":"新潟の高等小学校を卒業し、働きながら夜の工学校でも学んだ田中角栄。「小学校卒の総理」として注目され、1972年に首相になった。道路や鉄道で地方も豊かにする「日本列島改造論」を掲げ、同年、中国との正式な国の付き合いを取り戻す日中国交正常化を実現した。一方、お金をめぐる問題で退陣し、後にロッキード事件で逮捕された。","greeting":"暮らしを変える政治とは、どんなものか。道路や産業の話も、中国との国交の話もつながっておる。1972年に何が変わったか、聞いてみるか。","qs":["日中国交正常化はなぜ1972年に実現したの？","高度経済成長って何年ごろ・どうやって起きたの？","サンフランシスコ平和条約で日本はどう独立したの？","戦後の日本復興はどうやって進んだの？","日本列島改造論って具体的に何をしようとしたの？"]},{"id":54,"name":"マンデラ","period":"南アフリカ（1918〜2013年）","emoji":"✊","tag":"世界史","tagColor":"#047857","catchphrase":"27年間の牢獄から、南アフリカの大統領へ","color":"#059669","accent":"#6EE7B7","bio":"南アフリカでは、人種によって住む場所や権利を分けるアパルトヘイトが行われていた。マンデラはこの仕組みに反対し、27年間も刑務所で過ごした。釈放後は、相手と話し合って新しい国をつくる道を進めた。1994年、すべての人種が参加する選挙を経て、黒人初の大統領となった。自分を苦しめた相手への仕返しより、共に暮らせる国を目指した。","greeting":"27年間、牢獄の中で過ごした。出てきたとき選んだのは——復讐ではなく、和解だった。","qs":["アパルトヘイトってどんな制度だったの？","なぜ27年も牢獄に入れられたの？","怒りではなく和解を選んだ理由は何なの？","アパルトヘイトが終わったのはなぜ・どうやって？","マンデラの「真実和解委員会」って何をしたの？"]},{"id":47,"name":"キング牧師","period":"アメリカ（1929〜1968年）","emoji":"✊","tag":"世界史","tagColor":"#6D28D9","catchphrase":"肌の色で差別されない社会を求めた牧師","color":"#7C3AED","accent":"#DDD6FE","bio":"アメリカでは、黒人がバスの席や学校などで差別されていた。キング牧師は、暴力を使わない運動で、平等な権利を求めた。1963年には「私には夢がある」という演説で、肌の色ではなく人柄で判断される社会を訴えた。運動は差別を禁じる法律を進める力になったが、本人は1968年に殺された。","greeting":"「私には夢がある」——黒人も白人も共に生きられる社会を。あの夢の話をしよう。","qs":["バスのボイコット運動ってどんな出来事だったの？","なぜ1950〜60年代に公民権運動が盛んになったの？","非暴力でも変化を起こせると信じた理由は？","アメリカの人種差別は法律でいつ禁止されたの？","キング牧師の思想はガンジーの影響を受けているの？"]},{"id":48,"name":"ゴルバチョフ","period":"ソ連（1931〜2022年）","emoji":"🕊️","tag":"世界史","tagColor":"#047857","catchphrase":"ソ連を立て直す改革が、国の終わりにもつながった","color":"#059669","accent":"#6EE7B7","bio":"アメリカとソ連が対立する冷戦が続く中、ゴルバチョフはソ連の指導者になった。経済や政治を立て直す「ペレストロイカ」を進め、情報をもっと公開するようにした。アメリカとも話し合い、1989年には冷戦の終結を宣言した。しかし、国内の混乱や各地の独立の動きを止められず、1991年にソ連は解体した。","greeting":"冷戦を終わらせた——でも同時にソ連も終わった。改革が国を崩すとはどういうことか、話そう。","qs":["冷戦ってどんな対立だったの？","ペレストロイカ・グラスノスチって何なの？","ソ連はなぜ崩壊したの？","冷戦が終わった後の世界はどうなったの？","冷戦が終わった後の世界は本当に平和になったの？"]}];

const ADDED_CHARACTERS=[{"id":105,"name":"小野妹子","period":"飛鳥時代（生没年不詳）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"中国の隋へ渡り、日本の国づくりを助けた使者","color":"#b45309","accent":"#fde68a","bio":"日本が外国の仕組みを学ぼうとしていたころ、小野妹子は遣隋使として中国の隋へ渡った。607年には国の手紙を届けた。その書き出しは「日出づる処の天子」として知られ、日本の天皇も隋の皇帝と並ぶ立場だと示すものだった。隋との行き来は、政治や文化を学び、日本の国づくりを進めるきっかけになった。","greeting":"海の向こうの隋へ使いとして渡りました。飛鳥時代の外交について、何から話しましょうか？","qs":["遣隋使は何のために送られたの？","遣唐使とはどう違うの？","当時の船旅はどんな危険があったの？"]},{"id":106,"name":"中臣鎌足","period":"飛鳥時代（614〜669年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"中大兄皇子と手を組み、蘇我氏を倒した","color":"#b45309","accent":"#fde68a","bio":"政治で強い力を持っていた蘇我氏を倒そうと、中臣鎌足は中大兄皇子に近づいた。二人は協力し、645年に蘇我入鹿を倒した。その後、天皇を中心に国の仕組みを変える大化の改新へと進んだ。鎌足は亡くなる直前に「藤原」の姓を与えられた。後に政治で大きな力を握る、藤原氏の始まりとなる人物だ。","greeting":"中大兄皇子とともに、政治を変えようと動きました。乙巳の変から話しましょうか。","qs":["乙巳の変はなぜ起こったの？","中大兄皇子とはどんな関係？","大化の改新で何が変わったの？"]},{"id":107,"name":"坂上田村麻呂","period":"平安時代（758〜811年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"東北へ軍を進めた、平安時代の将軍","color":"#b45309","accent":"#fde68a","bio":"桓武天皇の時代、朝廷は東北へ支配を広げようとしていた。坂上田村麻呂は征夷大将軍となり、蝦夷と呼ばれた現地の人々との戦いを進めた。しかし、降伏した敵の指導者たちについては、命を助けてほしいと朝廷に願い出た。願いは認められず、二人は処刑された。敵と戦う将軍でありながら、最後にはその命を守ろうとした姿も記録に残る。","greeting":"朝廷の命を受け、東北での戦いを指揮しました。当時の人々の立場も一緒に考えましょう。","qs":["征夷大将軍って何？","蝦夷とはどんな人たち？","朝廷はなぜ東北へ勢力を広げたの？"]},{"id":108,"name":"菅原道真","period":"平安時代（845〜903年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"政治で追われ、後に「学問の神様」となった","color":"#b45309","accent":"#fde68a","bio":"菅原道真は、文章や学問の力で出世し、天皇を助けた。しかし、藤原氏との政治争いに敗れ、九州の太宰府へ送られた。そこで亡くなった後、都で災いが続くと、道真の怒りではないかと恐れられた。やがて神としてまつられ、学問の神様として信仰を集めた。今も天満宮には、合格を願う多くの人が訪れる。","greeting":"学問を重ね、朝廷の政治にも関わりました。遣唐使のことも気軽に聞いてください。","qs":["遣唐使の停止を提案したのはなぜ？","停止後も中国との交流はあったの？","どうして学問の神様と呼ばれるの？"]},{"id":109,"name":"清少納言","period":"平安時代（生没年不詳）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"「春はあけぼの」で、日常のおもしろさを残した","color":"#b45309","accent":"#fde68a","bio":"清少納言は、平安時代に天皇の妻である中宮定子に仕えた。宮中での出来事や、好きなもの、困ったものなどを『枕草子』に書いた。「春はあけぼの」という始まりが有名だ。美しい景色だけでなく、日常の失敗や、人への鋭い見方も出てくる。約1000年前の人にも、今の私たちと似た気持ちがあったと感じられる作品だ。","greeting":"春はあけぼの。あなたなら、どの季節のどんな景色が好き？ 『枕草子』のお話もしましょう。","qs":["枕草子には何が書かれているの？","国風文化って何？","紫式部の源氏物語とはどう違うの？"]},{"id":110,"name":"白河上皇","period":"平安時代（1053〜1129年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"天皇をやめても、政治の中心にいた上皇","color":"#b45309","accent":"#fde68a","bio":"天皇の位を退けば、政治の仕事も終わりとは限らなかった。白河上皇は、幼い天皇に位を譲ったあとも、自分の住まいから政治を動かした。このような政治を院政という。藤原氏が天皇の親族として力を持つ政治から、上皇が中心となる政治へ変わるきっかけになった。寺を建てるなど、仏教にも深く関わった。","greeting":"天皇を退いた後も政治に関わりました。院政という仕組みを知っていますか？","qs":["院政ってどんな政治？","摂関政治とは何が違うの？","なぜ上皇が政治を行えたの？"]},{"id":111,"name":"後鳥羽上皇","period":"鎌倉時代（1180〜1239年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"幕府に戦いを挑み、島へ送られた上皇","color":"#b45309","accent":"#fde68a","bio":"後鳥羽上皇は、和歌などの文化を大切にする一方、朝廷の力を強めようとした。1221年に鎌倉幕府を倒すため兵を集めたが、幕府の軍に敗れた。これが承久の乱だ。敗れた上皇は隠岐の島へ送られ、そこで生涯を終えた。戦いの後は、幕府が京都の朝廷を見張るようになり、武士の政治がさらに強くなった。","greeting":"朝廷と幕府の力関係を変えようとしました。承久の乱について話しましょう。","qs":["承久の乱はなぜ起こったの？","乱の後、幕府の力はどうなったの？","乱の後にどこへ流されたの？"]},{"id":112,"name":"北条時宗","period":"鎌倉時代（1251〜1284年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"二度の元寇で、幕府を率いた若いリーダー","color":"#b45309","accent":"#fde68a","bio":"元の皇帝フビライが日本に従うよう求めてきたころ、北条時宗は鎌倉幕府の政治を率いる執権になった。要求に従わず、攻撃に備えた。1274年と1281年に元の大軍が来たが、武士たちの抵抗や暴風雨などで退けた。この二度の攻撃を元寇という。しかし、守る戦いでは新しい土地を得られず、武士へのほうびが足りない問題が残った。","greeting":"元の軍勢が海を越えてきた。幕府がどう備えたのか、一緒に見ていこう。","qs":["元寇はなぜ起こったの？","文永の役と弘安の役はどう違う？","元寇の後、御家人の生活はどうなったの？"]},{"id":113,"name":"運慶","period":"鎌倉時代（生年不詳〜1223年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"筋肉や表情まで本物らしい仏像をつくった","color":"#b45309","accent":"#fde68a","bio":"鎌倉時代、運慶は力強く、生きているような仏像をつくった。体の筋肉や顔の表情を細かく表し、武士たちからも支持された。奈良の東大寺南大門にある金剛力士像は、快慶らと協力した仕事として有名だ。大きく目を開いた像からは、今にも動きそうな力が伝わる。鎌倉文化を代表する仏師、つまり仏像をつくる職人だ。","greeting":"仏像の表情や体の動き、じっくり見たことはあるかい？ 南大門の像の話をしよう。","qs":["金剛力士像はどこにあるの？","快慶とはどんな関係？","鎌倉時代の仏像にはどんな特徴があるの？"]},{"id":114,"name":"足利義政","period":"室町時代（1436〜1490年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"京都で争いが続く中、銀閣と文化を残した将軍","color":"#b45309","accent":"#fde68a","bio":"室町幕府の8代将軍、足利義政の時代、将軍の後継ぎ問題などから応仁の乱が起きた。京都は大きな被害を受け、各地で戦いが続く時代へ進んだ。一方、義政は京都の東山に銀閣を建て、庭や茶の湯などを楽しんだ。静かで落ち着いた美しさを重んじる東山文化が育ち、今の和室にもつながる住まいの形が広まった。","greeting":"東山の山荘は、後に銀閣と呼ばれるようになった。文化の話から始めようか。","qs":["銀閣と金閣は何が違うの？","東山文化にはどんな特徴があるの？","応仁の乱はなぜ起こったの？"]},{"id":115,"name":"世阿弥","period":"室町時代（1363年頃〜1443年頃）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"父とともに、能を大きく育てた役者","color":"#b45309","accent":"#fde68a","bio":"世阿弥は、父の観阿弥とともに能を発展させた。能は、歌や楽器に合わせて、動きや言葉で物語を伝える舞台芸術だ。若いころ将軍の足利義満に認められ、役者としても作者としても活躍した。芸を磨く考え方を『風姿花伝』に残したことでも知られる。室町時代に育った能は、今も演じられている。","greeting":"舞台では、ほんの小さな動きにも意味があります。能について一緒に見てみましょう。","qs":["能はどんな芸能なの？","父の観阿弥と何をしたの？","室町時代に能が広まったのはなぜ？"]},{"id":116,"name":"尚巴志","period":"琉球王国（1372〜1439年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"沖縄の三つの国をまとめ、琉球王国を築いた","color":"#b45309","accent":"#fde68a","bio":"昔の沖縄本島は、北山・中山・南山という三つの国に分かれていた。尚巴志は、父とともに中山で力をつけ、北山、さらに南山を倒した。1429年に三山を統一し、琉球王国を築いた人物だ。首里を中心に国を治め、中国との関係も大切にした。その後の琉球は、日本や中国、東南アジアを結ぶ貿易で栄えていく。","greeting":"琉球の三つの勢力をまとめ、王国の基礎を築きました。海の向こうとの交流も話しましょう。","qs":["三山統一って何？","琉球王国はどんな国々と貿易したの？","首里は王国でどんな役割を持ったの？"]},{"id":117,"name":"ザビエル","period":"スペイン（1506〜1552年）","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"日本にキリスト教を伝えた宣教師","color":"#2563eb","accent":"#bfdbfe","bio":"ザビエルは、キリスト教を外国に広める宣教師だった。アジアで活動した後、1549年に鹿児島へ来た。日本にキリスト教を本格的に伝えた人物として知られる。日本語や習慣の違いに苦労しながら、各地で教えを広めた。日本での活動は約2年だったが、その後も宣教師が訪れ、キリスト教を信じる人が増えていった。","greeting":"私はキリスト教を伝えるために日本を訪れました。当時の日本との出会いについて話しましょう。","qs":["いつ日本に来たの？","キリスト教はどう広まったの？","鉄砲の伝来とはどう違うの？"]},{"id":118,"name":"千利休","period":"安土桃山時代（1522〜1591年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"小さな茶室に、茶の湯の深い楽しみを込めた","color":"#b45309","accent":"#fde68a","bio":"千利休は、堺の商人の家に生まれ、茶の湯を学んだ。豪華な道具だけに頼らず、簡素な茶室や道具の中に美しさを見いだす「わび茶」を大成した。織田信長や豊臣秀吉にも仕え、茶の湯を通して大きな影響力を持った。しかし、後に秀吉と対立し、切腹を命じられた。なぜ命を失うことになったのかは、今もはっきりしていない。","greeting":"一杯のお茶をどう用意するか。その中にも、工夫があります。茶の湯のことを話しましょう。","qs":["茶の湯って何？","桃山文化にはどんな特徴があるの？","豊臣秀吉とはどんな関係だったの？"]},{"id":119,"name":"徳川家光","period":"江戸時代（1604〜1651年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"大名を江戸と領地に通わせた、3代将軍","color":"#b45309","accent":"#fde68a","bio":"徳川家光は、江戸幕府の3代将軍だ。大名が江戸と自分の領地を行き来する参勤交代を制度として整えた。大名には大きなお金がかかり、幕府に逆らう力を持ちにくくなった。キリスト教を厳しく禁じ、外国との行き来も制限した。ただし、すべての外国との交流をやめたわけではなく、長崎などを通した貿易は続いた。","greeting":"江戸幕府の三代将軍として、大名を統制する仕組みを整えました。何を聞きたいですか？","qs":["参勤交代はどんな制度？","大名や人々の暮らしにどんな影響があったの？","江戸時代は外国と全く交流しなかったの？"]},{"id":120,"name":"徳川吉宗","period":"江戸時代（1684〜1751年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"幕府のお金を立て直そうとした、8代将軍","color":"#b45309","accent":"#fde68a","bio":"徳川吉宗は、お金に困っていた江戸幕府を立て直そうとした。むだづかいを減らし、新田開発で田畑を増やし、年貢の収入を増やした。人々の意見を集める目安箱を置いたことでも知られる。この一連の政治を享保の改革という。ただし、年貢の負担が重くなるなど、農民の生活が苦しくなる面もあった。","greeting":"幕府の台所事情を立て直すために、いろいろな改革に取り組んだ。気になることはあるか？","qs":["享保の改革では何をしたの？","目安箱は何のために置いたの？","寛政の改革とはどう違うの？"]},{"id":121,"name":"田沼意次","period":"江戸時代（1719〜1788年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"商売の力を使って、幕府の収入を増やそうとした","color":"#b45309","accent":"#fde68a","bio":"田沼意次は、年貢だけに頼らず、盛んになった商売から幕府の収入を増やそうとした。同じ仕事の商人がつくる株仲間を認め、税を取ったほか、外国との貿易も進めた。しかし、役人にお金や品物を渡して便宜を求めるわいろが問題になった。食料不足や物価の上昇で不満も高まり、支えとなっていた将軍が亡くなると政治の中心を去った。","greeting":"人や物が動けば、お金も動く。商業と幕府の政治の関係を一緒に考えてみよう。","qs":["株仲間って何？","なぜ商業を重視したの？","松平定信の政治とはどう違うの？"]},{"id":122,"name":"松平定信","period":"江戸時代（1759〜1829年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"ぜいたくをおさえ、政治を立て直そうとした","color":"#b45309","accent":"#fde68a","bio":"田沼意次の後、松平定信は幕府の政治を立て直そうとした。これが寛政の改革だ。むだづかいを減らし、食料不足に備えて米を蓄えるようにした。借金に苦しむ幕府の家来を助ける決まりも出した。一方で、本や学問、暮らし方にも厳しい制限を加えた。人々の不満も出て、改革は十分な成果を上げられなかった。","greeting":"飢饉の後、暮らしを立て直すことは大きな課題でした。寛政の改革を話しましょう。","qs":["寛政の改革では何をしたの？","なぜ農村を重視したの？","田沼意次の政治とどう違うの？"]},{"id":123,"name":"水野忠邦","period":"江戸時代（1794〜1851年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"厳しい改革で幕府を立て直そうとした","color":"#b45309","accent":"#fde68a","bio":"江戸時代の終わりが近づき、幕府は食料不足やお金の問題に苦しんでいた。水野忠邦は天保の改革を進め、ぜいたくを禁じたり、江戸の人々を農村へ帰そうとしたりした。品物の値段を下げるため商人の株仲間も解散させたが、品物が届きにくくなるなどうまくいかなかった。土地を幕府へ集める計画にも反対が強く、改革は行き詰まった。","greeting":"幕府の財政や社会の混乱に向き合うため、天保の改革を進めました。","qs":["天保の改革は何のため？","株仲間を解散させたのはなぜ？","享保・寛政の改革との違いは？"]},{"id":124,"name":"大塩平八郎","period":"江戸時代（1793〜1837年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"飢える人を救おうと、大坂で立ち上がった元役人","color":"#b45309","accent":"#fde68a","bio":"食べ物が足りず、人々が苦しむ天保のききん。それでも利益を得る商人や、十分に助けない役人に、大塩平八郎は怒った。元は大坂の町奉行所で働く役人で、学問も教えていた人物だ。1837年、仲間と武器を取って立ち上がったが、すぐにおさえられた。幕府の元役人が反乱を起こしたことは、社会に大きな衝撃を与えた。","greeting":"人々が苦しむ中、政治に何ができるのか。大阪で起きた乱の背景を一緒に考えましょう。","qs":["大塩平八郎の乱はなぜ起こったの？","当時、人々はどんなことで苦しんでいたの？","乱は幕府にどんな影響を与えたの？"]},{"id":125,"name":"伊能忠敬","period":"江戸時代（1745〜1818年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"50歳で学び直し、日本地図づくりに挑んだ","color":"#b45309","accent":"#fde68a","bio":"伊能忠敬は、家の商売を次の世代へ任せた後、50歳で江戸へ出て学び直した。星の動きや測量を学び、55歳から日本各地を歩いて土地を測った。海岸線の形や場所をこつこつ調べたが、地図の完成前に亡くなった。弟子たちが仕事を引き継ぎ、1821年に精密な日本地図を完成させた。年を重ねてからの学びが、大きな仕事につながった。","greeting":"各地を歩き、少しずつ地図の材料を集めました。測量の方法が気になりますか？","qs":["どうやって土地の形を測ったの？","完成した地図は何に役立ったの？","地図はいつ完成したの？"]},{"id":126,"name":"葛飾北斎","period":"江戸時代（1760〜1849年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"大きな波と富士山で、世界を驚かせた絵師","color":"#b45309","accent":"#fde68a","bio":"葛飾北斎は、江戸時代の浮世絵師だ。『富嶽三十六景』では、さまざまな場所から見える富士山を描いた。大きな波の向こうに小さな富士山が見える「神奈川沖浪裏」は、特に有名だ。風景だけでなく、人や動物などもたくさん描いた。年をとっても絵を学び続け、その大胆な形や色は、後に海外の画家たちにも影響を与えた。","greeting":"富士山も見る場所が変われば、ずいぶん違って見える。絵の話をしようか。","qs":["富嶽三十六景って何？","浮世絵はどうやって作られたの？","歌川広重の作品とはどう違うの？"]},{"id":127,"name":"歌川広重","period":"江戸時代（1797〜1858年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"旅先の雨や雪まで伝えた、風景画の名人","color":"#b45309","accent":"#fde68a","bio":"歌川広重は、江戸時代の浮世絵師だ。『東海道五十三次』では、江戸と京都を結ぶ道の宿場や景色を描いた。雨の中を急ぐ人、雪に包まれた町など、天気や人々の暮らしまで感じられる。旅行が簡単ではなかった時代、絵を見て旅を楽しむ人もいた。北斎とともに日本の風景画を広め、海外の芸術にも影響を与えた。","greeting":"道を旅すると、宿場ごとに違う景色が見える。東海道の絵を見てみよう。","qs":["東海道五十三次って何？","江戸時代の人はどんな旅をしたの？","北斎の作品とはどう違うの？"]},{"id":128,"name":"ペリー","period":"アメリカ・幕末（1794〜1858年）","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"黒船で来て、日本に開国を求めた","color":"#2563eb","accent":"#bfdbfe","bio":"1853年、アメリカのペリーが黒船を率いて浦賀へ来た。日本に港を開くよう求める大統領の手紙を届けたのだ。大きな船と軍事力を前に、幕府は対応に悩んだ。翌1854年、日米和親条約が結ばれ、下田と函館が開かれた。長く外国との行き来を限っていた日本は、開国へ進み、幕府の政治も大きく揺れていく。","greeting":"アメリカから船で日本を訪れました。当時の交渉について、日本側の事情も含めて考えましょう。","qs":["黒船はなぜ来たの？","日米和親条約で何が決まったの？","日米修好通商条約とはどう違うの？"]},{"id":129,"name":"井伊直弼","period":"幕末（1815〜1860年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"開国を進め、反対する人々を厳しく取り締まった","color":"#b45309","accent":"#fde68a","bio":"外国から開国を求められ、幕府の中でも意見が割れていた。大老になった井伊直弼は、1858年、天皇の許可を得ないまま日米修好通商条約を結ぶ方針を進めた。将軍の後継ぎ問題でも反対派をおさえ、多くの人を処罰した。これが安政の大獄だ。反発は強まり、1860年に江戸城近くで襲われ、殺された。桜田門外の変である。","greeting":"開国をめぐり、幕府の内外で意見が分かれていました。当時の判断を見ていきましょう。","qs":["日米修好通商条約はどんな条約？","安政の大獄って何？","桜田門外の変はなぜ起こったの？"]},{"id":130,"name":"徳川慶喜","period":"幕末（1837〜1913年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"約260年続いた江戸幕府、最後の将軍","color":"#b45309","accent":"#fde68a","bio":"徳川慶喜は、江戸幕府の15代、最後の将軍だ。幕府の力が弱まり、倒そうとする動きが強まる中、1867年に政治の権限を天皇へ返す大政奉還を行った。しかし、新しい誰が政治の中心になるかをめぐって争いは続き、幕府側と新政府側の戦争になった。慶喜はやがて新政府に従い、その後は政治の中心から離れて暮らした。","greeting":"幕府を取り巻く状況は大きく変わっていました。大政奉還について話しましょう。","qs":["大政奉還って何？","なぜ政権を朝廷に返したの？","大政奉還の後、何が起きたの？"]},{"id":131,"name":"木戸孝允（桂小五郎）","aliases":["木戸孝允","桂小五郎"],"period":"幕末〜明治時代（1833〜1877年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"薩摩と手を組み、明治の国づくりを進めた","color":"#b45309","accent":"#fde68a","bio":"木戸孝允は、長州藩で桂小五郎と呼ばれていた人物だ。薩摩藩との対立を乗り越え、1866年に薩長同盟を結ぶ中心となった。幕府が倒れた後は、新しい政治の方針を示す五箇条の御誓文づくりにも関わった。藩をなくして県を置く廃藩置県など、国の仕組みを変える仕事も進めた。西郷隆盛、大久保利通と並び、明治維新の中心人物とされる。","greeting":"桂小五郎という名でも知られています。薩長の協力から明治の国づくりまで話しましょう。","qs":["薩長同盟はどうして結ばれたの？","桂小五郎と木戸孝允（桂小五郎）は同じ人？","明治政府でどんな改革に関わったの？"]},{"id":132,"name":"岩倉具視","period":"幕末〜明治時代（1825〜1883年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"使節団を率い、欧米の国づくりを学びに行った","color":"#b45309","accent":"#fde68a","bio":"岩倉具視は、朝廷の側から江戸幕府を終わらせる動きに関わった。明治政府では、1871年に岩倉使節団を率いてアメリカやヨーロッパへ出発した。不平等条約を改める話し合いはうまくいかなかったが、工場や学校、政治の仕組みを見て回った。外国で学んだことを、新しい日本の国づくりに生かそうとした人物だ。","greeting":"使節団とともに欧米へ渡りました。何を見て、何を学ぼうとしたのか話しましょう。","qs":["岩倉使節団の目的は何？","どんな人たちが使節団に参加したの？","条約改正はその時に実現したの？"]},{"id":133,"name":"大隈重信","period":"明治〜大正時代（1838〜1922年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"政治でも教育でも活躍した、早稲田大学の創立者","color":"#b45309","accent":"#fde68a","bio":"大隈重信は、明治政府でお金や外国との交渉を担当した。政府を去った後は立憲改進党をつくり、議会のある政治を目指した。東京専門学校を開いたことでも知られ、この学校が今の早稲田大学になった。後には総理大臣も務めた。政治の仕事に加え、自分で考える人を育てる教育にも力を入れた人物だ。","greeting":"自由民権運動の時代、立憲改進党をつくりました。政治にどう参加するか、一緒に考えましょう。","qs":["立憲改進党はどんな政党？","板垣退助の自由党とどう違うの？","どんな学校の設立に関わったの？"]},{"id":134,"name":"小村寿太郎","period":"明治時代（1855〜1911年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"関税を日本で決める権利を取り戻した外交官","color":"#b45309","accent":"#fde68a","bio":"外国から来る品物への税を、日本が自由に決められない。幕末の不平等条約には、このような問題が残っていた。小村寿太郎は外国との交渉を進め、1911年に関税自主権を回復した。長く続いた条約改正がようやく実現したのだ。日露戦争後のポーツマス条約でも日本側を代表したが、戦争の損害を埋める賠償金が得られず、国内で強い不満が起きた。","greeting":"戦争を終わらせる交渉や、条約の見直しに関わりました。外交の話をしましょう。","qs":["ポーツマス条約で何が決まったの？","関税自主権の回復って何？","陸奥宗光の条約改正とはどう違うの？"]},{"id":135,"name":"尚泰","period":"琉球王国〜明治時代（1843〜1901年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"琉球王国が沖縄県に変わる時代、最後の王","color":"#b45309","accent":"#fde68a","bio":"尚泰は、琉球王国最後の王だ。琉球は中国や日本との関係を保ってきたが、明治政府は琉球を日本の県に組み込もうとした。1879年、政府は軍や警察を送り、王国を終わらせて沖縄県を置いた。この一連の動きを琉球処分という。尚泰は首里城を去り、後に東京で暮らした。沖縄の国の形が大きく変わる時代の人物だ。","greeting":"私は琉球王国の最後の国王です。王国から沖縄県へ移る時代を、一緒にたどりましょう。","qs":["琉球処分って何？","沖縄県が置かれるまでに何があったの？","当時の琉球の人々はどんな立場に置かれたの？"]},{"id":136,"name":"田中正造","period":"明治時代（1841〜1913年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"川の毒から暮らしを守ろうと、国に訴え続けた","color":"#b45309","accent":"#fde68a","bio":"足尾銅山から出た有害なものが川を汚し、農作物や人々の暮らしに被害が出た。田中正造は、国会議員として足尾銅山鉱毒事件を取り上げ、対策を求めた。議員をやめた後には、天皇に直接訴えようとした。さらに、川の水があふれるのを防ぐため村をなくす計画にも反対し、谷中村の人々と暮らした。被害を受ける人の側に立ち続けた人物だ。","greeting":"川や田畑の被害に苦しむ人たちがいました。足尾鉱毒事件を一緒に考えましょう。","qs":["足尾鉱毒事件って何？","人々の暮らしにどんな被害があったの？","産業の発展と公害はどう関係するの？"]},{"id":137,"name":"津田梅子","period":"明治〜大正時代（1864〜1929年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"わずか6歳で留学し、女性の学ぶ道を開いた","color":"#b45309","accent":"#fde68a","bio":"津田梅子は、1871年、わずか6歳でアメリカへ留学した。長い海外生活の後に帰国し、日本では女性が十分に学び、仕事につく機会が少ないことに向き合った。1900年に女子英学塾を開き、英語などを学ぶ女性を育てた。この学校が今の津田塾大学だ。女性が自分の力で生きるために、教育の道を広げた。","greeting":"幼いころに海を渡り、帰国後は女子教育に取り組みました。学ぶことについて話しましょう。","qs":["なぜアメリカへ留学したの？","当時の女子教育にはどんな課題があったの？","どんな学校をつくったの？"]},{"id":138,"name":"北里柴三郎","period":"明治〜大正時代（1853〜1931年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"病気と闘う研究を進めた、「日本の細菌学の父」","color":"#b45309","accent":"#fde68a","bio":"北里柴三郎は、病気を起こす細菌の研究に取り組んだ。ドイツへ留学し、破傷風の原因となる菌を育てて調べることに成功した。さらに、体が病気と闘う力を利用する血清療法の研究も進めた。帰国後は研究所をつくり、感染症を防ぐ仕事や研究者の育成に力を注いだ。人々の命を守る医学を、日本で発展させた人物だ。","greeting":"病気の原因を調べ、予防や治療につなげる。医学の研究について話しましょう。","qs":["細菌って何？","破傷風の研究では何が進んだの？","野口英世とはどんなつながりがあるの？"]},{"id":139,"name":"樋口一葉","period":"明治時代（1872〜1896年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"暮らしに苦しみながら名作を残し、24歳で亡くなった","color":"#b45309","accent":"#fde68a","bio":"樋口一葉は、若くして家族を支える立場となり、貧しさに苦しみながら小説を書いた。店を開いて商売をした経験もあり、町の人々の暮らしをよく見つめた。『たけくらべ』などでは、子どもが大人へ近づく心の変化や、女性の生きにくさを描いた。わずか24歳で亡くなったが、短い生涯に残した作品は今も読まれている。","greeting":"人の暮らしや心の動きを、物語の言葉にしました。明治の文学の話をしましょう。","qs":["たけくらべはどんな作品？","明治時代の文学にはどんな特徴があるの？","夏目漱石とはどんな時代を生きたの？"]},{"id":140,"name":"渋沢栄一","period":"幕末〜明治時代（1840〜1931年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"もうけと社会の役立ち、両方を大切にした実業家","color":"#b45309","accent":"#fde68a","bio":"渋沢栄一は、ヨーロッパで会社や銀行の仕組みを学んだ。帰国後は、第一国立銀行など、多くの会社や団体の設立・育成に関わった。鉄道や紙、保険など、取り組みは幅広い。お金をもうけるだけでなく、社会の役に立つことも大切だと考えた人物だ。教育や福祉にも力を入れ、近代日本の経済の土台づくりを支えた。","greeting":"銀行や会社の仕組みを整える仕事に関わりました。お金の流れから近代の日本を見てみよう。","qs":["銀行はどんな役割を持つの？","日本の近代産業とどう関わったの？","徳川慶喜とはどんなつながりがあるの？"]},{"id":141,"name":"原敬","period":"大正時代（1856〜1921年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"選挙で選ばれた政党を中心に、内閣をつくった","color":"#b45309","accent":"#fde68a","bio":"原敬は新聞記者や外交の仕事を経て、政治家になった。1918年に首相となり、同じ考えで政治に取り組む政党の人々を中心に、本格的な政党内閣をつくった。貴族の称号を持たない首相として「平民宰相」と呼ばれたが、すべての人に選挙権を広げたわけではない。鉄道や教育を整える一方、反発も受け、1921年に東京駅で殺された。","greeting":"政党が中心となる内閣を組織しました。政治がどう変わったか話しましょう。","qs":["政党内閣って何？","なぜ本格的な政党内閣と呼ばれるの？","米騒動と内閣の成立にはどんな関係があるの？"]},{"id":142,"name":"吉野作造","period":"大正時代（1878〜1933年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"政治は国民のために、と民本主義を説いた","color":"#b45309","accent":"#fde68a","bio":"一部の人の考えだけで政治を動かしてよいのか。大正時代の学者、吉野作造は、政治は国民の幸せのために行い、国民の意見を反映すべきだと説いた。これを民本主義という。天皇が国を治めるという当時の憲法の形を保ちながら、民主的な政治を進めようとした。大正デモクラシーと呼ばれる動きを、考え方の面から支えた。","greeting":"政治は誰のためにあるのでしょう。民本主義という考え方から一緒に考えてみましょう。","qs":["民本主義って何？","大正デモクラシーとはどんな動き？","民主主義と民本主義はどう違うの？"]},{"id":143,"name":"マッカーサー","period":"アメリカ・昭和時代（日本占領期）（1880〜1964年）","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"敗戦後の日本を管理した、GHQの最高司令官","color":"#2563eb","accent":"#bfdbfe","bio":"1945年、日本が戦争に負けると、連合国が日本を占領した。その改革を進めるGHQの最高司令官がマッカーサーだ。日本政府に指示し、女性の選挙権や農地改革などを進め、日本国憲法づくりにも大きく関わった。一方で、新聞などの内容を調べて制限もした。日本の戦後の出発に、大きな影響を与えた人物だ。","greeting":"戦後の日本では、占領のもとでさまざまな改革が進みました。その内容を確認しましょう。","qs":["GHQは何をしたの？","戦後の民主化ではどんな改革があったの？","日本国憲法はどのように作られたの？"]},{"id":144,"name":"佐藤栄作","period":"昭和時代（1901〜1975年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"沖縄の日本復帰を実現した総理大臣","color":"#b45309","accent":"#fde68a","bio":"戦後もアメリカのもとに置かれていた沖縄。佐藤栄作は首相として返還交渉を進め、1972年に沖縄の日本復帰を実現した。ただし、復帰後も多くの米軍基地が残った。核兵器を「持たず、つくらず、持ち込ませず」という非核三原則を示したことでも知られる。1974年には、核兵器を減らす取り組みなどでノーベル平和賞を受けた。","greeting":"沖縄の本土復帰が実現した時代の首相です。復帰までの歩みと、その後の課題を話しましょう。","qs":["沖縄が本土に復帰したのはいつ？","復帰を求める運動はどんなものだったの？","非核三原則って何？"]},{"id":145,"name":"バスコ・ダ・ガマ","period":"ポルトガル（1469年頃〜1524年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"アフリカを回り、船でインドへ着いた航海者","color":"#2563eb","accent":"#bfdbfe","bio":"ヨーロッパの人々は、香辛料を手に入れるため、アジアへ直接行く海の道を探していた。ポルトガルのバスコ・ダ・ガマは、アフリカの南端を回り、1498年にインドへ到着した。ヨーロッパとインドを船で結ぶ道が開かれたのだ。その後、ポルトガルは軍事力も使ってアジアの貿易へ入り、現地の人々に大きな影響を与えた。","greeting":"アフリカ南端を回り、インドへ航海しました。どんな航路だったか、地図を思い浮かべてみよう。","qs":["どんな航路でインドへ行ったの？","コロンブスの航海とは何が違うの？","航路の開拓は現地の人々に何をもたらしたの？"]},{"id":146,"name":"ワット","period":"イギリス（1736〜1819年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"蒸気機関を使いやすくし、産業革命を進めた","color":"#2563eb","accent":"#bfdbfe","bio":"蒸気の力で動く機械は、ワットより前からあった。しかし、燃料をたくさん使うという問題があった。ワットは仕組みを工夫し、少ない燃料で効率よく動くように改良した。蒸気機関は工場などで広く使われ、人の手に頼っていた仕事が機械へ変わっていった。イギリスで始まった産業革命を、技術の面から支えた人物だ。","greeting":"蒸気の力をもっと役立てるにはどうすればいいか。機械の改良から産業革命を見てみよう。","qs":["蒸気機関をどう改良したの？","工場の生産はどう変わったの？","産業革命で働く人の生活はどう変わったの？"]},{"id":147,"name":"孫文","period":"中国・清末〜中華民国（1866〜1925年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"皇帝のいない中国を目指した、「革命の父」","color":"#2563eb","accent":"#bfdbfe","bio":"中国の清が弱まり、外国の力が強くなる中、孫文は国を変えようとした。民族・民権・民生という三民主義を掲げ、外国の支配からの自立、人々の政治参加、暮らしの安定を目指した。1911年の辛亥革命で清が倒れる流れが生まれ、翌年に中華民国の臨時大総統となった。ただし、新しい国の政治は、その後も争いが続いた。","greeting":"清の時代から新しい国へ。中国で起きた変化を一緒にたどってみましょう。","qs":["辛亥革命って何？","中華民国はどうして成立したの？","三民主義ってどんな考え？"]},{"id":148,"name":"ウィルソン","period":"アメリカ・第一次世界大戦期（1856〜1924年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"世界の平和のため、国際連盟を提案した大統領","color":"#2563eb","accent":"#bfdbfe","bio":"アメリカ大統領ウィルソンは、第一次世界大戦に参加した後、戦後の平和の仕組みを考えた。民族が自分たちの政治を決める民族自決などを掲げ、国々が話し合う国際連盟を提案した。しかし、この考えはアジアやアフリカの植民地すべてには認められなかった。国際連盟は生まれたものの、アメリカ自身は議会の反対で参加しなかった。","greeting":"大きな戦争の後、どうすれば平和を守れるのか。国際連盟の構想から話しましょう。","qs":["十四か条の平和原則って何？","民族自決ってどういう考え？","なぜアメリカは国際連盟に加盟しなかったの？"]},{"id":149,"name":"勝海舟","period":"幕末〜明治時代（1823〜1899年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸を戦場にしないため、話し合った幕府の役人","color":"#b45309","accent":"#fde68a","bio":"勝海舟は、江戸幕府で船や海軍の仕事を進めた。日本の軍艦で太平洋を渡り、アメリカへ行った経験もある。幕府が倒れた後、新政府の軍が江戸へ迫ると、西郷隆盛と話し合った。1868年、江戸城を大きな戦いなしで渡すことになり、多くの人が住む町を戦火から守った。立場の違う相手とも話す道を探した人物だ。","greeting":"船を動かすにも、国を動かすにも、相手を知らなきゃ始まらねえ。江戸でどんな選択があったか話そうか。","qs":["江戸城の無血開城とは何？","西郷隆盛とどんな交渉をしたの？","坂本龍馬とはどんな関係？","咸臨丸はどこへ行ったの？","戊辰戦争と無血開城はどうつながるの？"]},{"id":151,"name":"東郷平八郎","period":"明治〜昭和初め（1848〜1934年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"日露戦争で、海軍の艦隊を率いた","color":"#b45309","accent":"#fde68a","bio":"東郷平八郎は、若いころイギリスで船や航海を学んだ。日露戦争では、日本の軍艦の集まりである連合艦隊を率いた。1905年の日本海海戦で、遠くヨーロッパから来たロシアのバルチック艦隊を破った。この勝利は、戦争を終わらせる話し合いにも影響を与えた。長く海外で学んだ若者が、日本の海軍を率いる人物になったのだ。","greeting":"艦隊を動かすには準備と連携が欠かせません。日露戦争の海上で何が起こったのか、確かめていきましょう。","qs":["日本海海戦はいつ起きたの？","日露戦争が起きた理由は？","小村寿太郎とはどんな役割の違いがある？","日本海海戦と旅順の戦いは違うの？","日露戦争の後、日本はどう変わったの？"]},{"id":152,"name":"栄西","period":"平安末〜鎌倉時代（1141〜1215年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"坐禅の教えと、お茶の習慣を広めたお坊さん","color":"#b45309","accent":"#fde68a","bio":"栄西は中国の宋へ渡り、禅の教えを学んだ。帰国後は、坐禅などの修行を大切にする臨済宗を日本に広めた。京都に建仁寺を開き、幕府の人々からも支えられた。お茶を飲むことが体によいと説く本を書いたことでも知られる。教えとともに、お茶の文化が広まるきっかけをつくった人物だ。","greeting":"急いで答えを出さず、目の前のことをよく見てみましょう。禅や宋との交流について話せますよ。","qs":["栄西が広めた宗派は何？","道元の曹洞宗とはどう違う？","禅宗はなぜ武士に広まったの？","茶と栄西にはどんな関係がある？","建仁寺はどこにあるの？"]},{"id":153,"name":"井原西鶴","period":"江戸時代（1642〜1693年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"町人のお金と暮らしを、おもしろく描いた作家","color":"#b45309","accent":"#fde68a","bio":"商売で豊かになる人もいれば、お金に困る人もいる。井原西鶴は、江戸時代の町人の姿を生き生きと小説に描いた。『日本永代蔵』ではお金を得る工夫を、『世間胸算用』では年末の支払いに悩む人々を描いた。人間の欲や失敗が出てくる物語は、町の人に親しまれた。京都や大坂などの上方を中心に栄えた元禄文化を代表する作家だ。","greeting":"人の欲も笑いも、町にはいくらでも転がっているね。上方の商人や浮世草子の話でもしようか。","qs":["浮世草子って何？","『日本永代蔵』はどんな作品？","元禄文化が上方で栄えたのはなぜ？","近松門左衛門と何が違うの？","当時の町人は何を楽しんでいたの？"]},{"id":154,"name":"尾形光琳","period":"江戸時代（1658〜1716年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"花や水の流れを、大胆な形と色で描いた","color":"#b45309","accent":"#fde68a","bio":"尾形光琳は、江戸時代に京都で活躍した画家だ。『紅白梅図屏風』では、梅の木と流れる水を、はっきりした形や色で表した。写真的に描くよりも、形や配置のおもしろさを生かしたのだ。絵だけでなく、漆の工芸品などのデザインにも関わった。こうした美しさは、琳派と呼ばれる芸術の流れとして受け継がれた。","greeting":"花の形は同じでも、並べ方で景色が変わるんだ。屏風の絵を一緒に見てみないか。","qs":["『燕子花図屏風』はどんな作品？","琳派とは何？","俵屋宗達とはどんな関係？","菱川師宣の浮世絵との違いは？","元禄文化で絵画が発達した背景は？"]},{"id":155,"name":"菱川師宣","period":"江戸時代（生年不詳〜1694年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"町の人の姿を描き、浮世絵を広めた","color":"#b45309","accent":"#fde68a","bio":"江戸の町がにぎわうと、人々は身近な暮らしや流行の絵を楽しむようになった。菱川師宣は、本の挿絵や一枚の絵として、人々の姿をたくさん描いた。浮世絵を発展させた人物として知られる。代表作『見返り美人図』には、着物姿で振り向く女性が描かれている。顔だけでなく、姿や着物の美しさまで楽しめる絵だ。","greeting":"ふと振り返る仕草一つで、絵には動きが生まれる。町人の暮らしをどう描いたのか話そうか。","qs":["『見返り美人図』はどんな絵？","浮世絵はどうやって作ったの？","肉筆画って何？","尾形光琳との違いは？","北斎や広重よりいつ頃の人物？"]},{"id":156,"name":"十返舎一九","period":"江戸時代（1765〜1831年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"旅の失敗や笑いを描いた、『東海道中膝栗毛』の作者","color":"#b45309","accent":"#fde68a","bio":"十返舎一九は、江戸時代に笑いの多い物語を書いた作家だ。『東海道中膝栗毛』では、弥次さんと喜多さんという二人が旅をする。行く先々で勘違いや失敗を繰り返す姿が、読者を楽しませた。今のように簡単には旅行できない時代、本を通して旅の気分も味わえた。町人の読書が広がった化政文化を代表する作品だ。","greeting":"旅の道中は思いがけないことばかり。弥次さん喜多さんの珍道中をのぞいてみようか。","qs":["『東海道中膝栗毛』はどんな話？","滑稽本って何？","化政文化と元禄文化の違いは？","曲亭馬琴とは何が違う？","江戸時代の旅はどんな様子だったの？"]},{"id":157,"name":"滝沢馬琴","aliases":["曲亭馬琴","滝沢馬琴","曲亭馬琴（滝沢馬琴）"],"period":"江戸時代（1767〜1848年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"目が見えなくなっても、家族と物語を書き続けた","color":"#b45309","accent":"#fde68a","bio":"滝沢馬琴は、江戸時代の作家だ。八人の勇士が登場する『南総里見八犬伝』を、約28年かけて書き上げた。家族のつながりや、よいことと悪いことへの報いを描く長い物語だ。年をとって目が見えなくなった後も、家族に書き取ってもらって続けた。あきらめずにつくり続けた物語は、今も芝居などに形を変えて親しまれている。","greeting":"長い物語では、一人の行動が後の展開につながる。八犬伝の世界や江戸の読書について話そうか。","qs":["『南総里見八犬伝』はどんな話？","読本と滑稽本はどう違うの？","滝沢馬琴と曲亭馬琴は同じ人？","なぜ28年もかけて書いたの？","化政文化で本が広がったのはなぜ？"]},{"id":158,"name":"狩野永徳","period":"安土桃山時代（1543〜1590年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"城の大きな部屋を、豪華な絵で飾った","color":"#b45309","accent":"#fde68a","bio":"狩野永徳は、織田信長や豊臣秀吉らに仕えた画家だ。城や屋敷の大きなふすまや屏風に、木や動物などを力強く描いた。金色を生かした豪華な絵は、部屋を飾るだけでなく、主人の大きな力も示した。『唐獅子図屏風』などで知られ、安土桃山時代の華やかな文化を代表する人物だ。","greeting":"大きな壁いっぱいに絵を描くと、部屋の空気まで変わる。桃山文化の豪華さを見てみよう。","qs":["『唐獅子図屏風』はどんな作品？","障壁画とは何？","織田信長や豊臣秀吉とどんな関係？","桃山文化の特徴は？","尾形光琳の絵とは何が違うの？"]},{"id":159,"name":"藤原清衡","period":"平安時代後期（1056〜1128年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"東北の平泉に、金色の仏堂を建てた","color":"#b45309","accent":"#fde68a","bio":"藤原清衡は、家族を失う戦いを経験しながら、東北で力をつけた。平泉を拠点に、奥州藤原氏と呼ばれる一族の繁栄の土台を築いた。中尊寺を整え、1124年には金色堂を建てた。金色の建物には、戦いで亡くなった人々を弔い、平和を願う思いも込められたとされる。平泉は、都から遠く離れた東北の文化の中心となった。","greeting":"争いの後に、どんな土地を築くか。平泉の文化と東北の歴史を一緒に見てみよう。","qs":["藤原清衡は平泉で何をしたの？","中尊寺金色堂との関係は？","前九年・後三年の合戦とは？","源義経を守った藤原秀衡と同じ人？","平泉はなぜ栄えたの？"]},{"id":160,"name":"武田信玄","period":"戦国時代（1521〜1573年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"強い軍と、川の工事で領地を支えた武将","color":"#b45309","accent":"#fde68a","bio":"武田信玄は、甲斐、今の山梨県を拠点にした戦国大名だ。隣の地域へ勢力を広げ、上杉謙信とは川中島で何度も戦った。戦いだけでなく、洪水から田畑を守る工事や、領地の決まりづくりにも力を入れた。徳川家康を三方ヶ原の戦いで破ったことでも知られる。しかし、西へ軍を進める途中で病気になり、亡くなった。","greeting":"軍勢だけでは国は保てぬ。川を治め田畑を守ることも大切じゃ。どの話から聞きたい？","qs":["武田信玄が治めた国はどこ？","上杉謙信との川中島の戦いとは？","戦国大名は領地をどう治めたの？","分国法とは何？","信玄堤は何のために作られたの？"]},{"id":161,"name":"上杉謙信","period":"戦国時代（1530〜1578年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"信玄と何度も戦った、越後の強い武将","color":"#b45309","accent":"#fde68a","bio":"上杉謙信は、越後、今の新潟県を拠点にした戦国大名だ。武田信玄と領地をめぐって対立し、川中島で何度も戦った。関東にも軍を進め、北陸へも力を広げた。戦いの神、毘沙門天を深く信じていたことでも知られる。しかし、急に亡くなると、後継ぎをめぐって家の中で争いが起きた。強い武将にも、死後の難題が残った。","greeting":"越後の山から眺めれば、国境の向こうにも多くの暮らしがある。川中島の戦いをどう考える？","qs":["上杉謙信が治めた国はどこ？","武田信玄とどこで戦ったの？","川中島の戦いはなぜ起こったの？","戦国大名はどんな政治をしたの？","「義の武将」という評判は史実なの？"]},{"id":162,"name":"俵屋宗達","period":"江戸時代初め（生没年不詳）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"風神・雷神を、迫力いっぱいに描いた","color":"#b45309","accent":"#fde68a","bio":"俵屋宗達は、江戸時代の初めに京都で活躍した画家だ。『風神雷神図屏風』では、風の神と雷の神を画面の左右に大きく描いた。余白や金色を生かし、見る人に強い印象を残す絵をつくった。扇など、身近な品の絵も手がけたと考えられる。宗達の表し方は尾形光琳らにも受け継がれ、琳派の流れにつながった。","greeting":"金色の広い余白に、二つの姿をどう置くか。それだけで絵に動きが生まれます。屏風の話をしましょう。","qs":["『風神雷神図屏風』は誰が描いたの？","尾形光琳との関係は？","琳派とはどんな美術？","屏風の金色にはどんな効果があるの？","狩野永徳の障壁画とはどう違うの？"]},{"id":164,"name":"足利義昭","period":"室町時代末期（1537〜1597年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"信長に助けられ、後に追い出された最後の室町将軍","color":"#b45309","accent":"#fde68a","bio":"足利義昭は、兄の将軍が殺された後、自分が将軍になるため味方を探した。織田信長に助けられて京都へ入り、1568年に室町幕府の15代将軍となった。しかし、政治の進め方をめぐり信長と対立する。各地の大名に協力を求めたが、1573年に京都から追い出された。一般に、この出来事で室町幕府が終わったとされる。","greeting":"将軍の名だけで世を動かすのは難しいものです。信長と協力した理由や、対立の経緯を確かめましょう。","qs":["足利義昭は何代目の将軍？","織田信長が義昭を助けた理由は？","1573年に何が起きたの？","足利義満・足利義政とはどう違う？","京都を追われた後は何をしていたの？"]}];

function historyAvatarHTML(ch){
  const ident = Number(ch.id);
  // 表示できる人物画像を優先し、読み込みに失敗した場合は元の絵文字を使う。
  const fallback = `<span class="history-emoji-fallback" aria-hidden="true">${ch.emoji||"👤"}</span>`;
  if(!Object.prototype.hasOwnProperty.call(HISTORY_ICON_REVISIONS, ident)) return fallback;
  const key=String(ident).padStart(3,"0");
  const revision=HISTORY_ICON_REVISIONS[ident];
  return fallback + `<img class="history-avatar-image" src="history-icons/${key}.webp?v=${revision}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`;
}

function openChatDB(){
  if(!chatDbPromise){
    chatDbPromise=new Promise((resolve,reject)=>{
      if(!("indexedDB" in window)){reject(new Error("IndexedDB is not available"));return;}
      const req=indexedDB.open(CHAT_DB_NAME,1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(CHAT_DB_STORE))req.result.createObjectStore(CHAT_DB_STORE,{keyPath:"id"});};
      req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>db.close();resolve(db);};
      req.onerror=()=>reject(req.error||new Error("DB open failed"));
      req.onblocked=()=>reject(new Error("DB blocked"));
    }).catch(err=>{chatDbPromise=null;throw err;});
  }
  return chatDbPromise;
}
async function readSavedChat(id){
  // 書き込み直後に人物を切り替えても、古いデータを先に読まない。
  await chatWrites.catch(()=>{});
  const db=await openChatDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(CHAT_DB_STORE,"readonly"),req=tx.objectStore(CHAT_DB_STORE).get(String(id));
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error("Read failed"));
    tx.onabort=()=>reject(tx.error||new Error("Read aborted"));
  });
}
function writeSavedChat(id,record){
  // 登録と削除の順序を保証する。書き込み完了前に保存済みとは表示しない。
  const operation=chatWrites.catch(()=>{}).then(async()=>{
    const db=await openChatDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(CHAT_DB_STORE,"readwrite");
      const store=tx.objectStore(CHAT_DB_STORE);
      if(record)store.put({id:String(id),version:1,updatedAt:Date.now(),turns:record.turns,suggestions:record.suggestions});
      else store.delete(String(id));
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error("Write failed"));
      tx.onabort=()=>reject(tx.error||new Error("Write aborted"));
    });
  });
  chatWrites=operation;
  return operation;
}
function completedChatTurns(source=messages){
  const result=[];
  // 先頭の挨拶や未完了・エラーの回答は保存／AIの記憶に含めない。
  for(let i=1;i+1<source.length;i++){
    const user=source[i],answer=source[i+1];
    if(user?.role==="user"&&answer?.role==="assistant"&&
       typeof user.content==="string"&&user.content.trim()&&
       typeof answer.content==="string"&&answer.content.trim()&&
       !answer.content.startsWith("⚠️ 接続エラー")){
      result.push({...user},{...answer});i++;
    }
  }
  return result;
}
function persistCurrentChat(ch=currentChar){
  if(!ch)return Promise.resolve();
  const record={turns:completedChatTurns(),suggestions:[...dynamicSuggestions]};
  const epoch=chatEpoch;
  setChatStorageStatus("保存中…");
  return writeSavedChat(ch.id,record.turns.length?record:null).then(()=>{
    if(epoch===chatEpoch&&currentChar===ch)setChatStorageStatus("✓ この端末に会話を保存済み");
  }).catch(err=>{
    console.warn("会話を保存できませんでした",err);
    if(epoch===chatEpoch&&currentChar===ch)setChatStorageStatus("⚠️ 会話を保存できません。ブラウザの保存設定をご確認ください","error");
  });
}
function buildApiConversation(question){
  const turns=completedChatTurns();
  const selected=[];
  let length=question.length;
  // 古い発言のみが単独で混入しないよう、user / assistantのペア単位で切り詰める。
  for(let i=turns.length-2;i>=0&&selected.length<AI_CONTEXT_MAX_PAIRS*2;i-=2){
    const pairLength=turns[i].content.length+turns[i+1].content.length;
    if(length+pairLength>AI_CONTEXT_MAX_CHARS)break;
    selected.unshift(turns[i],turns[i+1]);length+=pairLength;
  }
  return [...selected,{role:"user",content:question}];
}

}
function showOlderHistory(){

}

function getEra(period) {
  const y=(function(){
    const bc=period.match(/紀元前(\d+)/);if(bc)return -parseInt(bc[1]);
    if(period.includes('紀元前'))return -1;
    const m=period.match(/[（(](\d{3,4})/);if(m)return parseInt(m[1]);
    if(period.includes('3世紀'))return 250;if(period.includes('5世紀'))return 450;return 9999;
  })();
  if(y<600)return{id:"古代",label:"古代",color:"#92400E",bg:"#FDE68A"};
  if(y<1300)return{id:"中世",label:"中世",color:"#1E40AF",bg:"#BFDBFE"};
  if(y<1700)return{id:"近世",label:"近世",color:"#065F46",bg:"#6EE7B7"};
  if(y<1900)return{id:"近代",label:"近代",color:"#6D28D9",bg:"#DDD6FE"};
  return{id:"現代",label:"現代",color:"#0E7490",bg:"#A5F3FC"};
}
