// 日本語の文末や段落を基準に分割。APIの回答自体はそのまま会話履歴に保持する。
// 10秒を基準に、長文には読む余裕を追加する。待機は最大14秒。
function historyReadingDelay(text=''){
 return 10000+Math.min(3000,Math.max(0,String(text).length-60)*30)+Math.floor(Math.random()*1001);
}
function splitReplyBubbles(text){
  const source=String(text||"").replace(/\r\n?/g,"\n").trim();
  if(!source)return ["……"];
  const paragraphs=source.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const pieces=[];
  for(const paragraph of paragraphs){
    const sentences=paragraph.match(/[^。！？!?]+[。！？!?]+[」』）】]?|[^。！？!?]+$/g)||[paragraph];
    for(let sentence of sentences){
      sentence=sentence.trim();if(!sentence)continue;
      while(sentence.length>120){
        const look=sentence.slice(0,107);
        let cut=Math.max(look.lastIndexOf("、"),look.lastIndexOf("，"),look.lastIndexOf("\n"),look.lastIndexOf(" "));
        if(cut<50)cut=95;else cut+=1;
        pieces.push(sentence.slice(0,cut).trim());sentence=sentence.slice(cut).trim();
      }
      if(sentence)pieces.push(sentence);
    }
    pieces.push(null); // 段落の境界でバブルを切る
  }
  const chunks=[];let current="";
  for(const piece of pieces){
    if(piece===null){if(current){chunks.push(current);current="";}continue;}
    if(current&&current.length+piece.length>100){chunks.push(current);current=piece;}
    else current+=piece;
  }
  if(current)chunks.push(current);
  return chunks.length?chunks:[source];
}
function makeRevealStatus(ch){
  return nodeFromHTML(`<div class="reveal-status" role="status" aria-label="${himikoUi('続きの吹き出しを順番に表示するにゃ','続きの吹き出しを順番に表示するぜ')}">
    <div class="typing reveal-typing-bubble" aria-hidden="true">${[0,.2,.4].map(d=>`<span class="typing-dot" style="background:${ch.color};animation-delay:${d}s"></span>`).join("")}</div>
  </div>`);
}
// 回答は取得済みの1回分を、1つずつDOMに追加する。
// 以前の「未表示バブルをまとめて確保→先頭へ強制移動」は廃止。
// スクロールするのは会話の末尾のみ。回答が終わったら質問候補まで追従する。
function startReveal(ch,reply,suggestions){
  cancelReveal(false);
  const chunks=splitReplyBubbles(reply);
  const group=nodeFromHTML('<div class="bubble-group"></div>');
  appendChatNode(group,false);
  const state={group,ch,chunks,suggestions,index:0,timer:null,status:null};
  activeReveal=state;
  watchChatContent();
  const addNext=()=>{
    if(activeReveal!==state||currentChar!==ch||!group.isConnected)return;
    state.status?.remove();state.status=null;
    const i=state.index++;const saved=messages.at(-1);if(saved?.role==='assistant'){saved.chunkTimes||=[];saved.chunkTimes[i]=Date.now();persistCurrentChat(ch);}
    group.append(nodeFromHTML(assistantRowHTML(ch,chunks[i],i===0,true,Date.now())));
    playReceiveSound();
    window.dispatchEvent(new CustomEvent('himiko-person-bubble',{detail:{id:ch.id,text:chunks[i]}}));
    if(state.index<chunks.length){
      state.status=makeRevealStatus(ch);
      group.append(state.status);
      const readingTime=historyReadingDelay(chunks[i]); // 10秒以上、長文は少し長め
      state.timer=setTimeout(addNext,readingTime);
    }else{
      activeReveal=null;
      if(suggestions.length){
        const turn=messages.at(-1);if(turn?.role==='assistant'){turn.questionsAt=Date.now()+10000;persistCurrentChat(ch);schedulePersonalSuggestions(ch,suggestions,turn);}
      }
    }
    // Newly inserted bubbles can grow after the first layout frame on iOS.
    // During automatic reveal, settle at the true end without a competing
    // smooth-scroll animation. Respect manual reading of older messages.
    scrollChatToEnd(false);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(currentChar===ch && !userReadingHistory)scrollChatToEnd(false);
    }));
  };
  // 回答の最初から表示する。先頭へのジャンプや表示前の画面移動はしない。
  addNext();
}
function cancelReveal(showRest=false,showQuestions=false){
  clearTimeout(personalSuggestionTimer);
  const state=activeReveal;if(!state)return;
  clearTimeout(state.timer);
  activeReveal=null;
  state.status?.remove();
  if(showRest){
    while(state.index<state.chunks.length){
      const i=state.index++;
      state.group.append(nodeFromHTML(assistantRowHTML(state.ch,state.chunks[i],i===0)));
    }
    if(showQuestions&&state.suggestions.length){
      setPersonalQuestions(state.ch,state.suggestions);
      scrollChatToEnd(true);
    }
  }
}


// Replies accept JSON and legacy question tags. The server owns model instructions.
function looseSuggestionSection(value){
 const raw=String(value||'');const match=/(?:^|\n)\s*["']?suggestions["']?\s*:\s*(?=\[)/i.exec(raw);
 if(!match)return {text:raw,suggestions:[]};
 const section=raw.slice(match.index+match[0].length).trim();let suggestions=[];
 try{const a=JSON.parse(section.replace(/[,}\s]+$/,''));if(Array.isArray(a))suggestions=a;}catch{try{suggestions=JSON.parse(section.slice(0,section.lastIndexOf(']')+1))}catch{}}
 return {text:raw.slice(0,match.index).trim(),suggestions};
}
function cleanReplyText(value){
  // Keep normal historical prose, punctuation and angle brackets as text.
  // Remove only transport/formatting artifacts; display still passes through esc().
  return looseSuggestionSection(value).text.replace(/\r\n?/g,'\n')
    .replace(/\[\/?SUGGESTIONS\b[^\]]*\]/gi,'')
    .replace(/^\s*```(?:json|text|markdown)?\s*$/gim,'')
    .replace(/^\s{0,3}#{1,6}\s+/gm,'')
    .replace(/\*\*([^\n]+?)\*\*/g,'$1')
    .replace(/__([^\n]+?)__/g,'$1')
    .replace(/`([^`\n]+)`/g,'$1')
    .replace(/\n{3,}/g,'\n\n').trim();
}

function normalizeSuggestions(values,ch=currentChar,reply=''){
  if(!Array.isArray(values))return [];
  const seen=new Set();
  const key=s=>String(s).normalize('NFKC').replace(/[\s?？!！。、]/g,'').toLowerCase();
  // Do not suggest the same question again, even after restoring chat history.
  const asked=new Set(messages.filter(m=>m.role==='user').map(m=>key(m.content)));
  return values.filter(v=>typeof v==='string').map(value=>{
    let q=value.trim().replace(/^(?:[-•・]|\d+[.)、]|[①②③])\s*/, '');
    const subject=(ch?.isExplainer||ch?.isNarrator)?ch.name:'あなた';
    q=q.replace(/^(?:私|わし|余|朕|おれ|俺|拙者)(の|が|は)/,subject+'$1');
    if(ch?.isExplainer||ch?.isNarrator)q=q.replace(/あなた(の|が|は)/g,ch.name+'$1');
    q=q.replace(/(?:聞かせて|教えて|話して)ほしいの[？?]?$/,m=>m.split('ほしい')[0]+'？');
    q=q.replace(/\?$/,'？');
    if(!/[？?]$/.test(q)&&/(?:教えて|聞かせて|話して|知りたい|聞きたい)$/.test(q))q+='？';
    return q;
  }).filter(q=>{
    const k=key(q);
    if(q.length<6||q.length>60||!/[？?]$/.test(q)||/[\[\]{}<>\n\r]|SUGGESTIONS|```|\*\*/i.test(q))return false;
    if(seen.has(k)||asked.has(k)||key(reply)===k)return false;
    seen.add(k);return true;
  }).slice(0,3);
}

function getFallbackSuggestions(ch,reply=''){
  if(!ch)return [];
  const choices=ch.isSpecial
    ? ['今の説明をもっとやさしく教えて？','この出来事の前後の流れを教えて？','似ている言葉とのちがいを教えて？',...ch.qs]
    : ['今の説明をもっとやさしく教えて？',...ch.qs,'この話と同じ時代の出来事を教えて？','当時の人々の暮らしを教えて？'];
  return normalizeSuggestions(choices,ch,reply);
}

function completeSuggestions(values,ch,reply){
  return normalizeSuggestions([...normalizeSuggestions(values,ch,reply),...getFallbackSuggestions(ch,reply)],ch,reply);
}

// Recover only a completed JSON string field, never display an unfinished
// transport object. A truncated reply is treated as a failed answer by sendMessage.
function extractCompleteJsonString(raw,key){
  const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const match=raw.match(new RegExp('"'+escaped+'"\\s*:\\s*("(?:\\\\[\\s\\S]|[^"\\\\])*")'));
  if(!match)return null;
  try{return JSON.parse(match[1]);}catch{return null;}
}

function parseSuggestions(value,ch=currentChar){
  let parsed=null,raw=typeof value==='string'?value.trim():'';
  if(value&&typeof value==='object'&&!Array.isArray(value))parsed=value;
  if(!parsed){
    const unfenced=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    try{parsed=JSON.parse(unfenced);}catch{
      // Some models add a short preface despite the output contract.
      const first=unfenced.indexOf('{'),last=unfenced.lastIndexOf('}');
      if(first>=0&&last>first){try{parsed=JSON.parse(unfenced.slice(first,last+1));}catch{}}
    }
  }
  if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){
    const reply=typeof parsed.reply==='string'?parsed.reply:(typeof parsed.text==='string'?parsed.text:null);
    if(reply!==null){
      // Remove any accidentally nested legacy question section from the reply.
      const text=cleanReplyText(reply.split(/\[SUGGESTIONS\b/i)[0]);
      return {text,suggestions:completeSuggestions(parsed.suggestions,ch,text)};
    }
  }
  if(!raw)return {text:'',suggestions:[]};
  const jsonLike=raw.replace(/^```(?:json)?\s*/i,'').trim();
  if(/^\s*\{/.test(jsonLike)||/"(?:reply|suggestions)"\s*:/.test(jsonLike)){
    const reply=extractCompleteJsonString(jsonLike,'reply')??extractCompleteJsonString(jsonLike,'text');
    if(reply!==null){
      const text=cleanReplyText(reply.split(/\[SUGGESTIONS\b/i)[0]);
      return {text,suggestions:completeSuggestions([],ch,text)};
    }
    return {text:'',suggestions:[]};
  }
  // Legacy [SUGGESTIONS] is intentionally supported for existing API behavior.
  // Cut from the opening marker even when the closing marker never arrived.
  const loose=looseSuggestionSection(raw);raw=loose.text;
  const marker=raw.search(/\[SUGGESTIONS\b/i);
  let candidates=loose.suggestions;
  if(marker>=0){
    const section=raw.slice(marker).replace(/^\[SUGGESTIONS\]?/i,'').split(/\[\/SUGGESTIONS\]/i)[0];
    candidates=section.split(/\||\n|(?=[①②③])/).map(s=>s.trim());
    raw=raw.slice(0,marker);
  }
  // Also hide a tag cut in the middle of its name at the very end.
  raw=raw.replace(/\[(?:\/?S(?:U(?:G(?:G(?:E(?:S(?:T(?:I(?:O(?:N(?:S)?)?)?)?)?)?)?)?)?)?)?\s*$/i,'');
  const text=cleanReplyText(raw);
  return {text,suggestions:completeSuggestions(candidates,ch,text)};
}

// Use the app's sound palette, volume and mute setting when embedded.
function appSound(kind,event){
  try { if(window.parent!==window && window.parent.location.origin===location.origin && typeof window.parent.nekoponChatSound==='function') window.parent.nekoponChatSound(kind,event); } catch(_) {}
}
function playSendSound(){appSound('chatSend');}
function playReceiveSound(){appSound('chatReceive');}
document.addEventListener('pointerdown',event=>{if(event.target.matches('#search-input,#msg-input'))appSound('tap',event);});
document.addEventListener('click',event=>{
  const card=event.target.closest('.char-card');
  if(card && !event.target.closest('.fav-btn')){appSound('open',event);return;}
  const button=event.target.closest('button,.fav-btn,.header-tap');
  if(!button || button.disabled || button.id==='send-btn' || button.classList.contains('suggestion-btn'))return;
  appSound('tap',event);
},true);

async function sendMessage(text){
  if(!text||!text.trim()||isLoading||!currentChar||!chatReady)return;
  cancelReveal(true,false);
  const ch=currentChar,epoch=chatEpoch,question=text.trim();
  const scroller=document.getElementById("messages"),inner=messageInner();
  const {hadQuestions,oldTop}=preparePersonalSend();
  messages.push({role:"user",content:question,at:Date.now(),read:false});if(window.parent!==window)window.parent.postMessage({type:'himiko-chat-busy'},location.origin);
  // The first-message-only scroll snap must end immediately when a user
  // sends a question. Otherwise iOS snaps the growing conversation back
  // toward the greeting and hides the bottom of long replies.
  document.getElementById("messages").classList.remove("nekopon-initial-greeting");

  document.getElementById("msg-input").value="";
  dynamicSuggestions=[];
  isLoading=true;
  clearTimeout(personalSuggestionTimer);
  scroller.querySelectorAll('.suggestions').forEach(node=>node.remove());
  userReadingHistory=false; // 自分が送信したときは最新メッセージへ戻す
  const userRow=nodeFromHTML(userRowHTML(ch,question,true,messages.at(-1).at));
  const typingRow=nodeFromHTML(typingHTML(ch));
  if(historyDateHTML(messages.at(-1).at,messages.at(-2)?.at))appendChatNode(nodeFromHTML(historyDateHTML(messages.at(-1).at,messages.at(-2)?.at)),false);appendChatNode(userRow,false);
  appendChatNode(typingRow,false);
  if(hadQuestions){
    automaticChatScrollUntil=Date.now()+200;
    scroller.scrollTop=oldTop;previousChatScroll=oldTop;
  }else scrollChatToEnd(true);
  updateSendBtn();
  playSendSound();
  try{
    const apiMessages=buildApiConversation(question);
    const res=await fetch("/api/himiko-chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({characterId:ch.id,nickname:himikoNickname(),messages:apiMessages})
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.error||res.status);
    }
    const data=await res.json();
    if(epoch!==chatEpoch||currentChar!==ch)return;
    const rawReply=typeof data.reply==='string'?data:
      (Array.isArray(data.content)?data.content.filter(b=>b.type==="text"&&typeof b.text==='string').map(b=>b.text).join(""):
       typeof data.content==='string'?data.content:'');
    const parsed=parseSuggestions(rawReply,ch);
    if(!parsed.text)throw new Error("回答を受け取りきれませんでした。もう一度送ってください。");
    messages.at(-1).read=true;const time=userRow.querySelector('.history-message-time');if(time)time.innerHTML='既読<br>'+esc(historyClock(messages.at(-1).at));
    messages.push({role:"assistant",content:parsed.text,at:Date.now(),chunkTimes:[]});historyActivity();
    dynamicSuggestions=parsed.suggestions;
    // API応答の完了した往復だけを保存。画面描画の完了を待つ必要はない。
    persistCurrentChat(ch);
    typingRow.remove();
    startReveal(ch,parsed.text,dynamicSuggestions);
  }catch(e){
    if(epoch!==chatEpoch||currentChar!==ch)return;
    // API障害の回答や未完了の質問を保存・次のAPIリクエストに混入させない。
    messages.pop();
    const message=himikoUi(`⚠️ ${e.message} 質問は残してあるにゃ。もう一度送ってみてにゃ。`,`⚠️ ${e.message} 質問は残してあるぜ。もう一度送ってくれよ。`);
    dynamicSuggestions=[];
    typingRow.remove();userRow.remove();
    document.getElementById("msg-input").value=question;
    appendChatNode(nodeFromHTML(`<div class="error-msg" role="alert">${esc(message)}</div>`),true);
  }finally{
    if(epoch===chatEpoch&&currentChar===ch){isLoading=false;updateSendBtn();}
  }
}

function handleSend(){dynamicSuggestions=[];sendMessage(document.getElementById("msg-input").value);}

function updateSendBtn(){
  const btn=document.getElementById("send-btn"),val=document.getElementById("msg-input").value.trim();
  btn.disabled=!val||isLoading||!chatReady;
  if(!btn.disabled&&currentChar){
    btn.style.background=`linear-gradient(135deg,${currentChar.color},${currentChar.accent})`;
    btn.style.color="#fff";btn.style.boxShadow=`0 3px 10px ${currentChar.color}45`;
  }else{btn.style.background="#f1f5f9";btn.style.color="#94a3b8";btn.style.boxShadow="none";}
}

document.getElementById("msg-input").addEventListener("input",updateSendBtn);
document.getElementById("msg-input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();handleSend();}
});

const PROFILE_EPISODES = Object.freeze({"80":{"title":"石にも長い旅の歴史","body":"法典を刻んだ大きな石は、王が治めた町とは別の場所で見つかりました。後の戦いで持ち去られたと考えられています。人だけでなく、石にも長い旅があったのです。"},"81":{"title":"厳しすぎる修行をやめた","body":"体がやせ細るほど厳しい修行をしたと伝わります。でも、自分を苦しめるだけでは答えは見つからないと考え、その方法をやめたそうです。"},"34":{"title":"音楽に夢中になることも","body":"『論語』には、孔子がすばらしい音楽に感動した話があります。しばらく肉の味も気にならないほどだったというから、よほど心を動かされたのでしょう。"},"33":{"title":"ずっと生きられる薬が欲しかった","body":"中国の古い歴史書には、死なずに生き続けられる薬を探させたと書かれています。広い国を治める皇帝も、死ぬことは怖かったようです。"},"75":{"title":"大工と呼ばれた人","body":"キリスト教の聖書には、イエスが故郷の人から「大工」と呼ばれる場面があります。教えを伝える前の、働く人としての姿も感じられます。"},"1":{"title":"姿を見られる人は少なかった","body":"中国の記録には、女王になった卑弥呼の姿を見る人は少なかったとあります。大勢の女性が身の回りの世話をし、食事を運ぶ男性は一人だったと書かれています。"},"35":{"title":"もともとは商人だった","body":"教えを広める前は、商人として働いていたと伝わります。商売を任せてくれた女性と結婚し、その妻は、教えを広める活動も支えたそうです。"},"2":{"title":"十人の話を一度に聞けた？","body":"十人が同時に話しても、聞き分けられたという伝説があります。本当にできたかはわかりませんが、多くの話を理解できる、すごい人として語り継がれてきました。"},"3":{"title":"靴が飛んだのが出会いのきっかけ？","body":"『日本書紀』には、球技の途中で靴を飛ばしてしまった話があります。それを拾ったのが中臣鎌足。後に政治を動かす二人の出会いとして伝わる場面です。"},"57":{"title":"旅の休憩所もつくった","body":"税として納める品を都へ運ぶ人は、長い道を歩きました。行基は、そんな人たちが途中で泊まったり休んだりできる場所づくりにも取り組みました。"},"84":{"title":"船には薬や食べ物も","body":"日本へ渡る船には、お経や仏像だけでなく、薬や食べ物も積まれていました。職人も一緒に来ており、暮らしに役立つ技術も伝わりました。"},"4":{"title":"遊び道具も大切にした","body":"奈良の正倉院には、天皇が大切にした品をはじめ、楽器や碁盤、すごろくの道具が伝わっています。大仏をつくる天皇の暮らしにも、遊びや音楽がありました。"},"96":{"title":"天皇になったのは45歳のとき","body":"若いころは、次の天皇になる有力な候補ではありませんでした。天皇になったのは、当時の数え方で45歳のとき。平安京をつくる大きな仕事は、その後に待っていました。"},"58":{"title":"空海から本を借りたかった","body":"空海に、お経やその説明の本を借りたいと頼んだ手紙の内容が残っています。教科書では別々に出てくる二人ですが、本を通じたやり取りもありました。"},"62":{"title":"学びたい人のために学校を","body":"身分などのため、国の学校に入りにくい人も学べる場所を開きました。仏教だけでなく、中国の教えなども学ぶ学校だったのです。"},"5":{"title":"体の悩みもあった","body":"日記などには、のどが渇くことや、目の調子が悪いことも記されています。今では糖尿病だった可能性が指摘されています。大きな力を持つ人にも、体の悩みはありました。"},"6":{"title":"弟より早く覚えた","body":"弟が中国の文章を習うのをそばで聞き、自分の方が早く覚えたと日記に書いています。父も驚いたほどで、子どものころから学ぶ力があったようです。"},"72":{"title":"海に浮かぶようなお社","body":"広島の厳島神社を深く信じ、建物を整える仕事を支えました。潮が満ちると海に浮かぶように見える景色に、清盛の足跡が残っています。"},"97":{"title":"父から、仕返しをするなと","body":"伝記によると、父は人に襲われて亡くなりました。そのとき父は、相手に仕返しをしないよう言い残したといいます。法然は後に、お坊さんになる道を選びました。"},"7":{"title":"有名なあの顔、別人かも？","body":"頼朝の顔として長く紹介されてきた絵には、別の人物を描いたという説もあります。写真のない時代の顔を確かめるのは、簡単ではないのです。"},"8":{"title":"夫は、父が見張っていた人","body":"頼朝は、平氏との戦いに敗れた源氏の一人として伊豆へ送られました。政子の父は、その頼朝を見張る立場でした。後に幕府を支える夫婦は、そんな関係から出会ったのです。"},"85":{"title":"天狗に剣を習った？","body":"子どものころ、山の天狗に剣を習ったという話が有名です。これは後に生まれた伝説です。昔の人も、強い英雄の子ども時代を想像して楽しんだのでしょう。"},"36":{"title":"子どものころは苦しい暮らし","body":"古い物語には、幼いころに父を失い、家族が苦しい暮らしをした話が残っています。後に広い国を治める王にも、食べていくのに苦労した子ども時代があったのです。"},"98":{"title":"家族の手紙も残っている","body":"妻が娘へ送った手紙には、親鸞の病気や暮らしの話もあります。教えの言葉だけではわからない、家族の中での姿を伝えてくれます。"},"86":{"title":"法律のねらいを弟に説明","body":"新しい法律について、京都にいた弟へ手紙を書きました。法律に詳しくない人にも、何を基準に判断するか伝わるようにしたかったのです。"},"99":{"title":"料理も大切な修行","body":"中国で、年をとったお坊さんが料理の材料を買いに来た話を書いています。座って学ぶだけでなく、食事をつくることも修行なのだと学ぶ出会いでした。"},"9":{"title":"紙で買い物できることにびっくり","body":"元では紙のお金が使われていました。マルコ・ポーロの旅の本にも、その驚きが書かれています。当時のヨーロッパでは、紙がお金になるのは珍しかったのです。"},"100":{"title":"差し入れへのお礼も書いた","body":"手紙には、米や食べ物を送ってくれた人へのお礼がよく出てきます。厳しい教えを説くだけでなく、人の親切を喜ぶ姿も見えてきます。"},"60":{"title":"旅の絵には町の様子も","body":"一遍の旅を描いた絵には、市場や港、道を行く人々も登場します。旅する姿を追いかけると、昔の町の様子までのぞけます。"},"59":{"title":"島から逃げ出した天皇","body":"幕府を倒そうとして隠岐の島へ送られましたが、あきらめずに脱出しました。海を渡り、味方の武士に支えられて、再び幕府に立ち向かいました。"},"87":{"title":"仏の絵を描くことも","body":"尊氏が描いたと伝わる仏の絵が残っています。戦いや政治で知られる人にも、静かに筆を持つ時間があったようです。"},"10":{"title":"金閣は、もともと別荘の一部","body":"金閣寺として知られる場所は、義満の別荘を、死後に寺にしたものです。金色の建物の周りには、庭やいくつもの建物が広がっていました。"},"11":{"title":"涙でネズミを描いた？","body":"柱にしばられ、涙でネズミを描いたという話があります。本人の時代より後に広まった伝説です。それほど絵のうまい人だと伝えたくなるお話ですね。"},"37":{"title":"有名な「卵」の物語","body":"卵を立てるよう求められ、端をつぶして立たせたという物語があります。実話かどうかはわかりませんが、誰かがやった後では簡単に見えることも、最初に思いつくのは難しいと伝える話です。"},"77":{"title":"鏡に映すと読める文字","body":"ノートには、右から左へ書いた文字が残っています。鏡に映すと読みやすくなる文字です。機械や人の体の絵もあり、考えたことを細かく書き留めていました。"},"88":{"title":"本人は一周できなかった","body":"世界一周で有名ですが、マゼラン本人は途中で命を落としました。出発した船のうち一隻が帰り着き、残った仲間が航海を成し遂げたのです。"},"38":{"title":"音楽でも教えを広めた","body":"教会で歌う歌をつくり、自分でも楽器を演奏しました。本を読むだけでなく、みんなで歌うことを通しても、教えを身近にしたのです。"},"12":{"title":"相撲で強い人を仲間に","body":"古い記録には、大勢の力士を集めて相撲をさせた話があります。強い人を家来にすることもあり、楽しみながら人材を探す場にもなりました。"},"13":{"title":"花見のために桜を集めた","body":"京都の醍醐寺で大きな花見を開きました。そのために多くの桜を集め、建物や庭まで整えさせました。花を見る場所ごと用意する、ぜいたくな花見です。"},"14":{"title":"健康のため、自分で薬も","body":"健康に気を配り、薬について学んで、自分で材料を混ぜることもありました。長く生きるため、日々の食事や体の調子も大切にしていたのです。"},"90":{"title":"医学も学んでいた","body":"政治の考え方で有名ですが、医学を学び、医師としても働いていました。人の体を診る仕事と、社会の仕組みを考える仕事の両方に関わったのです。"},"89":{"title":"名前のもとは植物","body":"「芭蕉」は、住まいのそばに植えられた、バナナに似た大きな葉の植物にちなんだ名前です。生まれたときからの名前ではありません。"},"101":{"title":"将軍が先生になることも","body":"中国の学問を熱心に学び、自ら家来たちに教えることもありました。犬を守る決まりだけでなく、学問にも力を入れた将軍でした。"},"15":{"title":"武士の家から、芝居の世界へ","body":"武士の家に生まれましたが、後には芝居の台本を書く道へ進みました。生まれた家の仕事を継ぐのではなく、町の人を楽しませる世界で活躍しました。"},"102":{"title":"子どものころのあだ名は「火の子」","body":"怒ると眉の間に「火」の字のようなしわが寄ったため、そう呼ばれたと伝わります。まじめな学者にも、気の強い子ども時代があったようです。"},"91":{"title":"ワインづくりにも関わった","body":"政治の本を書く一方、故郷の土地ではブドウを育て、ワインづくりにも関わりました。机に向かって考える時間と、土地の実りを生かす仕事の両方がありました。"},"40":{"title":"草花を集めるのが楽しみ","body":"年をとってからは植物を集め、葉を押して乾かした標本をつくりました。社会について考えるかたわら、身近な小さな草花もよく見ていました。"},"17":{"title":"鈴の音がお気に入り","body":"鈴を集め、その音を楽しんだことで知られています。自分の書斎にも「鈴屋」と名づけました。難しい本のそばには、好きな音を鳴らす品もあったのです。"},"39":{"title":"大統領も歯に悩んだ","body":"歯の調子が悪く、入れ歯を使っていました。木製だったという話が有名ですが、残っているものには象牙や金属などが使われています。大統領にも、食事に関わる苦労がありました。"},"16":{"title":"辞書も足りない中で翻訳","body":"オランダの医学書を訳し始めたころは、頼れる辞書も十分ではありませんでした。玄白は後に、船を動かす道具もなく大海へ出るような心細さだったと振り返りました。"},"41":{"title":"夜が短くても、昼にひと休み","body":"一日3時間しか眠らなかった、とよくいわれます。一方で、昼間にも眠ったという記録があります。忙しい中でも、昼の休みを取り入れていたようです。"},"43":{"title":"若いころは力自慢","body":"若いころ、相手と組み合うレスリングのような勝負で、強さを知られていました。演説する大統領になる前には、体を張って勝負する一面もありました。"},"42":{"title":"図書館でこつこつ調べた","body":"ロンドンの大英博物館に通い、本や資料を調べていました。社会を変える大きな考えも、毎日の地道な読書や研究に支えられていたのです。"},"92":{"title":"犬と山へ出かけた","body":"猟犬を飼い、一緒に山へ出かけていました。東京の上野にある銅像も、犬を連れた姿です。軍服姿だけではない、日常の一面が伝わります。"},"93":{"title":"若いころから囲碁が好き","body":"囲碁を楽しみ、17歳のころの日記には、勝負に負けた記録もあります。重々しい写真の印象とは違う、身近な遊びを楽しむ姿が見えてきます。"},"20":{"title":"学び直して英語へ","body":"初めはオランダ語を学んでいました。でも、開港した横浜でその言葉が通じず驚き、英語を学び始めました。必要に気づいて、勉強を切り替えたのです。"},"18":{"title":"旅の様子を姉に手紙で","body":"妻と鹿児島の霧島へ出かけたとき、旅の様子を姉への手紙に書きました。山登りなどの話もあり、政治だけではない、家族に旅を伝える姿が見えます。"},"94":{"title":"襲われた後も生き延びた","body":"「板垣死すとも自由は死せず」という言葉で有名です。でも、襲われたその場で亡くなったわけではありません。傷から回復し、その後も長く活動しました。"},"21":{"title":"若いころ、こっそり留学","body":"幕府の許可を得ず、仲間とイギリスへ留学しました。後に日本の政治を率いる人も、若いころには外国を自分の目で見て学んでいたのです。"},"95":{"title":"妻への手紙も残っている","body":"仕事で離れて暮らす妻へ送った、自筆の手紙が残っています。外国と交渉する大きな仕事のかたわら、家族とのつながりも大切にしていました。"},"19":{"title":"たくさんの和歌を残した","body":"生涯に詠んだ和歌は、約9万首とも伝えられています。国の行事だけでなく、自然や日々の気持ちも短い歌にして残しました。"},"24":{"title":"小説だけでなく絵も","body":"絵を描くことも楽しみ、水彩画の絵はがきなどを残しています。文章だけでなく、色や筆を使って景色を表すことも好きだったのです。"},"46":{"title":"人前で話すのが苦手だった","body":"弁護士になりたてのころ、法廷で緊張してうまく話せなかったと、自分の本に書いています。大勢を動かした人にも、話すのが苦手な時期がありました。"},"45":{"title":"図書館で本を読む時間も","body":"ロンドンの大英博物館で本を読むため、別の名前で利用を申し込みました。人々に呼びかけて革命を進める一方で、静かに本や資料を調べる時間もありました。"},"23":{"title":"「英世」は後からの名前","body":"野口英世は、若いころに名前を変えています。長く千円札で親しまれた「英世」は、生まれたときからの名前ではなかったのです。"},"22":{"title":"大勢の子どもを育てた","body":"詩や短歌、文章を書きながら、たくさんの子どもを育てました。12人生まれ、そのうち11人が育ったとされます。家の中もにぎやかだったでしょう。"},"27":{"title":"写真にも写るお気に入り","body":"葉巻を好み、使っていた道具も残っています。政治の写真に写る姿にも、本人の好みが表れています。愛用品から、その人を知ることもできます。"},"51":{"title":"大統領になっても切手集め","body":"子どものころから切手を集め、大統領になってからも続けました。船の模型なども集めており、忙しい毎日の中にも好きなものを楽しむ時間がありました。"},"25":{"title":"名前のもとは、山にすむ鳥","body":"「らいてう」は雷鳥という鳥にちなんだ、作品などで使う名前です。昔の書き方なので不思議に見えますが、読み方は「らいちょう」です。"},"49":{"title":"画家を目指した時期も","body":"若いころは画家を目指し、美術学校を受験しましたが、不合格でした。後に政治の世界へ進むヒトラーにも、絵を描く仕事を夢見ていた時期がありました。"},"52":{"title":"70代でも泳ぐ姿を見せた","body":"水泳が好きで、70代に長江で泳ぐ姿も報道されました。その元気な姿を国内外に見せる、政治的なねらいもあったと考えられています。"},"53":{"title":"「小学校卒」でも、学ぶのをやめなかった","body":"角栄が卒業した高等小学校は、今の小学6年までの小学校とは違い、その先も学ぶ学校でした。上京後も働きながら夜の工学校で土木を学び、卒業しています。「小学校卒の総理」という呼び名の裏には、学び続けた時間もありました。"},"105":{"title":"「妹子」だけれど男性","body":"名前に「妹」が入っていますが、小野妹子は男性です。今の名前の感覚だけで読むと、少しびっくりしますね。"},"106":{"title":"「藤原」は後からもらった姓","body":"亡くなる直前に、天智天皇から藤原という姓を与えられました。その名前が子孫に受け継がれ、後に政治で大きな力を持つ一族になりました。"},"107":{"title":"清水寺ともつながりがある","body":"京都の清水寺の始まりにも関わる人物です。寺に伝わる物語では、山でのお坊さんとの出会いが語られています。戦いだけではない一面です。"},"108":{"title":"梅の木が空を飛んだ？","body":"道真を慕った梅の木が、京都から太宰府まで飛んできたという伝説があります。遠くへ送られた道真のもとに、大好きな梅まで会いに来る。そんなふうに、道真と梅のつながりが語り継がれています。"},"109":{"title":"言葉の代わりに、雪景色で返事","body":"ある雪の日、中国の詩をもとにした問いかけを受けると、すだれを上げて外の雪を見せました。『枕草子』にある場面です。長く説明せず、知っていることを動きで示したのですね。"},"110":{"title":"さいころまでは思いどおりにならない","body":"川の水や、すごろくのさいころなどは思いどおりにならない、と語った話が伝わります。大きな力を持つ上皇も、出る目までは決められませんでした。"},"111":{"title":"歌だけでなく、刀にも夢中","body":"和歌を楽しむだけでなく、刀にも深い関心を持っていました。刀をつくる職人を招き、自分も制作に関わったと伝えられています。"},"112":{"title":"十代で幕府のリーダーに","body":"執権になったのは、当時の数え方で18歳でした。外国からの要求に向き合う幕府の中心人物は、まだ十代だったのです。"},"113":{"title":"仏像の裏に、仕事の記録","body":"若いころにつくった仏像の台の裏には、名前や制作の時期が残っています。仕事のお礼として絹を受け取ったことまで書かれています。"},"114":{"title":"銀閣は銀色ではない","body":"金閣が金色なら、銀閣も銀色だと思いませんか。でも、銀閣の建物は銀で覆われていません。名前と実際の見た目が違うのです。"},"115":{"title":"70代で遠い島へ","body":"長く能の世界で活躍しましたが、70代になって佐渡へ送られました。その経験を書いた作品もあり、人生の後半には厳しい暮らしもありました。"},"116":{"title":"最初は自分でなく、父を王に","body":"中山の王を倒した後、まず父を王にしました。後に自分が王を継ぎ、三つの国をまとめたときには、すでに50代になっていました。"},"117":{"title":"日本の人は質問が多い！","body":"手紙には、日本の人が次々に質問してくると書いています。宗教だけでなく、雨や雪など自然についても聞かれ、答える側も大変だったようです。"},"118":{"title":"たった二畳の茶室","body":"利休の作と伝わる茶室には、お茶をたてる部屋が二畳ほどしかないものがあります。小さな部屋だからこそ、お茶を出す人と飲む人が、近い距離で向き合えます。"},"119":{"title":"将軍が描いた鳥の絵","body":"ミミズクやフクロウなどの鳥を描いた絵が伝わっています。少し不思議で愛らしい形もあり、厳しい政治の顔とは違う一面が見えます。"},"120":{"title":"象が長崎から江戸まで歩いた","body":"海外から来た象が、長崎から江戸まで歩いて運ばれ、吉宗も見ました。道中でも大きな話題となり、町の人々を驚かせました。"},"121":{"title":"息子を突然失った","body":"幕府で大切な役職についていた息子が、江戸城の中で襲われて亡くなりました。政治家として働く人生の中に、家族を失う悲しみもありました。"},"122":{"title":"みんなが楽しめる庭園を","body":"白河に南湖という庭園をつくりました。武士だけでなく、普通の人も楽しめる場所を整えたのです。節約を求めた政治家にも、景色を楽しむ一面がありました。"},"123":{"title":"収入より、次の仕事を選んだ？","body":"幕府で出世しやすい浜松へ、領地を移したいと望んだといわれます。実際の収入は減ったとされ、目先のお金より将来の仕事を選んだ形です。"},"124":{"title":"大切な本を売って人助け","body":"立ち上がる前に、自分が集めた多くの本を売り、飢える人を助けるお金にしました。大切な品を手放すほど、苦しい人々を助けたいと思っていたのです。"},"125":{"title":"50歳で、年下の先生に入門","body":"長く商売をした後、50歳で江戸へ出て学び直しました。先生は自分より年下でした。学ぶのに、年齢は関係なかったのですね。"},"126":{"title":"引っ越しは93回？","body":"後の伝記には、生涯に93回も引っ越したと書かれています。部屋が散らかると移ったという話も伝わり、暮らし方も少し変わっていたようです。"},"127":{"title":"火消しの仕事もしていた","body":"町の火事に備える、火消しの仕事をする家に生まれました。父の仕事を継いだ後に、絵師としても活動しました。初めから絵だけで暮らしていたわけではありません。"},"128":{"title":"走る機関車の模型を持参","body":"日本への贈り物には、蒸気の力で本当に走る機関車の模型もありました。黒船だけでなく、新しい技術を動かして見せる場面もあったのです。"},"129":{"title":"長く学ぶ時間があった","body":"大名の家に生まれましたが、すぐに跡を継ぐ立場ではありませんでした。表に出る前の約15年、学問や茶の湯に取り組む時間を過ごしました。"},"130":{"title":"将軍をやめた後は写真も","body":"政治の中心を離れた後、写真を撮ったり油絵を描いたりしました。最後の将軍にも、新しい道具で趣味を楽しむ明治時代の暮らしがありました。"},"131":{"title":"一人なのに、名前は二通り","body":"「桂小五郎」と「木戸孝允」は同じ人です。幕末には桂小五郎、明治の国づくりでは木戸孝允としてよく登場します。名前が変わっても、二つの時代を生きた一人の人物なのです。"},"132":{"title":"旅の途中で髪形も服も変えた","body":"欧米へは、ちょんまげと和服で出発しました。でも、旅の途中で髪を切り、洋服に変わりました。写真を比べると、見た目の変化もわかります。"},"133":{"title":"メロンも育てた園芸好き","body":"温室でメロンなどを育て、珍しい植物を集めました。政治や学校づくりだけでなく、植物の世話にも熱心だったのです。"},"134":{"title":"パスポートに顔の特徴まで","body":"留学したときの旅券、つまりパスポートには、鼻や口など顔の特徴が書かれていました。顔写真のように、本人かどうかを確かめる手がかりにしていたのです。"},"135":{"title":"王でなくなった後は東京へ","body":"琉球王国がなくなった後、東京で暮らすことになりました。王としての時代が終わっても、その後の人生は続いていました。"},"136":{"title":"日記を書き続けた","body":"公害の問題や政治の活動に向き合いながら、日記を書き続けました。残った日記は本にすると何冊分にもなり、毎日考え続けたことが伝わります。"},"137":{"title":"帰国したら日本語に苦労","body":"6歳からアメリカで長く暮らしたため、帰国後は日本語に苦労しました。外国語だけでなく、ふるさとの言葉も学び直したのです。"},"138":{"title":"あだ名は「雷」の先生","body":"厳しい口調から、ドイツ語で雷を意味するあだ名で呼ばれたと伝わります。周りの人にとって、雷のように迫力のある先生だったのでしょう。"},"139":{"title":"小さなお店を開いた","body":"家族の暮らしを支えるため、お菓子や日用品を売る小さな店を開きました。小説を書くかたわら、店先で町の人と接する生活も経験しました。"},"140":{"title":"若いころにパリへ","body":"まだ幕府に仕えていた20代に、パリの万国博覧会へ行きました。ヨーロッパの会社や銀行の仕組みを、現地で学ぶ機会になりました。"},"141":{"title":"新聞記者だった時代も","body":"若いころは新聞記者として働き、後には新聞社の経営にも関わりました。話を聞いて文章で伝える仕事を経験してから、政治の世界で活躍したのです。"},"142":{"title":"中学生のころから雑誌づくり","body":"中学生のころ、校内で回して読む雑誌づくりに参加しました。文章や和歌も載せており、仲間へ考えを伝える活動を早くからしていました。"},"143":{"title":"大きなパイプの材料は？","body":"写真でくわえている大きなパイプは、トウモロコシの芯を使った種類です。身近な作物からつくられる品が、あの姿の目印になっています。"},"144":{"title":"名字が違っても、実の兄弟","body":"元首相の岸信介は、実のお兄さんです。兄が岸家を継いだため、名字が違います。教科書では別々に出てくる名前にも、家族のつながりがあります。"},"145":{"title":"最後もインドで","body":"最初にインドへ着いた後も、インドとの関わりは続きました。年をとってから再び渡り、ポルトガル側の責任者を務め、その地で亡くなりました。"},"146":{"title":"機械の力を、馬と比べて説明","body":"蒸気機関の力を伝えるため、馬の働きと比べる「馬力」という単位を広めました。発明を使う人に、役立ち方が伝わる説明も工夫したのです。"},"147":{"title":"革命家になる前は医師","body":"医学を学び、医師として患者を診ていた時期があります。目の前の患者を助ける仕事から、中国の政治を変えようとする活動へと、取り組みを広げていきました。"},"148":{"title":"大統領の庭に羊がいた","body":"ホワイトハウスの芝生で、羊が草を食べていました。戦争中の草刈りの人手を減らし、刈った羊毛は人を助ける活動のお金にもなりました。"},"149":{"title":"子どものころ、犬で大けが","body":"犬にかまれて大けがをし、父が看病したと伝わります。その経験から、犬を怖がったともいわれています。難しい交渉をする人にも、苦手なものがありました。"},"151":{"title":"イギリスで約7年学んだ","body":"大きな艦隊を率いる前に、約7年間イギリスへ留学しました。船や航海について学ぶ、若い学生だった時代もあったのです。"},"152":{"title":"飲みすぎた将軍にお茶","body":"古い記録には、酒で体調を崩した将軍に、お茶とお茶の本を差し出した話があります。教えだけでなく、飲み物でも人を気づかったのですね。"},"153":{"title":"一日で2万句以上？","body":"一日と一晩で2万3500句を詠んだと、自分の手紙に書いています。小説だけでなく、次々に言葉を生み出す速さでも知られました。"},"154":{"title":"かるたの絵も描いた","body":"大きな屏風だけでなく、百人一首のかるたも手がけました。眺める絵から、手に取って遊ぶものまで、絵の仕事は広がっていたのです。"},"155":{"title":"着物を飾る仕事も","body":"着物に糸や金銀で飾りをつける仕事にも関わりました。絵の中の着物をよく見ると、細かい模様へのこだわりも見えてきます。"},"156":{"title":"文章も絵も自分で","body":"物語の文章だけでなく、本の挿絵も描きました。印刷のもとになる文字を書く仕事もでき、本をつくるいろいろな作業をこなしました。"},"157":{"title":"見えなくなっても、物語を続けた","body":"年をとって目が見えなくなってからは、息子の妻に物語を話し、書き取ってもらいました。二人の力で、長い作品を完成へ進めたのです。"},"158":{"title":"若いころから、大きな絵を","body":"京都の町を描いた有名な屏風は、20代から30代ごろの作と考えられています。大きな画面の中に、建物や大勢の人を細かく描き込んでいます。"},"159":{"title":"子どものころに家族が変わった","body":"幼いころ父を失い、母が再婚したため、別の一族の中で育ちました。後に藤原の姓に戻りました。華やかな平泉を築く前には、つらい家族の経験もありました。"},"160":{"title":"「信玄」は後からの名前","body":"「信玄」は、仏教の道に入ってから使うようになった名前です。昔の人には、家を継いだり、お坊さんになったりする節目に、名前を変えることがありました。"},"161":{"title":"名前を何度も変えている","body":"生まれた家は上杉家ではありませんでした。別の家を継ぎ、立場も変わる中で、何度も名前を変えました。今よく知られる「謙信」は後の呼び名です。"},"162":{"title":"持ち歩く扇にも絵を","body":"大きな屏風だけでなく、扇などに絵を描く仕事場を営んでいたと考えられています。身近に使う品にも、絵を楽しむ工夫がありました。"},"164":{"title":"将軍になる前はお坊さん","body":"初めは寺でお坊さんとして暮らしていました。ところが、将軍だった兄が殺され、人生が大きく変わります。寺を離れ、将軍になるために味方を探す道へ進んだのです。"}});
// 吉田松陰のエピソードを既存の人物テーブルに影響させず追加。
const YOSHIDA_PROFILE_EPISODE={"title":"教室は、たった8畳から","body":"松下村塾の講義室は、最初はたった8畳でした。けれど、集まった若者は増え続け、松陰は教え子たちと協力して建物を広げました。広い校舎や立派な道具がなくても、そこから明治の日本を変える人々が育っていったのです。"};
function profileEpisodeHTML(ch){
  const episode=ch.id===165?YOSHIDA_PROFILE_EPISODE:PROFILE_EPISODES[ch.id];
  if(!episode)return "";
  return `<section class="profile-episode" aria-labelledby="profile-episode-heading" style="background:${ch.color}0d;border-left:4px solid ${ch.color};border-radius:0 12px 12px 0;padding:12px 14px;font-size:13px;color:#374151;line-height:1.8;font-weight:500">
    <h3 class="profile-episode-title" id="profile-episode-heading">${esc(episode.title)}</h3>
    <p class="profile-episode-body">${esc(episode.body)}</p>
  </section>`;
}

let profileCharacter=null;
function showProfile(person=currentChar){
  const ch=person;if(!ch)return;profileCharacter=ch;
  const modal=document.getElementById("profile-modal");
  modal.innerHTML=`<div class="modal-overlay" id="modal-overlay" onclick="closeProfile(event)">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle"></div>
      <button type="button" class="modal-close" aria-label="閉じる" title="閉じる" onclick="closeProfile()">×</button>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <button type="button" class="history-profile-avatar" onclick="openProfileImage()" aria-label="人物の画像を拡大" style="border:0;padding:0;cursor:pointer;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,${ch.color},${ch.accent});display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">${historyAvatarHTML(ch)}</button>
        <div>
          <div style="font-weight:900;font-size:18px;color:#1e293b">${esc(profileDisplayName(ch))}</div>
          <div style="font-size:11px;color:#94a3b8;margin-top:2px">${esc(ch.period)}</div>
          <div style="font-size:12px;font-weight:800;color:${ch.color};margin-top:4px">「${esc(ch.catchphrase)}」</div>
        </div>
      </div>
      <div style="background:${ch.color}0d;border-left:4px solid ${ch.color};border-radius:0 12px 12px 0;padding:12px 14px;font-size:13px;color:#374151;line-height:1.8;font-weight:500">${esc(ch.bio)}</div>
      ${profileEpisodeHTML(ch)}
    </div>
  </div>`;
  modal.classList.remove("hidden");
}

// 子画面の歴史教材からプロフィールを直接開く。ダミーカードのクリックは使わない。
window.himikoOpenHistoricalProfileById=function(id){
 const person=allHistoryChars.find(item=>item.id===Number(id));
 if(!person)return false;
 showProfile(person);
 return true;
};
function openProfileImage(){const source=document.querySelector('#profile-modal .history-profile-avatar img');if(source)openChatImage((source.currentSrc||source.src).replace(/\.webp(?=\?|$)/,'.png'),(profileCharacter?.name||'人物')+'の画像',document.querySelector('#profile-modal .history-profile-avatar'));}
function openGroupImage(trigger){openChatImage('history-icons/group-chat.png?v=timemachine1','グループの画像',trigger);}
function openChatImage(src,alt,trigger){
 const view=document.createElement('div');view.className='profile-image-view';view.setAttribute('role','dialog');view.setAttribute('aria-modal','true');view.setAttribute('aria-label',alt);const img=document.createElement('img');img.src=src;img.alt=alt;const close=document.createElement('button');close.type='button';close.className='profile-image-close';close.setAttribute('aria-label','画像を閉じる');close.textContent='×';const dismiss=()=>{document.removeEventListener('keydown',onkey);view.remove();trigger?.focus()};const onkey=e=>{if(e.key==='Escape')dismiss();if(e.key==='Tab'){e.preventDefault();close.focus()}};close.onclick=dismiss;view.onclick=e=>{if(e.target===view)dismiss()};view.append(img,close);document.body.append(view);document.addEventListener('keydown',onkey);close.focus();
}

function closeProfile(e){
  if(e&&e.target!==document.getElementById("modal-overlay"))return;

// 「読書中のユーザーが最下部に戻った」根拠にしない。
const chatScroller=document.getElementById("messages");
let chatTouchStartY=null,chatUserMovingDown=false,chatTouchDirection=null;
function pauseChatFollow(){
  // A touchmove/wheel stream must never reset the native kinetic scroll on every event.
  // Reading older messages disables future auto-follow without touching scrollTop.
  if(userReadingHistory)return;
  userReadingHistory=true;
  chatUserMovingDown=false;
  // Cancel future auto-follow requests without forcing scrollTop or a scrollTo().
  // iOS needs its own upward drag and inertial scroll to keep full control.
  automaticChatScrollUntil=0;
}
function resumeChatFollowIfAtBottom(){
  if(chatUserMovingDown&&nearChatBottom(45)){
    userReadingHistory=false;
    chatUserMovingDown=false;
  }
}
chatScroller.addEventListener("scroll",()=>{
  previousChatScroll=chatScroller.scrollTop;
  resumeChatFollowIfAtBottom();
},{passive:true});
chatScroller.addEventListener("wheel",e=>{
  if(e.deltaY<0)pauseChatFollow();
  else if(e.deltaY>0){chatUserMovingDown=true;resumeChatFollowIfAtBottom();}
},{passive:true});
chatScroller.addEventListener("touchstart",e=>{
  chatTouchStartY=e.touches?.length===1?e.touches[0].clientY:null;
  chatTouchDirection=null;
},{passive:true});
chatScroller.addEventListener("touchmove",e=>{
  const y=e.touches?.length===1?e.touches[0].clientY:null;
  if(y===null||chatTouchStartY===null)return;
  const delta=y-chatTouchStartY;
  if(chatTouchDirection===null&&Math.abs(delta)>8){
    chatTouchDirection=delta>0?'older':'newer';
    if(chatTouchDirection==='older')pauseChatFollow();
    else chatUserMovingDown=true;
  }
  // While dragging, let iOS handle scroll offset and inertia natively.
  if(chatTouchDirection==='newer')resumeChatFollowIfAtBottom();
},{passive:true});
const endChatTouch=()=>{chatTouchStartY=null;chatTouchDirection=null;};
chatScroller.addEventListener("touchend",endChatTouch,{passive:true});
chatScroller.addEventListener("touchcancel",endChatTouch,{passive:true});
chatScroller.addEventListener("keydown",e=>{
  if(["ArrowUp","PageUp","Home"].includes(e.key))pauseChatFollow();
  else if(["ArrowDown","PageDown","End"].includes(e.key)){chatUserMovingDown=true;resumeChatFollowIfAtBottom();}
},{passive:true});

<script>
(()=>{
  // Both the personal and group composers live inside the iframe. Tell the parent
  // about either keyboard focus so its visualViewport sizing keeps the composer
  // directly above the iPhone keyboard instead of leaving it offscreen.
  const inputs=['msg-input','group-input','group-search-input'].map(id=>document.getElementById(id)).filter(Boolean);
  const tell=active=>{if(window.parent!==window)window.parent.postMessage({type:'himiko-input-focus',active},location.origin)};
  for(const input of inputs){
    input.addEventListener('focus',()=>tell(true));
    input.addEventListener('blur',()=>{
      // Switching from one composer to the other must not briefly disable
      // keyboard layout while a different chat editor is focused.
      requestAnimationFrame(()=>tell(inputs.includes(document.activeElement)));
    });
  }
})();

 function groupTimeContext(question,entries,now=Date.now()){
  const q=String(question).normalize('NFKC');
  const refs=[...q.matchAll(/(午前|午後)?\s*(\d{1,2})(?:[:：]([0-5]\d)|時(?:([0-5]?\d)分?)?)/g)]
   .filter(m=>Number(m[2])<24).map(m=>{let hour=Number(m[2]);if(m[1]&&hour<=12)hour=hour%12+(m[1]==='午後'?12:0);const min=m[3]??m[4];return {minute:hour*60+Number(min||0),hourOnly:min===undefined};}).slice(0,2);
  if(!refs.length)return null;
  const referenceIntent=/(会話|発言|やりとり|やり取り|の話|した話|話して|話した|話の|話って|どういう|説明|意味|さっき|先ほど|以降|以後|のやつ|の部分|のところ|の件|のこと)/.test(q)||refs.length===2||/^(?:午前|午後)?\s*\d{1,2}(?::[0-5]\d|時(?:[0-5]?\d分?)?)\s*[？?]?$/u.test(q);
  if(!referenceIntent)return null;
  const rows=entries.filter(e=>Number(e.at)>0&&e.at<=now).map(e=>{const clock=historyClock(e.at),[h,m]=clock.split(':').map(Number);return {...e,day:historyDay(e.at),minute:h*60+m};});
  const since=refs.length===1&&/(以降|以後|から|より後|の後|のあと)/.test(q);
  const range=refs.length===2&&/(から|まで|[〜～~\-])/u.test(q);
  const matches=e=>range?(refs[1].minute>=refs[0].minute?e.minute>=refs[0].minute&&e.minute<=refs[1].minute:e.minute>=refs[0].minute||e.minute<=refs[1].minute):since?e.minute>=refs[0].minute:refs.some(r=>r.hourOnly?Math.floor(e.minute/60)===Math.floor(r.minute/60):e.minute===r.minute);
  let selectedDay=null;
  const date=q.match(/(\d{4})-(\d{1,2})-(\d{1,2})/)||q.match(/(?:(\d{4})[年/])?(\d{1,2})[月/](\d{1,2})日?/);
  if(/一昨日|おととい/.test(q))selectedDay=historyDay(now-2*86400000);
  else if(/昨日|きのう/.test(q))selectedDay=historyDay(now-86400000);
  else if(/今日|きょう/.test(q))selectedDay=historyDay(now);
  else if(date){const year=date[1]||historyDay(now).slice(0,4);selectedDay=year+'-'+date[2].padStart(2,'0')+'-'+date[3].padStart(2,'0');}
  else selectedDay=rows.filter(e=>range&&refs[1].minute<refs[0].minute?e.minute>=refs[0].minute:matches(e)).map(e=>e.day).sort().at(-1)||null;
  if(!selectedDay&&range&&refs[1].minute<refs[0].minute){const endDay=rows.filter(e=>e.minute<=refs[1].minute).map(e=>e.day).sort().at(-1);if(endDay)selectedDay=historyDay(Date.parse(endDay+'T00:00:00+09:00')-86400000);}
  const midnight=selectedDay?Date.parse(selectedDay+'T00:00:00+09:00'):NaN;
  const start=midnight+refs[0].minute*60000;
  const end=range?midnight+refs[1].minute*60000+(refs[1].minute<refs[0].minute?86400000:0)+60000:since?now+1:start+(refs[0].hourOnly?3600000:60000);
  const relevant=selectedDay?rows.filter(e=>since||range?e.at>=start&&e.at<end:e.day===selectedDay&&matches(e)):[];
  if(!relevant.length)return {found:false,count:0,day:selectedDay,content:'参照結果：保存されている表示済み履歴には、指定された日時に対応する発言を確認できません。画面上に時刻がないという意味ではありません。利用者に発言の引用や内容の一部をお願いしてください。'};
  // Include the immediately preceding context without pushing matches out of budget.
  const first=rows.indexOf(relevant[0]),prior=rows.slice(Math.max(0,first-2),first).filter(e=>e.day===selectedDay);
  const selected=[];let used=0;
  for(const entry of relevant){const line=groupHistoryLine(entry).slice(0,1300);if(used+line.length+1>3900)break;selected.push(line);used+=line.length+1;}
  const context=[];for(const entry of prior.reverse()){const line=groupHistoryLine(entry).slice(0,650);if(used+line.length+1>4300)break;context.unshift(line);used+=line.length+1;}
  const note='参照日：'+selectedDay+'（日本時間）。指定に該当する発言は'+relevant.length+'件、そのうち'+selected.length+'件を掲載。'+(context.length?'冒頭の'+context.length+'行は直前の文脈。':'')+(selected.length<relevant.length?'全件ではなく冒頭からの抜粋です。':'');
  return {found:true,count:relevant.length,day:selectedDay,content:note+'\n'+[...context,...selected].join('\n')};
 }

 function groupHistory(question,quote=null,pendingTurn=null){
  const history=[],lines=[],entries=groupVisibleEntries(pendingTurn);let used=0;
  for(const entry of entries.slice(-80).reverse()){
