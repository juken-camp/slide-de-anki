<script id="nekopon-embedded-canvas-alignment">
(()=>{
 if(window.parent===window)return;
 const root=document.documentElement;
 function sync(){
  try{
   const frame=window.frameElement;if(!frame)return;
   const rect=frame.getBoundingClientRect();
   const bg=parent.getComputedStyle(parent.document.body,'::before');
   root.style.setProperty('--embedded-list-top-inset',parent.getComputedStyle(parent.document.documentElement).getPropertyValue('--himiko-list-overlap').trim()||'0px');
   root.style.setProperty('--embedded-bg-color',bg.backgroundColor);
   root.style.setProperty('--embedded-bg-image',bg.backgroundImage);
   root.style.setProperty('--embedded-bg-size',bg.backgroundSize);
   root.style.setProperty('--embedded-bg-x',(-rect.left)+'px');
   root.style.setProperty('--embedded-bg-y',(-rect.top)+'px');
  }catch(_){}
 }
 let pending=false;
 function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;sync()});}
 sync();window.addEventListener('load',schedule);
 parent.addEventListener('resize',schedule,{passive:true});
 parent.addEventListener('scroll',schedule,{passive:true});
 parent.visualViewport?.addEventListener('resize',schedule,{passive:true});
 if(window.ResizeObserver)new ResizeObserver(schedule).observe(window.frameElement);
 for(const element of [parent.document.documentElement,parent.document.getElementById('himikoScreen'),window.frameElement]){
  if(element)new MutationObserver(schedule).observe(element,{attributes:true,attributeFilter:['class','style','hidden','data-persona']});
 }
})();

0,"name":"白河上皇","period":"平安時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"平安時代に上皇として院政を行った","color":"#b45309","accent":"#fde68a","bio":"平安時代後期の天皇。退位後の1086年から上皇として政治を行い、院政を本格化させた。天皇を後見する上皇が政治を動かす仕組みは、藤原氏による摂関政治とは異なる。院政の広がりと、その後に武士の力が強まる流れを押さえたい。","greeting":"天皇を退いた後も政治に関わりました。院政という仕組みを知っていますか？","qs":["院政ってどんな政治？","摂関政治とは何が違うの？","なぜ上皇が政治を行えたの？"]},{"id":111,"name":"後鳥羽上皇","period":"鎌倉時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"鎌倉時代、幕府を倒そうとして承久の乱を起こした","color":"#b45309","accent":"#fde68a","bio":"鎌倉時代の上皇。朝廷の力を取り戻そうとし、1221年に鎌倉幕府を倒すため兵を挙げた。承久の乱で幕府側に敗れ、隠岐へ流された。乱の後、幕府は京都に六波羅探題を置いて西国への支配を強めた。朝廷と幕府の力関係の変化に注目したい。","greeting":"朝廷と幕府の力関係を変えようとしました。承久の乱について話しましょう。","qs":["承久の乱はなぜ起こったの？","乱の後、幕府の力はどうなったの？","乱の後にどこへ流されたの？"]},{"id":112,"name":"北条時宗","period":"鎌倉時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"鎌倉幕府の執権として、元の襲来に対応した","color":"#b45309","accent":"#fde68a","bio":"鎌倉幕府の8代執権。元の服属要求に応じず、1274年の文永の役と1281年の弘安の役への対応を指揮した。この二度の襲来を元寇という。戦った御家人に十分な恩賞を与えられなかったことが、幕府の弱体化につながった点も重要である。","greeting":"元の軍勢が海を越えてきた。幕府がどう備えたのか、一緒に見ていこう。","qs":["元寇はなぜ起こったの？","文永の役と弘安の役はどう違う？","元寇の後、御家人の生活はどうなったの？"]},{"id":113,"name":"運慶","period":"鎌倉時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"鎌倉時代に活躍した仏師。快慶らと東大寺南大門の金剛力士像の制作に関わった","color":"#b45309","accent":"#fde68a","bio":"鎌倉時代を代表する仏師。力強く写実的な仏像を制作し、武士の時代の文化を象徴した。快慶らとともに東大寺南大門の金剛力士像の制作に関わったことで知られる。人物名・作品・場所を結び付け、鎌倉文化のたくましい表現の特徴を押さえたい。","greeting":"仏像の表情や体の動き、じっくり見たことはあるかい？ 南大門の像の話をしよう。","qs":["金剛力士像はどこにあるの？","快慶とはどんな関係？","鎌倉時代の仏像にはどんな特徴があるの？"]},{"id":114,"name":"足利義政","period":"室町時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"室町幕府の8代将軍。東山文化と銀閣で知られる","color":"#b45309","accent":"#fde68a","bio":"室町幕府の8代将軍。将軍家の後継ぎ問題などを背景として、その治世に応仁の乱が起こった。京都の東山に山荘を造り、銀閣は東山文化の代表となった。足利義満の金閣・北山文化と区別し、書院造や水墨画などの発展と関連付けたい。","greeting":"東山の山荘は、後に銀閣と呼ばれるようになった。文化の話から始めようか。","qs":["銀閣と金閣は何が違うの？","東山文化にはどんな特徴があるの？","応仁の乱はなぜ起こったの？"]},{"id":115,"name":"世阿弥","period":"室町時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"室町時代に父の観阿弥とともに能を大成した","color":"#b45309","accent":"#fde68a","bio":"室町時代の能役者・作者。父の観阿弥とともに、猿楽をもとに能を大成した。足利義満の保護を受け、歌・舞・演技を組み合わせた芸能を発展させた。能は面や装束を用いることでも知られる。室町文化の中で、狂言との違いも押さえたい。","greeting":"舞台では、ほんの小さな動きにも意味があります。能について一緒に見てみましょう。","qs":["能はどんな芸能なの？","父の観阿弥と何をしたの？","室町時代に能が広まったのはなぜ？"]},{"id":116,"name":"尚巴志","period":"琉球王国","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"15世紀に琉球の三山を統一し、琉球王国の基礎を築いた","color":"#b45309","accent":"#fde68a","bio":"15世紀の琉球の王。沖縄本島で対立していた北山・中山・南山を1429年までに統一した。首里を拠点とする琉球王国の発展の土台を築き、王国は中国や日本、東南アジアなどとの交易を進めた。三山統一と海を通じた交流を結び付けたい。","greeting":"琉球の三つの勢力をまとめ、王国の基礎を築きました。海の向こうとの交流も話しましょう。","qs":["三山統一って何？","琉球王国はどんな国々と貿易したの？","首里は王国でどんな役割を持ったの？"]},{"id":117,"name":"ザビエル","period":"室町時代（戦国時代）","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"1549年に来日し、キリスト教を伝えた宣教師","color":"#2563eb","accent":"#bfdbfe","bio":"イエズス会の宣教師。1549年に鹿児島へ到着し、日本でキリスト教を広める活動を始めた。南蛮貿易が行われた時代、西洋の宗教や文化を伝える役割を担った。1543年の鉄砲伝来と混同せず、伝わったもの・年代・人物を区別して覚えたい。","greeting":"私はキリスト教を伝えるために日本を訪れました。当時の日本との出会いについて話しましょう。","qs":["いつ日本に来たの？","キリスト教はどう広まったの？","鉄砲の伝来とはどう違うの？"]},{"id":118,"name":"千利休","period":"安土桃山時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"安土桃山時代に茶の湯を大成した茶人","color":"#b45309","accent":"#fde68a","bio":"安土桃山時代を代表する茶人。織田信長や豊臣秀吉に仕え、簡素で落ち着いた美しさを重んじるわび茶を大成した。茶の湯は道具や空間、人のもてなしとも関わる文化だった。城郭や障壁画に見られる桃山文化の華やかさと併せて学びたい。","greeting":"一杯のお茶をどう用意するか。その中にも、工夫があります。茶の湯のことを話しましょう。","qs":["茶の湯って何？","桃山文化にはどんな特徴があるの？","豊臣秀吉とはどんな関係だったの？"]},{"id":119,"name":"徳川家光","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸幕府の3代将軍。参勤交代の制度化や対外関係の制限を進めた","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の3代将軍。1635年に武家諸法度を改め、参勤交代を大名の義務として制度化した。大名に江戸と領地を行き来させ、幕府の統制を強めた。貿易や渡航の制限も進めたが、長崎や対馬、琉球、松前などを通じた対外関係は続いた。","greeting":"江戸幕府の三代将軍として、大名を統制する仕組みを整えました。何を聞きたいですか？","qs":["参勤交代はどんな制度？","大名や人々の暮らしにどんな影響があったの？","江戸時代は外国と全く交流しなかったの？"]},{"id":120,"name":"徳川吉宗","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸幕府の8代将軍で、享保の改革を行った","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の8代将軍。財政を立て直すため享保の改革を行い、倹約や新田開発、年貢収入の増加を進めた。目安箱を設けて意見を集め、公事方御定書で裁判の基準を整えた。寛政の改革・天保の改革と、担当者や政策を区別して押さえたい。","greeting":"幕府の台所事情を立て直すために、いろいろな改革に取り組んだ。気になることはあるか？","qs":["享保の改革では何をしたの？","目安箱は何のために置いたの？","寛政の改革とはどう違うの？"]},{"id":121,"name":"田沼意次","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸幕府の老中として商業を重視した政策を進めた","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の老中。商業の発達に合わせ、株仲間を認めて運上・冥加などの収入を得る政策を進めた。農業や年貢を中心とする財政を補おうとした一方、わいろなどへの批判も受けた。倹約や農村の立て直しを重視した改革との違いに注目したい。","greeting":"人や物が動けば、お金も動く。商業と幕府の政治の関係を一緒に考えてみよう。","qs":["株仲間って何？","なぜ商業を重視したの？","松平定信の政治とはどう違うの？"]},{"id":122,"name":"松平定信","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸幕府の老中として寛政の改革を行った","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の老中。天明のききん後に寛政の改革を進め、倹約や農村の立て直しに取り組んだ。囲米で飢饉への備えを求め、寛政異学の禁では幕府の学問所で朱子学以外を教えることを禁じた。田沼意次の政治との違いも関連付けたい。","greeting":"飢饉の後、暮らしを立て直すことは大きな課題でした。寛政の改革を話しましょう。","qs":["寛政の改革では何をしたの？","なぜ農村を重視したの？","田沼意次の政治とどう違うの？"]},{"id":123,"name":"水野忠邦","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸幕府の老中として天保の改革を進めた","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の老中。1841年から天保の改革を進め、倹約令や株仲間の解散、人返しの法などを行った。物価の引き下げや農村の立て直しを目指したが、江戸・大坂周辺を直轄地にする上知令は反対を受けた。改革が行き詰まった理由も押さえたい。","greeting":"幕府の財政や社会の混乱に向き合うため、天保の改革を進めました。","qs":["天保の改革は何のため？","株仲間を解散させたのはなぜ？","享保・寛政の改革との違いは？"]},{"id":124,"name":"大塩平八郎","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"1837年に大阪で乱を起こした元役人・陽明学者","color":"#b45309","accent":"#fde68a","bio":"大坂町奉行所の元役人で陽明学者。天保のききんで人々が苦しむ中、救済が不十分な政治を批判し、1837年に大坂で乱を起こした。乱は短期間で鎮められたが、元役人による反乱は社会に衝撃を与えた。幕府の弱体化を示す出来事として重要である。","greeting":"人々が苦しむ中、政治に何ができるのか。大阪で起きた乱の背景を一緒に考えましょう。","qs":["大塩平八郎の乱はなぜ起こったの？","当時、人々はどんなことで苦しんでいたの？","乱は幕府にどんな影響を与えたの？"]},{"id":125,"name":"伊能忠敬","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸時代に各地を測量し、日本地図作成を進めた","color":"#b45309","accent":"#fde68a","bio":"江戸時代の測量家。商人として暮らした後に天文学や測量を学び、50代から各地の海岸線などを測量した。その成果は、死後に完成した『大日本沿海輿地全図』にまとめられた。実際に観測し測る学問の発展と、正確な日本地図の作成を結び付けたい。","greeting":"各地を歩き、少しずつ地図の材料を集めました。測量の方法が気になりますか？","qs":["どうやって土地の形を測ったの？","完成した地図は何に役立ったの？","地図はいつ完成したの？"]},{"id":126,"name":"葛飾北斎","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸時代の浮世絵師。富嶽三十六景などで知られる","color":"#b45309","accent":"#fde68a","bio":"江戸時代後期の浮世絵師。代表作『富嶽三十六景』では、さまざまな場所から見た富士山と人々の暮らしを描いた。大胆な構図で知られ、作品は海外の芸術にも影響を与えた。歌川広重とともに化政文化を代表する画家として、作品名を覚えたい。","greeting":"富士山も見る場所が変われば、ずいぶん違って見える。絵の話をしようか。","qs":["富嶽三十六景って何？","浮世絵はどうやって作られたの？","歌川広重の作品とはどう違うの？"]},{"id":127,"name":"歌川広重","period":"江戸時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸時代の浮世絵師。東海道五十三次などで知られる","color":"#b45309","accent":"#fde68a","bio":"江戸時代後期の浮世絵師。代表作『東海道五十三次』で、宿場や旅人、雨や雪などの風景を描いた。交通の発達や庶民の旅への関心が高まった時代の文化を伝える。葛飾北斎の『富嶽三十六景』と区別し、化政文化と結び付けて押さえたい。","greeting":"道を旅すると、宿場ごとに違う景色が見える。東海道の絵を見てみよう。","qs":["東海道五十三次って何？","江戸時代の人はどんな旅をしたの？","北斎の作品とはどう違うの？"]},{"id":128,"name":"ペリー","period":"江戸時代末期","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"アメリカの使節として来航し、開国を求めた","color":"#2563eb","accent":"#bfdbfe","bio":"アメリカ海軍の軍人。1853年に軍艦を率いて浦賀へ来航し、日本に開国を要求した。翌1854年の再来航で日米和親条約が結ばれ、下田・箱館が開港された。1858年の日米修好通商条約とは区別し、幕末の外交と国内の動揺を関連付けたい。","greeting":"アメリカから船で日本を訪れました。当時の交渉について、日本側の事情も含めて考えましょう。","qs":["黒船はなぜ来たの？","日米和親条約で何が決まったの？","日米修好通商条約とはどう違うの？"]},{"id":129,"name":"井伊直弼","period":"江戸時代末期","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸幕府の大老として日米修好通商条約の調印や安政の大獄に関わった","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の大老。1858年、朝廷の許可を得ないまま日米修好通商条約の調印を進め、反対派を安政の大獄で処罰した。1860年に桜田門外の変で暗殺された。開国をめぐる対立と、幕府・朝廷・諸藩の関係が変わる幕末の流れを押さえたい。","greeting":"開国をめぐり、幕府の内外で意見が分かれていました。当時の判断を見ていきましょう。","qs":["日米修好通商条約はどんな条約？","安政の大獄って何？","桜田門外の変はなぜ起こったの？"]},{"id":130,"name":"徳川慶喜","period":"江戸時代末期","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸幕府の最後の将軍。大政奉還を行った","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の15代将軍で、最後の将軍。1867年に大政奉還を行い、政治を行う権限を朝廷へ返した。その後、王政復古の大号令で新政府が成立し、旧幕府側との対立は戊辰戦争へ進んだ。大政奉還と、その後の政治・社会の変革を区別して学びたい。","greeting":"幕府を取り巻く状況は大きく変わっていました。大政奉還について話しましょう。","qs":["大政奉還って何？","なぜ政権を朝廷に返したの？","大政奉還の後、何が起きたの？"]},{"id":131,"name":"木戸孝允","period":"幕末・明治","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"長州藩出身の政治家で、明治維新に関わった。桂小五郎とも呼ばれる","color":"#b45309","accent":"#fde68a","bio":"長州藩出身の政治家で、桂小五郎とも呼ばれる。薩長同盟の成立などに関わり、西郷隆盛・大久保利通とともに維新の三傑に数えられる。明治政府では五箇条の御誓文の起草や廃藩置県などを進めた。倒幕から中央集権国家づくりへの流れに注目したい。","greeting":"桂小五郎という名でも知られています。薩長の協力から明治の国づくりまで話しましょう。","qs":["薩長同盟はどうして結ばれたの？","桂小五郎と木戸孝允は同じ人？","明治政府でどんな改革に関わったの？"]},{"id":132,"name":"岩倉具視","period":"明治時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"明治政府の政治家。欧米に派遣された岩倉使節団の大使を務めた","color":"#b45309","accent":"#fde68a","bio":"公家出身の政治家。王政復古に関わり、1871年には岩倉使節団の大使として欧米へ出発した。使節団は不平等条約改正の交渉と制度・産業の視察を目的としたが、この時の条約改正は実現しなかった。欧米からの学びと留守政府の動きを結び付けたい。","greeting":"使節団とともに欧米へ渡りました。何を見て、何を学ぼうとしたのか話しましょう。","qs":["岩倉使節団の目的は何？","どんな人たちが使節団に参加したの？","条約改正はその時に実現したの？"]},{"id":133,"name":"大隈重信","period":"明治・大正","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"明治時代に立憲改進党を結成した政治家","color":"#b45309","accent":"#fde68a","bio":"明治・大正時代の政治家。1882年に立憲改進党を結成し、議会政治の実現を目指した。早稲田大学の前身である東京専門学校を創設したことでも知られる。板垣退助の自由党と区別し、自由民権運動から政党・議会が発展する流れを押さえたい。","greeting":"自由民権運動の時代、立憲改進党をつくりました。政治にどう参加するか、一緒に考えましょう。","qs":["立憲改進党はどんな政党？","板垣退助の自由党とどう違うの？","どんな学校の設立に関わったの？"]},{"id":134,"name":"小村寿太郎","period":"明治時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"日本の外交官で、ポーツマス条約の締結や関税自主権の回復に関わった","color":"#b45309","accent":"#fde68a","bio":"明治時代の外交官・外務大臣。1905年、日露戦争後のポーツマス条約に日本の全権として調印した。1911年には関税自主権を回復し、不平等条約の改正を完成させた。陸奥宗光による領事裁判権の撤廃と区別し、条約改正の二段階を覚えたい。","greeting":"戦争を終わらせる交渉や、条約の見直しに関わりました。外交の話をしましょう。","qs":["ポーツマス条約で何が決まったの？","関税自主権の回復って何？","陸奥宗光の条約改正とはどう違うの？"]},{"id":135,"name":"尚泰","period":"幕末・明治","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"琉球王国の最後の国王。1879年の琉球処分により王国は廃止された","color":"#b45309","accent":"#fde68a","bio":"琉球王国の最後の国王。明治政府の政策によって1872年に琉球藩王とされ、1879年の琉球処分で琉球藩が廃止されて沖縄県が置かれた。尚泰は首里城を離れ、東京へ移った。王国から県への移行を、琉球の人々の立場や中国との関係からも考えたい。","greeting":"私は琉球王国の最後の国王です。王国から沖縄県へ移る時代を、一緒にたどりましょう。","qs":["琉球処分って何？","沖縄県が置かれるまでに何があったの？","当時の琉球の人々はどんな立場に置かれたの？"]},{"id":136,"name":"田中正造","period":"明治時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"足尾鉱毒事件に際し、公害被害を訴えた政治家","color":"#b45309","accent":"#fde68a","bio":"明治時代の政治家。足尾銅山の鉱毒で渡良瀬川流域などに被害が出た足尾鉱毒事件で、農民の苦しみを訴えた。国会で追及し、1901年には天皇への直訴を試みた。産業の発展が暮らしや環境に及ぼす影響を示す、日本の初期の公害問題として重要である。","greeting":"川や田畑の被害に苦しむ人たちがいました。足尾鉱毒事件を一緒に考えましょう。","qs":["足尾鉱毒事件って何？","人々の暮らしにどんな被害があったの？","産業の発展と公害はどう関係するの？"]},{"id":137,"name":"津田梅子","period":"明治・大正","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"幼くして留学し、帰国後に女子教育に尽力した教育者","color":"#b45309","accent":"#fde68a","bio":"女子教育を進めた教育者。1871年、岩倉使節団に伴う女子留学生の一人として幼くしてアメリカへ渡った。帰国後も学びを重ね、1900年に女子英学塾を創設した。外国語や専門的な教育を通じて女性の自立を支えた人物として、近代の教育の広がりと結び付けたい。","greeting":"幼いころに海を渡り、帰国後は女子教育に取り組みました。学ぶことについて話しましょう。","qs":["なぜアメリカへ留学したの？","当時の女子教育にはどんな課題があったの？","どんな学校をつくったの？"]},{"id":138,"name":"北里柴三郎","period":"明治・大正","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"細菌学の研究や感染症対策に取り組んだ医学者","color":"#b45309","accent":"#fde68a","bio":"明治から昭和初めの医学者。ドイツで破傷風菌の純粋培養に成功し、ベーリングとともに血清療法の研究を進めた。感染症の治療や予防に貢献し、帰国後も研究機関の整備や人材育成に取り組んだ。日本の近代医学の発展を支えた人物として知られる。","greeting":"病気の原因を調べ、予防や治療につなげる。医学の研究について話しましょう。","qs":["細菌って何？","破傷風の研究では何が進んだの？","野口英世とはどんなつながりがあるの？"]},{"id":139,"name":"樋口一葉","period":"明治時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"明治時代の小説家。たけくらべなどを著した","color":"#b45309","accent":"#fde68a","bio":"明治時代の小説家。生活の苦労を抱えながら創作を続け、『たけくらべ』『にごりえ』などを発表した。町に暮らす人々や女性、子どもたちの生き方を繊細に描いた。近代文学の発展を学ぶ際には、夏目漱石らとともに作者名と代表作を組み合わせて覚えたい。","greeting":"人の暮らしや心の動きを、物語の言葉にしました。明治の文学の話をしましょう。","qs":["たけくらべはどんな作品？","明治時代の文学にはどんな特徴があるの？","夏目漱石とはどんな時代を生きたの？"]},{"id":140,"name":"渋沢栄一","period":"幕末・明治","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"多くの企業や銀行の設立・運営に関わった実業家","color":"#b45309","accent":"#fde68a","bio":"幕末から昭和初めの実業家。第一国立銀行など、多くの企業や経済団体の設立・運営に関わり、日本の近代産業を支えた。道徳と経済の両立を重んじ、教育や社会事業にも力を注いだ。多くの人の資金や協力を集める仕組みに注目して学びたい。","greeting":"銀行や会社の仕組みを整える仕事に関わりました。お金の流れから近代の日本を見てみよう。","qs":["銀行はどんな役割を持つの？","日本の近代産業とどう関わったの？","徳川慶喜とはどんなつながりがあるの？"]},{"id":141,"name":"原敬","period":"大正時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"1918年に本格的な政党内閣を組織した政治家","color":"#b45309","accent":"#fde68a","bio":"大正時代の政治家。1918年、立憲政友会を基盤に日本初の本格的な政党内閣を組織した。華族ではない衆議院議員が首相となり、「平民宰相」と呼ばれた。米騒動後の社会を背景に、政党政治への期待と、普通選挙はまだ実現していなかった点を押さえたい。","greeting":"政党が中心となる内閣を組織しました。政治がどう変わったか話しましょう。","qs":["政党内閣って何？","なぜ本格的な政党内閣と呼ばれるの？","米騒動と内閣の成立にはどんな関係があるの？"]},{"id":142,"name":"吉野作造","period":"大正時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"大正時代に民本主義を唱えた政治学者","color":"#b45309","accent":"#fde68a","bio":"大正時代の政治学者。人々の幸福を政治の目的とし、民意を政治に反映させる民本主義を唱えた。普通選挙や政党政治を求める大正デモクラシーに思想面から影響を与えた。天皇主権の憲法のもとで民意を重んじる考えで、国民主権と単純に同じ意味ではない。","greeting":"政治は誰のためにあるのでしょう。民本主義という考え方から一緒に考えてみましょう。","qs":["民本主義って何？","大正デモクラシーとはどんな動き？","民主主義と民本主義はどう違うの？"]},{"id":143,"name":"マッカーサー","period":"昭和時代","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"第二次世界大戦後、連合国軍最高司令官として日本の占領政策を指揮した","color":"#2563eb","accent":"#bfdbfe","bio":"第二次世界大戦後の連合国軍最高司令官。GHQの最高責任者として日本占領を指揮した。占領期には非軍事化と民主化が進み、選挙制度や農地制度の改革、日本国憲法の制定などが行われた。日本政府や国民も関わり、一人だけで改革を決めたわけではない。","greeting":"戦後の日本では、占領のもとでさまざまな改革が進みました。その内容を確認しましょう。","qs":["GHQは何をしたの？","戦後の民主化ではどんな改革があったの？","日本国憲法はどのように作られたの？"]},{"id":144,"name":"佐藤栄作","period":"昭和時代","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"内閣総理大臣として沖縄の本土復帰や非核三原則に関わった","color":"#b45309","accent":"#fde68a","bio":"昭和時代の内閣総理大臣。1967年に非核三原則を表明し、1972年の沖縄の本土復帰を実現した政権を率いた。復帰には沖縄の人々の長年の運動があった。返還後も米軍基地が多く残ったことを含め、沖縄と戦後日本の関係を考える手がかりとなる。","greeting":"沖縄の本土復帰が実現した時代の首相です。復帰までの歩みと、その後の課題を話しましょう。","qs":["沖縄が本土に復帰したのはいつ？","復帰を求める運動はどんなものだったの？","非核三原則って何？"]},{"id":145,"name":"バスコ・ダ・ガマ","period":"大航海時代","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"ヨーロッパから喜望峰を回りインドに到達したポルトガルの航海者","color":"#2563eb","accent":"#bfdbfe","bio":"ポルトガルの航海者。1498年、アフリカ南端の喜望峰を回り、ヨーロッパから海路でインドに到達した。これによりアジアとの海上交易やポルトガルの進出が進んだ。コロンブスの大西洋航海や、マゼランの船団の世界一周と航路・目的地を区別したい。","greeting":"アフリカ南端を回り、インドへ航海しました。どんな航路だったか、地図を思い浮かべてみよう。","qs":["どんな航路でインドへ行ったの？","コロンブスの航海とは何が違うの？","航路の開拓は現地の人々に何をもたらしたの？"]},{"id":146,"name":"ワット","period":"18世紀","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"蒸気機関の改良に取り組んだ技術者","color":"#2563eb","accent":"#bfdbfe","bio":"18世紀のイギリスで活躍した技術者。すでにあった蒸気機関を改良し、燃料を効率よく使えるようにした。蒸気機関は工場などの動力として普及し、産業革命を支えた。最初の発明者と混同せず、機械の改良と生産・労働の変化を関連付けて押さえたい。","greeting":"蒸気の力をもっと役立てるにはどうすればいいか。機械の改良から産業革命を見てみよう。","qs":["蒸気機関をどう改良したの？","工場の生産はどう変わったの？","産業革命で働く人の生活はどう変わったの？"]},{"id":147,"name":"孫文","period":"近代中国","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"中国の革命運動を指導し、中華民国の臨時大総統となった人物","color":"#2563eb","accent":"#bfdbfe","bio":"中国の革命運動を指導した人物。民族・民権・民生の三民主義を唱え、1911年に始まる辛亥革命後、1912年に中華民国の臨時大総統となった。清の皇帝による支配が終わり、共和国が成立した点が重要である。革命後も軍閥などの対立が続いた。","greeting":"清の時代から新しい国へ。中国で起きた変化を一緒にたどってみましょう。","qs":["辛亥革命って何？","中華民国はどうして成立したの？","三民主義ってどんな考え？"]},{"id":148,"name":"ウィルソン","period":"第一次世界大戦期","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"第一次世界大戦中に十四か条を提唱し、戦後の国際秩序を構想したアメリカ大統領","color":"#2563eb","accent":"#bfdbfe","bio":"第一次世界大戦期のアメリカ大統領。1918年に十四か条の平和原則を示し、民族自決や国際平和のための組織を提唱した。戦後に国際連盟が成立したが、アメリカ自身は加盟しなかった。民族自決も全植民地に認められたわけではなく、理念と現実の違いを押さえたい。","greeting":"大きな戦争の後、どうすれば平和を守れるのか。国際連盟の構想から話しましょう。","qs":["十四か条の平和原則って何？","民族自決ってどういう考え？","なぜアメリカは国際連盟に加盟しなかったの？"]}];

function openChatDB(){
  if(!chatDbPromise){
    chatDbPromise=new Promise((resolve,reject)=>{
      if(!("indexedDB" in window)){reject(new Error("IndexedDB is not available"));return;}
      const req=indexedDB.open(CHAT_DB_NAME,1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(CHAT_DB_STORE))req.result.createObjectStore(CHAT_DB_STORE,{keyPath:"id"});};
      req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>db.close();resolve(db);};
      req.onerror=()=>reject(req.error||new Error("DB open failed"));
      req.onblocked=()=>reject(new Error("DB blocked"));
    }).catch(err=>{chatDbPromise=null;throw err;});
  }
  return chatDbPromise;
}
async function readSavedChat(id){
  // 書き込み直後に人物を切り替えても、古いデータを先に読まない。
  await chatWrites.catch(()=>{});
  const db=await openChatDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(CHAT_DB_STORE,"readonly"),req=tx.objectStore(CHAT_DB_STORE).get(String(id));
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error("Read failed"));
    tx.onabort=()=>reject(tx.error||new Error("Read aborted"));
  });
}
function writeSavedChat(id,record){
  // 登録と削除の順序を保証する。書き込み完了前に保存済みとは表示しない。
  const operation=chatWrites.catch(()=>{}).then(async()=>{
    const db=await openChatDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(CHAT_DB_STORE,"readwrite");
      const store=tx.objectStore(CHAT_DB_STORE);
      if(record)store.put({id:String(id),version:1,updatedAt:Date.now(),turns:record.turns,suggestions:record.suggestions});
      else store.delete(String(id));
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error("Write failed"));
      tx.onabort=()=>reject(tx.error||new Error("Write aborted"));
    });
  });
  chatWrites=operation;
  return operation;
}
function completedChatTurns(source=messages){
  const result=[];
  // 先頭の挨拶や未完了・エラーの回答は保存／AIの記憶に含めない。
  for(let i=1;i+1<source.length;i++){
    const user=source[i],answer=source[i+1];
    if(user?.role==="user"&&answer?.role==="assistant"&&
       typeof user.content==="string"&&user.content.trim()&&
       typeof answer.content==="string"&&answer.content.trim()&&
       !answer.content.startsWith("⚠️ 接続エラー")){
      result.push({...user},{...answer});i++;
    }
  }
  return result;
}
function persistCurrentChat(ch=currentChar){
  if(!ch)return Promise.resolve();
  const record={turns:completedChatTurns(),suggestions:[...dynamicSuggestions]};
  const epoch=chatEpoch;
  setChatStorageStatus("保存中…");
  return writeSavedChat(ch.id,record.turns.length?record:null).then(()=>{
    if(epoch===chatEpoch&&currentChar===ch)setChatStorageStatus("✓ この端末に会話を保存済み");
  }).catch(err=>{
    console.warn("会話を保存できませんでした",err);
    if(epoch===chatEpoch&&currentChar===ch)setChatStorageStatus("⚠️ 会話を保存できません。ブラウザの保存設定をご確認ください","error");
  });
}
function buildApiConversation(question){
  const turns=completedChatTurns();
  const selected=[];
  let length=question.length;
  // 古い発言のみが単独で混入しないよう、user / assistantのペア単位で切り詰める。
  for(let i=turns.length-2;i>=0&&selected.length<AI_CONTEXT_MAX_PAIRS*2;i-=2){
    const pairLength=turns[i].content.length+turns[i+1].content.length;
    if(length+pairLength>AI_CONTEXT_MAX_CHARS)break;
    selected.unshift(turns[i],turns[i+1]);length+=pairLength;
  }
  return [...selected,{role:"user",content:question}];
}

function getEra(period) {
  const y=(function(){
    const bc=period.match(/紀元前(\d+)/);if(bc)return -parseInt(bc[1]);
    if(period.includes('紀元前'))return -1;
    const m=period.match(/[（(](\d{3,4})/);if(m)return parseInt(m[1]);
    if(period.includes('3世紀'))return 250;if(period.includes('5世紀'))return 450;return 9999;
  })();
  if(y<600)return{id:"古代",label:"古代",color:"#92400E",bg:"#FDE68A"};
  if(y<1300)return{id:"中世",label:"中世",color:"#1E40AF",bg:"#BFDBFE"};
  if(y<1700)return{id:"近世",label:"近世",color:"#065F46",bg:"#6EE7B7"};
  if(y<1900)return{id:"近代",label:"近代",color:"#6D28D9",bg:"#DDD6FE"};
  return{id:"現代",label:"現代",color:"#0E7490",bg:"#A5F3FC"};
}

const filterLearningNotes={"era":{"縄文":"狩り・漁・採集を中心に生活し、縄文土器や竪穴住居を使った時代。貝塚や土偶も重要な手がかりだ。","世界の古代":"メソポタミア・エジプト・インダス・中国などで文明が発達。文字や法律、都市の成立に注目しよう。","弥生・古墳":"弥生時代は稲作と金属器が広まり、むら同士の争いが起きた。古墳時代にはヤマト政権が勢力を広げた。","飛鳥・奈良":"聖徳太子の政治や大化の改新を経て律令国家づくりが進んだ。平城京や東大寺、天平文化が重要だ。","平安":"794年に平安京へ遷都。藤原氏の摂関政治、国風文化、院政と武士の成長を押さえよう。","鎌倉":"源頼朝の武家政権と御恩・奉公の関係が基本。承久の乱、元寇、鎌倉仏教も重要だ。","室町":"足利氏の幕府のもと守護大名が力を持った。日明貿易、金閣・銀閣、応仁の乱から戦国時代への流れを学ぼう。","安土桃山":"織田信長と豊臣秀吉が全国統一を進めた。楽市・楽座、太閤検地、刀狩、南蛮貿易と桃山文化を覚えよう。","江戸":"徳川家康が幕府を開き、幕藩体制が続いた。参勤交代、対外政策、三大改革、元禄・化政文化が重要だ。","明治":"明治維新で近代国家づくりが進んだ。廃藩置県、地租改正、自由民権運動、大日本帝国憲法、条約改正を押さえよう。","大正・昭和":"大正デモクラシーが進む一方、昭和には戦争が拡大した。戦後の民主化や高度経済成長までの流れが重要だ。","現代":"冷戦終結やグローバル化、情報化が進んだ。国際協力や環境問題など、世界と日本のつながりに注目しよう。"},"region":{"日本":"縄文・弥生から武士の政治、明治維新、戦後の民主化まで、政治・文化・外交の変化をつなげて学ぼう。","アジア":"中国やインドなどで古代文明・宗教・王朝が発展した。シルクロードなどの交流は日本にも大きな影響を与えた。","ヨーロッパ":"古代ギリシャ・ローマからルネサンス、宗教改革、市民革命、産業革命へ。近代社会の成立をつかもう。","アメリカ":"独立宣言、南北戦争、公民権運動などが重要。自由と平等をめぐる社会の変化に注目しよう。","アフリカ":"多様な王国や文化が栄え、近代には植民地支配を受けた地域も多い。独立と人種差別撤廃の歴史を学ぼう。","西アジア・中東":"メソポタミア文明が生まれ、ユダヤ教・キリスト教・イスラム教に深く関わる地域。交易と文化交流も重要だ。"},"role":{"武士・武将":"武士は土地を守る集団から政治を担う存在へ成長した。鎌倉・室町・江戸の武家政権を比べよう。","王・皇帝・天皇":"国や地域を治めた君主たち。権力の仕組みと政治・宗教との関係が時代によってどう変わったかに注目しよう。","政治家・指導者":"制度や社会を変えた人物たち。何を改革し、どのような影響を残したかを出来事とセットで覚えよう。","宗教に関わる人":"仏教・キリスト教・イスラム教などは社会や文化に大きな影響を与えた。開祖と教えの広まりを整理しよう。","作家・文化人":"文学や文化は当時の社会を映す。代表作品・作者・時代背景を組み合わせて覚えよう。","芸術家":"絵画や彫刻などの表現から時代の文化や価値観が見えてくる。代表作品と人物を結びつけよう。","科学者・医師":"観察や実験で新しい知識を広めた人々。発見・研究内容と社会への影響を確認しよう。","探検家":"航海と探検は世界の交流を広げた一方、植民地化にもつながった。航路とその影響を地図で確かめよう。","思想家・教育者":"社会や人間のあり方を考えた人々。主張した考えと政治・教育への影響を整理しよう。","社会を変えた人":"差別や不平等の解消、権利の拡大を目指した人々。運動の目的と実現した変化を学ぼう。"},"special":{"女性の人物":"卑弥呼の政治、紫式部の文学、平塚らいてうの女性解放運動など、各時代の女性の活躍を学ぼう。","AI先生":"歴史の疑問を質問できる先生だ。出来事の背景や重要語句を確かめよう。","解説モード":"本人の発言だと誤解させないよう、歴史の先生が説明する。","歴史的教訓":"戦争・独裁などを美化せず、問題点や教訓を学ぶ。","敬意配慮":"宗教の開祖や天皇などは、敬意を大切にして本人になりきらず紹介する。"}};
function filterGuideHTML(){

  const note=filterLearningNotes[openedFilterGroup]?.[key];
  if(!note)return '';
  const eraColor=openedFilterGroup==='era'?ERA_BADGE_COLORS[key]:null;
  const chipStyle=eraColor?` style="background:${eraColor.bg};color:${eraColor.color}"`: '';
  return `<div class="himiko-mode-guide-item"><span class="himiko-mode-chip mode-explain"${chipStyle}>${esc(key)}</span><span class="himiko-mode-explain">${esc(himikoGuideCopy(note))}</span></div>`;
 }).join('');
 return `<div class="himiko-mode-guide" role="note" aria-label="選択項目の説明">${rows}</div>`;
}

let listScrollY=0;

async function openChat(id){
  personalUnreadIndex=-1;personalUnreadAnchorPending=false;
  const openingUnread=Math.max(0,Number(window.himikoPersonalUnreadCount?.(id))||0);
  setPersonalQuestions(currentChar,[]);
  chatEpoch++;cancelReveal(false);isLoading=false;dynamicSuggestions=[];chatReady=false;
  const epoch=chatEpoch;
  listScrollY=window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;
  currentChar=id===0?AI_SENSEI:CHARACTERS.find(c=>c.id===id);
  if(!currentChar)return;
  messages=[{role:"assistant",content:currentChar.greeting}];
  const ch=currentChar,ai=ch.isSpecial;
  const av=document.getElementById("chat-avatar");
  av.innerHTML=historyAvatarHTML(ch);
  av.style.background=`linear-gradient(135deg,${ch.color},${ch.accent})`;
  av.style.animation=ai?"float 3s ease-in-out infinite":"none";
  document.getElementById("chat-name").textContent=ch.name;
  document.getElementById("chat-period").textContent=ch.period;
  document.getElementById("online-badge").classList.toggle("hidden",!ai);
  document.getElementById("explainer-badge").classList.toggle("hidden",!ch.isExplainer);
  document.getElementById("narrator-badge").classList.toggle("hidden",!ch.isNarrator);
  syncHimikoPrompt();
  document.getElementById("list-view").classList.add("hidden");
  document.getElementById("chat-view").classList.remove("hidden");
  document.documentElement.dataset.chatOpen="true";
   if(window.parent!==window)window.parent.postMessage({type:"himiko-chat-state",open:true},location.origin);
  document.getElementById("msg-input").value="";
  document.getElementById("chat-reset").disabled=true;
  setChatStorageStatus("保存した会話を読み込み中…");
  document.getElementById("messages").innerHTML='<div class="history-loading">会話を読み込み中…</div>';
  updateSendBtn();
  try{
    const saved=await readSavedChat(ch.id);
    if(epoch!==chatEpoch||currentChar!==ch)return;
    const savedTurns=Array.isArray(saved?.turns)?saved.turns.map(m=>m.role==='assistant'?{...m,content:cleanReplyText(m.content)}:m):[];
    // 壊れた形式の保存データをチャット／APIに流さない。
    const validTurns=completedChatTurns([{role:"assistant",content:ch.greeting},...savedTurns]);
    messages=[{role:"assistant",content:ch.greeting},...validTurns];
    dynamicSuggestions=validTurns.length&&Array.isArray(saved?.suggestions)?saved.suggestions.filter(x=>typeof x==="string"&&x.length<150).slice(0,3):[];
    setChatStorageStatus(validTurns.length?"✓ この端末の会話を復元しました":"✓ この端末に会話を自動保存");
  }catch(err){
    console.warn("会話を読み込めませんでした",err);
    if(epoch!==chatEpoch||currentChar!==ch)return;
    setChatStorageStatus("⚠️ 保存データを読み込めません。会話の保存ができない可能性があります","error");
  }
  if(epoch!==chatEpoch||currentChar!==ch)return;
  historyVisiblePairs=HISTORY_PAGE_PAIRS;
  if(openingUnread){
    const incoming=messages.map((m,i)=>m.role==='assistant'&&i>0?i:-1).filter(i=>i>=0);
    personalUnreadIndex=incoming[Math.max(0,incoming.length-openingUnread)]??-1;
    personalUnreadAnchorPending=personalUnreadIndex>=0;
    if(personalUnreadAnchorPending)historyVisiblePairs=Math.max(historyVisiblePairs,Math.ceil((messages.length-personalUnreadIndex)/2)+1);
  }
  chatReady=true;
  document.getElementById("chat-reset").disabled=false;
  renderMessages();
  // After layout settles, start at the actual end of the saved conversation.
  // Unread anchors and a user's own scroll always take priority.
  if(!openingUnread && messages.length>1){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(epoch!==chatEpoch || currentChar!==ch || userReadingHistory)return;
      scrollChatToEnd(false);
    }));
  }
  // スマートフォンでキーボードが突然開いて画面が飛ぶのを防ぐ。
}

}

// 会話を毎回全再描画するとスクロール位置が飛ぶため、新規メッセージはDOMへ追加する。
function preparePersonalSend(){
  const scroller=document.getElementById('messages'),inner=messageInner();
  const oldTop=scroller.scrollTop,hadQuestions=!!inner?.querySelector('.suggestions');
  // Keep the existing history height BEFORE removing questions. No timed
  // shrinking spacer: new messages naturally fill the vacated question area.
  if(hadQuestions&&inner){
    inner.style.setProperty('min-height',inner.offsetHeight+'px','important');
    if(scroller.classList.contains('nekopon-initial-greeting'))
      inner.style.setProperty('padding-top',getComputedStyle(inner).paddingTop,'important');
  }
  setPersonalQuestions(currentChar,[]);
  scroller.classList.remove('nekopon-initial-greeting');
  automaticChatScrollUntil=Date.now()+200;
  scroller.scrollTop=oldTop;previousChatScroll=oldTop;
  return {hadQuestions,oldTop};
}
function setPersonalQuestions(ch,questions,initial=false){
  const inner=messageInner();if(!inner)return;
  inner.querySelectorAll('.suggestions').forEach(node=>node.remove());
  if(questions.length)inner.append(nodeFromHTML(suggestionHTML(ch,questions,initial)));
}
function messageInner(){return document.querySelector("#messages .messages-inner");}
function nodeFromHTML(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
function nearChatBottom(tolerance=125){
  const el=document.getElementById("messages");
  return el.scrollHeight-el.scrollTop-el.clientHeight<tolerance;
}
// 通常のメッセージアプリと同じ追従方式。
// 送信時に確保した高さは維持し、追加された回答がその空間を埋める。
// 手動で履歴をさかのぼっている間は、画面位置を一切変更しない。
function scrollChatToEnd(smooth=false, force=false){
  const el=document.getElementById("messages");
  if(!el?.clientHeight||(!force&&userReadingHistory))return;
  const epoch=chatEpoch;
  requestAnimationFrame(()=>{
    if(epoch!==chatEpoch||!el.isConnected||(!force&&userReadingHistory))return;
    const end=Math.max(0,el.scrollHeight-el.clientHeight);
    if(Math.abs(el.scrollTop-end)<2)return;
    automaticChatScrollUntil=Date.now()+(smooth?700:100);
    el.scrollTo({top:end,behavior:smooth&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches?"smooth":"auto"});
  });
}
// Track real content height (including late font/layout changes), not only
// the height at the instant a reply bubble was appended.
const chatContentSizeObserver=new ResizeObserver(()=>{
  if(!currentChar || userReadingHistory || !activeReveal)return;
  scrollChatToEnd(false);
});
function watchChatContent(){
  chatContentSizeObserver.disconnect();
  const inner=messageInner();
  if(inner)chatContentSizeObserver.observe(inner);
}
function appendChatNode(node,follow=false){
  const inner=messageInner();if(!inner)return;
  inner.append(node);
  if(follow)scrollChatToEnd(true);
}
function historyDay(at){return at?new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date(at)):''}
function historyClock(at){return at?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(at)):''}
function historyDateHTML(at,previous){if(!at||historyDay(at)===historyDay(previous))return '';const key=historyDay(at),today=historyDay(Date.now()),yesterday=historyDay(Date.now()-86400000);const label=key===today?'今日':key===yesterday?'昨日':new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short'}).format(new Date(at));return `<div class="history-day" data-date="${key}"><span>${esc(label)}</span></div>`}
function historyMeta(at,read=false){return at?`<span class="history-message-time">${read?'既読<br>':''}${esc(historyClock(at))}</span>`:''}
function historyActivity(){if(window.parent!==window)window.parent.postMessage({type:'himiko-chat-activity'},location.origin)}

    <div class="suggestions-list">${questions.map(q=>`<button type="button" class="suggestion-btn" style="border:2px solid ${ch.color}38;color:${ch.color}" data-suggestion="${escAttr(q)}">${esc(q)}</button>`).join("")}</div>

let personalSuggestionTimer=null;
function schedulePersonalSuggestions(ch,questions,turn){
 clearTimeout(personalSuggestionTimer);
 if(!questions.length)return;
 personalSuggestionTimer=setTimeout(()=>{
  if(currentChar!==ch||messages.at(-1)!==turn||activeReveal)return;
  if(!messageInner()||messageInner().querySelector('.suggestions'))return;
  setPersonalQuestions(ch,questions);scrollChatToEnd(true);
 },Math.max(0,(Number(turn?.questionsAt)||0)-Date.now()));
}
function renderMessages(resetScroll=true){
  clearTimeout(personalSuggestionTimer);
  const ch=currentChar;if(!ch)return;
  // 保存済みの長い会話をすべて一度にDOM化せず、40往復ずつ遡れる。
  const olderCount=Math.max(0,Math.floor((messages.length-1)/2)-historyVisiblePairs);
  const visible=olderCount?messages.slice(1+olderCount*2):messages;
  const markup=visible.map((m,i)=>historyDateHTML(m.at,visible[i-1]?.at)+(i+(olderCount?1+olderCount*2:0)===personalUnreadIndex?'<div id="personal-unread-divider" role="separator">ここから未読メッセージ</div>':'')+(m.role==="user"?userRowHTML(ch,m.content,false,m.at,m.read):
    `<div class="bubble-group">${(olderCount===0&&i===0?[m.content]:splitReplyBubbles(m.content)).map((part,index)=>assistantRowHTML(ch,part,index===0,false,m.chunkTimes?.[index]||m.at)).join("")}</div>`)).join("");
  const older=olderCount?`<button type="button" class="older-history" data-older="1" data-remaining="${olderCount}">${himikoUi('↑ 過去の会話を表示するにゃ','↑ 過去の会話を表示するぜ')}（残り${olderCount}往復）</button>`:"";
  const initial=messages.length<=1?ch.qs||[]:[];
  const followups=messages.length>1&&messages.at(-1)?.role==="assistant"?dynamicSuggestions:[];
  const el=document.getElementById("messages");
  el.innerHTML=`<div class="messages-inner">${older}${markup}</div>`;
  if(followups.length&&Number(messages.at(-1)?.questionsAt)>Date.now())schedulePersonalSuggestions(ch,followups,messages.at(-1));
  setPersonalQuestions(ch,initial.length?initial:(Date.now()>=(Number(messages.at(-1)?.questionsAt)||0)?followups:[]),!!initial.length);
  watchChatContent();
  el.classList.toggle('nekopon-initial-greeting',messages.length===1); if(resetScroll){el.scrollTop=messages.length>1?el.scrollHeight:0;previousChatScroll=el.scrollTop;userReadingHistory=false;}
  if(personalUnreadAnchorPending){
    personalUnreadAnchorPending=false;const epoch=chatEpoch;
    const anchor=()=>{if(epoch!==chatEpoch||currentChar!==ch)return;const divider=document.getElementById('personal-unread-divider');if(!divider)return;userReadingHistory=true;automaticChatScrollUntil=Date.now()+200;el.scrollTop+=divider.getBoundingClientRect().top-el.getBoundingClientRect().top-12;previousChatScroll=el.scrollTop;};
    anchor();requestAnimationFrame(anchor);
  }
  updateSendBtn();
}

// 日本語の文末や段落を基準に分割。APIの回答自体はそのまま会話履歴に保持する。
// 10秒を基準に、長文には読む余裕を追加する。待機は最大14秒。
function historyReadingDelay(text=''){
 return 10000+Math.min(3000,Math.max(0,String(text).length-60)*30)+Math.floor(Math.random()*1001);
}
function splitReplyBubbles(text){
  const source=String(text||"").replace(/\r\n?/g,"\n").trim();
  if(!source)return ["……"];
  const paragraphs=source.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const pieces=[];
  for(const paragraph of paragraphs){
    const sentences=paragraph.match(/[^。！？!?]+[。！？!?]+[」』）】]?|[^。！？!?]+$/g)||[paragraph];
    for(let sentence of sentences){
      sentence=sentence.trim();if(!sentence)continue;
      while(sentence.length>120){
        const look=sentence.slice(0,107);
        let cut=Math.max(look.lastIndexOf("、"),look.lastIndexOf("，"),look.lastIndexOf("\n"),look.lastIndexOf(" "));
        if(cut<50)cut=95;else cut+=1;
        pieces.push(sentence.slice(0,cut).trim());sentence=sentence.slice(cut).trim();
      }
      if(sentence)pieces.push(sentence);
    }
    pieces.push(null); // 段落の境界でバブルを切る
  }
  const chunks=[];let current="";
  for(const piece of pieces){
    if(piece===null){if(current){chunks.push(current);current="";}continue;}
    if(current&&current.length+piece.length>100){chunks.push(current);current=piece;}
    else current+=piece;
  }
  if(current)chunks.push(current);
  return chunks.length?chunks:[source];
}
function makeRevealStatus(ch){
  return nodeFromHTML(`<div class="reveal-status" role="status" aria-label="${himikoUi('続きの吹き出しを順番に表示するにゃ','続きの吹き出しを順番に表示するぜ')}">
    <div class="typing reveal-typing-bubble" aria-hidden="true">${[0,.2,.4].map(d=>`<span class="typing-dot" style="background:${ch.color};animation-delay:${d}s"></span>`).join("")}</div>
  </div>`);
}
// 回答は取得済みの1回分を、1つずつDOMに追加する。
// 以前の「未表示バブルをまとめて確保→先頭へ強制移動」は廃止。
// スクロールするのは会話の末尾のみ。回答が終わったら質問候補まで追従する。
function startReveal(ch,reply,suggestions){
  cancelReveal(false);
  const chunks=splitReplyBubbles(reply);
  const group=nodeFromHTML('<div class="bubble-group"></div>');
  appendChatNode(group,false);
  const state={group,ch,chunks,suggestions,index:0,timer:null,status:null};
  activeReveal=state;
  watchChatContent();
  const addNext=()=>{
    if(activeReveal!==state||currentChar!==ch||!group.isConnected)return;
    state.status?.remove();state.status=null;
    const i=state.index++;const saved=messages.at(-1);if(saved?.role==='assistant'){saved.chunkTimes||=[];saved.chunkTimes[i]=Date.now();persistCurrentChat(ch);}
    group.append(nodeFromHTML(assistantRowHTML(ch,chunks[i],i===0,true,Date.now())));
    playReceiveSound();
    window.dispatchEvent(new CustomEvent('himiko-person-bubble',{detail:{id:ch.id,text:chunks[i]}}));
    if(state.index<chunks.length){
      state.status=makeRevealStatus(ch);
      group.append(state.status);
      const readingTime=historyReadingDelay(chunks[i]); // 10秒以上、長文は少し長め
      state.timer=setTimeout(addNext,readingTime);
    }else{
      activeReveal=null;
      if(suggestions.length){
        const turn=messages.at(-1);if(turn?.role==='assistant'){turn.questionsAt=Date.now()+10000;persistCurrentChat(ch);schedulePersonalSuggestions(ch,suggestions,turn);}
      }
    }
    // Newly inserted bubbles can grow after the first layout frame on iOS.
    // During automatic reveal, settle at the true end without a competing
    // smooth-scroll animation. Respect manual reading of older messages.
    scrollChatToEnd(false);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(currentChar===ch && !userReadingHistory)scrollChatToEnd(false);
    }));
  };
  // 回答の最初から表示する。先頭へのジャンプや表示前の画面移動はしない。
  addNext();
}
function cancelReveal(showRest=false,showQuestions=false){
  clearTimeout(personalSuggestionTimer);
  const state=activeReveal;if(!state)return;
  clearTimeout(state.timer);
  activeReveal=null;
  state.status?.remove();
  if(showRest){
    while(state.index<state.chunks.length){
      const i=state.index++;
      state.group.append(nodeFromHTML(assistantRowHTML(state.ch,state.chunks[i],i===0)));
    }
    if(showQuestions&&state.suggestions.length){
      setPersonalQuestions(state.ch,state.suggestions);
      scrollChatToEnd(true);
    }
  }
}


// Replies accept JSON and legacy question tags. The server owns model instructions.
function looseSuggestionSection(value){
 const raw=String(value||'');const match=/(?:^|\n)\s*["']?suggestions["']?\s*:\s*(?=\[)/i.exec(raw);
 if(!match)return {text:raw,suggestions:[]};
 const section=raw.slice(match.index+match[0].length).trim();let suggestions=[];
 try{const a=JSON.parse(section.replace(/[,}\s]+$/,''));if(Array.isArray(a))suggestions=a;}catch{try{suggestions=JSON.parse(section.slice(0,section.lastIndexOf(']')+1))}catch{}}
 return {text:raw.slice(0,match.index).trim(),suggestions};
}
function cleanReplyText(value){
  // Keep normal historical prose, punctuation and angle brackets as text.
  // Remove only transport/formatting artifacts; display still passes through esc().
  return looseSuggestionSection(value).text.replace(/\r\n?/g,'\n')
    .replace(/\[\/?SUGGESTIONS\b[^\]]*\]/gi,'')
    .replace(/^\s*```(?:json|text|markdown)?\s*$/gim,'')
    .replace(/^\s{0,3}#{1,6}\s+/gm,'')
    .replace(/\*\*([^\n]+?)\*\*/g,'$1')
    .replace(/__([^\n]+?)__/g,'$1')
    .replace(/`([^`\n]+)`/g,'$1')
    .replace(/\n{3,}/g,'\n\n').trim();
}

function normalizeSuggestions(values,ch=currentChar,reply=''){
  if(!Array.isArray(values))return [];
  const seen=new Set();
  const key=s=>String(s).normalize('NFKC').replace(/[\s?？!！。、]/g,'').toLowerCase();
  // Do not suggest the same question again, even after restoring chat history.
  const asked=new Set(messages.filter(m=>m.role==='user').map(m=>key(m.content)));
  return values.filter(v=>typeof v==='string').map(value=>{
    let q=value.trim().replace(/^(?:[-•・]|\d+[.)、]|[①②③])\s*/, '');
    const subject=(ch?.isExplainer||ch?.isNarrator)?ch.name:'あなた';
    q=q.replace(/^(?:私|わし|余|朕|おれ|俺|拙者)(の|が|は)/,subject+'$1');
    if(ch?.isExplainer||ch?.isNarrator)q=q.replace(/あなた(の|が|は)/g,ch.name+'$1');
    q=q.replace(/(?:聞かせて|教えて|話して)ほしいの[？?]?$/,m=>m.split('ほしい')[0]+'？');
    q=q.replace(/\?$/,'？');
    if(!/[？?]$/.test(q)&&/(?:教えて|聞かせて|話して|知りたい|聞きたい)$/.test(q))q+='？';
    return q;
  }).filter(q=>{
    const k=key(q);
    if(q.length<6||q.length>60||!/[？?]$/.test(q)||/[\[\]{}<>\n\r]|SUGGESTIONS|```|\*\*/i.test(q))return false;
    if(seen.has(k)||asked.has(k)||key(reply)===k)return false;
    seen.add(k);return true;
  }).slice(0,3);
}

function getFallbackSuggestions(ch,reply=''){
  if(!ch)return [];
  const choices=ch.isSpecial
    ? ['今の説明をもっとやさしく教えて？','この出来事の前後の流れを教えて？','似ている言葉とのちがいを教えて？',...ch.qs]
    : ['今の説明をもっとやさしく教えて？',...ch.qs,'この話と同じ時代の出来事を教えて？','当時の人々の暮らしを教えて？'];
  return normalizeSuggestions(choices,ch,reply);
}

function completeSuggestions(values,ch,reply){
  return normalizeSuggestions([...normalizeSuggestions(values,ch,reply),...getFallbackSuggestions(ch,reply)],ch,reply);
}

// Recover only a completed JSON string field, never display an unfinished
// transport object. A truncated reply is treated as a failed answer by sendMessage.
function extractCompleteJsonString(raw,key){
  const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const match=raw.match(new RegExp('"'+escaped+'"\\s*:\\s*("(?:\\\\[\\s\\S]|[^"\\\\])*")'));
  if(!match)return null;
  try{return JSON.parse(match[1]);}catch{return null;}
}

function parseSuggestions(value,ch=currentChar){
  let parsed=null,raw=typeof value==='string'?value.trim():'';
  if(value&&typeof value==='object'&&!Array.isArray(value))parsed=value;
  if(!parsed){
    const unfenced=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    try{parsed=JSON.parse(unfenced);}catch{
      // Some models add a short preface despite the output contract.
      const first=unfenced.indexOf('{'),last=unfenced.lastIndexOf('}');
      if(first>=0&&last>first){try{parsed=JSON.parse(unfenced.slice(first,last+1));}catch{}}
    }
  }
  if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){
    const reply=typeof parsed.reply==='string'?parsed.reply:(typeof parsed.text==='string'?parsed.text:null);
    if(reply!==null){
      // Remove any accidentally nested legacy question section from the reply.
      const text=cleanReplyText(reply.split(/\[SUGGESTIONS\b/i)[0]);
      return {text,suggestions:completeSuggestions(parsed.suggestions,ch,text)};
    }
  }
  if(!raw)return {text:'',suggestions:[]};
  const jsonLike=raw.replace(/^```(?:json)?\s*/i,'').trim();
  if(/^\s*\{/.test(jsonLike)||/"(?:reply|suggestions)"\s*:/.test(jsonLike)){
    const reply=extractCompleteJsonString(jsonLike,'reply')??extractCompleteJsonString(jsonLike,'text');
    if(reply!==null){
      const text=cleanReplyText(reply.split(/\[SUGGESTIONS\b/i)[0]);
      return {text,suggestions:completeSuggestions([],ch,text)};
    }
    return {text:'',suggestions:[]};
  }
  // Legacy [SUGGESTIONS] is intentionally supported for existing API behavior.
  // Cut from the opening marker even when the closing marker never arrived.
  const loose=looseSuggestionSection(raw);raw=loose.text;
  const marker=raw.search(/\[SUGGESTIONS\b/i);
  let candidates=loose.suggestions;
  if(marker>=0){
    const section=raw.slice(marker).replace(/^\[SUGGESTIONS\]?/i,'').split(/\[\/SUGGESTIONS\]/i)[0];
    candidates=section.split(/\||\n|(?=[①②③])/).map(s=>s.trim());
    raw=raw.slice(0,marker);
  }
  // Also hide a tag cut in the middle of its name at the very end.
  raw=raw.replace(/\[(?:\/?S(?:U(?:G(?:G(?:E(?:S(?:T(?:I(?:O(?:N(?:S)?)?)?)?)?)?)?)?)?)?)?\s*$/i,'');
  const text=cleanReplyText(raw);
  return {text,suggestions:completeSuggestions(candidates,ch,text)};
}

async function sendMessage(text){
  if(!text||!text.trim()||isLoading||!currentChar||!chatReady)return;
  cancelReveal(true,false);
  const ch=currentChar,epoch=chatEpoch,question=text.trim();
  const scroller=document.getElementById("messages"),inner=messageInner();
  const {hadQuestions,oldTop}=preparePersonalSend();
  messages.push({role:"user",content:question,at:Date.now(),read:false});if(window.parent!==window)window.parent.postMessage({type:'himiko-chat-busy'},location.origin);
  // The first-message-only scroll snap must end immediately when a user
  // sends a question. Otherwise iOS snaps the growing conversation back
  // toward the greeting and hides the bottom of long replies.
  document.getElementById("messages").classList.remove("nekopon-initial-greeting");

  document.getElementById("msg-input").value="";
  dynamicSuggestions=[];
  isLoading=true;
  userReadingHistory=false; // 自分が送信したときは最新メッセージへ戻す
  const userRow=nodeFromHTML(userRowHTML(ch,question,true,messages.at(-1).at));
  const typingRow=nodeFromHTML(typingHTML(ch));
  if(historyDateHTML(messages.at(-1).at,messages.at(-2)?.at))appendChatNode(nodeFromHTML(historyDateHTML(messages.at(-1).at,messages.at(-2)?.at)),false);appendChatNode(userRow,false);
  appendChatNode(typingRow,false);
  if(hadQuestions){
    automaticChatScrollUntil=Date.now()+200;
    scroller.scrollTop=oldTop;previousChatScroll=oldTop;
  }else scrollChatToEnd(true);
  updateSendBtn();
  playSendSound();
  try{
    const apiMessages=buildApiConversation(question);
    const res=await fetch("/api/himiko-chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({characterId:ch.id,nickname:himikoNickname(),messages:apiMessages})
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.error||res.status);
    }
    const data=await res.json();
    if(epoch!==chatEpoch||currentChar!==ch)return;
    const rawReply=typeof data.reply==='string'?data:
      (Array.isArray(data.content)?data.content.filter(b=>b.type==="text"&&typeof b.text==='string').map(b=>b.text).join(""):
       typeof data.content==='string'?data.content:'');
    const parsed=parseSuggestions(rawReply,ch);
    if(!parsed.text)throw new Error("回答を受け取りきれませんでした。もう一度送ってください。");
    messages.at(-1).read=true;const time=userRow.querySelector('.history-message-time');if(time)time.innerHTML='既読<br>'+esc(historyClock(messages.at(-1).at));
    messages.push({role:"assistant",content:parsed.text,at:Date.now(),chunkTimes:[]});historyActivity();
    dynamicSuggestions=parsed.suggestions;
    // API応答の完了した往復だけを保存。画面描画の完了を待つ必要はない。
    persistCurrentChat(ch);
    typingRow.remove();
    startReveal(ch,parsed.text,dynamicSuggestions);
  }catch(e){
    if(epoch!==chatEpoch||currentChar!==ch)return;
    // API障害の回答や未完了の質問を保存・次のAPIリクエストに混入させない。
    messages.pop();
    const message=himikoUi(`⚠️ ${e.message} 質問は残してあるにゃ。もう一度送ってみてにゃ。`,`⚠️ ${e.message} 質問は残してあるぜ。もう一度送ってくれよ。`);
    dynamicSuggestions=[];
    typingRow.remove();userRow.remove();
    document.getElementById("msg-input").value=question;
    appendChatNode(nodeFromHTML(`<div class="error-msg" role="alert">${esc(message)}</div>`),true);
  }finally{

<script id="history-continuous-bubble-shape">
(()=>{

 }
