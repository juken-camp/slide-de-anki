  background-color:var(--himiko-persona-bg)!important;
  /* Exact grid rhythm and tint of the usual Yorupon app background. */
  background-image:
    linear-gradient(#00f5ff09 1px,transparent 1px),
    linear-gradient(90deg,#00f5ff09 1px,transparent 1px),
    radial-gradient(ellipse at 50% 0%,rgba(0,245,255,.09),transparent 54%),
    radial-gradient(ellipse at 90% 85%,rgba(191,0,255,.10),transparent 55%)!important;
  background-size:36px 36px,36px 36px,cover,cover!important;
  background-attachment:fixed!important;
}
/* A solid background from the previous embedded-page styles used to hide the
   grid specifically on chat open; make those surfaces truly transparent. */
html body,
html[data-chat-open] body,
html[data-persona="cyber"] body,
html[data-persona="cyber"][data-chat-open] body,
html #list-view,
html #list-view .header,
html #group-view,
html[data-chat-open] #group-view,
html[data-persona="cyber"][data-chat-open] #group-view,
html #group-view .messages,
html #group-view .chat-header,
html #group-view .chat-storage-status,
html #group-view .input-area {
  background:transparent!important;
  background-image:none!important;
}
/* Keep a single subtle separator instead of a dark solid header/composer. */
html #group-view .chat-header { box-shadow:none!important; }


/* Restore the native iOS rubber-band only inside the independent message scroller. */
html[data-chat-open] #group-view .messages{
  overflow-y:auto!important;
  overscroll-behavior-y:contain!important;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  scroll-behavior:auto;
}
html[data-chat-open] #group-view .messages-inner{
  transform:none!important;
  transition:none!important;
  will-change:auto!important;
}
/* The fixed header and composer do not participate in the swipe. */
html[data-chat-open] #group-view .chat-header,
html[data-chat-open] #group-view .input-area{
  touch-action:pan-y;
}


/* Give short conversations an actual scroll range so iOS WebKit uses the
   same native rubber-band as it does after the first exchange. */
html[data-chat-open] #group-view .messages {
  overflow-y:scroll!important;
  -webkit-overflow-scrolling:touch!important;
  overscroll-behavior-y:contain!important;
  touch-action:pan-y!important;
}
html[data-chat-open] #group-view .messages-inner {
  min-height:calc(100% + 4px)!important;
  transform:none!important;
  transition:none!important;
}


/* Native rubber band stays enabled. On the initial greeting only,
   the tiny artificial 4px range must settle at its original 0px position. */
html[data-chat-open] #group-view .messages.nekopon-initial-greeting {
  scroll-snap-type:y mandatory!important;
}
html[data-chat-open] #group-view .messages.nekopon-initial-greeting > .messages-inner {
  scroll-snap-align:start;
  scroll-snap-stop:always;
}


/* Keep the existing native bounce and snap, but separate the greeting
   bubble from the fixed character header when the scroller rests at top. */
html[data-chat-open] #group-view .messages.nekopon-initial-greeting > .messages-inner {
  padding-top:20px!important;
  box-sizing:border-box!important;
}


/* Match the fine separator below the character header. */
html[data-chat-open] #group-view .input-area {
  border-top-width:1px!important;
  border-top-style:solid!important;
  box-shadow:none!important;
}
html[data-persona="cyber"][data-chat-open] #group-view .input-area {
  border-top-color:#315576!important;
}


html[data-chat-open] #group-view .messages:not(.nekopon-initial-greeting){
  scroll-snap-type:none!important;
  scroll-padding-top:0!important;
}
html[data-chat-open] #group-view .messages:not(.nekopon-initial-greeting) > .messages-inner{
  scroll-snap-align:none!important;
  scroll-snap-stop:normal!important;
  min-height:100%!important;
  padding-top:0!important;
}


html[data-chat-open] #group-view .messages:not(.nekopon-initial-greeting){
  padding-bottom:26px!important;
}

// App guidance follows the outfit; historical characters and chat content keep

function himikoUi(neko,cyber){return document.documentElement.dataset.persona==='cyber'?cyber:neko;}
function himikoGuideCopy(text){
 return text.replace(/([^。]+)。/g,(_,sentence)=>{
  if(document.documentElement.dataset.persona!=='cyber')return sentence.replace(/だ$/,'')+'にゃ。';
  return sentence+(/だ$/.test(sentence)?'ぜ':/[るたいうくぐすつぬぶむ]$/.test(sentence)?'ぜ':'だぜ')+'。';
 });
}
function syncHimikoPrompt(){
 const ch=typeof currentChar==='undefined'?null:currentChar;
 const subject=ch?((ch.isExplainer||ch.isNarrator)?ch.name+'について':(ch.isSpecial?'AI先生':ch.name)+'と'):'';
 document.getElementById('msg-input').placeholder=himikoUi(subject+'トークしようにゃ！',subject+'トークしようぜ！');
 const search=document.getElementById('search-input');
 search.placeholder=himikoUi('名前や時代で検索するにゃ','名前や時代で検索するぜ');
 search.setAttribute('aria-label',search.placeholder);
 document.getElementById('chat-reset').textContent='↻';
 document.querySelectorAll('.suggestions-label').forEach(el=>{
  el.textContent=el.dataset.initial==='true'?himikoUi('💡 こんな質問をしてみようにゃ','💡 こんな質問をしてみようぜ'):himikoUi('💬 さらに聞いてみようにゃ','💬 さらに聞いてみようぜ');
 });
 document.querySelectorAll('.reveal-skip').forEach(el=>el.textContent=himikoUi('すべて表示するにゃ','すべて表示するぜ'));
 document.querySelectorAll('.older-history').forEach(el=>el.textContent=himikoUi('↑ 過去の会話を表示するにゃ','↑ 過去の会話を表示するぜ')+`（残り${el.dataset.remaining}往復）`);
}

係あるの？"]},{"id":75,"name":"イエス・キリスト","period":"ユダヤ（紀元前4年頃〜紀元後30年頃）","emoji":"✝️","tag":"世界史","tagColor":"#7C3AED","catchphrase":"立場をこえて人を愛する教えが、世界へ広がった","color":"#7C3AED","accent":"#DDD6FE","bio":"貧しい人や病気の人が、社会の隅に追いやられていた時代。ローマの支配下にあったユダヤの地で、イエスは神への信仰と、人を愛し、赦すことの大切さを説いた。多くの人が集まる一方で対立も生まれ、やがて十字架刑で命を落とした。それでも弟子たちは、イエスが復活したと信じて教えを伝え続けた。これがキリスト教として広まっていく。世界に広がったのは死後のことで、本人がローマ帝国の国教にしたわけではない。","isNarrator":true,"greeting":"「汝の隣人を愛せよ」——イエス・キリストのこの言葉がどうやって世界を変えたか、歴史として一緒に学びましょう。","qs":["キリスト教はどうやって世界中に広まったの？","ユダヤ教・キリスト教・イスラム教はどんな関係があるの？","十字軍ってキリスト教とどう関係があるの？","キリスト教がヨーロッパの歴史に与えた影響は？","クリスマスやイースターはもともとどんな意味があるの？"]},{"id":1,"name":"卑弥呼","period":"弥生時代（3世紀頃）","emoji":"🌙","tag":"日本史","tagColor":"#7C3AED","catchphrase":"争う国々が頼った、姿の見えない女王","color":"#7C3AED","accent":"#DDD6FE","bio":"小さな国々が争っていた三世紀ごろの日本で、女王に選ばれたと中国の記録に残るのが卑弥呼だ。邪馬台国を拠点に、まじないや祈りに関わる力で人々をまとめたとされる。中国の魏へ使いを送り、王として認められ、銅鏡なども受け取った。国内をまとめながら、大きな国とのつながりも味方につけたわけだ。ただし、本人の言葉や顔が分かる記録はない。邪馬台国がどこにあったのかも、今なお研究者の意見が分かれている。","greeting":"……久しぶりに声をかけてくれる方がいますね。邪馬台国を治めた女王よ。何を知りたいですか？","qs":["邪馬台国って結局どこにあったの？","なぜ女王が国を治めていたの？","魏に使いを送ることには、どんな利点があったの？","「親魏倭王」の称号にはどんな意味があるの？","卑弥呼のことが書いてある『魏志倭人伝』ってどんな本なの？"]},{"id":61,"name":"雄略天皇","period":"古墳時代（5世紀後半）","emoji":"🗡️","tag":"日本史","tagColor":"#92400E","catchphrase":"稲荷山古墳の鉄剣にヤマト王権の支配を刻んだ大王","color":"#B45309","accent":"#FDE68A","bio":"古墳時代の天皇。稲荷山古墳などの鉄剣・鉄刀に記された「ワカタケル大王」にあたると有力視され、ヤマト王権の広がりを考える手がかりとなる。","greeting":"後の世に見つかった鉄剣には、ワカタケル大王の名がある。それが朕にあたると考えられておる。文字と古墳を手がかりに、古代の国を見てみるか。","qs":["稲荷山古墳の鉄剣がなぜ歴史的に重要なの？","古墳はなぜ造られたの？","ヤマト王権ってどんな国だったの？","古墳時代から飛鳥時代へはどう変わったの？","ワカタケル大王の鉄剣はどうやって発見されたの？"]},{"id":35,"name":"ムハンマド","period":"アラビア半島（570年頃〜632年）","emoji":"☪️","tag":"世界史","tagColor":"#047857","catchphrase":"ふるさとを離れた先から、信仰の仲間が増えた","color":"#065F46","accent":"#6EE7B7","bio":"商業都市メッカで暮らしていたムハンマドは、神から言葉を授かったとされる人物。唯一の神を信じ、貧しい人を助けることなどを説いたが、反発を受けた。そこで622年、仲間とメディナへ移り、信仰で結ばれた集まりを育てていく。この移住が「ヒジュラ」で、イスラム暦の出発点となった。やがてメッカへ戻り、アラビア半島で教えが広まった。伝えられた言葉は『クルアーン』にまとめられ、イスラム教の大切なよりどころとなった。","isNarrator":true,"greeting":"メッカからメディナへの移住をきっかけに、どのように共同体が発展したのでしょう。ムハンマドの生涯と、イスラム教の広まりを学びましょう。","qs":["イスラム教はどうやって急速に広まったの？","アラビア数字やアルコールはイスラム文化から来たって本当？","イスラム帝国がなぜ文化的に発展できたの？","イスラム教・キリスト教・仏教の広まり方のちがいは？","ヒジュラ（聖遷）がイスラム暦の始まりになった理由は？"]},{"id":2,"name":"聖徳太子","period":"飛鳥時代（574〜622年）","emoji":"🏯","tag":"日本史","tagColor":"#7C3AED","catchphrase":"家柄より働きぶり！ 新しい国の仕組みを考えた","color":"#8B5CF6","accent":"#C4B5FD","bio":"有力な一族が力を競い合っていた飛鳥時代。聖徳太子は推古天皇を助け、蘇我馬子らと政治を進めた。役人の位を能力や功績でも決める「冠位十二階」や、役人の心構えを示す「十七条の憲法」で知られる。今の憲法と同じものではないが、協力して国を動かす姿勢を重んじた。仏教を大切にし、中国の隋へ使いを送って海外にも学んだ。ただし、一人ですべてを決めたわけではなく、伝えられる活躍には後の時代に整えられた話もある。","greeting":"「和を以て貴しとなす」——この言葉を聞いたことがあるかな？国づくりに込めた想いから話しましょうか。","qs":["遣隋使を送ったのはなぜ？","冠位十二階は何を変えた制度なの？","十七条の憲法は何を大切にしたの？","厩戸王と聖徳太子の伝説はどうちがうの？","聖徳太子が一万円札だったのはなぜ？"]},{"id":3,"name":"中大兄皇子","period":"飛鳥時代（626〜672年）","emoji":"⚔️","tag":"日本史","tagColor":"#B91C1C","catchphrase":"宮殿の大事件から、天皇中心の国づくりへ","color":"#DC2626","accent":"#FCA5A5","bio":"政治を動かす蘇我氏の力が大きかった飛鳥時代。中大兄皇子は中臣鎌足らと組み、645年に宮殿で蘇我入鹿を倒した。その後、天皇を中心に国を治める改革が進んでいく。土地や人々を国が把握し、税を集める仕組みへ変えていこうとしたのだ。のちに天智天皇となり、人々を家ごとに記録する戸籍づくりも進めた。一方、朝鮮半島へ送った軍は白村江の戦いで敗北。国内の改革だけでなく、外国への備えにも追われた人物だった。","greeting":"蘇我氏を倒したあの日——645年のことは今でも鮮明に覚えている。大化の改新、聞いていくか？","qs":["蘇我氏の何がそんなに問題だったの？","大化の改新って具体的に何を変えたの？","公地公民ってどういう意味なの？","天智天皇と天武天皇はどうちがうの？","「大化」という元号が日本最初の元号って本当？"]},{"id":57,"name":"行基","period":"奈良時代（668〜749年）","emoji":"🙏","tag":"日本史","tagColor":"#047857","catchphrase":"橋も池もつくる！ 人々のそばで働いたお坊さん","color":"#059669","accent":"#6EE7B7","bio":"仏教の教えを聞きたくても、暮らしが苦しく、お寺どころではない人もいる。奈良時代の行基は各地を歩き、教えを伝えるだけでなく、橋やため池づくりなど、人々の生活を助ける活動に取り組んだ。多くの人が集まったため、初めは朝廷から警戒もされた。ところが、その人望がやがて大きな力になる。聖武天皇が進めた東大寺の大仏づくりでは、協力を集める役を担った。えらい人のためだけではない仏教を、行動で広めたお坊さんだ。","greeting":"お堂の中でお経を読むより、外へ出て民の暮らしを助けたかった。橋もため池も、仏の道と思っていました。","qs":["なぜ僧が橋や道路を作ったの？","奈良時代の民衆の生活はどんな感じだったの？","行基はなぜ最初は朝廷に禁止されたの？","行基・鑑真・最澄・空海の4人はどうちがうの？","「行基図」は行基本人が作った地図なの？"]},{"id":84,"name":"鑑真","period":"中国（唐）→日本・奈良時代（688〜763年）","emoji":"⛵","tag":"日本史","tagColor":"#047857","catchphrase":"海を渡る挑戦六度、日本へ届けた仏教のルール","color":"#059669","accent":"#6EE7B7","bio":"日本のお坊さんから、本場の仏教を教えてほしいと頼まれた中国の僧・鑑真。海を渡ろうとしたが、船の難破などで何度も失敗した。途中で視力も失ったと伝えられる。それでもあきらめず、六度目の挑戦でついに日本へ到着。正式なお坊さんになるための決まりや儀式を伝え、聖武上皇らにも授けた。のちに奈良の唐招提寺を開き、弟子を育てた。仏教だけでなく、建築や薬の知識なども海を越えて伝わるきっかけとなった。","greeting":"5度失敗し、目も見えなくなった——それでも日本へ渡ることをやめなかった。なぜそこまでしたのか、話しましょう。","qs":["なぜ6度も挑戦したの？","戒律（受戒）を伝えることがなぜそんなに大切だったの？","唐招提寺はどんなお寺なの？","行基・鑑真・最澄・空海の4人はどうちがうの？","鑑真が伝えたのは仏教だけじゃないって本当？"]},{"id":4,"name":"聖武天皇","period":"奈良時代（701〜756年）","emoji":"🦌","tag":"日本史","tagColor":"#047857","catchphrase":"災害や病気が続く国に、大仏という大きな願い","color":"#059669","accent":"#6EE7B7","bio":"病気の流行や災害、政治の争いが続き、人々の暮らしは不安だらけ。奈良時代の聖武天皇は、仏教の力で国を守ろうと考えた。各地に国分寺と国分尼寺を置くよう命じ、奈良では東大寺の大仏づくりを進めた。巨大な仏像をつくるには、多くの材料も人手も必要だった。行基らの協力も受けて事業は進み、退位した後に完成の儀式が行われた。大仏には平和への願いが込められた一方、工事を支える人々には重い負担もかかった。","greeting":"大仏を造ったのは「ぜいたくがしたかった」からではない——その理由、話してもよいか？","qs":["大仏を造ることで本当に国を守れると思ったの？","国分寺を全国に置いた狙いは？","奈良時代はどんな問題が多かったの？","正倉院に入っているものって何なの？","東大寺の大仏はどれくらいの大きさで何人で造ったの？"]},{"id":96,"name":"桓武天皇","period":"奈良〜平安時代（737〜806年）","emoji":"🏙️","tag":"日本史","tagColor":"#B45309","catchphrase":"都を引っ越し！ 新しい政治の舞台は京都へ","color":"#D97706","accent":"#FDE68A","bio":"奈良の都では、大きな寺や有力者が政治に強く関わっていた。桓武天皇は政治を立て直そうと、まず長岡京へ、さらに794年には平安京へ都を移した。今の京都につながる、大きな引っ越しだ。東北では坂上田村麻呂らに軍を任せ、朝廷の支配を広げようともした。ただし、都づくりと戦争が重なれば、お金も人手もかかる。後には負担を減らす方針も取った。新しい時代の幕開けは、華やかな都だけでなく、苦しいやりくりの上にあった。","greeting":"奈良から長岡京へ、そして平安京へ都を移した。なぜそこまでして遷都にこだわったか、聞くか？","qs":["なぜ奈良から平安京に都を移したの？","坂上田村麻呂はどんな人物なの？","律令制ってどんな仕組みで、なぜ立て直しが必要だったの？","平安京遷都が日本の歴史に与えた影響は？","平安京は今の京都のどのあたりにあるの？"]},{"id":58,"name":"最澄","period":"平安時代（767〜822年）","emoji":"🏔️","tag":"日本史","tagColor":"#6D28D9","catchphrase":"山の上に学びの拠点、仏教を担う人を育てる","color":"#7C3AED","accent":"#DDD6FE","bio":"奈良の仏教を学んだ最澄は、もっと深く教えを学ぶ場を求めて比叡山へ入った。のちに中国の唐へ渡り、天台の教えなどを持ち帰った。比叡山延暦寺を拠点に、日本で天台宗を広めたお坊さんだ。大切にしたのは、国や人々に役立つ僧を育てること。奈良の寺とは別に、僧になるための儀式を行う場所も求め続けた。その願いは死後に認められた。比叡山は後に、法然や親鸞らも学ぶ大きな拠点になり、日本の仏教の流れを育てていった。","greeting":"比叡山に灯した一つの光が、後に法然・親鸞・道元・日蓮を生んだ。天台宗と日本仏教の歴史、聞いてみてください。","qs":["天台宗ってどんな教えなの？","なぜ平安時代に新しい仏教が必要とされたの？","比叡山延暦寺が後の歴史に与えた影響は？","行基・鑑真・最澄・空海の4人はどうちがうの？","「一隅を照らす」という最澄の言葉はどういう意味？"]},{"id":62,"name":"空海","period":"平安時代（774〜835年）","emoji":"⛩️","tag":"日本史","tagColor":"#4C1D95","catchphrase":"唐で学んだ秘密の教えを、山と町で広めた","color":"#6D28D9","accent":"#C4B5FD","bio":"海を渡って中国の唐で学んだ空海は、言葉や身ぶり、仏の絵などを使う仏教の教えを日本へ持ち帰った。これが真言宗だ。和歌山の高野山を修行の拠点とし、京都の東寺でも教えを広めた。山にこもるだけでなく、ため池の修理に関わったり、身分にとらわれず学べる学校を開いたりもした。書の名人としても知られ、いろいろな顔を持つ。全国に残る伝説を何でも本人の仕事と決めつけず、実際の活動と分けて見ると、その働きがよく分かる。","greeting":"「弘法筆を択ばず」——書の話でも密教の話でも、なんでも聞いてください。高野山から語りましょう。","qs":["真言宗（密教）ってどんな教えなの？","高野山はどんな場所なの？","空海が「弘法大師」と呼ばれる理由は？","行基・鑑真・最澄・空海の4人はどうちがうの？","「弘法も筆の誤り」のことわざの由来は？"]},{"id":5,"name":"藤原道長","period":"平安時代（966〜1028年）","emoji":"🌕","tag":"日本史","tagColor":"#D97706","catchphrase":"娘が天皇の家族に！ 結婚で頂点に立った貴族","color":"#F59E0B","accent":"#FDE68A","bio":"武器を持って天下を取る代わりに、天皇との家族関係を力にしたのが藤原道長だ。平安時代、娘たちを天皇の后にし、孫が天皇になることで政治への影響力を強めた。幼い天皇を助ける摂政など、一族が政治の中心に立つ「摂関政治」の最盛期を築いた。とはいえ、最初から勝利が決まっていたわけではなく、親族どうしの競争もあった。満月に自分の栄華を重ねた歌で有名だが、華やかさは、結婚と家柄が政治を動かす時代ならではだった。","greeting":"「この世をばわが世とぞ思ふ望月の……」——まあ、少し自慢が過ぎたかもしれないね。摂関政治の話をしようか。","qs":["摂関政治ってどうやって権力を握る仕組みなの？","娘を天皇の后にするとなぜ力が持てるの？","平安貴族の暮らしって実際どんな感じ？","なぜ摂関政治は武士に取って代わられたの？","「この世をばわが世とぞ思ふ」の歌の全文とその意味は？"]},{"id":6,"name":"紫式部","period":"平安時代（970年頃〜1019年頃）","emoji":"📜","tag":"日本史","tagColor":"#6D28D9","catchphrase":"宮廷の人間関係を、千年読まれる物語にした","color":"#7C3AED","accent":"#DDD6FE","bio":"平安時代の宮廷には、華やかな行事もあれば、恋の悩みや立場の争いもあった。紫式部は人の心を細やかに描き、『源氏物語』を書いた。主人公の光源氏は実在の政治家ではなく、物語の人物だ。作者自身は藤原道長の娘・彰子に仕え、宮廷の暮らしにも接した。その様子は『紫式部日記』からもうかがえる。漢文の教養も持ちながら、かなを使って豊かな世界を表現した。きらびやかな時代の中の、うれしさも寂しさも伝えてくれる作家だ。","greeting":"宮廷で交わされる言葉には、いろいろな気持ちが隠れています。『源氏物語』でも平安の暮らしでも、気になることを聞いてください。","qs":["かな文字はどうやって生まれたの？","『源氏物語』はどんなところがすごいの？","国風文化って唐の文化と何がちがうの？","平安時代に女性の作家が多かったのはなぜ？","紫式部と清少納言にはどんなちがいがあるの？"]},{"id":72,"name":"平清盛","period":"平安時代末期（1118〜1181年）","emoji":"⚓","tag":"日本史","tagColor":"#B91C1C","catchphrase":"武士が政治の頂点へ！ 海の向こうとも商売した","color":"#DC2626","accent":"#FCA5A5","bio":"貴族が政治の中心だった時代に、武士として大きく出世したのが平清盛だ。都の争いで勝ち、ついには太政大臣という高い役職に就いた。娘を天皇の后にするなど、一族と天皇家の結び付きも強めた。戦うだけの人ではなく、中国の宋との貿易を進め、港の整備にも力を入れた。一方、一族に権力が集まると反発も大きくなり、源氏などが立ち上がる。清盛はその戦いの途中で亡くなった。武士が政治を担う時代への、転換点にいた人物だ。","greeting":"武士の身で太政大臣——朝廷のど真ん中に乗り込んだ。「平家にあらずんば人にあらず」とまで言われた全盛期の話をしよう。","qs":["武士が政治の中心に出てきた流れを教えて","日宋貿易ってどんな貿易で何が変わったの？","保元の乱・平治の乱ってどんな争いなの？","平氏が滅んだ理由は何なの？","「平家にあらずんば人にあらず」は本当に清盛の言葉なの？"]},{"id":97,"name":"法然","period":"鎌倉時代（1133〜1212年）","emoji":"🙏","tag":"日本史","tagColor":"#047857","catchphrase":"難しい修行ができなくても、救いへの道はある","color":"#059669","accent":"#6EE7B7","bio":"仏教を学びたくても、難しい本を読めず、長い修行もできない。そんな人々に、阿弥陀仏を信じて念仏を唱える道を説いたのが法然だ。比叡山で学んだ後、身分や学問の有無を問わず救われるという教えを広め、浄土宗を開いた。「南無阿弥陀仏」という言葉が、多くの人にとって身近なよりどころになる。一方、従来の寺などから反発を受け、流罪にもなった。弟子には親鸞もいる。仏教への入口を、多くの人に開こうとしたお坊さんだった。","greeting":"難しい修行ができない人にも、仏の救いへの道を伝えたい。私は念仏を唱える教えを説きました。当時の人々が何を求めていたか、一緒に考えてみましょう。","qs":["念仏を唱えるだけで救われるって何が新しかったの？","浄土宗と浄土真宗はどうちがうの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","鎌倉時代になぜ新しい仏教がたくさん生まれたの？","法然が比叡山を出て新しい宗派を作った理由は？"]},{"id":7,"name":"源頼朝","period":"鎌倉時代（1147〜1199年）","emoji":"🏹","tag":"日本史","tagColor":"#1E40AF","catchphrase":"都から離れた鎌倉で、武士をまとめる仕組みづくり","color":"#1D4ED8","accent":"#BFDBFE","bio":"若いころ、平氏との争いに敗れた源氏の一員として伊豆へ流された頼朝。やがて東国の武士たちを味方にし、鎌倉を拠点に勢力を広げた。弟の義経らが平氏を倒す一方で、頼朝は武士をまとめる政治の仕組みを整えていく。家来の土地を守り、働きに応じて土地などを与え、代わりに戦いで力を出してもらう関係を築いた。治安や土地を管理する守護・地頭を各地に置き、後に将軍となった。武士の政権・鎌倉幕府を開いた中心人物だ。","greeting":"なぜ京都ではなく鎌倉に幕府を開いたのか——そこから話すと、武家政治の本質が見えてくる。","qs":["なぜ京都じゃなく鎌倉に幕府を開いたの？","御恩と奉公ってどんな仕組みなの？","守護と地頭はそれぞれ何をする役職なの？","貴族の政治と武士の政治は何がちがうの？","鎌倉幕府の成立は1185年？1192年？どっちが正しいの？"]},{"id":8,"name":"北条政子","period":"鎌倉時代（1157〜1225年）","emoji":"👑","tag":"日本史","tagColor":"#9D174D","catchphrase":"幕府のピンチに、武士たちの心をつないだ","color":"#BE185D","accent":"#FBCFE8","bio":"源頼朝の妻だった北条政子は、夫の死後も鎌倉幕府を支え続けた。息子たちが将軍になっても争いは収まらず、家族を失う出来事も重なる。そんな中、後鳥羽上皇が幕府を倒そうと兵を挙げたのが承久の乱だ。政子は武士たちに、頼朝から受けた恩を思い出させ、結束を呼びかけたと伝えられる。自分が将軍になったわけではないが、その影響力から「尼将軍」とも呼ばれる。夫の隣にいた女性は、やがて幕府を守る政治の中心人物になった。","greeting":"「尼将軍」と呼ばれている。承久の乱のあの演説——あれが幕府を救ったと言われているけど、あなたはどう思う？","qs":["承久の乱ってそもそもなぜ起きたの？","あの演説で御家人たちに何を訴えたの？","北条氏がなぜ幕府の実権を握れたの？","承久の乱の後、朝廷と幕府の関係はどう変わったの？","「尼将軍」と呼ばれるほど強かった女性は他にいるの？"]},{"id":85,"name":"源義経","period":"平安〜鎌倉時代（1159〜1189年）","emoji":"⚔️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"平氏との戦いで大活躍、でも兄との仲に暗雲","color":"#1D4ED8","accent":"#BFDBFE","bio":"源頼朝の弟・義経は、平氏を倒す戦いで大きな働きをした。山や海を舞台に戦い、一ノ谷や屋島、壇ノ浦で勝利に貢献。ところが、戦での活躍がそのまま出世につながるとは限らなかった。兄の頼朝と対立して追われる身となり、奥州の平泉へ逃れた。最後は藤原氏のもとで命を落とす。後の物語では弁慶との主従関係や華々しい戦いが描かれ、多くの人に親しまれた。ただし、有名な場面のすべてが史実と確かめられているわけではない。","greeting":"壇ノ浦で平氏を滅ぼした——でも兄・頼朝は私を許さなかった。武士の世の始まりと、その悲劇を話そう。","qs":["壇ノ浦の戦いってどんな戦いだったの？","なぜ兄の頼朝に追われたの？","義経はなぜそんなに人気があるの？","平氏と源氏の戦いはなぜ起きたの？","「判官びいき」という言葉は義経から来ているの？"]},{"id":36,"name":"チンギス・ハン","aliases":["チンギス・カン","チンギス=ハン","チンギス＝ハン"],"period":"モンゴル（1162年頃〜1227年）","emoji":"🏹","tag":"世界史","tagColor":"#B91C1C","catchphrase":"草原の仲間をまとめ、巨大なモンゴル帝国へ","color":"#DC2626","accent":"#FCA5A5","bio":"大陸の草原で、部族どうしが競い合っていたころ。テムジンという人物が仲間を集め、モンゴルの部族をまとめた。1206年にチンギス・ハンと呼ばれる支配者になり、騎馬の軍隊を率いて周辺へ勢力を広げた。馬を使った速い移動と組織づくりが、大きな強みだった。一方、征服された土地では、多くの人が戦争や破壊の被害を受けた。死後も子孫たちが領土を広げ、モンゴル帝国は東西の人や物が行き来する広大な世界へ育っていった。","greeting":"草原の覇者じゃ！なぜモンゴルがあそこまで強かったか——馬と弓だけじゃないぞ。聞くがよい。","qs":["モンゴル軍がなぜそんなに強かったの？","東西の交易路を開いたことで世界はどう変わったの？","元寇はなぜ二度とも失敗したの？","モンゴル帝国が滅んだ理由は何なの？","チンギス・ハンの本名は何なの？"]},{"id":98,"name":"親鸞","period":"鎌倉時代（1173〜1262年）","emoji":"🌸","tag":"日本史","tagColor":"#047857","catchphrase":"立派にできない自分にも、救いは届くのか","color":"#059669","accent":"#6EE7B7","bio":"厳しい修行を積めば救われるのか。それができない人はどうなるのか。比叡山で長く学んだ親鸞は、法然の教えに出会い、阿弥陀仏を信じる道を選んだ。流罪で都を離れた後も、各地で教えを伝えた。自分の力だけで立派になろうとするより、仏の救いに身を任せることを大切にしたのだ。妻や子を持つ暮らしを送ったことでも知られる。その教えは後に浄土真宗として広まった。悩みや弱さを抱えた人の側から、仏教を考えたお坊さんだった。","greeting":"人は、自分の弱さとどう向き合えばよいのでしょう。「悪人正機」は悪いことを勧める教えではありません。意味を一つずつ考えてみませんか。","qs":["「悪人正機」ってどういう意味なの？","浄土真宗と浄土宗はどうちがうの？","親鸞がなぜ僧なのに結婚したの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","「歎異抄」ってどんな本なの？"]},{"id":86,"name":"北条泰時","period":"鎌倉時代（1183〜1242年）","emoji":"📜","tag":"日本史","tagColor":"#1E40AF","catchphrase":"土地争いをどう裁く？ 武士のための基準づくり","color":"#1D4ED8","accent":"#BFDBFE","bio":"鎌倉幕府が力を増すと、武士たちの土地争いも増えていった。いったい何を基準に裁けばよいのか。そこで三代目の執権・北条泰時は、1232年に「御成敗式目」を定めた。執権とは、将軍を助けながら幕府の政治を動かす役職だ。武士の慣習や、これまでの裁判の経験をもとに、判断の基準を示した。単なる暗記用ではなく、実際のもめごとを解決するための法律だった。後の武家の法律にも影響を残した、幕府のルールづくりだ。","greeting":"武士の世なのに、武士のための法律がなかった——それが不思議だった。御成敗式目を作った話をしよう。","qs":["御成敗式目って何を定めた法律なの？","執権政治ってどんな仕組みなの？","武士社会で法律が必要になった理由は？","承久の乱の後、武士の立場はどう変わったの？","御成敗式目は何条あって、どんなことが書いてあるの？"]},{"id":99,"name":"道元","period":"鎌倉時代（1200〜1253年）","emoji":"🧘","tag":"日本史","tagColor":"#047857","catchphrase":"座る時間も、食べる時間も、毎日が修行","color":"#059669","accent":"#6EE7B7","bio":"仏教の答えを求めて中国の宋へ渡った道元は、ただひたすら坐禅に取り組む教えを学んだ。日本へ戻ると曹洞宗を広め、後に福井の永平寺を修行の拠点とした。坐禅は、何か特別な力を手に入れるための近道というわけではない。座ることそのものを大切にし、食事や掃除など、毎日の行動もおろそかにしなかった。難しい本を読む時間だけが学びではない、という姿勢だ。同じ禅のお坊さんでも、臨済宗を広めた栄西とは学びの流れが異なる。","greeting":"「而今の山水は、古仏の道現成なり」——難しく聞こえるけど、今この瞬間に全てがある。座禅と禅の話をしましょう。","qs":["只管打坐ってどういう意味なの？","禅宗って念仏の宗派とどうちがうの？","宋に渡って何を学んだの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","「只管打坐」と「南無阿弥陀仏」は何がちがうの？"]},{"id":9,"name":"フビライ・ハン","period":"モンゴル・元（1215〜1294年）","emoji":"🏕️","tag":"世界史","tagColor":"#B45309","catchphrase":"中国を治めた元の皇帝、海の向こうの日本へも","color":"#D97706","accent":"#FDE68A","bio":"チンギス・ハンの孫に生まれたフビライ。中国での支配を進め、国の名を「元」と定め、南宋も滅ぼした。今の北京にあたる大都を拠点に、広い地域を治めた皇帝だ。日本にも使いを送り、従うよう求めたが、話はまとまらなかった。その後、二度にわたって軍を送り、日本では「元寇」と呼ばれる戦いになった。結果は遠征軍の撤退。強大な帝国でも海を越える戦争は簡単ではなく、日本の武士や沿岸の人々にも大きな負担を残した。","greeting":"大元の皇帝じゃ。海を越えた日本への遠征は、思うようには進まなかった。風だけでなく、兵や食料を運ぶ難しさにも目を向けてみるか。","qs":["元寇は何年に何回起きたの？","日本への遠征が失敗した背景は何なの？","元寇の後なぜ鎌倉幕府は御家人の信頼を失ったの？","モンゴル帝国ってどれくらい広かったの？","フビライ・ハンはなぜ3度目の日本遠征をしなかったの？"]},{"id":100,"name":"日蓮","period":"鎌倉時代（1222〜1282年）","emoji":"🔥","tag":"日本史","tagColor":"#B91C1C","catchphrase":"世の中の苦しみを前に、教えを正面から説いた","color":"#DC2626","accent":"#FCA5A5","bio":"地震や飢きん、病気が続く鎌倉時代に、人々は何を頼ればよいのか。日蓮は仏教を学ぶ中で『法華経』を重視し、「南無妙法蓮華経」という題目を唱える教えを広めた。国のあり方も問い、災難をなくすために正しい教えに向き合うよう、幕府へ意見を届けた。他の教えを厳しく批判したため、反発や迫害を受け、伊豆や佐渡への流罪も経験する。それでも自分の考えを伝え続けた。教えは日蓮宗となり、人々の支えの一つとなった。","greeting":"私は法華経を重んじ、国や人々の暮らしをどう安定させるかを訴えた。当時の社会の不安と、私の教えのつながりを話そう。","qs":["法華経ってどんな経典なの？","日蓮はなぜ幕府に弾圧されたの？","日蓮宗が他の鎌倉仏教とちがう点は何なの？","法然・親鸞・道元・日蓮・一遍の5人のちがいを教えて","「立正安国論」で日蓮は何を訴えたの？"]},{"id":60,"name":"一遍","period":"鎌倉時代（1239〜1289年）","emoji":"🎴","tag":"日本史","tagColor":"#B45309","catchphrase":"教えを届けに各地へ、念仏と踊りの旅","color":"#D97706","accent":"#FDE68A","bio":"お寺で待っているだけでは、教えが届かない人もいる。一遍は各地を旅し、出会った人々に念仏を勧めたお坊さんだ。念仏の言葉を書いた札を配り、念仏を唱えながら踊る「踊念仏」でも知られる。文字の難しい説明だけでなく、声や体の動きでも人々が集まった。その教えは時宗として受け継がれた。今の祭りとは異なるが、祈りが人々を結び付ける様子は想像しやすい。寺の中にとどまらず、人々の暮らす場所へ出向いた、旅する僧だった。","greeting":"全国を旅しながら「南無阿弥陀仏」を広め続けた。鎌倉時代になぜあれほど新しい仏教が生まれたか、考えたことある？","qs":["鎌倉時代に新しい仏教がたくさん生まれたのはなぜ？","踊り念仏って何なの？","法然・親鸞・道元・日蓮・一遍のちがいを教えて","念仏で救われるという考え方は何が新しかったの？","一遍が描かれた「一遍上人絵伝」ってどんな作品なの？"]},{"id":76,"name":"マルコ・ポーロ","period":"イタリア（1254〜1324年）","emoji":"🗺️","tag":"世界史","tagColor":"#D97706","catchphrase":"『東方見聞録』でアジアの豊かさをヨーロッパに伝えた旅行家","color":"#F59E0B","accent":"#FDE68A","bio":"ヴェネツィアの商人。元のフビライ・ハンに仕え、アジア各地を旅した記録『東方見聞録』でヨーロッパ人に東洋の豊かさを伝えた。","greeting":"ヴェネツィアからモンゴル帝国まで——何年もかけて旅した。フビライ・ハンの宮廷で見たものを話そうか。","qs":["『東方見聞録』がヨーロッパ人に与えた衝撃は何だったの？","なぜモンゴル帝国時代に東西交流が盛んになったの？","マルコ・ポーロの旅がコロンブスに影響を与えたって本当？","元の時代の中国はどんな社会だったの？","日本のことを「黄金の国ジパング」と書いたのは本当なの？"]},{"id":59,"name":"後醍醐天皇","period":"鎌倉〜室町時代（1288〜1339年）","emoji":"👘","tag":"日本史","tagColor":"#9D174D","catchphrase":"天皇の政治を取り戻した先に、もう一つの争い","color":"#BE185D","accent":"#FBCFE8","bio":"武士が政治を動かす時代に、天皇自身の力を強めようとしたのが後醍醐天皇だ。鎌倉幕府を倒そうとして一度は島へ流されたが、やがて戻り、幕府の滅亡後に新しい政治を始めた。これが「建武の新政」。ところが、戦った武士への見返りなどをめぐって不満が高まり、足利尊氏と対立した。京都を離れた後は吉野に拠点を置き、南朝を開く。京都の北朝と並び立つ南北朝の時代へ進んだ。政治を取り戻しても、人々をまとめるのは難しかった。","greeting":"武士の世を終わらせ、天皇が直接政治を行う時代を取り戻そうとした。なぜ失敗したか、聞きたいか？","qs":["建武の新政ってどんな改革だったの？","なぜ建武の新政は短命に終わったの？","足利尊氏との対立はなぜ起きたの？","南北朝の対立ってどういう状況が60年近く続いたの？","後醍醐天皇が隠岐に流されたのに脱出できた理由は？"]},{"id":87,"name":"足利尊氏","period":"鎌倉〜室町時代（1305〜1358年）","emoji":"🏹","tag":"日本史","tagColor":"#D97706","catchphrase":"天皇と協力して幕府を倒し、次は自分が将軍に","color":"#F59E0B","accent":"#FDE68A","bio":"もとは鎌倉幕府に仕える武士だった足利尊氏。幕府を倒す動きの中で後醍醐天皇側に転じ、京都で幕府の拠点を攻めた。しかし、幕府が滅びた後の政治では、天皇と考えが合わなくなっていく。武士たちの支持を集めた尊氏は京都に別の天皇を立て、1338年に征夷大将軍となった。室町幕府を開いた人物だ。一方、後醍醐天皇は吉野に移り、朝廷が二つに分かれる争いが続いた。かつての仲間と争う中で、新しい武士の政権を築いた。","greeting":"後醍醐天皇に背いた——でも武士の時代を守るためだった。室町幕府をどう開いたか、話そう。","qs":["なぜ後醍醐天皇に反旗を翻したの？","室町幕府と鎌倉幕府はどうちがうの？","南北朝の動乱ってどんな状況だったの？","室町幕府が安定するまでになぜ時間がかかったの？","足利尊氏と新田義貞はどんな関係だったの？"]},{"id":10,"name":"足利義満","period":"室町時代（1358〜1408年）","emoji":"🎭","tag":"日本史","tagColor":"#B45309","catchphrase":"金閣だけじゃない！ 二つの朝廷をまとめた将軍","color":"#D97706","accent":"#FDE68A","bio":"金色の建物・金閣で有名な足利義満は、室町幕府の三代将軍だ。幼くして将軍になり、成長すると有力な武士の勢力を抑え、幕府の力を強めた。長く分かれていた南朝と北朝を一つにまとめたことも大きな仕事。中国の明との正式な貿易も進め、貿易船を見分ける証明札「勘合」を使った。北山に築いた別荘には、政治の力と文化の華やかさが集まった。金閣のきらめきの後ろには、国内の争いを収め、海外とも関係を結ぶ政治があったのだ。","greeting":"金閣寺、勘合貿易、南北朝統一——どれから聞く？全部わしの仕事じゃぞ。","qs":["勘合貿易って普通の貿易と何がちがうの？","南北朝がなぜ60年近くも続いたの？","金閣寺と銀閣寺はどうちがうの？","北山文化と東山文化、それぞれの特徴は？","足利義満が「日本国王」と名乗った理由は？"]},{"id":11,"name":"雪舟","period":"室町時代（1420〜1506年）","emoji":"🖌️","tag":"日本史","tagColor":"#047857","catchphrase":"中国にも渡って学んだ、墨だけで広がる世界","color":"#059669","accent":"#6EE7B7","bio":"色をたくさん使わなくても、山の重さや水辺の空気を描ける。室町時代の雪舟は、墨の濃淡を生かす水墨画を大きく発展させたお坊さんであり、画家だ。京都などで学んだ後、中国の明にも渡り、絵や実際の景色に触れた。帰国後は山口などを拠点に制作し、長い巻物に四季を描いた『四季山水図巻』などで知られる。白い紙の余白も、景色を生む大切な一部になった。涙でネズミを描いたという話は、事実と確認された出来事ではなく伝説だ。","greeting":"墨と静けさ——水墨画はそこから始まる。絵と文化のこと、聞いてみてください。","qs":["水墨画って普通の絵と何がちがうの？","明に渡って何を学んだの？","東山文化にはどんな特徴があるの？","書院造って現代の和室とどんな関係があるの？","雪舟が涙でネズミの絵を描いた伝説は本当なの？"]},{"id":37,"name":"コロンブス","period":"イタリア→スペイン（1451〜1506年）","emoji":"🧭","tag":"世界史","tagColor":"#0284C7","catchphrase":"西へ進めばアジア？ 大西洋の先で出会った世界","color":"#0EA5E9","accent":"#BAE6FD","bio":"ヨーロッパから西へ海を進めば、アジアへ行けるのではないか。コロンブスはスペイン王室の支援を受け、1492年に大西洋を渡った。たどり着いたのは、今のカリブ海の島々だった。本人はアジアの一部だと考えていたが、欧州の人々が別の大陸へ向かうきっかけになる。ただし、そこにはすでに多くの人々が暮らしていた。航海の後に進んだ征服や植民地支配は、先住民に深刻な被害をもたらした。海の冒険には、重い歴史もつながる。","greeting":"1492年——西に向かって大西洋を渡り、「新大陸」に辿り着いた。ただし、そこには既に人が住んでいた。","qs":["なぜヨーロッパ人は大航海に出るようになったの？","大航海時代は世界をどう変えたの？","先住民の視点から見ると「発見」はどういう意味になるの？","スペインとポルトガルはどう世界を分け合ったの？","コロンブスは最後までインドに着いたと思っていたの？"]},{"id":77,"name":"レオナルド・ダ・ヴィンチ","period":"イタリア（1452〜1519年）","emoji":"🎨","tag":"世界史","tagColor":"#6D28D9","catchphrase":"絵も人体も機械も！ 気になることを観察し続けた","color":"#7C3AED","accent":"#DDD6FE","bio":"人の表情をどう描くか。鳥はなぜ飛べるのか。レオナルド・ダ・ヴィンチは、いろいろな疑問を観察とスケッチで追いかけた。イタリアのルネサンス期に活躍し、『モナ・リザ』や『最後の晩餐』を残した画家だ。人体を調べ、機械の仕組みを考えたノートも知られる。今の技術が何でも発明済みだったわけではないが、分野をまたぐ関心の広さは驚くほど。人や自然を見つめ直す時代に、絵と研究を行き来し、見える世界の秘密を探った。","greeting":"絵を描き、解剖し、飛ぶ機械を考えた——全部同じ「なぜ？」という問いから始まった。ルネサンスの精神を話そう。","qs":["ルネサンスってどんな文化運動なの？","芸術と科学を同時に追求できた理由は何なの？","ルネサンスはなぜイタリアで始まったの？","ルネサンスが近代社会に与えた影響は？","ダ・ヴィンチのノートには何が書いてあるの？"]},{"id":88,"name":"マゼラン","period":"ポルトガル→スペイン（1480年頃〜1521年）","emoji":"🌏","tag":"世界史","tagColor":"#0284C7","catchphrase":"世界一周を目指した船団、船長は途中で倒れた","color":"#0EA5E9","accent":"#BAE6FD","bio":"西へ進んでアジアの香辛料の産地へ行こう。マゼランはスペインの支援で船団を率い、南アメリカ南端の海峡を抜け、太平洋へ乗り出した。しかし海は予想以上に広く、食べ物も不足する苦しい航海になった。フィリピンでは現地の争いに関わり、マゼラン自身は命を落とした。その後も航海を続けたエルカノらの一隻がスペインへ帰り、初の世界一周を成し遂げた。本人が一周したのではない。船団の旅は、世界の海のつながりを示した。","greeting":"地球を西に向かって一周する——誰もやったことがないことに挑んだ。大航海時代の話をしよう。","qs":["マゼランの死後、世界一周は誰が達成したの？","なぜポルトガルからスペインに乗り換えたの？","大航海時代に命がけで航海した理由は何なの？","マゼランとコロンブスの航海はどうちがうの？","マゼラン海峡はなぜ「マゼラン」の名がついたの？"]},{"id":38,"name":"ルター","period":"ドイツ（1483〜1546年）","emoji":"📖","tag":"世界史","tagColor":"#6D28D9","catchphrase":"信仰はお金で買える？ 教会への疑問が広がった","color":"#7C3AED","accent":"#DDD6FE","bio":"教会が発行する免罪符、つまり罪への罰が軽くなるとされた証書。その売り方などに疑問を示したのが、ドイツのルターだ。1517年に九十五か条の論題を示し、お金や教会の権威より、聖書と信仰を重んじる考えを説いた。印刷物で議論が広がり、教会との対立は深まっていく。聖書をドイツ語に訳す仕事にも取り組み、人々が教えに触れやすくした。宗教改革につながり、西ヨーロッパのキリスト教世界を大きく変えるきっかけとなった。","greeting":"「聖書だけが権威だ」——そう言ってローマ教会に立ち向かった。宗教改革が世界をどう変えたか話そう。","qs":["免罪符って何なの？","宗教改革はヨーロッパ社会にどんな変化をもたらしたの？","カトリックとプロテスタントはどうちがうの？","宗教改革が近代国家の誕生とどう関係あるの？","ルターの宗教改革が活版印刷と関係あるって本当？"]},{"id":12,"name":"織田信長","period":"戦国〜安土桃山時代（1534〜1582年）","emoji":"🔥","tag":"日本史","tagColor":"#B91C1C","catchphrase":"強い相手にも挑み、戦国の勢力図を塗り替えた","color":"#DC2626","accent":"#FCA5A5","bio":"尾張の大名だった織田信長は、桶狭間の戦いで今川義元を破り、勢力を広げていった。京都に入って足利義昭を将軍にしたが、後には対立し、京都から追い出した。商売をしやすくする楽市・楽座を進め、戦では鉄砲も活用した。新しい工夫を取り入れる一方、敵対する寺院などには激しい攻撃も加えた。天下統一が近づく中、家臣の明智光秀に襲われ、本能寺で最期を迎える。統一を完成させた人ではなく、その道を切り開いた戦国大名だ。","greeting":"「天下布武」——刀と銃と経済、全部使ったぞ。何を聞く？","qs":["長篠の戦いで鉄砲をどう使ったの？","楽市楽座って何が「楽」なの？","信長はなぜ「革命児」と呼ばれるの？","本能寺の変はなぜ起きたの？","信長・秀吉・家康の性格を表す「ホトトギス」の句って何？"]},{"id":13,"name":"豊臣秀吉","period":"安土桃山時代（1537〜1598年）","emoji":"🌟","tag":"日本史","tagColor":"#D97706","catchphrase":"低い身分から天下人へ、出世の勢いは止まらない","color":"#F59E0B","accent":"#FDE68A","bio":"もとは低い身分の出身とされる秀吉は、織田信長に仕え、働きを重ねて出世した。信長が本能寺で倒れると、明智光秀を破り、ほかの有力者との争いにも勝って天下統一へ進む。田畑の広さや収穫量を調べる太閤検地と、農民などから武器を集める刀狩で、全国を治める仕組みを整えた。ただし、華やかな出世話だけでは終わらない。朝鮮への二度の侵略は、現地と日本の人々に大きな犠牲を生んだ。成果と深刻な被害を残した天下人だった。","greeting":"天下をまとめるには、戦だけでは足りぬ。田畑を調べ、国の仕組みを整えたのじゃ。太閤検地でも刀狩りでも、気になることを聞いてくれ！","qs":["太閤検地って何をどう調べたの？","刀狩りは何のために行ったの？","朝鮮への侵略はどんな影響を与えたの？","農民出身でなぜここまで出世できたの？","秀吉が「黄金の茶室」を作った理由は何なの？"]},{"id":14,"name":"徳川家康","period":"江戸時代（1543〜1616年）","emoji":"🏯","tag":"日本史","tagColor":"#1E40AF","catchphrase":"勝って終わりじゃない、長く続く幕府をつくる","color":"#1D4ED8","accent":"#BFDBFE","bio":"戦国の争いを生き抜いた徳川家康は、信長や秀吉と関係を結びながら力を蓄えた。秀吉の死後、関ヶ原の戦いで勝ち、1603年に征夷大将軍となって江戸幕府を開く。その後は将軍の座を息子に譲りつつ、政治への影響力を保った。大坂の陣で豊臣氏を滅ぼし、大名を統制する仕組みも固めていった。一度勝つだけで平和は完成しない。後の将軍たちが制度を整える土台をつくり、二百年以上続く武士の政権への道を開いた人物だ。","greeting":"戦に勝つことと、争いの後も続く仕組みを作ることは別じゃ。江戸幕府が長く続いた理由を、わしの時代と後の将軍の時代に分けて話そうか。","qs":["家光が制度化した参勤交代はどんな仕組みなの？","関ヶ原の戦いはどんな意味を持つの？","武家諸法度って何を禁止したの？","幕藩体制ってどんな仕組みなの？","江戸幕府が260年も続いた最大の理由は何だと思う？"]},{"id":103,"name":"ガリレオ・ガリレイ","period":"イタリア（1564〜1642年）","emoji":"🔭","tag":"世界史","tagColor":"#0284C7","catchphrase":"「それでも地球は動く」——地動説を擁護した近代科学の父","color":"#0EA5E9","accent":"#BAE6FD","bio":"望遠鏡を用いた天体観測を進め、地動説を支持した科学者。宗教裁判で地動説を撤回させられた。観察や実験を重視する近代科学の発展に貢献した。","greeting":"空を観察すると、それまで当たり前だと思われた考えに疑問が生まれた。地動説や望遠鏡の話から、科学で確かめるとは何かを考えてみよう。","qs":["地動説と天動説はどうちがうの？","地動説をめぐる宗教裁判はどんなものだったの？","観察や実験を重視することはなぜ大切なの？","科学革命はヨーロッパ社会をどう変えたの？","ガリレオの望遠鏡はどれくらいの性能だったの？"]},{"id":90,"name":"ロック","period":"イギリス（1632〜1704年）","emoji":"📝","tag":"世界史","tagColor":"#6D28D9","catchphrase":"王様にも限度がある！ 政治は人々の権利のため","color":"#7C3AED","accent":"#DDD6FE","bio":"王様が決めたことなら、何でも従うしかないのか。イギリスのロックは、人には生まれながらに生命や自由、財産を守る権利があり、政府はそのためにあると考えた。政治を行う側が約束を破り、人々の権利を侵すなら、抵抗して政府を変えてもよいという。王の権力を制限する動きが進む時代に、政治の仕組みを問い直したのだ。この考えは、後のアメリカ独立などにも影響した。ただし、今と同じ平等が実現していたわけではない。","greeting":"「人間は生まれながらに自由・平等・財産を持つ権利がある」——この考えがアメリカ独立宣言に直接つながった。","qs":["自然権ってどういう考え方なの？","社会契約論ってどういう意味なの？","ロックの考えがアメリカ独立にどう影響したの？","ロック・ルソー・モンテスキューはどう役割がちがうの？","ロックの考えは現代の人権とどうつながるの？"]},{"id":89,"name":"松尾芭蕉","period":"江戸時代（1644〜1694年）","emoji":"🐸","tag":"日本史","tagColor":"#047857","catchphrase":"旅先の景色と気持ちを、短い句にぎゅっと","color":"#059669","accent":"#6EE7B7","bio":"見た景色や、ふと動いた心を短い言葉で残す。江戸時代の松尾芭蕉は、俳諧を深めた人だ。江戸で弟子たちと句づくりをしながら、各地への旅にも出た。東北や北陸などを巡った旅をもとにまとめたのが『おくのほそ道』。名所を見て終わりではなく、そこに生きた人や昔の出来事にも思いを重ねた。今の旅行日記とそっくりではなく、推敲を重ねた文学作品でもある。五・七・五の短さの中に、風景より広い世界を感じさせる言葉を探した。","greeting":"「古池や蛙飛び込む水の音」——たった17文字に宇宙を込める。俳句と奥の細道の話を聞いてください。","qs":["俳句の五・七・五はどう数えるの？","奥の細道の旅はどんな旅だったの？","元禄文化ってどんな文化なの？","俳句が武士じゃなく庶民の文化になった理由は？","「奥の細道」の旅は何日間・何kmくらいだったの？"]},{"id":101,"name":"徳川綱吉","period":"江戸時代（1646〜1709年）","emoji":"🐕","tag":"日本史","tagColor":"#1E40AF","catchphrase":"犬だけじゃない、命と秩序を大切にした将軍","color":"#1D4ED8","accent":"#BFDBFE","bio":"町で犬を傷つけたら、厳しく罰せられることもある。江戸幕府五代将軍の徳川綱吉は、動物や弱い立場の人を守る「生類憐みの令」で知られる。捨て子や病人の保護も含む決まりだったが、取り締まりや犬の世話は人々の負担にもなった。一方、学問を重んじ、武士に礼儀や道徳を学ばせた。戦う強さだけでなく、社会の秩序を守る姿勢を求めたのだ。「犬公方」のあだ名だけでは見えない、政治の理想と暮らしへの影響を持つ将軍だった。","greeting":"「犬将軍」と笑われたが——わしが目指したのは儒学で人々の心を豊かにする政治じゃ。元禄時代の話を聞いてくれ。","qs":["生類憐みの令ってどんな法律なの？","元禄文化ってどんな文化なの？","儒学を奨励することで何を変えようとしたの？","江戸幕府の将軍はどうやって政治をしていたの？","生類憐みの令は本当に犬だけを守る法律だったの？"]},{"id":15,"name":"近松門左衛門","period":"江戸時代（1653〜1725年）","emoji":"🎭","tag":"日本史","tagColor":"#9D174D","catchphrase":"人形の芝居で、世間と本音の板ばさみを描いた","color":"#BE185D","accent":"#FBCFE8","bio":"恋を大事にしたい。でも、家族や仕事の立場もある。そんな人の苦しさを芝居にしたのが、江戸時代の近松門左衛門だ。人形を動かし、語りと三味線で見せる人形浄瑠璃や、歌舞伎の台本を書いた。『曽根崎心中』では、世間の決まりと自分の思いの間で追い込まれる男女を描いた。歴史上の出来事を題材にした作品もある。舞台にいるのは人形でも、見る人に心が伝わる。大阪などの町人文化が栄えた元禄期を代表する、人気の劇作家だった。","greeting":"「虚実の皮膜」——現実とフィクションの境界に芸術は宿る。江戸の文化、話しましょうか。","qs":["元禄文化ってどんな文化なの？","人形浄瑠璃って今で言う何に近いの？","なぜ江戸時代に庶民文化が発展したの？","化政文化と元禄文化はどうちがうの？","近松門左衛門が書いた「曽根崎心中」はどんな話なの？"]},{"id":102,"name":"新井白石","period":"江戸時代（1657〜1725年）","emoji":"📚","tag":"日本史","tagColor":"#6D28D9","catchphrase":"幕府のお財布と外交を、学問の力で立て直す","color":"#7C3AED","accent":"#DDD6FE","bio":"お金を増やせば、暮らしもよくなるのか。江戸幕府の政治に関わった学者・新井白石は、質の下がった貨幣を見直し、金や銀の含有量を高める政策を進めた。長崎での貿易も制限し、貴金属が海外へ流れ出るのを抑えようとした。六代将軍・家宣らに仕えた政治は「正徳の治」と呼ばれる。外国から来た宣教師に話を聞き、海外事情を学ぶ姿勢も持っていた。ただし、通貨の改革には混乱も伴う。学問を政治に生かそうとした、将軍の相談役だ。","greeting":"学問で政治を変えられる——そう信じて将軍のそばで改革を進めた。江戸時代の政治の仕組み、話しましょう。","qs":["正徳の治ってどんな改革だったの？","江戸時代の三大改革を教えて","儒学が江戸時代の政治にどう影響したの？","長崎貿易の改革はなぜ必要だったの？","新井白石の「正徳の治」は享保の改革とどうちがうの？"]},{"id":91,"name":"モンテスキュー","period":"フランス（1689〜1755年）","emoji":"⚖️","tag":"世界史","tagColor":"#6D28D9","catchphrase":"権力を一か所に集めない！ 暴走を防ぐ仕組み","color":"#7C3AED","accent":"#DDD6FE","bio":"ルールをつくる人が、自分で何でも実行し、裁判まで好きに決めたらどうなるか。フランスのモンテスキューは、権力の集中が自由を脅かすと考えた。そこで『法の精神』で、法律をつくる力、政治を行う力、裁判する力を分け、互いに抑え合う仕組みを説いた。これが三権分立の考えだ。国によって制度の形は違うが、一人や一つの組織が勝手をしにくくする工夫になる。王の力が強かった時代の議論が、今の民主政治を考える手がかりだ。","greeting":"権力を一か所に集めると必ず腐敗する——だから三つに分けるべきだ。三権分立の話をしよう。","qs":["三権分立ってなぜ必要なの？","日本の政治でも三権分立は使われているの？","啓蒙思想って何なの？","ロック・ルソー・モンテスキューはどう役割がちがうの？","三権分立は日本でどのように実現されているの？"]},{"id":40,"name":"ルソー","period":"フランス（1712〜1778年）","emoji":"📝","tag":"世界史","tagColor":"#6D28D9","catchphrase":"国の主人公はだれ？ 人々の合意から政治を考えた","color":"#7C3AED","accent":"#DDD6FE","bio":"王様だから国を支配して当然、とは限らない。フランスで活動したルソーは、人々が約束を結び、共に社会をつくるという考えを『社会契約論』で示した。政治のもとになる力は人民にあるという「人民主権」を説いたのだ。みんなの決まりを、自分たちの問題として考える発想である。教育について論じた『エミール』も書いた。本人がフランス革命を指導したわけではないが、王の権力を問う思想は、後の革命や政治の議論に影響を与えた。","greeting":"「人間は生まれながらに自由である。しかしいたるところで鎖につながれている」——自由と革命の話をしよう。","qs":["啓蒙思想って何なの？","「人民主権」ってどういう意味なの？","ルソーの考えがフランス革命にどう影響したの？","モンテスキュー・ロックとルソーはどうちがうの？","ルソーのいう自由は、何でもしてよいという意味なの？"]},{"id":17,"name":"本居宣長","period":"江戸時代（1730〜1801年）","emoji":"📖","tag":"日本史","tagColor":"#6D28D9","catchphrase":"昔の言葉をじっくり読み、日本の心を探った","color":"#7C3AED","accent":"#DDD6FE","bio":"江戸時代、政治や学問では中国の考え方が重んじられていた。本居宣長は、それだけで昔の日本の人々の気持ちを説明できるのかと考えた。医者として働きながら古い言葉や本を研究し、『古事記』を長年かけて読み解いた『古事記伝』を完成させた。日本の古典を研究する「国学」を大きく発展させた人物だ。物語を読む時には、うれしさや寂しさに心が動く「もののあはれ」も大切にした。古い本から、人の感じ方に近づこうとした学者だ。","greeting":"「もののあわれ」——日本人の心の奥にある美しい感受性を、源氏物語から見つけた。","qs":["国学ってどんな学問なの？","「もののあわれ」って一言で言うとどういう意味なの？","国学が明治維新にどう影響したの？","蘭学と国学はなぜ同時代に発展したの？","本居宣長の「古事記伝」は完成までに何年かかったの？"]},{"id":39,"name":"ワシントン","period":"アメリカ（1732〜1799年）","emoji":"🦅","tag":"世界史","tagColor":"#0284C7","catchphrase":"独立戦争を率いた後、王様にはならなかった","color":"#0EA5E9","accent":"#BAE6FD","bio":"イギリスの支配を受けていた北アメリカの植民地で、人々の不満が高まった。ワシントンは独立戦争で軍の指揮を執り、苦戦しながらも独立へ導いた。新しい国の仕組みづくりにも関わり、アメリカ初代大統領になった。大きな名声を得ても、国王になる道は選ばず、二期務めた後に退いた。一方、本人は奴隷を所有しており、掲げられた自由がすべての人に及んだわけではない。国をつくった功績と、当時の社会の矛盾も見える人物だ。","greeting":"「代表なくして課税なし」——そのひとことがアメリカ独立の火をつけた。民主主義の誕生を話そう。","qs":["なぜイギリスの植民地が独立しようとしたの？","独立宣言で何が宣言されたの？","民主主義ってどんな考え方なの？","アメリカ独立がフランス革命に与えた影響は？","ワシントンが大統領を2期で辞めた理由は何なの？"]},{"id":16,"name":"杉田玄白","period":"江戸時代（1733〜1817年）","emoji":"📚","tag":"日本史","tagColor":"#047857","catchphrase":"本の図と体が同じ！ 驚きから始まった医学の翻訳","color":"#059669","accent":"#6EE7B7","bio":"人の体の中はどうなっているのか。江戸時代の医者・杉田玄白は、解剖を見学し、オランダ語の医学書の図が目の前の体とよく合うことに驚いた。そこで前野良沢らと翻訳に挑んだ。辞書も不十分で、言葉の意味を探る大仕事だった。こうして『解体新書』が刊行され、西洋の医学を日本語で学ぶ道が広がった。玄白一人で完成させた本ではない。仲間との試行錯誤が、オランダ語を通して西洋を学ぶ「蘭学」の発展を後押しした。","greeting":"本の図が、実際に見た体の様子とよく合っていた。その驚きが翻訳の出発点です。前野良沢ら仲間と取り組んだ『解体新書』の話をしましょう。","qs":["蘭学ってどんな学問なの？","仲間と『解体新書』を訳すのはなぜ大変だったの？","江戸時代に医学がなぜ発展したの？","国学と蘭学はどうちがうの？","「蘭学事始」にはどんな苦労話が書いてあるの？"]},{"id":41,"name":"ナポレオン","period":"フランス（1769〜1821年）","emoji":"⚔️","tag":"世界史","tagColor":"#1E40AF","catchphrase":"革命後の混乱から皇帝へ、ヨーロッパを動かした","color":"#1D4ED8","accent":"#BFDBFE","bio":"フランス革命の後、国内も周辺の国々も争いが続いていた。軍人として頭角を現したナポレオンは、政権を握り、やがて皇帝になった。法律をまとめたナポレオン法典は、身分の特権を認めない考えや財産の権利などを広めた。一方、女性の権利は制限され、政治も強い支配へ向かった。各地へ軍を進めて勢力を広げたが、ロシア遠征などでつまずき、最後は敗れた。革命の成果と戦争の拡大という二つの顔を持った、激動の時代の中心にいた。","greeting":"革命後のフランスで力を握り、やがて皇帝となった。法律を整えたことも、戦争が広がったことも含めて、私の時代を見てほしい。","qs":["フランス革命はなぜ起きたの？","ナポレオン法典って何を定めたの？","なぜモスクワ遠征は失敗したの？","ナポレオンがヨーロッパ各国にもたらしたものは？","ナポレオンの身長が低いという話は本当なの？"]},{"id":43,"name":"リンカーン","period":"アメリカ（1809〜1865年）","emoji":"🇺🇸","tag":"世界史","tagColor":"#B91C1C","catchphrase":"国が二つに割れた戦争で、奴隷制の終わりへ","color":"#DC2626","accent":"#FCA5A5","bio":"奴隷制をめぐる対立などから、アメリカが南北に分かれて戦った南北戦争。大統領のリンカーンは、国を一つに保つために戦いを指導した。途中で奴隷解放宣言を出し、奴隷制を終わらせる方向を強めていく。ただし、宣言だけですべての奴隷がすぐ自由になったわけではない。憲法の改正へも働きかけたが、終戦のころに暗殺された。民主政治の演説でも知られる。統一と自由を掲げた仕事は、その後の差別の問題を考える出発点になる。","greeting":"「人民の、人民による、人民のための政治」——民主主義をひとことで言うならこれだ。南北戦争の話をしよう。","qs":["南北戦争ってなぜ起きたの？","奴隷制度ってなぜアメリカに存在したの？","奴隷解放宣言はどんな意味を持つの？","リンカーン暗殺はなぜ起きたの？","奴隷解放宣言を出した背景を教えて？"]},{"id":104,"name":"ダーウィン","period":"イギリス（1809〜1882年）","emoji":"🦕","tag":"世界史","tagColor":"#047857","catchphrase":"自然選択による進化論の提唱者","color":"#059669","accent":"#6EE7B7","bio":"ビーグル号での航海でガラパゴス諸島などを観察し、「自然選択による進化論」を提唱。『種の起源』で生物学・思想界に革命を起こした。","greeting":"航海で集めた観察や資料を、長い時間をかけて考えた。生き物はなぜ多様なのか。自然選択という考え方から、一緒にたどってみよう。","qs":["進化論ってどういう考え方なの？","自然選択ってどういう意味なの？","進化論が当時の社会に与えた衝撃は何なの？","ガラパゴスで何を発見したの？","進化論を発表するまでに20年以上かかった理由は？"]},{"id":44,"name":"ビスマルク","period":"ドイツ（1815〜1898年）","emoji":"🏰","tag":"世界史","tagColor":"#92400E","catchphrase":"「鉄血政策」によるドイツ統一の立役者","color":"#B45309","accent":"#FDE68A","bio":"「鉄血宰相」として知られる。普仏戦争に勝利しドイツ統一を実現。ビスマルク体制で欧州バランスを維持した。","greeting":"「現在の大問題は演説や多数決ではなく、鉄と血によって解決される」——ドイツ統一の話をしよう。","qs":["ドイツが統一されるまでにどんな戦争があったの？","ビスマルクの外交がヨーロッパの平和を保った仕組みは？","普仏戦争ってどんな戦争なの？","ドイツ統一が第一次世界大戦につながった理由は？","ビスマルク体制が崩れたことが第一次世界大戦につながったの？"]},{"id":42,"name":"マルクス","period":"ドイツ（1818〜1883年）","emoji":"✊","tag":"世界史","tagColor":"#B91C1C","catchphrase":"工場で働く人はなぜ苦しい？ 社会の仕組みを追った","color":"#DC2626","accent":"#FCA5A5","bio":"工場が増え、商品が次々につくられる一方で、長時間働いても貧しい人がいる。ドイツ出身のマルクスは、その仕組みを調べた。資本家が工場や資金を持ち、労働者が働いて賃金を得る仕組みを分析し、貧富の差や対立が生まれる理由を考えた。エンゲルスと『共産党宣言』を書き、『資本論』の研究にも取り組んだ。考えは労働運動や社会主義運動に影響を与えた。後の国の制度を本人がつくったわけではなく、思想と現実は分けて見たい。","greeting":"「万国の労働者よ、団結せよ」——産業革命が生んだ格差に、哲学で立ち向かった。","qs":["産業革命って具体的に何が変わったの？","資本主義の何が問題だとマルクスは考えたの？","社会主義と共産主義はどうちがうの？","マルクスの思想がソ連・中国にどう影響したの？","マルクスの思想が現代でもまだ議論される理由は？"]},{"id":92,"name":"西郷隆盛","period":"幕末〜明治時代（1828〜1877年）","emoji":"🌋","tag":"日本史","tagColor":"#B91C1C","catchphrase":"幕府を倒した立役者が、最後は新政府と戦った","color":"#DC2626","accent":"#FCA5A5","bio":"薩摩藩の西郷隆盛は、長州藩などと力を合わせ、江戸幕府を倒す動きを進めた。新政府軍の中心となりながら、勝海舟との交渉で江戸城を大きな戦闘なしに明け渡させた。明治政府でも働いたが、朝鮮への対応などをめぐって仲間と対立し、政府を去る。鹿児島へ戻った後、士族たちが起こした西南戦争の指導者となり、新政府軍に敗れて命を落とした。新しい国づくりの仲間が敵どうしになる。その難しさを映した、明治維新の中心人物だ。","greeting":"「敬天愛人」——天を敬い、人を愛せよ。維新を成し遂げながら、なぜ新政府と戦ったか、話そう。","qs":["薩長同盟はどうやって成立したの？","廃刀令や徴兵令はなぜ武士の反感を買ったの？","西南戦争はなぜ起きたの？","西郷隆盛がいまも人気がある理由は何なの？","西郷隆盛の銅像がなぜ上野公園にあるの？"]},{"id":93,"name":"大久保利通","period":"幕末〜明治時代（1830〜1878年）","emoji":"🏛️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"新しい国を動かすため、藩をなくし工業を育てた","color":"#1D4ED8","accent":"#BFDBFE","bio":"薩摩藩の大久保利通は、西郷隆盛や長州藩の人々と共に幕府を倒す動きを進めた。明治政府では、藩をなくして県を置く廃藩置県など、政府が全国を動かす改革を進めた。欧米を視察した後は、工場や産業を育てることにも力を注ぐ。一方、急な改革で暮らしや立場が変わり、不満を抱く人々も増えた。かつての仲間・西郷とも別の道を進み、西南戦争では政府側に立った。のちに不満を持つ士族に暗殺される。国づくりには対立もあった。","greeting":"感情で動けば国は滅ぶ——明治の日本に必要なのは冷静な設計だった。近代国家の作り方を話そう。","qs":["岩倉使節団はなぜ欧米へ行ったの？","殖産興業ってどんな政策なの？","西郷隆盛と大久保利通はなぜ対立したの？","明治政府が最初に力を入れたことは何なの？","大久保利通が暗殺された「紀尾井坂の変」って何？"]},{"id":20,"name":"福沢諭吉","period":"明治時代（1835〜1901年）","emoji":"💡","tag":"日本史","tagColor":"#D97706","catchphrase":"学ぶことが、自分で生きる力になる","color":"#F59E0B","accent":"#FDE68A","bio":"身分で人生が決まりやすかった時代に、福沢諭吉は学ぶ力を重んじた。オランダ語を学んだ後、英語の必要性に気づいて学び直し、アメリカやヨーロッパにも渡った。海外の社会や制度を紹介し、慶應義塾を育てた。『学問のすゝめ』では、実生活に役立つ学問と、自分で考えて生きる姿勢を説いた。「天は人の上に人を造らず」で有名だが、そこで話は終わらない。生まれに頼らず、学びによって自分や社会を変えようと呼びかけた人物だ。","greeting":"「天は人の上に人を造らず、人の下に人を造らず」——この言葉の本当の意味、知ってるかい？","qs":["文明開化って具体的に何が変わったの？","「天は人の上に人を造らず」の続きの意味は何なの？","なぜ学問が明治時代に必要とされたの？","福沢諭吉がお札になった理由は何なの？","福沢諭吉の「脱亜論」ってどんな内容なの？"]},{"id":18,"name":"坂本龍馬","period":"幕末（1836〜1867年）","emoji":"🌊","tag":"日本史","tagColor":"#0284C7","catchphrase":"仲の悪い薩摩と長州をつなぎ、時代を動かした","color":"#0EA5E9","accent":"#BAE6FD","bio":"土佐藩を離れた坂本龍馬は、海や海外に目を向け、新しい日本の形を考えた。商売や船の活動にも関わりながら、薩摩藩と長州藩の仲立ちをした。反目していた両藩が協力する薩長同盟は、幕府を倒す流れを強めた。将軍が政治の権限を朝廷へ返す大政奉還へ向けた動きにも関わったが、その年に京都で暗殺される。一人で維新を起こしたのではない。それでも、人と人をつなぎ、藩の枠を越えて動いた姿が、物語でも親しまれてきた。","greeting":"幕府だ藩だとかいう前に、日本全体のことを考えなきゃ——そう思って動いた。何を聞く？","qs":["薩長同盟ってなぜ必要だったの？","大政奉還ってどんな意味があるの？","龍馬はなぜ暗殺されたの？","幕末の志士たちは何を目指していたの？","坂本龍馬の「船中八策」って何を提案したの？"]},{"id":94,"name":"板垣退助","period":"明治時代（1837〜1919年）","emoji":"✊","tag":"日本史","tagColor":"#9D174D","catchphrase":"政府だけで決めないで！ 国会を求めて全国へ","color":"#BE185D","accent":"#FBCFE8","bio":"土佐藩出身の板垣退助は、新しい政府づくりに加わった後、政府の外から政治を変えようと動いた。国のことを一部の役人だけで決めず、人々の代表が話し合う議会を開くべきだと訴えたのだ。国会の開設などを求める自由民権運動を進め、自由党を結成した。岐阜では演説後に襲われ、傷を負った。「板垣死すとも自由は死せず」という言葉で有名だが、当時の自由や選挙は今と範囲が違う。政治参加の道を広げた運動の中心人物だった。","greeting":"「板垣死すとも自由は死せず」——岐阜で刺されたときそう叫んだと言われる。国民の権利を勝ち取る戦いを話そう。","qs":["自由民権運動ってどんな運動なの？","民選議院設立建白書って何を求めたの？","国会はいつ・どうやって作られたの？","伊藤博文と板垣退助はどうちがうの？","「板垣死すとも自由は死せず」は本当に言ったの？"]},{"id":21,"name":"伊藤博文","period":"明治時代（1841〜1909年）","emoji":"📜","tag":"日本史","tagColor":"#1E40AF","catchphrase":"新しい国の設計図を探し、初代首相になった","color":"#1D4ED8","accent":"#BFDBFE","bio":"明治になっても、国をどんなルールで動かすかは大きな課題だった。長州藩出身の伊藤博文は、ヨーロッパで憲法の仕組みを調べ、日本の制度づくりを進めた。1885年に内閣制度が始まると、初代の内閣総理大臣になった。大日本帝国憲法の制定にも中心的に関わり、後には政党づくりにも取り組んだ。一方、韓国への日本の支配が強まる中で初代韓国統監にもなった。制度を整えた功績と、対外支配に関わった歴史の両方を持つ政治家だ。","greeting":"プロイセンの憲法を参考に——日本独自の憲法を作るためにヨーロッパへ渡った。","qs":["大日本帝国憲法はどの国の憲法を参考にしたの？","内閣制度ってなぜ必要だったの？","自由民権運動と憲法制定はどう関係あるの？","伊藤博文が安重根に暗殺された背景は？","大日本帝国憲法と日本国憲法はどこがちがうの？"]},{"id":95,"name":"陸奥宗光","period":"明治時代（1844〜1897年）","emoji":"🤝","tag":"日本史","tagColor":"#0284C7","catchphrase":"外国人を裁けない？ 不平等な約束を変えた外交官","color":"#0EA5E9","accent":"#BAE6FD","bio":"日本で外国人が事件を起こしても、日本の裁判所で裁けない。幕末の条約には、そんな不利な決まりがあった。陸奥宗光は明治政府の外務大臣として、この領事裁判権をなくす交渉を進め、1894年にイギリスとの条約改正を実現した。国内の法律や裁判制度の整備、国際情勢の変化も交渉を支えた。日清戦争後には下関条約の交渉にもあたった。ただし、関税を自由に決める権利の回復はまだ先。条約改正は一人で解決した話ではない。","greeting":"条約改正は、一つの権利を取り戻せば全部終わり、という話ではない。領事裁判権と関税自主権を分けるところから、外交の歩みを話そう。","qs":["不平等条約ってどんな内容だったの？","治外法権ってどういう意味なの？","条約改正がなぜそんなに難しかったの？","日清戦争はなぜ起きてどんな結果になったの？","ノルマントン号事件が条約改正にどう影響したの？"]},{"id":19,"name":"明治天皇","period":"明治時代（1852〜1912年）","emoji":"🌸","tag":"日本史","tagColor":"#B91C1C","catchphrase":"幕府の時代から近代へ、国の大転換の中心にいた","color":"#DC2626","accent":"#FCA5A5","bio":"江戸幕府が終わり、日本が大きく変わる時期に天皇となった明治天皇。新政府は天皇を中心とする国づくりを掲げ、政治の拠点は京都から東京へ移った。藩が県に変わり、学校や軍隊の制度が整い、憲法と議会も生まれていく。明治天皇は憲法の発布などの節目に立った。ただし、改革を一人で考えたのではなく、政府の政治家や役人が実務を担った。新しい仕組みや戦争によって暮らしが変わる中、国家の中心に位置づけられた人物だ。","isNarrator":true,"greeting":"「富国強兵・殖産興業」——明治政府が掲げたスローガンで、日本はわずか数十年で列強の仲間入りをしました。明治時代の話を学びましょう。","qs":["五箇条の御誓文で何が約束されたの？","廃藩置県はなぜ必要だったの？","大日本帝国憲法と日本国憲法はどうちがうの？","日清・日露戦争はなぜ起きてどう終わったの？","五箇条の御誓文と日本国憲法の精神はつながっているの？"]},{"id":24,"name":"夏目漱石","period":"明治〜大正時代（1867〜1916年）","emoji":"📝","tag":"日本史","tagColor":"#6D28D9","catchphrase":"猫の目や人の悩みから、近代日本を見つめた","color":"#7C3AED","accent":"#DDD6FE","bio":"学校で英語を教え、イギリスで学んだ夏目漱石。帰国後、『吾輩は猫である』で作家として注目され、やがて新聞社に入って小説を書く仕事に専念した。猫が人間を眺めたり、若い教師が学校で騒動に巻き込まれたり、作品の入口は親しみやすい。でも、その奥には見栄や孤独、人付き合いの難しさがある。『坊っちゃん』『こころ』などで、社会が変わる中の人の心を描いた。偉そうな人にも弱い人にも目を向け、明治を代表する小説家だ。","greeting":"小説には、すぐ答えの出ない人間の悩みが出てくる。『坊っちゃん』でも『こころ』でも、明治という時代でも、気になるところから話そう。","qs":["『こころ』のテーマは何なの？","近代化の中で「個人の孤独」がなぜ生まれたの？","明治時代の文学はなぜ西洋の影響を受けたの？","夏目漱石と森鴎外はどうちがうの？","漱石がロンドン留学で精神的に苦しんだ理由は？"]},{"id":46,"name":"ガンジー","period":"インド（1869〜1948年）","emoji":"🕊️","tag":"世界史","tagColor":"#047857","catchphrase":"武器でやり返さず、塩づくりで支配に抵抗した","color":"#059669","accent":"#6EE7B7","bio":"イギリスの支配下にあったインドで、ガンジーは非暴力の抵抗を広めた。南アフリカで差別を経験した後、インドで独立運動を率いるようになる。塩への課税に抗議し、海まで歩いて自分たちで塩をつくる運動も行った。暮らしに欠かせない塩が、抵抗の象徴になったのだ。投獄されても活動を続けたが、一人で独立させたわけではない。独立時には宗教間の激しい対立も起こり、本人も暗殺された。暴力を使わず政治を動かそうとした人物だ。","greeting":"不当な決まりに、暴力を使わずどう抵抗するか。私は、その道を人々と探った。塩の行進やインド独立の話から始めようか。","qs":["塩の行進ってどんな抵抗運動なの？","非暴力で植民地支配に勝てると信じた理由は？","インドがイギリスの植民地になった経緯は？","ガンジーの思想が世界の独立運動に与えた影響は？","ガンジーの「非暴力」は現代の社会運動にどう影響しているの？"]},{"id":45,"name":"レーニン","period":"ロシア（1870〜1924年）","emoji":"✊","tag":"世界史","tagColor":"#B91C1C","catchphrase":"戦争と食料不足の中、革命で新しい政権を握った","color":"#DC2626","accent":"#FCA5A5","bio":"第一次世界大戦で疲れ切ったロシアでは、皇帝の支配が倒れた後も戦争や食料不足が続いた。レーニンは、平和や土地を求める人々に訴え、ボリシェビキという政治勢力を率いた。1917年の十月革命で臨時政府を倒し、新政権の中心となる。その後、内戦や外国の干渉を経て、ソ連の成立につながった。一方、反対する勢力への弾圧も進んだ。社会主義を掲げた革命は、人々の希望と、権力集中の問題を抱えながら新しい国を生んだ。","greeting":"「一歩前進、二歩後退」——ロシア革命は直線ではなかった。世界初の社会主義国家をどう作ったか話そう。","qs":["ロシア革命ってなぜ起きたの？","ソビエト連邦ってどんな国だったの？","社会主義国家と資本主義国家はどうちがうの？","ロシア革命が世界に与えた衝撃は何だったの？","レーニンの死後、ソ連はどう変わったの？"]},{"id":50,"name":"チャーチル","period":"イギリス（1874〜1965年）","emoji":"🇬🇧","tag":"世界史","tagColor":"#1E40AF","catchphrase":"第二次世界大戦でナチスへの徹底抗戦を貫いたイギリス首相","color":"#1D4ED8","accent":"#BFDBFE","bio":"第二次世界大戦でナチスドイツへの徹底抗戦を訴えイギリスを勝利に導いた。「最も暗い時間」でも希望を失わなかった指導者。","greeting":"ナチス・ドイツとの戦争で、イギリスは厳しい選択を迫られた。戦いの経過でも、演説でも、戦後の冷戦でも、気になることを聞いてくれ。","qs":["なぜイギリスはナチスに屈しなかったの？","連合国ってどの国が入っていたの？","冷戦の「鉄のカーテン」という言葉はどこから来たの？","第二次世界大戦後の世界秩序はどう変わったの？","チャーチルの演説がなぜ戦争の流れを変えたの？"]},{"id":23,"name":"野口英世","period":"明治〜大正時代（1876〜1928年）","emoji":"🔬","tag":"日本史","tagColor":"#047857","catchphrase":"やけどの経験から医学へ、感染症の研究に挑んだ","color":"#059669","accent":"#6EE7B7","bio":"幼いころ左手に大やけどを負った野口英世は、後に受けた手術をきっかけに医学を志した。努力して医師となり、アメリカへ渡って感染症を研究した。梅毒などの研究で知られ、黄熱病の原因も追い続けた。ただし、黄熱病の病原体を発見したという当時の主張は、後に誤りと分かった。研究を続けるためアフリカへ渡ったが、自らも黄熱病に感染して亡くなる。努力の物語だけでなく、発見も確かめ直す、科学の厳しさが見える生涯だ。","greeting":"貧乏で、手に障害があって、でも諦めなかった。努力の話、聞いてほしい。","qs":["野口英世はどんな研究をしたの？","明治時代になぜ科学・医学が急発展したの？","貧困から世界的科学者になれた理由は何なの？","野口英世はなぜ黄熱病の研究でアフリカへ行ったの？","野口英世がお札の人物に選ばれた理由は？"]},{"id":22,"name":"与謝野晶子","period":"明治〜昭和時代（1878〜1942年）","emoji":"🌺","tag":"日本史","tagColor":"#9D174D","catchphrase":"恋も戦争への思いも、自分の言葉で歌にした","color":"#BE185D","accent":"#FBCFE8","bio":"自分の気持ちを、周りに遠慮して飲み込まない。与謝野晶子は、明治時代に情熱的な恋の歌などを詠み、歌集『みだれ髪』で注目された。日露戦争の際には、戦地へ行った弟を思う詩「君死にたまふことなかれ」を発表し、大きな議論を呼んだ。短歌や詩だけでなく、女性が学ぶことや自立することについても意見を述べた。子育てと共に執筆を続け、『源氏物語』の現代語訳にも取り組む。暮らしの中の思いを、社会へ届けた作家だった。","greeting":"「君死にたまふことなかれ」——弟に向けたこの歌は、国家と個人の間で引き裂かれた女性の叫びでもあった。","qs":["日露戦争の時代の日本社会ってどんな雰囲気だったの？","反戦詩を書くことは当時どれだけ危険だったの？","明治時代の女性の地位はどんな感じだったの？","与謝野晶子の歌が現代に伝えるものは何なの？","与謝野晶子の「みだれ髪」はなぜ当時衝撃的だったの？"]},{"id":27,"name":"吉田茂","period":"昭和時代（1878〜1967年）","emoji":"🕊️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"戦争の後、講和と経済の立て直しを進めた首相","color":"#1D4ED8","accent":"#BFDBFE","bio":"敗戦後の日本は、町も産業も大きな被害を受け、連合国の占領下にあった。吉田茂は首相として、国の再出発を進めた。1951年にはサンフランシスコ平和条約と日米安全保障条約に調印。翌年、日本は主権を回復したが、沖縄などは引き続きアメリカの施政下に置かれた。アメリカとの関係を軸に安全保障を考え、経済の復興を重んじた人物だ。ただし、講和に加わらなかった国もあった。独立回復の節目には、後に残る課題もあった。","greeting":"戦後の日本を、どのように立て直すか。それは外交と暮らしの両方に関わる問題じゃ。平和条約でも経済復興でも、聞いてみるがよい。","qs":["サンフランシスコ平和条約で何が決まったの？","日米安保条約ってどんな内容なの？","GHQの占領政策で日本はどう変わったの？","朝鮮戦争が日本の復興にどう関係したの？","「吉田ドクトリン」って具体的にどんな方針なの？"]},{"id":51,"name":"ルーズベルト","period":"アメリカ（1882〜1945年）","emoji":"🦅","tag":"世界史","tagColor":"#0284C7","catchphrase":"大不況への対策から戦時の指導へ、長く国を率いた","color":"#0EA5E9","accent":"#BAE6FD","bio":"仕事を失う人があふれ、銀行もつぶれる世界恐慌。アメリカ大統領のフランクリン・ルーズベルトは、公共事業で仕事をつくり、金融制度を見直すニューディール政策を進めた。政府の経済を支える役割を強めた。その後、第二次世界大戦では連合国側の指導者として日本やドイツと戦った。戦後の国際協力の構想にも関わったが、終戦前に亡くなった。在任中は日系人の強制収容も行われた。危機への対応と共に、人権を損なった政策も残る。","greeting":"「恐れるべきものは恐れ自身だ」——大恐慌の時代、アメリカ国民にそう語りかけた。","qs":["ニューディール政策って何をしたの？","大恐慌はなぜ起きたの？","ヤルタ会談で何が決まったの？","第二次世界大戦後の国連はどうやって作られたの？","ニューディール政策と日本の高度経済成長は似ているの？"]},{"id":26,"name":"東条英機","period":"昭和時代（1884〜1948年）","emoji":"⚔️","tag":"日本史","tagColor":"#B91C1C","catchphrase":"太平洋戦争開戦時の首相・A級戦犯となった陸軍大将","color":"#DC2626","accent":"#FCA5A5","bio":"陸軍大将・首相として太平洋戦争を開戦。東京裁判でA級戦犯として処刑された。","isExplainer":true,"greeting":"太平洋戦争開戦の背景——なぜ日本がアメリカと戦争することになったのか、その歴史的経緯を一緒に学びましょう。","qs":["なぜ日本はアメリカに宣戦布告したの？","軍国主義ってどうやって日本を支配したの？","東京裁判ってどんな裁判だったの？","太平洋戦争で日本はなぜ負けたの？","太平洋戦争の開戦と終戦はどこで決められたの？"]},{"id":25,"name":"平塚らいてう","period":"明治〜昭和時代（1886〜1971年）","emoji":"✊","tag":"日本史","tagColor":"#9D174D","catchphrase":"女性も自分の人生を、自分の言葉で語りたい","color":"#BE185D","accent":"#FBCFE8","bio":"女性は家庭を支えるだけでよい、と思われがちだった時代。平塚らいてうは仲間と文芸雑誌『青鞜』を創刊し、女性が自分の言葉を発表する場をつくった。「元始、女性は太陽であった」という文章で、女性が自ら輝く存在であることを訴えた。雑誌は文学の場から、結婚や女性の生き方を考える議論の場にもなった。後には政治参加を求める活動にも関わる。世間の反発を受けながらも、当たり前とされていた女性の立場を問い直した人物だ。","greeting":"「元始、女性は太陽であった」——まず自分の中の太陽を取り戻すことから始まる。","qs":["大正デモクラシーってどんな運動なの？","明治・大正時代の女性の権利はどうだったの？","「青鞜」という雑誌は何を訴えていたの？","女性が参政権を得たのはいつ、なぜなの？","「新しい女」という言葉はどういう意味だったの？"]},{"id":49,"name":"ヒトラー","period":"ドイツ（1889〜1945年）","emoji":"⚠️","tag":"世界史","tagColor":"#B91C1C","catchphrase":"不満を独裁へ利用し、戦争と迫害を広げた","color":"#DC2626","accent":"#FCA5A5","bio":"第一次世界大戦後のドイツでは、不景気や失業で不満が高まった。ヒトラーは人々の不安を利用して支持を集め、首相になった後、反対派を抑えて独裁を進めた。ユダヤ人などを差別・迫害し、政権のもとで組織的な大量虐殺が行われた。さらに周辺国へ侵攻し、第二次世界大戦を引き起こした。演説や宣伝が、人を傷つける政治と結び付いたのだ。戦争の末に自殺したが、残された犠牲は計り知れない。独裁と差別の危険を考える人物だ。","isExplainer":true,"greeting":"歴史の中で最も重要な反面教師——なぜ民主主義国家ドイツでナチズムが生まれたのか。この問いは現代にも直結します。一緒に学びましょう。","qs":["なぜドイツ国民がヒトラーを支持したの？","ホロコーストってどんな事件なの？","民主主義はなぜナチズムを止められなかったの？","第二次世界大戦はどうやって始まって終わったの？","ナチスの台頭から学べる民主主義の弱点って何？"]},{"id":52,"name":"毛沢東","period":"中国（1893〜1976年）","emoji":"🐉","tag":"世界史","tagColor":"#B91C1C","catchphrase":"革命を率いて中国を建国、その後の政策は大混乱も","color":"#DC2626","accent":"#FCA5A5","bio":"中国共産党の指導者として、毛沢東は農村を重視しながら勢力を広げた。日本との戦争や国民党との内戦を経て、1949年に中華人民共和国の成立を宣言した。広い中国を変えようとしたが、急いで生産を増やす大躍進政策は、深刻な食料不足と多数の死者を生んだ。その後の文化大革命でも、迫害や社会の混乱が広がった。建国の中心人物として大きな影響を持つ一方、権力の集中と政策の失敗が、人々の暮らしを傷つけることも示した。","isExplainer":true,"greeting":"「革命は客を招いてご飯を食べることではない」——毛沢東のこの言葉が示す時代。中華人民共和国の建国と文化大革命の歴史を一緒に学びましょう。","qs":["中華人民共和国はどうやって建国されたの？","国共内戦ってどんな戦いだったの？","文化大革命はなぜ起きてどんな影響があったの？","中国と台湾の関係はどう生まれたの？","「大躍進政策」はなぜ失敗したの？"]},{"id":28,"name":"昭和天皇","period":"昭和時代（1901〜1989年）","emoji":"🕊️","tag":"日本史","tagColor":"#1E40AF","catchphrase":"玉音放送で終戦を告げ象徴天皇制を歩んだ昭和の天皇","color":"#1D4ED8","accent":"#BFDBFE","bio":"1926年に即位した天皇。戦前・戦中を経て、1945年の玉音放送で終戦を伝えた。戦後は日本国憲法のもとで象徴天皇となり、その役割は大きく変わった。","isNarrator":true,"greeting":"1945年8月15日の玉音放送——昭和天皇の声が初めてラジオで流れたあの日、何が起きたのかを一緒に学びましょう。","qs":["玉音放送ってどんな内容だったの？","日本が太平洋戦争に負けた理由は？","象徴天皇制ってどういう意味なの？","GHQの占領政策で日本はどう変わったの？","人間宣言って何を宣言したの？"]},{"id":53,"name":"田中角栄","period":"昭和時代（1918〜1993年）","emoji":"🗾","tag":"日本史","tagColor":"#0E7490","catchphrase":"道路や鉄道で地方をつなぐ、開発を掲げた首相","color":"#0891B2","accent":"#A5F3FC","bio":"地方にも道路や鉄道、工場を広げ、都市との格差を縮めたい。田中角栄は、そうした開発を掲げた「日本列島改造論」で注目され、首相となった。1972年には中国を訪れ、日中共同声明によって国交を正常化した。行動力を発揮した一方、大規模な開発への期待は地価上昇などの問題とも結び付いた。金銭をめぐる疑惑で首相を退き、後にロッキード事件で逮捕される。経済成長の時代の勢いと、政治とお金の問題の両方を映す人物だ。","greeting":"暮らしを変える政治とは、どんなものか。道路や産業の話も、中国との国交の話もつながっておる。1972年に何が変わったか、聞いてみるか。","qs":["日中国交正常化はなぜ1972年に実現したの？","高度経済成長って何年ごろ・どうやって起きたの？","サンフランシスコ平和条約で日本はどう独立したの？","戦後の日本復興はどうやって進んだの？","日本列島改造論って具体的に何をしようとしたの？"]},{"id":54,"name":"マンデラ","period":"南アフリカ（1918〜2013年）","emoji":"✊","tag":"世界史","tagColor":"#047857","catchphrase":"27年の獄中生活を経た南アフリカ初の黒人大統領","color":"#059669","accent":"#6EE7B7","bio":"27年間の獄中生活の後、南アフリカ初の黒人大統領に。報復ではなく和解を選んだ。","greeting":"27年間、牢獄の中で過ごした。出てきたとき選んだのは——復讐ではなく、和解だった。","qs":["アパルトヘイトってどんな制度だったの？","なぜ27年も牢獄に入れられたの？","怒りではなく和解を選んだ理由は何なの？","アパルトヘイトが終わったのはなぜ・どうやって？","マンデラの「真実和解委員会」って何をしたの？"]},{"id":47,"name":"キング牧師","period":"アメリカ（1929〜1968年）","emoji":"✊","tag":"世界史","tagColor":"#6D28D9","catchphrase":"「私には夢がある」の演説で知られる公民権運動の指導者","color":"#7C3AED","accent":"#DDD6FE","bio":"「私には夢がある」の演説で有名。公民権運動を非暴力で指導し人種差別と戦った。","greeting":"「私には夢がある」——黒人も白人も共に生きられる社会を。あの夢の話をしよう。","qs":["バスのボイコット運動ってどんな出来事だったの？","なぜ1950〜60年代に公民権運動が盛んになったの？","非暴力でも変化を起こせると信じた理由は？","アメリカの人種差別は法律でいつ禁止されたの？","キング牧師の思想はガンジーの影響を受けているの？"]},{"id":48,"name":"ゴルバチョフ","period":"ソ連（1931〜2022年）","emoji":"🕊️","tag":"世界史","tagColor":"#047857","catchphrase":"ペレストロイカで冷戦終結を導いたソ連最後の書記長","color":"#059669","accent":"#6EE7B7","bio":"ペレストロイカ・グラスノスチで改革を推進。冷戦終結・ソ連崩壊につながった最後の書記長。","greeting":"冷戦を終わらせた——でも同時にソ連も終わった。改革が国を崩すとはどういうことか、話そう。","qs":["冷戦ってどんな対立だったの？","ペレストロイカ・グラスノスチって何なの？","ソ連はなぜ崩壊したの？","冷戦が終わった後の世界はどうなったの？","冷戦が終わった後の世界は本当に平和になったの？"]}];

const ADDED_CHARACTERS=[{"id":105,"name":"小野妹子","period":"飛鳥時代（生没年不詳）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"名前は妹子、仕事は外交！ 隋へ渡った使者","color":"#b45309","accent":"#fde68a","bio":"「妹子」という名だけれど、男性の役人だった小野妹子。飛鳥時代、海を渡って中国の隋へ向かった遣隋使として知られる。推古天皇のもとで国づくりが進む中、大国との関係を築き、その制度や文化を学ぶ大切な役目を担った。隋へ届けた国書の表現が、皇帝を怒らせたとも『隋書』に記される。相手の国に認めてもらうのは、当時も難題だった。後には隋の使者と共に帰国し、交流をつないだ。名前の印象と違う、国を結ぶ外交の実務者だ。","greeting":"海の向こうの隋へ使いとして渡りました。飛鳥時代の外交について、何から話しましょうか？","qs":["遣隋使は何のために送られたの？","遣唐使とはどう違うの？","当時の船旅はどんな危険があったの？"]},{"id":106,"name":"中臣鎌足","period":"飛鳥時代（614〜669年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"皇子と手を組み、蘇我氏の強い支配を崩した","color":"#b45309","accent":"#fde68a","bio":"飛鳥時代、朝廷では蘇我氏の力が大きくなっていた。中臣鎌足は中大兄皇子と協力し、645年に蘇我入鹿を倒す計画を実行した。これが「乙巳の変」で、その後の大化の改新につながる。その場の事件だけで国が一気に変わったのではなく、天皇中心の制度づくりは長く続いた。鎌足は皇子を支え、のちに天智天皇となった皇子から、死の直前に藤原の姓を与えられた。後の藤原氏へとつながる人物だ。道長らが力を振るう前の出発点にいた。","greeting":"中大兄皇子とともに、政治を変えようと動きました。乙巳の変から話しましょうか。","qs":["乙巳の変はなぜ起こったの？","中大兄皇子とはどんな関係？","大化の改新で何が変わったの？"]},{"id":107,"name":"坂上田村麻呂","period":"平安時代（758〜811年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"東北へ進んだ朝廷の軍、その先にいた人々","color":"#b45309","accent":"#fde68a","bio":"平安時代の初め、朝廷は東北へ支配を広げようとした。その軍を率いたのが、征夷大将軍の坂上田村麻呂だ。相手は、朝廷から「蝦夷」と呼ばれた東北の人々だった。戦いの末に、指導者のアテルイらが降伏する。田村麻呂は二人を助命するよう求めたと記録に残るが、願いは通らなかった。京都の清水寺とも縁の深い人物として知られる。軍の活躍として覚えるだけでなく、支配を広げる側と、土地で暮らす人々の側からも考えたい出来事だ。","greeting":"朝廷の命を受け、東北での戦いを指揮しました。当時の人々の立場も一緒に考えましょう。","qs":["征夷大将軍って何？","蝦夷とはどんな人たち？","朝廷はなぜ東北へ勢力を広げたの？"]},{"id":108,"name":"菅原道真","period":"平安時代（845〜903年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"優秀な学者が都を追われ、後には学問の神様に","color":"#b45309","accent":"#fde68a","bio":"学問や漢詩に優れた菅原道真は、宇多天皇に重んじられ、政治でも出世した。唐の衰えや航海の危険などを考え、遣唐使の停止を提案したことでも知られる。ところが、藤原氏との政治の対立の中で失脚し、九州の大宰府へ送られた。都に戻れないまま亡くなり、その後、都で災害などが続くと、道真のたたりを恐れる人々が現れた。やがて天神として祭られ、学問の神様として親しまれるようになる。受験の神様にも、苦い政治の過去がある。","greeting":"学問を重ね、朝廷の政治にも関わりました。遣唐使のことも気軽に聞いてください。","qs":["遣唐使の停止を提案したのはなぜ？","停止後も中国との交流はあったの？","どうして学問の神様と呼ばれるの？"]},{"id":109,"name":"清少納言","period":"平安時代（生没年不詳）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"宮廷の毎日から、好きも苦手も言葉で切り取る","color":"#b45309","accent":"#fde68a","bio":"春の明け方、気の利いた会話、ちょっと困る人。清少納言は宮廷で見聞きしたことや、自分が感じたことを『枕草子』に書き留めた。平安時代、一条天皇の后・定子に仕えた女性だ。「春はあけぼの」で始まる文章のほか、物事を並べたものや、宮廷での出来事もある。ただの日記ではなく、鋭い観察やユーモアが光る随筆だ。かなの表現が豊かになった時代に、身近な好き嫌いを読む楽しみに変えた。千年前なのに、感覚が身近な作家だ。","greeting":"春はあけぼの。あなたなら、どの季節のどんな景色が好き？ 『枕草子』のお話もしましょう。","qs":["枕草子には何が書かれているの？","国風文化って何？","紫式部の源氏物語とはどう違うの？"]},{"id":110,"name":"白河上皇","period":"平安時代（1053〜1129年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"天皇を退いても政治は続く、上皇という立場","color":"#b45309","accent":"#fde68a","bio":"天皇を辞めたら、政治の仕事も終わりとは限らない。平安時代後期の白河天皇は、位を息子に譲って上皇となった後も、政治を動かし続けた。上皇が中心となるこの仕組みを「院政」という。藤原氏だけに頼らず、自分に近い人々を使い、財産や武士の力も集めていった。寺の勢力が要求を突き付けるなど、思いどおりにいかないことも多かった。華やかな宮廷の裏で、政治の中心がどう移るかを示す人物だ。後に武士が台頭する時代を生きた。","greeting":"天皇を退いた後も政治に関わりました。院政という仕組みを知っていますか？","qs":["院政ってどんな政治？","摂関政治とは何が違うの？","なぜ上皇が政治を行えたの？"]},{"id":111,"name":"後鳥羽上皇","period":"鎌倉時代（1180〜1239年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"幕府を倒そうとした上皇、戦いの結果は逆方向へ","color":"#b45309","accent":"#fde68a","bio":"鎌倉幕府が力を持つ一方、都では天皇や上皇の政治も続いていた。後鳥羽上皇は朝廷の力を取り戻そうとし、1221年に北条義時を討つよう命じた。これが承久の乱だ。しかし、幕府側の武士は結束し、朝廷側は敗れた。上皇は隠岐へ流され、幕府は京都に六波羅探題を置いて、朝廷の監視や西国支配を強めた。力を取り戻すはずが、幕府の支配を広げる結果になった。和歌にも深く関わり、『新古今和歌集』の編さんを進めた顔も持つ。","greeting":"朝廷と幕府の力関係を変えようとしました。承久の乱について話しましょう。","qs":["承久の乱はなぜ起こったの？","乱の後、幕府の力はどうなったの？","乱の後にどこへ流されたの？"]},{"id":112,"name":"北条時宗","period":"鎌倉時代（1251〜1284年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"海の向こうから大軍が来た！ 元寇に向き合う","color":"#b45309","accent":"#fde68a","bio":"鎌倉幕府の政治を担う執権となった北条時宗を、大きな外交問題が待っていた。元から日本に従うよう求める使者が来たのだ。幕府が要求に応じない中、元は二度にわたり軍を送ってきた。時宗のもとで武士たちは九州の守りを固め、海岸には石の防塁も築いた。戦いと暴風などが重なり、遠征軍は撤退した。風だけで守られた話ではない。武士や地域の人々の負担は重く、勝っても土地を報酬にしにくく、幕府の課題として残った。","greeting":"元の軍勢が海を越えてきた。幕府がどう備えたのか、一緒に見ていこう。","qs":["元寇はなぜ起こったの？","文永の役と弘安の役はどう違う？","元寇の後、御家人の生活はどうなったの？"]},{"id":113,"name":"運慶","period":"鎌倉時代（生年不詳〜1223年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"木から生まれる迫力、仏像が今にも動きそう！","color":"#b45309","accent":"#fde68a","bio":"筋肉の盛り上がりや鋭い目。鎌倉時代の仏像には、本当にそこに人がいるような迫力がある。運慶は、そんな力強い表現で知られる仏像をつくる仏師だ。奈良の寺が戦火で傷ついた後、その復興にも関わった。東大寺南大門の金剛力士像は、快慶ら多くの職人と協力してつくられた。巨大な像も一人で彫ったわけではない。木を組み合わせる技術と、工房の仲間の仕事が支えた。武士の時代に、人々の祈りを目に見える姿へ変えた人物だ。","greeting":"仏像の表情や体の動き、じっくり見たことはあるかい？ 南大門の像の話をしよう。","qs":["金剛力士像はどこにあるの？","快慶とはどんな関係？","鎌倉時代の仏像にはどんな特徴があるの？"]},{"id":114,"name":"足利義政","period":"室町時代（1436〜1490年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"政治は大混乱、それでも東山に育った文化","color":"#b45309","accent":"#fde68a","bio":"室町幕府八代将軍の足利義政は、後継ぎの問題や有力な武士の対立が深まる中で政治を担った。やがて応仁の乱が起こり、京都は長い戦いで荒れてしまう。一方、義政は東山に山荘を築き、庭や建物、芸術を愛した。そこから茶や花、絵などの東山文化が育ち、後の日本文化にも影響した。銀閣で有名だが、建物に銀が張られているわけではない。文化の美しさだけでなく、人々の負担や政治の混乱も見ると、時代の姿が見えてくる。","greeting":"東山の山荘は、後に銀閣と呼ばれるようになった。文化の話から始めようか。","qs":["銀閣と金閣は何が違うの？","東山文化にはどんな特徴があるの？","応仁の乱はなぜ起こったの？"]},{"id":115,"name":"世阿弥","period":"室町時代（1363年頃〜1443年頃）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"舞台で人の心をつかむには？ 能を磨いた名人","color":"#b45309","accent":"#fde68a","bio":"子どものころ、父の観阿弥と演じた舞台を、将軍の足利義満に認められた世阿弥。将軍の保護を受けながら芸を磨き、歌や舞、せりふで物語を見せる能を大きく発展させた。派手に動くだけでなく、少ない動きで深い思いを表す芸だ。『風姿花伝』には、稽古の心得や、見る人を引きつける「花」の考えを残した。将軍との関係は順調なことばかりではなく、晩年には佐渡へ流された。今に続く舞台の奥には、工夫を重ねた芸人の歩みがある。","greeting":"舞台では、ほんの小さな動きにも意味があります。能について一緒に見てみましょう。","qs":["能はどんな芸能なの？","父の観阿弥と何をしたの？","室町時代に能が広まったのはなぜ？"]},{"id":116,"name":"尚巴志","period":"琉球王国（1372〜1439年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"三つに分かれた沖縄をまとめ、琉球王国の土台へ","color":"#b45309","accent":"#fde68a","bio":"沖縄本島が北山・中山・南山という三つの勢力に分かれていたころ。尚巴志は父の尚思紹と共に中山の支配を固め、さらに北山と南山を倒した。1429年の三山統一で知られる、第一尚氏の王だ。首里を中心に国をまとめ、中国の明との関係や、海を通じた交易も重んじた。琉球はその後、アジア各地をつなぐ貿易で栄えていく。一人ですべて完成させたのではないが、争いを経て、琉球王国がまとまっていく大きな節目を築いた人物だ。","greeting":"琉球の三つの勢力をまとめ、王国の基礎を築きました。海の向こうとの交流も話しましょう。","qs":["三山統一って何？","琉球王国はどんな国々と貿易したの？","首里は王国でどんな役割を持ったの？"]},{"id":117,"name":"ザビエル","period":"スペイン（1506〜1552年）","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"知らない言葉の壁を越え、日本で教えを伝えた","color":"#2563eb","accent":"#bfdbfe","bio":"ヨーロッパからアジアへ渡った宣教師フランシスコ・ザビエルは、日本人との出会いをきっかけに日本へ向かった。1549年、鹿児島に上陸し、キリスト教の教えを伝え始めた。言葉も習慣も違う土地では、説明する言葉選びさえ難しかった。山口などでも活動し、教えを受け入れる人々が生まれた。日本にキリスト教を伝えた宣教師として知られるが、広まったのは多くの宣教師や信者の働きによる。短い滞在が、交流の入口になった。","greeting":"私はキリスト教を伝えるために日本を訪れました。当時の日本との出会いについて話しましょう。","qs":["いつ日本に来たの？","キリスト教はどう広まったの？","鉄砲の伝来とはどう違うの？"]},{"id":118,"name":"千利休","period":"安土桃山時代（1522〜1591年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"小さな茶室で、お茶を囲む時間を磨いた","color":"#b45309","accent":"#fde68a","bio":"豪華な道具を並べるだけが、お茶の楽しみではない。堺の商人の家に生まれた千利休は、簡素な茶室や道具の中に美しさを見いだす、わび茶を大成した。お茶を出すまでの準備や相手への心配りも、場をつくる大切な仕事だった。織田信長や豊臣秀吉に仕え、茶の湯は武将たちの交流や政治とも結び付いた。しかし、秀吉との関係が悪化し、最後は切腹を命じられる。理由には不明な点も多い。静かな茶室にも、時代の力が入り込んでいた。","greeting":"一杯のお茶をどう用意するか。その中にも、工夫があります。茶の湯のことを話しましょう。","qs":["茶の湯って何？","桃山文化にはどんな特徴があるの？","豊臣秀吉とはどんな関係だったの？"]},{"id":119,"name":"徳川家光","period":"江戸時代（1604〜1651年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"大名は江戸へ、外国との窓口は限って管理","color":"#b45309","accent":"#fde68a","bio":"家康が開いた幕府を安定させた三代将軍の徳川家光。大名に江戸と領地を行き来させる参勤交代を制度として整え、幕府の統制を強めた。各地の大名が江戸へ集まることで、街道や宿場も発達した。一方、キリスト教を厳しく取り締まり、日本人の海外渡航や帰国を制限し、ポルトガル船の来航も禁じた。外国との交流をすべてなくしたわけではなく、窓口を限って続けた。大名も海外との関係も管理し、幕府の仕組みを固めた将軍だ。","greeting":"江戸幕府の三代将軍として、大名を統制する仕組みを整えました。何を聞きたいですか？","qs":["参勤交代はどんな制度？","大名や人々の暮らしにどんな影響があったの？","江戸時代は外国と全く交流しなかったの？"]},{"id":120,"name":"徳川吉宗","period":"江戸時代（1684〜1751年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"幕府のお財布が苦しい！ 倹約と工夫で立て直す","color":"#b45309","accent":"#fde68a","bio":"江戸幕府の財政が苦しい中、八代将軍になった徳川吉宗は享保の改革を進めた。出費を抑え、田畑を開いて収入を増やそうとした。人々の意見を受け付ける目安箱を置き、その声から小石川養生所も生まれた。町の防火や裁判の基準づくりにも取り組んだので、お金だけの改革ではない。ただし、年貢を増やす政策は農民の負担にもなった。テレビのように町で悪人を倒したのではなく、実際には制度や人を動かして政治を立て直そうとした。","greeting":"幕府の台所事情を立て直すために、いろいろな改革に取り組んだ。気になることはあるか？","qs":["享保の改革では何をしたの？","目安箱は何のために置いたの？","寛政の改革とはどう違うの？"]},{"id":121,"name":"田沼意次","period":"江戸時代（1719〜1788年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"米だけに頼らず、商売の力を幕府の収入へ","color":"#b45309","accent":"#fde68a","bio":"江戸の町で商売が盛んになっても、幕府の収入の中心は米の年貢だった。田沼意次は、商人たちの活動にも目を向け、商売の仲間組織である株仲間を認める代わりに税などを納めさせた。貿易や開発にも力を入れ、幕府のお金を増やそうとしたのだ。一方、役人への賄賂が問題となり、飢きんや災害で政治への不満も強まった。やがて失脚し、政策は見直されていく。商業を使う工夫と、利益をめぐる問題が見える、江戸時代の政治家だ。","greeting":"人や物が動けば、お金も動く。商業と幕府の政治の関係を一緒に考えてみよう。","qs":["株仲間って何？","なぜ商業を重視したの？","松平定信の政治とはどう違うの？"]},{"id":122,"name":"松平定信","period":"江戸時代（1759〜1829年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"ぜいたくを抑え、学問も統制！ 厳しい立て直し","color":"#b45309","accent":"#fde68a","bio":"飢きんや政治への不満が広がった後、老中の松平定信は寛政の改革を進めた。無駄な出費やぜいたくを抑え、米を備えて飢きんに備えるよう大名に命じた。旗本や御家人の古い借金を帳消しにするなど、武士を救う政策も取った。一方、幕府の学校では朱子学を重んじ、出版物も取り締まった。世の中を正そうとする厳しさは、暮らしや表現を窮屈にもしたのだ。倹約だけで人々が納得するとは限らない。政治と社会のずれが見える改革だった。","greeting":"飢饉の後、暮らしを立て直すことは大きな課題でした。寛政の改革を話しましょう。","qs":["寛政の改革では何をしたの？","なぜ農村を重視したの？","田沼意次の政治とどう違うの？"]},{"id":123,"name":"水野忠邦","period":"江戸時代（1794〜1851年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"物価も町も引き締めたい、でも改革は大反発","color":"#b45309","accent":"#fde68a","bio":"江戸時代の終わりが近づくころ、老中の水野忠邦は天保の改革を始めた。ぜいたくを禁じて、江戸へ出てきた人を農村に戻そうとし、物価を下げるため株仲間も解散させた。しかし、商売の仕組みを急に変えると流通も混乱した。江戸や大阪の周辺を幕府の直轄地にしようとする政策には、大名や旗本などが強く反発した。結局、改革は短期間で行き詰まり、失脚した。立て直したくても、命令だけでは社会は動かない。難しさを示した人だ。","greeting":"幕府の財政や社会の混乱に向き合うため、天保の改革を進めました。","qs":["天保の改革は何のため？","株仲間を解散させたのはなぜ？","享保・寛政の改革との違いは？"]},{"id":124,"name":"大塩平八郎","period":"江戸時代（1793〜1837年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"元役人が立ち上がる、飢える人を救うための反乱","color":"#b45309","accent":"#fde68a","bio":"大坂の役所で不正を取り締まっていた大塩平八郎は、退職後に学問を教えていた。天保の飢きんで人々が苦しむと、救済を求め、自分の本を売って助けた。それでも状況が変わらず、1837年に門人らと武装して蜂起した。役人だった人物が幕府に反旗を翻したことは、大きな衝撃を与えた。しかし、反乱はすぐに鎮められ、町には火災の被害も広がった。本人は逃亡の末に自害する。救いたい思いと、武力が残した被害の両方がある事件だ。","greeting":"人々が苦しむ中、政治に何ができるのか。大阪で起きた乱の背景を一緒に考えましょう。","qs":["大塩平八郎の乱はなぜ起こったの？","当時、人々はどんなことで苦しんでいたの？","乱は幕府にどんな影響を与えたの？"]},{"id":125,"name":"伊能忠敬","period":"江戸時代（1745〜1818年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"五十歳から本格的に学び、歩いて日本地図へ","color":"#b45309","accent":"#fde68a","bio":"商人として家の仕事を発展させた伊能忠敬は、引退後に江戸へ出て、天文学や測量を本格的に学んだ。五十歳ごろからの新しい挑戦だった。やがて幕府の許可を得て蝦夷地へ向かい、その後も各地の海岸線などを調べた。距離や方角、星の位置を仲間と測り、記録を積み重ねた。本人は全国図の完成前に亡くなったが、弟子たちが仕事を引き継いだ。こうして精密な日本地図が完成した。一人の伝説ではなく、学びと共同作業が生んだ成果だ。","greeting":"各地を歩き、少しずつ地図の材料を集めました。測量の方法が気になりますか？","qs":["どうやって土地の形を測ったの？","完成した地図は何に役立ったの？","地図はいつ完成したの？"]},{"id":126,"name":"葛飾北斎","period":"江戸時代（1760〜1849年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"大波も富士山も、大胆な絵で世界を驚かせた","color":"#b45309","accent":"#fde68a","bio":"大きな波の向こうに、小さく見える富士山。『神奈川沖浪裏』で知られる葛飾北斎は、江戸時代後期の浮世絵師だ。『冨嶽三十六景』では、各地の天候や働く人々と共に富士山を描いた。同じ山でも見せ方を変えれば、まるで別の景色になる。絵の手本となる『北斎漫画』には、人や動物の動きもたくさん残した。何度も名前を変え、年を重ねても描き続けた。版元や彫師、摺師らが支えた版画は海外へも渡り、後の画家たちに影響を与えた。","greeting":"富士山も見る場所が変われば、ずいぶん違って見える。絵の話をしようか。","qs":["富嶽三十六景って何？","浮世絵はどうやって作られたの？","歌川広重の作品とはどう違うの？"]},{"id":127,"name":"歌川広重","period":"江戸時代（1797〜1858年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"雨や雪まで旅の主役、絵で巡る東海道","color":"#b45309","accent":"#fde68a","bio":"江戸時代、旅をする人が増え、行ったことのない場所の景色にも人気が集まった。歌川広重は『東海道五拾三次』などで、街道の宿場や旅人を描いた浮世絵師だ。急な雨に走る人、雪の中を進む人、静かな夕暮れ。同じ道でも、時間や天気によって表情が変わる。写真がない時代の絵だが、どれも現地をそのまま写した記録とは限らず、見せ方の工夫もある。風景と人の暮らしを一枚に収めた作品は海外にも広がり、旅の気分を今に伝える。","greeting":"道を旅すると、宿場ごとに違う景色が見える。東海道の絵を見てみよう。","qs":["東海道五十三次って何？","江戸時代の人はどんな旅をしたの？","北斎の作品とはどう違うの？"]},{"id":128,"name":"ペリー","period":"アメリカ・幕末（1794〜1858年）","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"黒船で来航、幕府に開国を迫った使節","color":"#2563eb","accent":"#bfdbfe","bio":"江戸湾に黒い船が現れ、幕府は対応に追われた。1853年、アメリカのペリーが大統領の国書を持って来航したのだ。蒸気船を含む艦隊の力を背景に、日本へ開国を求めた。翌年に再び来航し、日米和親条約が結ばれ、下田と箱館が開かれた。目的には船への燃料や食料の補給、遭難者の保護などがあった。この条約で、すぐ自由貿易が始まったわけではない。外国との関係をどう変えるかという難問が、幕府の政治を大きく揺さぶった。","greeting":"アメリカから船で日本を訪れました。当時の交渉について、日本側の事情も含めて考えましょう。","qs":["黒船はなぜ来たの？","日米和親条約で何が決まったの？","日米修好通商条約とはどう違うの？"]},{"id":129,"name":"井伊直弼","period":"幕末（1815〜1860年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"条約を急いだ大老、反対派への弾圧が反発を生んだ","color":"#b45309","accent":"#fde68a","bio":"外国から通商を求められ、次の将軍を誰にするかでも揺れる江戸幕府。大老の井伊直弼は、朝廷の許可を得ないまま、1858年に日米修好通商条約を結んだ。日本に不利な内容を含む条約で、政治への反発が強まった。直弼は反対する人々を厳しく処罰し、これが安政の大獄と呼ばれる。やがて桜田門外で襲われ、命を落とした。幕府を守る強い決断が、新たな対立も生んだ。外国との交渉と国内の争いが重なった、幕末の難しい局面にいた。","greeting":"開国をめぐり、幕府の内外で意見が分かれていました。当時の判断を見ていきましょう。","qs":["日米修好通商条約はどんな条約？","安政の大獄って何？","桜田門外の変はなぜ起こったの？"]},{"id":130,"name":"徳川慶喜","period":"幕末（1837〜1913年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"政治の権限を返した最後の将軍、その後も戦いに","color":"#b45309","accent":"#fde68a","bio":"幕府を立て直せる人物として期待され、徳川慶喜は十五代将軍となった。ところが、薩摩や長州などの動きが強まる中、1867年に政治の権限を朝廷へ返した。これが大政奉還だ。徳川家も新しい政治に関われる道を探ったが、王政復古の政変で事態は変わる。翌年、旧幕府軍と新政府軍が鳥羽・伏見で戦い、慶喜は江戸へ退いた。後に恭順を示し、将軍として政治の表舞台を去る。権限を返しても、対立や戦争は終わらなかった。","greeting":"幕府を取り巻く状況は大きく変わっていました。大政奉還について話しましょう。","qs":["大政奉還って何？","なぜ政権を朝廷に返したの？","大政奉還の後、何が起きたの？"]},{"id":131,"name":"木戸孝允（桂小五郎）","aliases":["木戸孝允","桂小五郎"],"period":"幕末〜明治時代（1833〜1877年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"薩摩と手を結び、明治の制度づくりへ進んだ","color":"#b45309","accent":"#fde68a","bio":"桂小五郎の名でも知られる木戸孝允は、長州藩の政治を動かした人物だ。幕府と対立する中、坂本龍馬らの仲立ちもあり、薩摩藩と協力する薩長同盟を結んだ。かつての敵でも、状況が変われば手を組む。そうした判断が、幕府を倒す流れを強めた。明治政府では五箇条の御誓文や、藩をなくして県を置く廃藩置県などに関わり、国の仕組みを整えた。欧米の視察にも参加したが、政府内で意見が対立することもあった。維新の実務を担った。","greeting":"桂小五郎という名でも知られています。薩長の協力から明治の国づくりまで話しましょう。","qs":["薩長同盟はどうして結ばれたの？","桂小五郎と木戸孝允（桂小五郎）は同じ人？","明治政府でどんな改革に関わったの？"]},{"id":132,"name":"岩倉具視","period":"幕末〜明治時代（1825〜1883年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"海を渡って制度を見学、新政府の外交と国づくり","color":"#b45309","accent":"#fde68a","bio":"京都の公家だった岩倉具視は、幕末に天皇を中心とする新政府づくりへ関わった。明治になると使節団を率い、大久保利通や木戸孝允、留学生たちと欧米へ渡る。条約改正の準備や、各国の制度・産業を調べる旅だった。現地ですぐに不平等条約を改正できたわけではないが、帰国後の国づくりに多くの知識をもたらした。帰国後は朝鮮への使節派遣にも反対し、政府内の対立に関わった。海外での経験が、日本の進路を考える材料になった。","greeting":"使節団とともに欧米へ渡りました。何を見て、何を学ぼうとしたのか話しましょう。","qs":["岩倉使節団の目的は何？","どんな人たちが使節団に参加したの？","条約改正はその時に実現したの？"]},{"id":133,"name":"大隈重信","period":"明治〜大正時代（1838〜1922年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"藩の枠を越える政治と、若者が学ぶ学校をつくった","color":"#b45309","accent":"#fde68a","bio":"佐賀藩出身の大隈重信は、明治政府で財政などを担当した。しかし、国会や憲法をめぐる考えの違いもあり、政府を去る。その後、立憲改進党をつくり、議会を通した政治を目指した。後に首相にもなったが、政治家だけが仕事ではない。東京専門学校、今の早稲田大学につながる学校も開いた。政府にすべて任せず、社会を支える人材を育てる場にも力を入れたのだ。国のルールを争いながら、若者の学びにも関わった人物だ。","greeting":"自由民権運動の時代、立憲改進党をつくりました。政治にどう参加するか、一緒に考えましょう。","qs":["立憲改進党はどんな政党？","板垣退助の自由党とどう違うの？","どんな学校の設立に関わったの？"]},{"id":134,"name":"小村寿太郎","period":"明治時代（1855〜1911年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"戦争を終える交渉と、不平等条約の最後の課題へ","color":"#b45309","accent":"#fde68a","bio":"日露戦争が続く中、外交官の小村寿太郎はロシアとの講和交渉に向かった。1905年のポーツマス条約で戦争は終わったが、日本は賠償金を得られず、国内では不満が爆発した。犠牲や戦費を考えると、交渉は単なる勝ち負けではなかった。その後、外務大臣として条約改正も進め、1911年に関税自主権を回復した。外国から来る品にかける税を、日本が自分で決める権利だ。戦後の取り決めと国の権利回復を担った、明治の外交官だ。","greeting":"戦争を終わらせる交渉や、条約の見直しに関わりました。外交の話をしましょう。","qs":["ポーツマス条約で何が決まったの？","関税自主権の回復って何？","陸奥宗光の条約改正とはどう違うの？"]},{"id":135,"name":"尚泰","period":"琉球王国〜明治時代（1843〜1901年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"琉球王国最後の王、首里城を去って東京へ","color":"#b45309","accent":"#fde68a","bio":"琉球王国は、中国との関係を保ちながら、薩摩の支配も受ける立場にあった。その王国で最後の王となったのが尚泰だ。日本で明治政府が成立すると、琉球は琉球藩とされ、さらに1879年、政府が沖縄県を置いた。尚泰は首里城を明け渡し、王国の仕組みは終わりを迎える。その後は東京で暮らし、華族という立場になった。王の引っ越しにとどまらず、政治も暮らしも変わった。沖縄が今の県になる過程をたどるうえで欠かせない人物だ。","greeting":"私は琉球王国の最後の国王です。王国から沖縄県へ移る時代を、一緒にたどりましょう。","qs":["琉球処分って何？","沖縄県が置かれるまでに何があったの？","当時の琉球の人々はどんな立場に置かれたの？"]},{"id":136,"name":"田中正造","period":"明治時代（1841〜1913年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"川や田畑が傷つく中、鉱毒被害を国へ訴えた","color":"#b45309","accent":"#fde68a","bio":"工業が発展する明治時代、足尾銅山から出る有害な物質が川を汚し、流域の農業や暮らしに被害を与えた。栃木県出身の政治家・田中正造は、この鉱毒問題を国会で追及した。議員を辞めた後には、天皇へ直接訴えようともした。その後も、遊水地の計画で村を失うことになった谷中村の人々と共に暮らし、声を上げた。産業が伸びれば誰もが幸せになるとは限らない。国の発展の陰で苦しむ人を見つめ、生活と自然を守るため行動した人物だ。","greeting":"川や田畑の被害に苦しむ人たちがいました。足尾鉱毒事件を一緒に考えましょう。","qs":["足尾鉱毒事件って何？","人々の暮らしにどんな被害があったの？","産業の発展と公害はどう関係するの？"]},{"id":137,"name":"津田梅子","period":"明治〜大正時代（1864〜1929年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"六歳でアメリカへ、帰国後は女性の学ぶ場を開いた","color":"#b45309","accent":"#fde68a","bio":"岩倉使節団と共に海を渡った女子留学生の一人が、六歳の津田梅子だった。アメリカで長く学んで帰国したが、日本では女性が学び、仕事で力を発揮する道が限られていた。英語を教えるなどして経験を積み、再び留学した後、女性のための学校を開いた。それが女子英学塾で、今の津田塾大学につながる。英語の知識だけでなく、自立して社会に関わる力を育てようとした。海外での学びを、自分だけでなく、次の女性たちの機会へつないだ。","greeting":"幼いころに海を渡り、帰国後は女子教育に取り組みました。学ぶことについて話しましょう。","qs":["なぜアメリカへ留学したの？","当時の女子教育にはどんな課題があったの？","どんな学校をつくったの？"]},{"id":138,"name":"北里柴三郎","period":"明治〜大正時代（1853〜1931年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"見えない細菌と闘い、研究を人の命につなげた","color":"#b45309","accent":"#fde68a","bio":"感染症が恐れられていた時代、医師の北里柴三郎はドイツへ留学し、細菌学者コッホのもとで学んだ。破傷風菌をほかの菌と分けて育てることに成功し、血液中の免疫の働きを使う治療の研究にも貢献した。帰国後は伝染病の研究施設を育て、香港ではペストの病原菌の発見にも関わった。研究の成果だけでなく、病気を防ぎ、治す仕組みや人材も必要だった。後に北里研究所を開き、仲間や後輩を育てた。日本の近代医学を支えた研究者だ。","greeting":"病気の原因を調べ、予防や治療につなげる。医学の研究について話しましょう。","qs":["細菌って何？","破傷風の研究では何が進んだの？","野口英世とはどんなつながりがあるの？"]},{"id":139,"name":"樋口一葉","period":"明治時代（1872〜1896年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"二十四年の短い生涯で、町の暮らしを文学にした","color":"#b45309","accent":"#fde68a","bio":"明治の東京で暮らした樋口一葉は、家計を支える苦労を抱えながら小説を書いた。店を営んだ経験や身近な人々の生活にも触れ、貧しさや立場の違いが人の運命を左右する様子を描いた。代表作『たけくらべ』では、子どもたちが大人の世界へ近づく姿を見つめた。文章には古典の教養も生かされ、ただの生活記録にはとどまらない。二十四歳で亡くなったが、短期間に優れた作品を発表した。名もない人の心を照らした、近代日本の作家だ。","greeting":"人の暮らしや心の動きを、物語の言葉にしました。明治の文学の話をしましょう。","qs":["たけくらべはどんな作品？","明治時代の文学にはどんな特徴があるの？","夏目漱石とはどんな時代を生きたの？"]},{"id":140,"name":"渋沢栄一","period":"幕末〜明治時代（1840〜1931年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"会社をつくるだけでなく、社会をよくする商売へ","color":"#b45309","accent":"#fde68a","bio":"明治になった日本には、銀行や会社を動かす新しい仕組みが必要だった。渋沢栄一は政府で働いた後、民間へ移り、第一国立銀行など企業や団体の設立・育成に関わった。お金もうけと道徳は両立すべきだと考え、『論語』の教えと商売を結び付けて語った。教育や福祉にも力を入れたので、会社だけの人ではない。一人で何百社も経営したのではなく、仲間と資金や人をつないだ。経済発展の時代に、事業の社会での役割も問うた人物だ。","greeting":"銀行や会社の仕組みを整える仕事に関わりました。お金の流れから近代の日本を見てみよう。","qs":["銀行はどんな役割を持つの？","日本の近代産業とどう関わったの？","徳川慶喜とはどんなつながりがあるの？"]},{"id":141,"name":"原敬","period":"大正時代（1856〜1921年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"政党が政治を動かす時代へ、平民宰相と呼ばれた","color":"#b45309","accent":"#fde68a","bio":"政治は一部の有力者だけで動かすものなのか。原敬は新聞の仕事や官僚を経験し、政党の立憲政友会で力を付けた。1918年には首相となり、衆議院に議席を持つ政党員を中心に内閣を組んだ。爵位を持たなかったため「平民宰相」と呼ばれ、政党政治への期待を集めた。一方、成人男性みんなに選挙権を認める普通選挙には慎重だった。鉄道などの整備も進めたが、東京駅で暗殺される。政治参加が広がる途中の、期待と限界を持つ首相だ。","greeting":"政党が中心となる内閣を組織しました。政治がどう変わったか話しましょう。","qs":["政党内閣って何？","なぜ本格的な政党内閣と呼ばれるの？","米騒動と内閣の成立にはどんな関係があるの？"]},{"id":142,"name":"吉野作造","period":"大正時代（1878〜1933年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"民衆のための政治へ、選挙と議会の力を説いた","color":"#b45309","accent":"#fde68a","bio":"法律に議会があっても、人々の意見が政治に届かなければ十分ではない。大正時代の政治学者・吉野作造は、政治の目的を民衆の利益に置き、その意向を尊重する「民本主義」を唱えた。天皇が主権を持つ当時の憲法のもとで、議会や政党を通じて政治を変える道を考えたのだ。選挙権を広げることも訴えた。大正デモクラシーと呼ばれる民主化の動きを、言論で支えた人物である。制度の名前だけでなく、誰のために動くのかを問いかけた。","greeting":"政治は誰のためにあるのでしょう。民本主義という考え方から一緒に考えてみましょう。","qs":["民本主義って何？","大正デモクラシーとはどんな動き？","民主主義と民本主義はどう違うの？"]},{"id":143,"name":"マッカーサー","period":"アメリカ・昭和時代（日本占領期）（1880〜1964年）","emoji":"👤","tag":"日本史","tagColor":"#2563eb","catchphrase":"敗戦後の日本で、占領と改革を指揮した","color":"#2563eb","accent":"#bfdbfe","bio":"第二次世界大戦で日本が敗れると、連合国による占領が始まった。その最高司令官として日本に来たのが、アメリカの軍人マッカーサーだ。GHQを率い、日本政府を通じて軍の解体や民主化の改革を進めた。日本国憲法ができる過程にも、大きく関わった。一方、占領下では言論への検閲もあり、すべてが自由だったわけではない。朝鮮戦争では国連軍の指揮も執ったが、後に解任された。戦後日本の再出発を、外国から強く動かした人物だ。","greeting":"戦後の日本では、占領のもとでさまざまな改革が進みました。その内容を確認しましょう。","qs":["GHQは何をしたの？","戦後の民主化ではどんな改革があったの？","日本国憲法はどのように作られたの？"]},{"id":144,"name":"佐藤栄作","period":"昭和時代（1901〜1975年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"沖縄の施政権返還を進め、核を持たない方針を掲げた","color":"#b45309","accent":"#fde68a","bio":"戦争が終わっても、沖縄は長くアメリカの施政下に置かれた。首相の佐藤栄作はアメリカと交渉し、1972年に沖縄の日本復帰が実現した。ただし、復帰後も米軍基地は多く残った。核兵器を持たず、つくらず、持ち込ませずという非核三原則を掲げ、後にノーベル平和賞も受けた。一方、核の持ち込みなどをめぐる日米の密約は、後に検証の対象となった。復帰という節目の成果と、基地や核をめぐる課題を共に見るべき、首相だった。","greeting":"沖縄の本土復帰が実現した時代の首相です。復帰までの歩みと、その後の課題を話しましょう。","qs":["沖縄が本土に復帰したのはいつ？","復帰を求める運動はどんなものだったの？","非核三原則って何？"]},{"id":145,"name":"バスコ・ダ・ガマ","period":"ポルトガル（1469年頃〜1524年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"アフリカをぐるり、海でヨーロッパとインドを結んだ","color":"#2563eb","accent":"#bfdbfe","bio":"香辛料などを求め、アジアへ向かう航路を探したヨーロッパの人々。ポルトガルのバスコ・ダ・ガマは、アフリカ南端の喜望峰を回り、1498年に海路でインドへ到達した。地中海や陸の道とは別に、大西洋とインド洋をつなぐ航路が開かれたのだ。ただし、現地には以前から港や交易のネットワークがあった。その後のポルトガルの進出は、武力による支配や衝突も伴った。航海の成功だけでなく、現地の人々への影響も見たい出来事だ。","greeting":"アフリカ南端を回り、インドへ航海しました。どんな航路だったか、地図を思い浮かべてみよう。","qs":["どんな航路でインドへ行ったの？","コロンブスの航海とは何が違うの？","航路の開拓は現地の人々に何をもたらしたの？"]},{"id":146,"name":"ワット","period":"イギリス（1736〜1819年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"蒸気の力をもっと無駄なく！ 工場を動かす改良","color":"#2563eb","accent":"#bfdbfe","bio":"石炭をたくさん燃やすのに、蒸気の力がうまく使えない。イギリスの技術者ワットは、すでにあった蒸気機関の無駄に注目した。蒸気を冷やす場所を別にする工夫などで、燃料をより効率よく使えるようにした。事業家ボールトンとも協力し、工場などで機械を動かす力として広めた。蒸気機関を最初につくった人ではないが、改良は産業革命を支える大きな力になった。人や水車だけに頼らない生産が広がり、働き方や町の姿も変わっていく。","greeting":"蒸気の力をもっと役立てるにはどうすればいいか。機械の改良から産業革命を見てみよう。","qs":["蒸気機関をどう改良したの？","工場の生産はどう変わったの？","産業革命で働く人の生活はどう変わったの？"]},{"id":147,"name":"孫文","period":"中国・清末〜中華民国（1866〜1925年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"皇帝の国から共和国へ、中国の革命を進めた","color":"#2563eb","accent":"#bfdbfe","bio":"清という王朝の支配が続く中国で、孫文は新しい国をつくろうと革命運動を進めた。外国の支配に抵抗し、人々の政治参加や生活の向上を目指す「三民主義」を掲げた。1911年に辛亥革命が起こると、翌年、中華民国の臨時大総統になった。皇帝による政治が終わり、共和国へ進む大きな転換だった。しかし、孫文がそのまま国を安定させたわけではなく、軍人どうしの争いなども続いた。理想を求め、革命後も活動を続けた人物だ。","greeting":"清の時代から新しい国へ。中国で起きた変化を一緒にたどってみましょう。","qs":["辛亥革命って何？","中華民国はどうして成立したの？","三民主義ってどんな考え？"]},{"id":148,"name":"ウィルソン","period":"アメリカ・第一次世界大戦期（1856〜1924年）","emoji":"👤","tag":"世界史","tagColor":"#2563eb","catchphrase":"戦争の後こそ話し合う組織を、でも自国は不参加","color":"#2563eb","accent":"#bfdbfe","bio":"第一次世界大戦で多くの命が失われる中、アメリカ大統領ウィルソンは、戦後の平和のための十四か条を示した。民族が自分たちのあり方を決める考えや、国どうしで協力する組織を提案したのだ。戦後、国際連盟が成立したが、アメリカは国内の反対で加盟しなかった。民族の自立も、植民地のすべてに認められたわけではない。理想を掲げても、そのまま実現するとは限らない。平和をつくる難しさと、当時の限界を示した大統領だ。","greeting":"大きな戦争の後、どうすれば平和を守れるのか。国際連盟の構想から話しましょう。","qs":["十四か条の平和原則って何？","民族自決ってどういう考え？","なぜアメリカは国際連盟に加盟しなかったの？"]},{"id":149,"name":"勝海舟","period":"幕末〜明治時代（1823〜1899年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"江戸を戦場にしないため、敵の西郷と話し合った","color":"#b45309","accent":"#fde68a","bio":"幕府の役人だった勝海舟は、長崎で海軍の技術を学び、咸臨丸で太平洋も渡った。海外の力を知り、船や人材を育てることに取り組んだ。幕府と新政府の戦いが始まると、江戸が戦場になる危機が迫った。そこで新政府側の西郷隆盛と交渉し、1868年、江戸城を大きな戦闘なしに明け渡す道を開いた。幕府の立場を守るだけでなく、町と住民の被害を抑える判断だった。全国の戦争が終わったわけではない。交渉で道を探した人物だ。","greeting":"船を動かすにも、国を動かすにも、相手を知らなきゃ始まらねえ。江戸でどんな選択があったか話そうか。","qs":["江戸城の無血開城とは何？","西郷隆盛とどんな交渉をしたの？","坂本龍馬とはどんな関係？","咸臨丸はどこへ行ったの？","戊辰戦争と無血開城はどうつながるの？"]},{"id":151,"name":"東郷平八郎","period":"明治〜昭和初め（1848〜1934年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"海上の大決戦を指揮、日露戦争の一場面を担った","color":"#b45309","accent":"#fde68a","bio":"明治の日本が海軍を整え、東郷平八郎はイギリスで学び、軍人として経験を積んだ。日露戦争では連合艦隊を率い、1905年の日本海海戦でロシアのバルチック艦隊を破った。多くの船と人を動かすには、訓練や準備が欠かせなかった。ただし、この海戦だけが戦争のすべてではない。陸でも激しい戦いが続き、多くの犠牲と戦費が生じた。戦争を終える条約の交渉は小村寿太郎らが担った。勝利と、戦争が残した重さを共に見たい人物だ。","greeting":"艦隊を動かすには準備と連携が欠かせません。日露戦争の海上で何が起こったのか、確かめていきましょう。","qs":["日本海海戦はいつ起きたの？","日露戦争が起きた理由は？","小村寿太郎とはどんな役割の違いがある？","日本海海戦と旅順の戦いは違うの？","日露戦争の後、日本はどう変わったの？"]},{"id":152,"name":"栄西","period":"平安末〜鎌倉時代（1141〜1215年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"禅を学んで海を渡り、お茶の文化も広めた","color":"#b45309","accent":"#fde68a","bio":"平安時代の終わりから鎌倉時代、栄西は中国の宋へ渡り、仏教を学んだ。日本へ帰ると、坐禅などを重んじる臨済宗の教えを広めた。京都に建仁寺を開くなど、禅を学ぶ拠点づくりにも関わった。武士の支持も得て、その後の仏教や文化に影響を残す。お茶の効用を説く本を書き、茶を飲む習慣を広めたことでも知られる。ただし、日本に初めて茶を持ち込んだ人ではない。海の向こうの学びを、修行だけでなく暮らしにもつないだ僧だった。","greeting":"急いで答えを出さず、目の前のことをよく見てみましょう。禅や宋との交流について話せますよ。","qs":["栄西が広めた宗派は何？","道元の曹洞宗とはどう違う？","禅宗はなぜ武士に広まったの？","茶と栄西にはどんな関係がある？","建仁寺はどこにあるの？"]},{"id":153,"name":"井原西鶴","period":"江戸時代（1642〜1693年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"商売も借金も人の欲も、町の暮らしが物語に","color":"#b45309","accent":"#fde68a","bio":"江戸時代、商業で栄える大阪などの町では、お金をめぐる喜びや苦労があふれていた。井原西鶴は、そんな町人たちの姿を生き生きと書いた作家だ。俳諧でも活躍した後、『好色一代男』などの浮世草子と呼ばれる小説を書いた。『日本永代蔵』には商人の成功や失敗、『世間胸算用』には年の暮れの金銭のやりくりが登場する。人は計算どおりに動くとは限らない。お金に振り回される姿の中に、笑いと切実さを描いた、元禄文化の代表者だ。","greeting":"人の欲も笑いも、町にはいくらでも転がっているね。上方の商人や浮世草子の話でもしようか。","qs":["浮世草子って何？","『日本永代蔵』はどんな作品？","元禄文化が上方で栄えたのはなぜ？","近松門左衛門と何が違うの？","当時の町人は何を楽しんでいたの？"]},{"id":154,"name":"尾形光琳","period":"江戸時代（1658〜1716年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"花の置き方ひとつで変わる、金色の屏風の世界","color":"#b45309","accent":"#fde68a","bio":"金色の画面に、青い花と緑の葉を大胆に並べる。尾形光琳は、江戸時代の京都で活躍した絵師だ。呉服商の家に生まれ、華やかな町の文化にも触れて育った。代表作『燕子花図屏風』では、花を写真のように再現するのではなく、形や並べ方のリズムで見る人を引きつける。『紅白梅図屏風』も有名だ。俵屋宗達の表現に学び、後に琳派と呼ばれる美術の流れを発展させた。屏風をただの仕切りから、部屋の印象を変える絵の世界にした人物だ。","greeting":"花の形は同じでも、並べ方で景色が変わるんだ。屏風の絵を一緒に見てみないか。","qs":["『燕子花図屏風』はどんな作品？","琳派とは何？","俵屋宗達とはどんな関係？","菱川師宣の浮世絵との違いは？","元禄文化で絵画が発達した背景は？"]},{"id":155,"name":"菱川師宣","period":"江戸時代（生年不詳〜1694年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"ふと振り返る一瞬が、江戸の人気絵画になった","color":"#b45309","accent":"#fde68a","bio":"豪華な武将や昔の英雄だけでなく、町の人の姿も絵の主役になる。江戸時代前期の菱川師宣は、人々の暮らしや女性の姿を描き、浮世絵を発展させた。代表作『見返り美人図』には、着物姿で振り返る女性が描かれている。この絵は版画ではなく、筆で描いた作品だ。本の挿絵や版画などにも関わり、絵を楽しむ世界を広げた。後の北斎や広重の風景画より、前の時代の人だ。町人が文化を支える中、身近な姿に美や面白さを見いだした絵師だ。","greeting":"ふと振り返る仕草一つで、絵には動きが生まれる。町人の暮らしをどう描いたのか話そうか。","qs":["『見返り美人図』はどんな絵？","浮世絵はどうやって作ったの？","肉筆画って何？","尾形光琳との違いは？","北斎や広重よりいつ頃の人物？"]},{"id":156,"name":"十返舎一九","period":"江戸時代（1765〜1831年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"弥次さん喜多さんの失敗が、江戸の人々を笑わせた","color":"#b45309","accent":"#fde68a","bio":"旅に出たら、予定どおりにいかないことばかり。十返舎一九は、弥次郎兵衛と喜多八の珍道中を描いた『東海道中膝栗毛』で人気を集めた、江戸時代後期の作家だ。二人は街道や宿場で失敗や騒動を重ね、読者はそのやり取りを楽しんだ。笑いを中心にした「滑稽本」の代表作で、旅や出版が盛んになった社会ともつながる。実際の旅行記ではなく、工夫された物語だ。遠くへ行けない人にも、旅の景色と人のおかしさを、本で届けた人物だ。","greeting":"旅の道中は思いがけないことばかり。弥次さん喜多さんの珍道中をのぞいてみようか。","qs":["『東海道中膝栗毛』はどんな話？","滑稽本って何？","化政文化と元禄文化の違いは？","曲亭馬琴とは何が違う？","江戸時代の旅はどんな様子だったの？"]},{"id":157,"name":"滝沢馬琴","aliases":["曲亭馬琴","滝沢馬琴","曲亭馬琴（滝沢馬琴）"],"period":"江戸時代（1767〜1848年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"八人の犬士の物語、完成まで約二十八年！","color":"#b45309","accent":"#fde68a","bio":"不思議な縁で結ばれた八人の犬士が活躍する『南総里見八犬伝』。江戸時代後期の作家・馬琴は、物語を約二十八年かけて書いた。滝沢馬琴という呼び名で知られるが、作品で使った筆名は曲亭馬琴だ。歴史や伝説を材料にしながら、大きな物語の世界を組み立てた。登場人物の活躍は、実際の歴史そのものではない。晩年に視力を失っても、家族に助けられて執筆を続けた。出版が盛んな江戸で、長い物語を追う読者の楽しみを育てた作家だ。","greeting":"長い物語では、一人の行動が後の展開につながる。八犬伝の世界や江戸の読書について話そうか。","qs":["『南総里見八犬伝』はどんな話？","読本と滑稽本はどう違うの？","滝沢馬琴と曲亭馬琴は同じ人？","なぜ28年もかけて書いたの？","化政文化で本が広がったのはなぜ？"]},{"id":158,"name":"狩野永徳","period":"安土桃山時代（1543〜1590年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"城の広い壁いっぱいに、天下人の迫力を描いた","color":"#b45309","accent":"#fde68a","bio":"戦国の有力者が大きな城を築くと、中を飾る絵にも強さや豪華さが求められた。狩野永徳は、織田信長や豊臣秀吉のために、城や御殿の壁・ふすまなどへ絵を描いた絵師だ。金色を使った画面や、のびのびした大きな形で、部屋を迫力ある空間にした。『唐獅子図屏風』でも知られ、桃山文化を代表する。安土城など、建物と共に失われた仕事も多い。一枚の絵だけでなく、城という舞台ごと飾る仕事から、権力者と芸術の結び付きが見える。","greeting":"大きな壁いっぱいに絵を描くと、部屋の空気まで変わる。桃山文化の豪華さを見てみよう。","qs":["『唐獅子図屏風』はどんな作品？","障壁画とは何？","織田信長や豊臣秀吉とどんな関係？","桃山文化の特徴は？","尾形光琳の絵とは何が違うの？"]},{"id":159,"name":"藤原清衡","period":"平安時代後期（1056〜1128年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"争いの記憶から平泉へ、金色堂に込めた願い","color":"#b45309","accent":"#fde68a","bio":"東北で争いが続いた時代に生まれた藤原清衡は、家族を失うなど、戦いの苦しさを経験した。やがて平泉を拠点に勢力を整え、奥州藤原氏の基礎を築いた。中尊寺の造営を進め、1124年には金色堂を建てた。建物には、富を示すだけでなく、戦死者を敵味方の区別なくとむらう願いも込められた。平泉は栄え、豊かな文化を育てた。源義経を保護した藤原秀衡とは別人で、清衡はその祖父にあたる。争いの後の国づくりを考えた人物だ。","greeting":"争いの後に、どんな土地を築くか。平泉の文化と東北の歴史を一緒に見てみよう。","qs":["藤原清衡は平泉で何をしたの？","中尊寺金色堂との関係は？","前九年・後三年の合戦とは？","源義経を守った藤原秀衡と同じ人？","平泉はなぜ栄えたの？"]},{"id":160,"name":"武田信玄","period":"戦国時代（1521〜1573年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"合戦に強いだけじゃない、田畑を守る領地づくり","color":"#b45309","accent":"#fde68a","bio":"甲斐、今の山梨県を拠点にした戦国大名の武田信玄。周辺へ勢力を広げ、信濃の川中島では上杉謙信と何度も戦った。強い軍で知られる一方、領地で暮らす人々をどう支えるかも重要だった。川の氾濫に備える治水や、武士たちをまとめる決まりづくりにも取り組んだ。田畑が荒れれば、年貢も兵の食べ物も得られない。戦う力と領地を治める力はつながっていたのだ。全国統一を果たした人ではないが、戦国大名が国を動かす姿を示している。","greeting":"軍勢だけでは国は保てぬ。川を治め田畑を守ることも大切じゃ。どの話から聞きたい？","qs":["武田信玄が治めた国はどこ？","上杉謙信との川中島の戦いとは？","戦国大名は領地をどう治めたの？","分国法とは何？","信玄堤は何のために作られたの？"]},{"id":161,"name":"上杉謙信","period":"戦国時代（1530〜1578年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"越後から川中島へ、信玄と競い合った戦国大名","color":"#b45309","accent":"#fde68a","bio":"今の新潟県にあたる越後を本拠とした上杉謙信は、地域の武士をまとめて力を伸ばした戦国大名だ。隣の信濃へ勢力を広げる武田信玄と対立し、川中島でたびたび戦った。関東の争いにも関わり、広い範囲で戦った。後の世には、正義を重んじる「義の武将」として語られるようになる。ただし、何でも美談のとおりだったと決めつけることはできない。伝説と記録を分けて見ると、領地や同盟をめぐって争った、戦国の現実も見えてくる。","greeting":"越後の山から眺めれば、国境の向こうにも多くの暮らしがある。川中島の戦いをどう考える？","qs":["上杉謙信が治めた国はどこ？","武田信玄とどこで戦ったの？","川中島の戦いはなぜ起こったの？","戦国大名はどんな政治をしたの？","「義の武将」という評判は史実なの？"]},{"id":162,"name":"俵屋宗達","period":"江戸時代初め（生没年不詳）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"金色の余白に風と雷、大胆な配置で生まれる迫力","color":"#b45309","accent":"#fde68a","bio":"風の袋を持つ神と、太鼓を背負う神。俵屋宗達の『風神雷神図屏風』では、二つの姿が金色の画面の両端に現れる。真ん中に何も描かない余白があるからこそ、空間の広がりや動きが感じられる。宗達は江戸時代初めの京都で活躍し、扇などの絵をつくる工房にも関わったと考えられる。詳しい生涯には分からないことが多い。後の尾形光琳も作品から学び、琳派と呼ばれる美術につながった。主役だけでなく、空いた場所まで生かした絵師だ。","greeting":"金色の広い余白に、二つの姿をどう置くか。それだけで絵に動きが生まれます。屏風の話をしましょう。","qs":["『風神雷神図屏風』は誰が描いたの？","尾形光琳との関係は？","琳派とはどんな美術？","屏風の金色にはどんな効果があるの？","狩野永徳の障壁画とはどう違うの？"]},{"id":164,"name":"足利義昭","period":"室町時代末期（1537〜1597年）","emoji":"👤","tag":"日本史","tagColor":"#b45309","catchphrase":"信長に助けられて将軍へ、最後は都を追われた","color":"#b45309","accent":"#fde68a","bio":"室町幕府十五代将軍の足利義昭は、もとは寺で暮らす僧だった。兄の将軍が殺されると寺を離れ、将軍にしてくれる人を探した。織田信長の力で京都へ入り、将軍になったが、やがて信長と対立する。ほかの大名らへ協力を求めたものの、1573年に京都を追われた。教科書では、これを室町幕府の滅亡とする。その後も将軍として活動し、すぐに役職を辞めたわけではない。肩書と政治を動かす力が、別になっていく時代を示す人物だ。","greeting":"将軍の名だけで世を動かすのは難しいものです。信長と協力した理由や、対立の経緯を確かめましょう。","qs":["足利義昭は何代目の将軍？","織田信長が義昭を助けた理由は？","1573年に何が起きたの？","足利義満・足利義政とはどう違う？","京都を追われた後は何をしていたの？"]}];

function historyAvatarHTML(ch){
  const ident = Number(ch.id);

}
