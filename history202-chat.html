<!doctype html>
<html lang="ja" data-chat-open="true" data-group-open="true" data-persona="neko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="same-origin">
<meta name="theme-color" content="#fffcf7">
<title>歴史の重要ワード202 | JUKEN CAMP</title>
<script id="history202-theme-before-paint">(()=>{let mode='';try{if(parent!==window&&parent.location.origin===location.origin)mode=parent.document.documentElement.dataset.persona||''}catch(_){}if(mode!=='cyber'&&mode!=='neko')try{mode=localStorage.getItem('nekopon-character-theme-v1')||''}catch(_){}mode=mode==='cyber'?'cyber':'neko';document.documentElement.dataset.persona=mode;document.documentElement.style.colorScheme=mode==='cyber'?'dark':'light';})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<!-- 戦国グルチャが使用する正規のチャットCSSをそのまま使う -->
<link rel="stylesheet" href="sengoku-chat/original-chat.css?v=1">
<link rel="stylesheet" href="sengoku-chat/room.css?v=ui20261107-2">
<link rel="stylesheet" href="history202/room.css?v=cyber-labels-count-fit-20261108-v7">
<script src="history202/room.js?v=20261108-photo-compact-no-source-v2" defer></script>
<style>

/* History202: mobile-safe, small photographic chat bubbles. No credit or disclaimer UI. */
#group-view #group-messages,
#group-view #group-messages-inner,
#group-view #group-messages .bubble-row{max-width:100%!important;min-width:0!important}
#group-view #group-messages .bubble-row:has(.h202-real-image-bubble){overflow:visible;min-width:0!important}
#group-view #group-messages .group-reply-content.h202-has-image{
 display:grid!important;
 grid-template-columns:minmax(0,1fr) auto!important;
 column-gap:5px!important;
 width:min(100%,270px)!important;
 max-width:calc(100vw - 95px)!important;
 min-width:0!important;
 align-items:end!important;
 box-sizing:border-box!important;
}
#group-view #group-messages .group-reply-content.h202-has-image>.group-reply-name{
 grid-column:1/-1!important;grid-row:auto!important;min-width:0!important;
}
#group-view #group-messages .group-reply-content.h202-has-image>.h202-real-image-bubble{
 display:block!important;
 grid-column:1!important;grid-row:auto!important;
 width:100%!important;max-width:100%!important;min-width:0!important;
 box-sizing:border-box!important;
 height:auto!important;max-height:none!important;
 margin:0!important;padding:7px!important;
 overflow:hidden!important;white-space:normal!important;text-align:left!important;
 line-height:1.4!important;
}
#group-view #group-messages .h202-real-image-bubble img{
 display:block!important;
 box-sizing:border-box!important;
 width:100%!important;max-width:100%!important;
 height:clamp(130px,42vw,205px)!important;
 max-height:205px!important;
 min-width:0!important;object-fit:contain!important;
 object-position:center!important;
 border:0!important;border-radius:9px!important;
 margin:0!important;padding:0!important;
 background:rgba(255,255,255,.035)!important;
}
#group-view #group-messages .h202-real-image-caption{
 display:block!important;width:100%!important;
 overflow-wrap:anywhere!important;word-break:normal!important;
 margin:5px 1px 0!important;padding:0!important;
 font-size:11px!important;font-weight:700!important;
 line-height:1.45!important;white-space:normal!important;
}
#group-view #group-messages .group-reply-content.h202-has-image>.history-message-time{
 grid-column:2!important;grid-row:auto!important;
 align-self:end!important;white-space:nowrap!important;
 margin:0 0 2px 0!important;
}
#group-view #group-messages .h202-real-image-credit,
#group-view #group-messages .h202-image-source-always,
#group-view #group-messages .h202-image-source-link{display:none!important}
#group-view #group-messages .h202-image-load-failure{
 display:block!important;white-space:normal!important;
 padding:20px 5px!important;font-size:11px!important;line-height:1.5!important;
}

</style>
</head>
<body>
<section id="group-view" aria-label="歴史の重要ワード202・閲覧専用">
 <header class="chat-header">
  <button type="button" id="h202-back" class="back-btn" aria-label="グルチャ一覧に戻る">＜</button>
  <div class="group-heading">
   <span id="group-header-avatar" class="chat-avatar sengoku-avatar-placeholder" aria-hidden="true"></span>
   <div class="group-heading-text"><button type="button" id="group-title" title="31話の目次を表示" aria-label="31話の目次を開く">歴史の重要ワード202</button><span id="sengoku-period-badge">31話・202項目</span></div>
  </div>
  <div class="group-header-actions">
   <button type="button" id="group-search-toggle" class="chat-reset" aria-label="会話を検索" title="会話を検索" aria-expanded="false" aria-controls="group-search-form"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
   <button type="button" id="group-members-direct" class="chat-reset" aria-label="参加者一覧を開く" title="参加者一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="7.5" cy="8" r=".8" stroke="none" fill="currentColor"/><circle cx="7.5" cy="12" r=".8" stroke="none" fill="currentColor"/><circle cx="7.5" cy="16" r=".8" stroke="none" fill="currentColor"/><path d="M11 8h6M11 12h6M11 16h6"/></svg></button>
  </div>
  <form id="group-search-form" class="group-search-header" role="search" aria-label="会話を検索" hidden>
   <div class="group-search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input type="search" id="group-search-input" placeholder="この話の会話を検索" enterkeyhint="search" aria-label="検索キーワード"><button type="button" id="group-search-clear" class="group-search-icon-button" aria-label="検索語を消す" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
   <button type="button" id="group-search-close" class="group-search-icon-button" aria-label="検索を閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </form>
 </header>
 <div id="group-messages" class="messages" role="log" aria-live="polite" tabindex="0"><div id="group-messages-inner" class="messages-inner"><p id="h202-empty">会話を読み込んでいます…</p></div></div>
 <div id="h202-explain" role="region" aria-label="タップした発言の解説"><div id="h202-explain-text" aria-live="polite"></div></div>
 <!-- 戦国グルチャと同じ、送信欄なしの閲覧専用画面 -->
 <div id="group-members" hidden>
  <header class="members-header"><button id="group-members-back" class="back-btn" type="button" aria-label="チャットに戻る">＜</button><div class="members-heading"><span class="group-members-avatar sengoku-avatar-placeholder" aria-hidden="true"></span><h2 class="members-title">歴史の重要ワード202</h2></div></header>
  <div class="members-scroll"><div id="group-member-list"></div></div>
 </div>
</section>
<div id="h202-index-layer" hidden>
 <div id="h202-index-backdrop"></div>
 <section id="h202-index-panel" role="dialog" aria-modal="true" aria-label="全31話の目次">
  <header class="members-header"><button id="h202-index-back" class="back-btn" type="button" aria-label="チャットに戻る">＜</button><div class="members-heading"><h2 class="members-title">31話の目次</h2></div></header>
  <div id="h202-index-list" class="members-scroll"></div>
 </section>
</div>
</body>
</html>
