<script>
const H202_DEMO_FILES={"history202/chapters.json":{"title":"歴史の暗記202グルチャ","source":"rekishi-check(2).txt + history202_sample(1).txt","chapters":[{"category":"古代文明","entries":[{"term":"メソポタミア","sourceNote":"チグリス・ユーフラテス川で栄えた文明","studyNote":"チグリス・ユーフラテス川で栄えた文明"},{"term":"エジプト","sourceNote":"ナイル川流域のピラミッドで有名な文明","studyNote":"ナイル川流域のピラミッドで有名な文明"},{"term":"インダス","sourceNote":"モヘンジョダロなど計画都市が特徴","studyNote":"モヘンジョダロなど計画都市が特徴"},{"term":"中国","sourceNote":"黄河・長江流域で発展した四大文明の一つ","studyNote":"黄河・長江流域で発展した四大文明の一つ"},{"term":"ギリシャ","sourceNote":"ポリスや哲学で知られる地中海文明","studyNote":"ポリスや哲学で知られる地中海文明"}],"id":1,"title":"世界の文明は、なぜ川から始まった？","subtitle":"川→食料→町→国。5つの文明を旅する","messages":[{"speaker":"受験生","text":"古代文明、5つもある。もう名前だけで頭がいっぱい……。","role":"modern","id":"h01-001","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"今日は最初に5つ並べるよ。物語のゴールを先に知っておこう。","role":"historical","id":"h01-002","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"①メソポタミア ②エジプト ③インダス ④中国 ⑤ギリシャ。","role":"historical","id":"h01-003","matchedTerms":["メソポタミア","エジプト","インダス","中国","ギリシャ"],"explanation":"メソポタミア：チグリス・ユーフラテス川で栄えた文明\nエジプト：ナイル川流域のピラミッドで有名な文明\nインダス：モヘンジョダロなど計画都市が特徴\n中国：黄河・長江流域で発展した四大文明の一つ\nギリシャ：ポリスや哲学で知られる地中海文明"},{"speaker":"受験生","text":"四大文明なのに、5つあるの？","role":"modern","id":"h01-004","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ソクラテス","text":"いいところに気づいたね。最初の4つを学校で「四大文明」と呼ぶことが多い。ギリシャは別だけど、同じく重要な古代文明だ。","role":"historical","id":"h01-005","matchedTerms":["ギリシャ"],"explanation":"ギリシャ：ポリスや哲学で知られる地中海文明"},{"speaker":"受験生","text":"なるほど。じゃあ、どうして文明は生まれたの？","role":"modern","id":"h01-006","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ハンムラビ王","text":"想像してみてくれ。大昔の人々は、食べ物を探して歩くことも多かった。ある日、大きな川の近くに住むと便利だと気づいたんだ。","role":"historical","id":"h01-007","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"水が飲めるから？","role":"modern","id":"h01-008","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ハンムラビ王","text":"それだけじゃない。川の水を畑に引けば、たくさんの作物を育てられる。","role":"historical","id":"h01-009","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ハンムラビ王","text":"食べ物が増える→人が集まる→町が大きくなる。これが大切な流れだ。","role":"historical","id":"h01-010","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"人が多くなると、畑を世話する人以外の仕事もできそう。","role":"modern","id":"h01-011","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"そう。物を交換する人、建物をつくる人、国をまとめる人。文字や法律も必要になっていく。","role":"historical","id":"h01-012","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ハンムラビ王","text":"まず私のいたメソポタミア。チグリス川とユーフラテス川という2本の大きな川の間で発展した。","role":"historical","id":"h01-013","matchedTerms":["メソポタミア"],"explanation":"メソポタミア：チグリス・ユーフラテス川で栄えた文明"},{"speaker":"受験生","text":"2本の川の間に町ができたのが、メソポタミア！","role":"modern","id":"h01-014","matchedTerms":["メソポタミア"],"explanation":"メソポタミア：チグリス・ユーフラテス川で栄えた文明"},{"speaker":"ハンムラビ王","text":"私はずっと後の時代の王だが、争いごとをどう裁くかを法律にまとめたことで知られる。「人が増えると決まりが必要になる」わけだ。","role":"historical","id":"h01-015","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"川の名前だけじゃなくて、町が大きくなった後のことまで覚えられる。","role":"modern","id":"h01-016","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"次はエジプト。長いナイル川の周りで農業が盛んになった。","role":"historical","id":"h01-017","matchedTerms":["エジプト"],"explanation":"エジプト：ナイル川流域のピラミッドで有名な文明"},{"speaker":"受験生","text":"エジプトといえばピラミッド！","role":"modern","id":"h01-018","matchedTerms":["エジプト"],"explanation":"エジプト：ナイル川流域のピラミッドで有名な文明"},{"speaker":"AI先生","text":"ピラミッドは王の墓としてつくられたもの。巨大な建物を造れるほど、国に多くの人と技術が集まっていたんだ。","role":"historical","id":"h01-019","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"メソポタミアは2本の川。エジプトはナイル川とピラミッド。","role":"modern","id":"h01-020","matchedTerms":["メソポタミア","エジプト"],"explanation":"メソポタミア：チグリス・ユーフラテス川で栄えた文明\nエジプト：ナイル川流域のピラミッドで有名な文明"},{"speaker":"AI先生","text":"3つ目のインダス文明は、インダス川の流域など。モヘンジョダロという町が有名だよ。","role":"historical","id":"h01-021","matchedTerms":["インダス"],"explanation":"インダス：モヘンジョダロなど計画都市が特徴"},{"speaker":"受験生","text":"何がすごい町なの？","role":"modern","id":"h01-022","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"道路が整い、水を流す設備まであった。計画して町をつくったことがわかるんだ。","role":"historical","id":"h01-023","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"大昔の町にも、今の町みたいな工夫があったんだね。","role":"modern","id":"h01-024","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"始皇帝","text":"4つ目は中国の文明だ。黄河や長江の流域で、長い時間をかけてさまざまな文化が発展した。","role":"historical","id":"h01-025","matchedTerms":["中国"],"explanation":"中国：黄河・長江流域で発展した四大文明の一つ"},{"speaker":"受験生","text":"中国は黄河と長江、2つの川をセットで覚える。","role":"modern","id":"h01-026","matchedTerms":["中国"],"explanation":"中国：黄河・長江流域で発展した四大文明の一つ"},{"speaker":"始皇帝","text":"私が中国を初めて統一したのは紀元前221年。文明そのものは、それよりはるか昔からあったんだ。","role":"historical","id":"h01-027","matchedTerms":["中国"],"explanation":"中国：黄河・長江流域で発展した四大文明の一つ"},{"speaker":"受験生","text":"始皇帝が文明をつくったわけじゃないんだね。","role":"modern","id":"h01-028","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ソクラテス","text":"では5つ目、ギリシャに来よう。地中海のそばにはアテネなどの「ポリス」があった。","role":"historical","id":"h01-029","matchedTerms":["ギリシャ"],"explanation":"ギリシャ：ポリスや哲学で知られる地中海文明"},{"speaker":"受験生","text":"ポリスって警察のこと？","role":"modern","id":"h01-030","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ソクラテス","text":"ここでは違うよ。町と周りの土地が一つの国のようになった「都市国家」のことだ。","role":"historical","id":"h01-031","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"ソクラテス","text":"人々は政治のあり方や「よい生き方とは何か」も話し合った。私は質問を重ねて物事を考える哲学者として知られる。","role":"historical","id":"h01-032","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"川と農業で大きくなった国もあれば、町を中心に発展したギリシャもあるんだ。","role":"modern","id":"h01-033","matchedTerms":["ギリシャ"],"explanation":"ギリシャ：ポリスや哲学で知られる地中海文明"},{"speaker":"AI先生","text":"ここでテスト。『インダス文明の計画都市は？』","role":"historical","id":"h01-034","matchedTerms":["インダス"],"explanation":"インダス：モヘンジョダロなど計画都市が特徴"},{"speaker":"受験生","text":"モヘンジョダロ！","role":"modern","id":"h01-035","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"『ナイル川とピラミッドは？』","role":"historical","id":"h01-036","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"エジプト！","role":"modern","id":"h01-037","matchedTerms":["エジプト"],"explanation":"エジプト：ナイル川流域のピラミッドで有名な文明"},{"speaker":"AI先生","text":"『チグリス川・ユーフラテス川は？』","role":"historical","id":"h01-038","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"メソポタミア！","role":"modern","id":"h01-039","matchedTerms":["メソポタミア"],"explanation":"メソポタミア：チグリス・ユーフラテス川で栄えた文明"},{"speaker":"AI先生","text":"『黄河・長江は？　ポリスは？』","role":"historical","id":"h01-040","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"中国！　ポリスはギリシャ！","role":"modern","id":"h01-041","matchedTerms":["中国","ギリシャ"],"explanation":"中国：黄河・長江流域で発展した四大文明の一つ\nギリシャ：ポリスや哲学で知られる地中海文明"},{"speaker":"ソクラテス","text":"最後に、5つを順番にもう一度。今回は特徴も一緒に言おう。","role":"historical","id":"h01-042","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"①メソポタミア＝チグリス川・ユーフラテス川。","role":"modern","id":"h01-043","matchedTerms":["メソポタミア"],"explanation":"メソポタミア：チグリス・ユーフラテス川で栄えた文明"},{"speaker":"受験生","text":"②エジプト＝ナイル川・ピラミッド。","role":"modern","id":"h01-044","matchedTerms":["エジプト"],"explanation":"エジプト：ナイル川流域のピラミッドで有名な文明"},{"speaker":"受験生","text":"③インダス＝モヘンジョダロ。","role":"modern","id":"h01-045","matchedTerms":["インダス"],"explanation":"インダス：モヘンジョダロなど計画都市が特徴"},{"speaker":"受験生","text":"④中国＝黄河・長江。","role":"modern","id":"h01-046","matchedTerms":["中国"],"explanation":"中国：黄河・長江流域で発展した四大文明の一つ"},{"speaker":"受験生","text":"⑤ギリシャ＝ポリス・哲学。","role":"modern","id":"h01-047","matchedTerms":["ギリシャ"],"explanation":"ギリシャ：ポリスや哲学で知られる地中海文明"},{"speaker":"AI先生","text":"完璧。最初の4つを「四大文明」と呼び、ギリシャを加えると今回の5つ。文明を生んだ川の役目も忘れないでね。","role":"historical","id":"h01-048","matchedTerms":["ギリシャ"],"explanation":"ギリシャ：ポリスや哲学で知られる地中海文明"}],"count":5,"messageCount":48},{"category":"時代","entries":[{"term":"縄文","sourceNote":"土器や狩猟採集生活が特徴の時代","studyNote":"土器や狩猟採集生活が特徴の時代"},{"term":"弥生","sourceNote":"稲作が伝わり金属器が普及した時代","studyNote":"稲作が伝わり金属器が普及した時代"},{"term":"古墳","sourceNote":"巨大な古墳が権力の象徴とされた時代","studyNote":"巨大な古墳が権力の象徴とされた時代"},{"term":"飛鳥","sourceNote":"仏教文化と中央集権体制が始まった時代","studyNote":"仏教文化と中央集権体制が始まった時代"},{"term":"奈良","sourceNote":"平城京に都が置かれた仏教文化の時代","studyNote":"平城京に都が置かれた仏教文化の時代"},{"term":"平安","sourceNote":"貴族文化が栄えた和風の文化の時代","studyNote":"794年、都が平安京へ移った後、貴族文化が栄えた時代。"},{"term":"鎌倉","sourceNote":"武士が権力を握り幕府を開いた時代","studyNote":"武士が権力を握り幕府を開いた時代"},{"term":"南北朝","sourceNote":"朝廷が南北に分かれて争った時代","studyNote":"1336〜1392年ごろ、朝廷が南北に分かれた時代。室町時代と重なる。"},{"term":"室町","sourceNote":"足利氏が京都を中心に統治した時代","studyNote":"足利氏が京都を中心に統治した時代"},{"term":"戦国","sourceNote":"戦国大名が各地を支配した混乱の時代","studyNote":"室町後期に各地の戦国大名が勢力を争った時代。"},{"term":"安土桃山","sourceNote":"織田・豊臣が統一を目指した華やかな時代","studyNote":"織田・豊臣が統一を目指した華やかな時代"},{"term":"江戸","sourceNote":"徳川幕府が約260年続いた安定の時代","studyNote":"徳川幕府が約260年続いた安定の時代"},{"term":"明治","sourceNote":"近代化と文明開化が進んだ激動の時代","studyNote":"近代化と文明開化が進んだ激動の時代"},{"term":"大正","sourceNote":"民主主義と文化が栄えた短い時代","studyNote":"民主主義と文化が栄えた短い時代"},{"term":"昭和","sourceNote":"戦争・復興・高度経済成長があった時代","studyNote":"戦争・復興・高度経済成長があった時代"},{"term":"平成","sourceNote":"バブル崩壊後の安定と変化の時代","studyNote":"バブル崩壊後の安定と変化の時代"},{"term":"令和","sourceNote":"新しい日本の時代で現在も続いている","studyNote":"新しい日本の時代で現在も続いている"}],"id":2,"title":"時代は「生活の変化」でつながる","subtitle":"縄文から令和まで、一本の長い物語","messages":[{"speaker":"受験生","text":"時代の名前を覚えるだけだと、どれが先かわからなくなる。","role":"modern","id":"h02-001","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"最初に17の時代を通して見てみよう。","role":"historical","id":"h02-002","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"①縄文 ②弥生 ③古墳 ④飛鳥 ⑤奈良 ⑥平安 ⑦鎌倉 ⑧南北朝 ⑨室町 ⑩戦国 ⑪安土桃山 ⑫江戸 ⑬明治 ⑭大正 ⑮昭和 ⑯平成 ⑰令和。","role":"historical","id":"h02-003","matchedTerms":["縄文","弥生","古墳","飛鳥","奈良","平安","鎌倉","南北朝","室町","戦国","安土桃山","江戸","明治","大正","昭和","平成","令和"],"explanation":"縄文：土器や狩猟採集生活が特徴の時代\n弥生：稲作が伝わり金属器が普及した時代\n古墳：巨大な古墳が権力の象徴とされた時代\n飛鳥：仏教文化と中央集権体制が始まった時代\n奈良：平城京に都が置かれた仏教文化の時代\n平安：794年、都が平安京へ移った後、貴族文化が栄えた時代。\n鎌倉：武士が権力を握り幕府を開いた時代\n南北朝：1336〜1392年ごろ、朝廷が南北に分かれた時代。室町時代と重なる。\n室町：足利氏が京都を中心に統治した時代\n戦国：室町後期に各地の戦国大名が勢力を争った時代。\n安土桃山：織田・豊臣が統一を目指した華やかな時代\n江戸：徳川幕府が約260年続いた安定の時代\n明治：近代化と文明開化が進んだ激動の時代\n大正：民主主義と文化が栄えた短い時代\n昭和：戦争・復興・高度経済成長があった時代\n平成：バブル崩壊後の安定と変化の時代\n令和：新しい日本の時代で現在も続いている"},{"speaker":"受験生","text":"長い……。これを全部覚えるの？","role":"modern","id":"h02-004","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"大丈夫。4つの場面に分ける。「暮らし」「天皇と都」「武士」「近代から今」だ。","role":"historical","id":"h02-005","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"まず縄文時代。人々は木の実を集めたり、魚や動物をとったりした。縄文土器も使った。","role":"historical","id":"h02-006","matchedTerms":["縄文"],"explanation":"縄文：土器や狩猟採集生活が特徴の時代"},{"speaker":"受験生","text":"縄文は土器と狩りや採集。","role":"modern","id":"h02-007","matchedTerms":["縄文"],"explanation":"縄文：土器や狩猟採集生活が特徴の時代"},{"speaker":"卑弥呼","text":"次の弥生時代、米を水田で育てる稲作が広がった。青銅器や鉄器も使われる。","role":"historical","id":"h02-008","matchedTerms":["弥生"],"explanation":"弥生：稲作が伝わり金属器が普及した時代"},{"speaker":"受験生","text":"食べ物を集めるだけじゃなく、自分たちで育てる暮らしが広まったんだ。","role":"modern","id":"h02-009","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"ただし、昔の暮らしが一斉に消えたわけではないよ。変化が広がるには時間がかかった。","role":"historical","id":"h02-010","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"卑弥呼","text":"私は弥生時代の邪馬台国の女王だ。米が取れる土地や人々をまとめる国々があった。","role":"historical","id":"h02-011","matchedTerms":["弥生"],"explanation":"弥生：稲作が伝わり金属器が普及した時代"},{"speaker":"受験生","text":"そうか、米づくりと国づくりもつながるんだね。","role":"modern","id":"h02-012","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"古墳時代には、大きな墓をつくるほど力を持つ人々が現れた。前方後円墳が有名だよ。","role":"historical","id":"h02-013","matchedTerms":["古墳"],"explanation":"古墳：巨大な古墳が権力の象徴とされた時代"},{"speaker":"受験生","text":"お墓が大きい＝力のある人がいた証拠。","role":"modern","id":"h02-014","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"聖徳太子","text":"飛鳥時代は、仏教が広がり、天皇を中心とする国づくりが進んだ時代だ。私は推古天皇を助けたと伝わる。","role":"historical","id":"h02-015","matchedTerms":["飛鳥"],"explanation":"飛鳥：仏教文化と中央集権体制が始まった時代"},{"speaker":"受験生","text":"昔の村や国が、だんだん大きな仕組みになっていく。","role":"modern","id":"h02-016","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"710年に平城京へ都が移ると、奈良時代。東大寺の大仏や、仏教の文化が有名だ。","role":"historical","id":"h02-017","matchedTerms":["奈良"],"explanation":"奈良：平城京に都が置かれた仏教文化の時代"},{"speaker":"受験生","text":"飛鳥は国づくり、奈良は平城京と大仏。","role":"modern","id":"h02-018","matchedTerms":["飛鳥","奈良"],"explanation":"飛鳥：仏教文化と中央集権体制が始まった時代\n奈良：平城京に都が置かれた仏教文化の時代"},{"speaker":"紫式部","text":"794年、都は京都の平安京へ移りました。そこから平安時代です。","role":"historical","id":"h02-019","matchedTerms":["平安"],"explanation":"平安：794年、都が平安京へ移った後、貴族文化が栄えた時代。"},{"speaker":"紫式部","text":"貴族たちの間では、かな文字を使った文学が発展しました。私の『源氏物語』もその一つです。","role":"historical","id":"h02-020","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"飛鳥→奈良→平安は、国の仕組みと都と文化でつながるんだ。","role":"modern","id":"h02-021","matchedTerms":["飛鳥","奈良","平安"],"explanation":"飛鳥：仏教文化と中央集権体制が始まった時代\n奈良：平城京に都が置かれた仏教文化の時代\n平安：794年、都が平安京へ移った後、貴族文化が栄えた時代。"},{"speaker":"AI先生","text":"では、誰が政治を動かすかが変わる場面へ行こう。","role":"historical","id":"h02-022","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"源頼朝","text":"鎌倉時代には武士が政治の大きな力を握る。私は鎌倉に幕府の仕組みをつくり、1192年に征夷大将軍になった。","role":"historical","id":"h02-023","matchedTerms":["鎌倉"],"explanation":"鎌倉：武士が権力を握り幕府を開いた時代"},{"speaker":"受験生","text":"貴族や天皇の時代から、武士の時代へ！","role":"modern","id":"h02-024","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"その後の南北朝時代は、天皇のいる朝廷が南と北に分かれて争った時期だ。","role":"historical","id":"h02-025","matchedTerms":["南北朝"],"explanation":"南北朝：1336〜1392年ごろ、朝廷が南北に分かれた時代。室町時代と重なる。"},{"speaker":"受験生","text":"室町時代の前に南北朝時代があるの？","role":"modern","id":"h02-026","matchedTerms":["南北朝","室町"],"explanation":"南北朝：1336〜1392年ごろ、朝廷が南北に分かれた時代。室町時代と重なる。\n室町：足利氏が京都を中心に統治した時代"},{"speaker":"足利義満","text":"南北朝時代と室町時代は、一部が重なっているよ。私が1392年に南朝と北朝の合一を実現した。","role":"historical","id":"h02-027","matchedTerms":["南北朝","室町"],"explanation":"南北朝：1336〜1392年ごろ、朝廷が南北に分かれた時代。室町時代と重なる。\n室町：足利氏が京都を中心に統治した時代"},{"speaker":"受験生","text":"時代の区切りは、線を引いたように全部分かれるわけじゃないんだ！","role":"modern","id":"h02-028","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"足利義満","text":"室町時代は足利氏の幕府が京都を中心に政治を行った時代だ。","role":"historical","id":"h02-029","matchedTerms":["室町"],"explanation":"室町：足利氏が京都を中心に統治した時代"},{"speaker":"AI先生","text":"室町時代の後半、全国各地の戦国大名が争う戦国時代へ入っていく。","role":"historical","id":"h02-030","matchedTerms":["室町","戦国"],"explanation":"室町：足利氏が京都を中心に統治した時代\n戦国：室町後期に各地の戦国大名が勢力を争った時代。"},{"speaker":"織田信長","text":"私も戦国時代に勢力を広げた。しかし1582年、本能寺の変で命を落とした。全国統一はできなかった。","role":"historical","id":"h02-031","matchedTerms":["戦国"],"explanation":"戦国：室町後期に各地の戦国大名が勢力を争った時代。"},{"speaker":"受験生","text":"信長が途中まで進めたんだ。","role":"modern","id":"h02-032","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"豊臣秀吉","text":"その後、信長様の事業を引きつぎ、1590年には全国統一を成し遂げた。信長様と私のころを安土桃山時代と呼ぶ。","role":"historical","id":"h02-033","matchedTerms":["安土桃山"],"explanation":"安土桃山：織田・豊臣が統一を目指した華やかな時代"},{"speaker":"受験生","text":"戦国で争って、安土桃山で全国がまとまっていった。","role":"modern","id":"h02-034","matchedTerms":["戦国","安土桃山"],"explanation":"戦国：室町後期に各地の戦国大名が勢力を争った時代。\n安土桃山：織田・豊臣が統一を目指した華やかな時代"},{"speaker":"徳川家康","text":"そして1603年、私が江戸幕府を開いた。江戸時代には徳川家の幕府が約260年続く。","role":"historical","id":"h02-035","matchedTerms":["江戸"],"explanation":"江戸：徳川幕府が約260年続いた安定の時代"},{"speaker":"受験生","text":"鎌倉→南北朝→室町→戦国→安土桃山→江戸。武士の時代にも流れがあるね。","role":"modern","id":"h02-036","matchedTerms":["鎌倉","南北朝","室町","戦国","安土桃山","江戸"],"explanation":"鎌倉：武士が権力を握り幕府を開いた時代\n南北朝：1336〜1392年ごろ、朝廷が南北に分かれた時代。室町時代と重なる。\n室町：足利氏が京都を中心に統治した時代\n戦国：室町後期に各地の戦国大名が勢力を争った時代。\n安土桃山：織田・豊臣が統一を目指した華やかな時代\n江戸：徳川幕府が約260年続いた安定の時代"},{"speaker":"AI先生","text":"次の大きな転機は1868年ごろ。明治時代には政治や学校、軍隊、産業が大きく変わった。","role":"historical","id":"h02-037","matchedTerms":["明治"],"explanation":"明治：近代化と文明開化が進んだ激動の時代"},{"speaker":"受験生","text":"江戸幕府から近代の日本へ。","role":"modern","id":"h02-038","matchedTerms":["江戸"],"explanation":"江戸：徳川幕府が約260年続いた安定の時代"},{"speaker":"AI先生","text":"大正時代は1912年から。人々が議会や政治に参加しようとする動きが強まった。","role":"historical","id":"h02-039","matchedTerms":["大正"],"explanation":"大正：民主主義と文化が栄えた短い時代"},{"speaker":"受験生","text":"大正デモクラシーだね。","role":"modern","id":"h02-040","matchedTerms":["大正"],"explanation":"大正：民主主義と文化が栄えた短い時代"},{"speaker":"AI先生","text":"昭和時代には戦争と敗戦があった。その後、日本は復興し、経済が大きく成長した。","role":"historical","id":"h02-041","matchedTerms":["昭和"],"explanation":"昭和：戦争・復興・高度経済成長があった時代"},{"speaker":"受験生","text":"昭和は、戦争と復興の両方があるんだ。","role":"modern","id":"h02-042","matchedTerms":["昭和"],"explanation":"昭和：戦争・復興・高度経済成長があった時代"},{"speaker":"AI先生","text":"1989年から平成時代。バブル経済の崩壊や社会の変化があり、2019年から令和時代へ続く。","role":"historical","id":"h02-043","matchedTerms":["平成","令和"],"explanation":"平成：バブル崩壊後の安定と変化の時代\n令和：新しい日本の時代で現在も続いている"},{"speaker":"受験生","text":"平成→令和は今の自分たちにもつながるね。","role":"modern","id":"h02-044","matchedTerms":["平成","令和"],"explanation": 10","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"聖徳太子","text":"現代の憲法とは違うが、「みんなが勝手に動かないようにする決まり」と考えると近い。","role":"historical","id":"h03-011","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"卑弥呼は女王。聖徳太子は国を動かす役人の仕組み！","role":"modern","id":"h03-012","matchedTerms":["卑弥呼","聖徳太子"],"explanation":"卑弥呼：邪馬台国の女王で魏志倭人伝に記録あり\n聖徳太子：冠位十二階や十七条憲法を制定した皇子"},{"speaker":"藤原道長","text":"平安時代は貴族が大きな力を持った。私の藤原氏は、天皇と親戚になることで政治の中心に近づいた。","role":"historical","id":"h03-013","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"親戚になっただけで力を持てるの？","role":"modern","id":"h03-014","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"藤原道長","text":"娘が天皇の妻となり、孫が天皇になれば、私は天皇の祖父になる。政治の決定に強い影響を与えられる。","role":"historical","id":"h03-015","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"それが摂関政治につながるんだね。","role":"modern","id":"h03-016","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"でも、貴族だけの時代がずっと続くわけではない。","role":"historical","id":"h03-017","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"平清盛","text":"武士の平氏が力をつけた。私は1167年に太政大臣となり、武士として政治の頂点に近づいた。","role":"historical","id":"h03-018","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"太政大臣って、朝廷のとても高い役職だったよね。","role":"modern","id":"h03-019","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"平清盛","text":"そうだ。宋という中国の国との貿易にも力を入れた。外国との貿易は大きな利益につながった。","role":"historical","id":"h03-020","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"清盛は朝廷の中で力を持った武士、そして日宋貿易。","role":"modern","id":"h03-021","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"源頼朝","text":"平氏が倒れた後、武士が武士を治める新しい仕組みを鎌倉につくったのが私だ。","role":"historical","id":"h03-022","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"清盛も頼朝も武士だけど、何が違うの？","role":"modern","id":"h03-023","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"源頼朝","text":"清盛は朝廷の高い役職で力を持った。私は鎌倉を中心に、武士の幕府をつくった。1192年に征夷大将軍になった。","role":"historical","id":"h03-024","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"武士が政治を動かす場所が京都の朝廷から鎌倉へ広がったんだ。","role":"modern","id":"h03-025","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"足利義満","text":"その後、鎌倉幕府は滅び、足利氏の室町幕府が生まれた。私、3代将軍の義満は、1392年に南北に分かれた朝廷を一つにまとめた。","role":"historical","id":"h03-026","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"義満といえば金閣も！","role":"modern","id":"h03-027","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"足利義満","text":"京都の北山に建てた金閣で覚えてほしい。室町時代の文化にもつながる。","role":"historical","id":"h03-028","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"ところが室町幕府の力が弱くなり、各地の大名が争う戦国時代に入った。","role":"historical","id":"h03-029","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"織田信長","text":"私は戦いと政治の工夫で勢力を広げた。しかし1582年の本能寺の変で倒れ、全国統一は果たせなかった。","role":"historical","id":"h03-030","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"信長＝全国統一した人、ではないんだ！","role":"modern","id":"h03-031","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"豊臣秀吉","text":"その続きを進めたのが私。1590年に全国統一し、田畑を調べる太閤検地や、農民などから武器を集める刀狩を進めた。","role":"historical","id":"h03-032","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"太閤検地で土地を調べ、刀狩で武士と農民の区別を進めたんだね。","role" ":[{"term":"天智天皇","sourceNote":"大化の改新後、中大兄皇子として即位","studyNote":"中大兄皇子として大化の改新を進め、後に即位して天智天皇となった。"},{"term":"聖武天皇","sourceNote":"東大寺の建立や仏教の振興を推進","studyNote":"東大寺の建立や仏教の振興を推進"},{"term":"桓武天皇","sourceNote":"平安京遷都を行い律令制を整えた天皇","studyNote":"平安京遷都を行い律令制を整えた天皇"},{"term":"白河上皇","sourceNote":"院政を開始し実質的な政治を主導","studyNote":"1086年ごろから院政を始め、天皇の位を退いても政治を主導した。"},{"term":"後鳥羽上皇","sourceNote":"承久の乱を起こし幕府と対立","studyNote":"承久の乱を起こし幕府と対立"},{"term":"後醍醐天皇","sourceNote":"建武の新政を行い武士と対立した天皇","studyNote":"建武の新政を行い武士と対立した天皇"}],"id":4,"title":"国をつくる天皇たち","subtitle":"国を治めるって、何を変えること？","messages":[{"speaker":"受験生","text":"天皇の名前が増えてきた。みんな何をした人？","id":"h04-001","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"今日はこの6つを、つながる物語で覚えよう。\n1．天智天皇\n2．聖武天皇\n3．桓武天皇\n4．白河上皇\n5．後鳥羽上皇\n6．後醍醐天皇","role":"historical","kind":"index","id":"h04-002","matchedTerms":["天智天皇","聖武天皇","桓武天皇","白河上皇","後鳥羽上皇","後醍醐天皇"],"explanation":"天智天皇：中大兄皇子として大化の改新を進め、後に即位して天智天皇となった。\n聖武天皇：東大寺の建立や仏教の振興を推進\n桓武天皇：平安京遷都を行い律令制を整えた天皇\n白河上皇：1086年ごろから院政を始め、天皇の位を退いても政治を主導した。\n後鳥羽上皇：承久の乱を起こし幕府と対立\n後醍醐天皇：建武の新政を行い武士と対立した天皇"},{"speaker":"AI先生","text":"天皇ごとに「国の仕組みが何から何へ変わったか」を追ってみよう。","id":"h04-003","role":"historical","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"中大兄皇子","text":"645年、中臣鎌足らと蘇我氏を倒し、政治の改革を進めた。私はのちに即位して天智天皇と呼ばれる。","id":"h04-004","role":"historical","matchedTerms":["天智天皇"],"explanation":"天智天皇：中大兄皇子として大化の改新を進め、後に即位して天智天皇となった。"},{"speaker":"受験生","text":"中大兄皇子があとで天智天皇！ 別人じゃなかったんだ。","id":"h04-005","role":"modern","matchedTerms":["天智天皇"],"explanation":"天智天皇：中大兄皇子として大化の改新を進め、後に即位して天智天皇となった。"},{"speaker":"AI先生","text":"次は、都と仏教の話。奈良時代、災害や病気で不安な人も多かった。聖武天皇は仏教の力で国を守ろうとした。","id":"h04-006","role":"historical","matchedTerms":["聖武天皇"],"explanation":"聖武天皇：東大寺の建立や仏教の振興を推進"},{"speaker":"聖武天皇","text":"人々の平和を願い、各地に国分寺をつくらせ、東大寺の大仏も造らせた。","id":"h04-007","role":"historical","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"大仏は、ただ大きな像を見せるためじゃなかったんだね。","id":"h04-008","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"794年になると、桓武天皇が都を平安京に移す。京都が政治の中心となる新しい時代が始まった。","id":"h04-009","role":"historical","matchedTerms":["桓武天皇"],"explanation":"桓武天皇：平安京遷都を行い律令制を整えた天皇"},{"speaker":"受験生","text":"奈良から京都へ。都が変わると時代も変わる！","id":"h04-010","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"ところで、どうして天皇は何度も都を移したの？","role":"modern","kind":"story","id":"h04-011","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"都は政治をする中心地だからね。新しい場所に役所や人を集めて、前の政治とのつながりを変えようとする意味もあった。","role":"historical","kind":"story","id":"h04-012","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"桓武天皇","text":"私が794年に移した平安京は、今の京都にあたる。平安時代の始まりを思い出す目印だ。","role":"historical","kind":"story","id":"h04-013","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"桓武＝794年＝平安京、って一本につながった。","role":"modern","kind":"story","id":"h04-014","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"平安時代の終わりには、天皇をやめた後も政治を動かす人が現れる。","id":"h04-015","role":"historical","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"やめたのに？ どうして？","id":"h04-016","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"白河上皇は、天皇の位を後の人に譲ってからも政治を主導した。「院政」だよ。","id":"h04-017","role":"historical","matchedTerms":["白河上皇"],"explanation":"白河上皇：1086年ごろから院政を始め、天皇の位を退いても政治を主導した。"},{"speaker":"白河上皇","text":"天皇の位を譲っても、政治の仕事まで手放すとは限らない。私が上皇として政治を行ったのが院政だ。","role":"historical","kind":"story","id":"h04-018","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"白河上皇は「引退したのに指示を出す人」。名前の「上皇」と院政がつながった。","role":"modern","kind":"story","id":"h04-019","matchedTerms":["白河上皇"],"explanation":"白河上皇：1086年ごろから院政を始め、天皇の位を退いても政治を主導した。"},{"speaker":"受験生","text":"現役を退いても、実際には指示を出していたんだ。","id":"h04-020","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"その後、武士の鎌倉幕府と朝廷がぶつかった。1221年の承久の乱を起こしたのが後鳥羽上皇だ。","id":"h04-021","role":"historical","matchedTerms":["後鳥羽上皇"],"explanation":"後鳥羽上皇：承久の乱を起こし幕府と対立"},{"speaker":"受験生","text":"上皇が幕府に負けたの？","id":"h04-022","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"そう。幕府の力がさらに強まった。今度は1333年に幕府を倒そうとした後醍醐天皇が、建武の新政で天皇中心の政治をめざした。","id":"h04-023","role":"historical","matchedTerms":["後醍醐天皇"],"explanation":"後醍醐天皇：建武の新政を行い武士と対立した天皇"},{"speaker":"受験生","text":"でも武士と対立して、南北朝の争いになっていくんだよね。","id":"h04-024","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"天智＝改革、聖武＝大仏、桓武＝平安京、白河＝院政、後鳥羽＝承久の乱、後醍醐＝建武の新政。この変化の順番だ。","id":"h04-025","role":"historical","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"この章の6つを、もう一度。\n1．天智天皇\n2．聖武天皇\n3．桓武天皇\n4．白河上皇\n5．後鳥羽上皇\n6．後醍醐天皇","role":"historical","kind":"recap","id":"h04-026","matchedTerms":["天智天皇","聖武天皇","桓武天皇","白河上皇","後鳥羽上皇","後醍醐天皇"],"explanation":"天智天皇：中大兄皇子として大化の改新を進め、後に即位して天智天皇となった。\n聖武天皇：東大寺の建立や仏教の振興を推進\n桓武天皇：平安京遷都を行い律令制を整えた天皇\n白河上皇：1086年ごろから院政を始め、天皇の位を退いても政治を主導した。\n後鳥羽上皇：承久の乱を起こし幕府と対立\n後醍醐天皇：建武の新政を行い武士と対立した天皇"},{"speaker":"AI先生","text":"名前を隠して「何をした？」「なぜ起きた？」「次にどうなった？」と自分の言葉で説明できたら、ちゃんと覚えられている証拠だよ。","role":"historical","kind":"recap","id":"h04-027","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"}],"count":6,"messageCount":27},{"category":"江戸幕府の将軍","entries":[{"term":"家康","sourceNote":"江戸幕府を開き天下統一を達成した初代将軍","studyNote":"江戸幕府を開き天下統一を達成した初代将軍"},{"term":"家光","sourceNote":"参勤交代を定め幕府の基盤を強固にした将軍","studyNote":"参勤交代を定め幕府の基盤を強固にした将軍"},{"term":"綱吉","sourceNote":"生類憐みの令を出した第5代将軍","studyNote":"生類憐みの令を出した第5代将軍"},{"term":"吉宗","sourceNote":"享保の改革で財政改善に努めた名将軍","studyNote":"享保の改革で財政改善に努めた名将軍"},{"term":"慶喜","sourceNote":"大政奉還を行い幕末に幕府を終わらせた将軍","studyNote":"大政奉還を行い幕末に幕府を終わらせた将軍"}],"id":5,"title":"江戸幕府、260年のバトン","subtitle":"初代から最後まで、何が変わった？","messages":[{"speaker":"受験生","text":"江戸幕府の将軍、5人だけでも何が違うのかわからない。","id":"h05-001","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"今日はこの5つを、つながる物語で覚えよう。\n1．家康\n2．家光\n3．綱吉\n4．吉宗\n5．慶喜","role":"historical","kind":"index","id":"h05-002","matchedTerms":["家康","家光","綱吉","吉宗","慶喜"],"explanation":"家康：江戸幕府を開き天下統一を達成した初代将軍\n家光：参勤交代を定め幕府の基盤を強固にした将軍\n綱吉：生類憐みの令を出した第5代将軍\n吉宗：享保の改革で財政改善に努めた名将軍\n慶喜：大政奉還を行い幕末に幕府を終わらせた将軍"},{"speaker":"徳川家康","text":"1603年、江戸幕府を開いた初代将軍が私、徳川家康だ。","id":"h05-003","role":"historical","matchedTerms":["家康"],"explanation":"家康：江戸幕府を開き天下統一を達成した初代将軍"},{"speaker":"受験生","text":"戦いを終わらせるだけじゃなく、仕組みをつくる役目だね。","id":"h05-004","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"その仕組みを強めたのが3代将軍、徳川家光。1635年に参勤交代の制度を整えた。","id":"h05-005","role":"historical","matchedTerms":["家光"],"explanation":"家光：参勤交代を定め幕府の基盤を強固にした将軍"},{"speaker":"受験生","text":"参勤交代って、大名が江戸と領地を行き来するやつ？","id":"h05-006","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"徳川家光","text":"大名が国元と江戸を行き来する仕組みを強めたのは私、3代将軍家光だ。大名は江戸に住む期間もあった。","role":"historical","kind":"story","id":"h05-007","matchedTerms":["家光"],"explanation":"家光：参勤交代を定め幕府の基盤を強固にした将軍"},{"speaker":"受験生","text":"行くだけで旅費もかかるし、江戸にも住まないといけない。大名には大変だ！","role":"modern","kind":"story","id":"h05-008","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"徳川家康","text":"そうした仕組みで、大名が勝手に大きな軍隊を動かしにくくなった。","role":"historical","kind":"story","id":"h05-009","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"そう。移動にはお金がかかるし、大名を幕府の統制下に置きやすい。","id":"h05-010","role":"historical","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"5代将軍の徳川綱吉は、生類憐みの令で知られる。生き物を大切にする政策だが、厳しい取り締まりもあった。","id":"h05-011","role":"historical","matchedTerms":["綱吉"],"explanation":"綱吉：生類憐みの令を出した第5代将軍"},{"speaker":"徳川綱吉","text":"私、5代将軍の綱吉は生き物を大切にする政策を進めた。けれど取り締まりが厳しすぎることもあった。","role":"historical","kind":"story","id":"h05-012","matchedTerms":["綱吉"],"explanation":"綱吉：生類憐みの令を出した第5代将軍"},{"speaker":"受験生","text":"江戸時代の法律も、良い目的があれば何でもうまくいくわけじゃないんだ。","role":"modern","kind":"story","id":"h05-013","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"大名の統制から、生活への命令にもつながったんだ。","id":"h05-014","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"8代将軍、徳川吉宗は享保の改革。幕府の財政を立て直そうとして、質素な暮らしや新田開発を進めた。","id":"h05-015","role":"historical","matchedTerms":["吉宗"],"explanation":"吉宗：享保の改革で財政改善に努めた名将軍"},{"speaker":"受験生","text":"お金が足りなくなったから改革したんだね。","id":"h05-016","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"そして15代将軍、徳川慶喜。1867年、大政奉還で政治を行う権限を朝廷に返すことを申し出た。","id":"h05-017","role":"historical","matchedTerms":["慶喜"],"explanation":"慶喜：大政奉還を行い幕末に幕府を終わらせた将軍"},{"speaker":"受験生","text":"家康が開いた幕府を、慶喜が終わらせる。最初と最後がつながった。","id":"h05-018","role":"modern","matchedTerms":["家康","慶喜"],"explanation":"家康：江戸幕府を開き天下統一を達成した初代将軍\n慶喜：大政奉還を行い幕末に幕府を終わらせた将軍"},{"speaker":"徳川家康","text":"始めた人、固めた人、政策を出した人、立て直した人、終わりを迎えた人。順番で覚えよう。","id":"h05-019","role":"historical","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"この章の5つを、もう一度。\n1．家康\n2．家光\n3．綱吉\n4．吉宗\n5．慶喜","role":"historical","kind":"recap","id":"h05-020","matchedTerms":["家康","家光","綱吉","吉宗","慶喜"],"explanation":"家康：江戸幕府を開き天下統一を達成した初代将軍\n家光：参勤交代を定め幕府の基盤を強固にした将軍\n綱吉： "},{"speaker":"受験生","text":"米で税を払うのと、現金で払うのはそんなに違う？","role":"modern","kind":"story","id":"h15-015","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"国は毎年、決まった金額で収入を見込みやすくなる。でも農家にとっては、米の値段が下がっても税を現金で用意する必要があった。","role":"historical","kind":"story","id":"h15-016","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"国には便利でも、農民には新しい負担ができたんだ。","role":"modern","kind":"story","id":"h15-017","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"戦後の農地改革では、地主が貸していた農地などを買い上げ、実際に耕す農民が持てるようにした。","id":"h15-018","role":"historical","matchedTerms":["農地改革"],"explanation":"農地改革：戦後に行われた農民への土地配分政策"},{"speaker":"受験生","text":"国が配る→私有→調査→開発→現金で納税→耕す人が持つ。土地の歴史が1本の線になった！","id":"h15-019","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"この章の6つを、もう一度。\n1．班田収授法\n2．墾田永年私財法\n3．太閤検地\n4．新田開発\n5．地租改正\n6．農地改革","role":"historical","kind":"recap","id":"h15-020","matchedTerms":["班田収授法","墾田永年私財法","太閤検地","新田開発","地租改正","農地改革"],"explanation":"班田収授法：土地を6年ごとに再分配した律令制度\n墾田永年私財法：開墾地の私有を認めた土地制度\n太閤検地：豊臣秀吉が全国の土地を調査した制度\n新田開発：江戸時代に行われた農地の拡大事業\n地租改正：明治時代の土地税制の改革\n農地改革：戦後に行われた農民への土地配分政策"},{"speaker":"AI先生","text":"名前を隠して「何をした？」「なぜ起きた？」「次にどうなった？」と自分の言葉で説明できたら、ちゃんと覚えられている証拠だよ。","role":"historical","kind":"recap","id":"h15-021","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"}],"count":6,"messageCount":21},{"category":"明治維新","entries":[{"term":"地租改正","sourceNote":"土地の税制を貨幣納付に改めた政策","studyNote":"土地の税制を貨幣納付に改めた政策"},{"term":"藩閥政治","sourceNote":"藩出身者が実権を握った明治政府の体制","studyNote":"藩出身者が実権を握った明治政府の体制"},{"term":"解放令","sourceNote":"被差別民への差別廃止を定めた法令","studyNote":"1871年、江戸時代の身分の呼称を廃止して平民としたが、差別は続いた。"},{"term":"廃藩置県","sourceNote":"藩を廃止し府県制を導入した改革","studyNote":"藩を廃止し府県制を導入した改革"},{"term":"版籍奉還","sourceNote":"領地と人民を政府に返還した政策","studyNote":"領地と人民を政府に返還した政策"},{"term":"富国強兵","sourc 律","studyNote":"労働者の保護を目的とした三つの法律"}],"id":17,"title":"戦争が終わって、何を変えた？","subtitle":"戦後の13項目は、一つの転換","messages":[{"speaker":"受験生","text":"戦後の民主化政策、13個もあるの？","id":"h17-001","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"今日はこの13つを、つながる物語で覚えよう。\n1．軍隊の解散\n2．天皇の人間宣言\n3．極東国際軍事裁判\n4．財閥解体\n5．独占禁止法\n6．農地改革\n7．日本国憲法\n8．治安維持法の廃止\n9．選挙法の改正\n10．教育勅語の廃止\n11．教育基本法\n12．労働組合\n13．労働三法","role":"historical","kind":"index","id":"h17-002","matchedTerms":["軍隊の解散","天皇の人間宣言","極東国際軍事裁判","財閥解体","独占禁止法","農地改革","日本国憲法","治安維持法の廃止","選挙法の改正","教育勅語の廃止","教育基本法","労働組合","労働三法"],"explanation":"軍隊の解散：日本の軍事力を完全に解体\n天皇の人間宣言：1946年の昭和天皇の詔書。戦後の天皇と国民の関係の変化を考える手がかりです。\n極東国際軍事裁判：戦犯を裁くために行われた裁判\n財閥解体：経済の独占を防ぐための改革\n独占禁止法：市場競争を保つための法律\n農地改革：小作農に土地を分配し自作農を増加\n日本国憲法：平和主義と基本的人権を規定\n治安維持法の廃止：思想の自由を確立するための施策\n選挙法の改正：女性参政権を認めた制度改革\n教育勅語の廃止：1948年、国会が教育勅語の排除・失効確認を決議した。\n教育基本法：教育の基本理念を定めた法律\n労働組合：労働者の権利を守るための団体\n労働三法：労働者の保護を目的とした三つの法律"},{"speaker":"AI先生","text":"1945年に日本が敗戦した後、「戦争を繰り返さない」「自由や平等を広げる」ために仕組みが大きく変わった。","id":"h17-003","role":"historical","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"まず何から？","id":"h17-004","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"軍隊の解散で、それまでの日本軍は解体された。戦争の指導者らの責任を問う極東国際軍事裁判も1946年から開かれた。","id":"h17-005","role":"historical","matchedTerms":["軍隊の解散","極東国際軍事裁判"],"explanation":"軍隊の解散：日本の軍事力を完全に解体\n極東国際軍事裁判：戦犯を裁くために行われた裁判"},{"speaker":"受験生","text":"戦争の仕組みと責任を見直したんだね。","id":"h17-006","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"1946年、昭和天皇の詔書は後に「天皇の人間宣言」と呼ばれ、天皇と国民の関係をめぐる考え方が変わる一歩となった。","id":"h17-007","role":"historical","matchedTerms":["天皇の人間宣言"],"explanation":"天皇の人間宣言：1946年の昭和天皇の詔書。戦後の天皇と国民の関係の変化を考える手がかりです。"},{"speaker":"受験生","text":"政治の中心を考える仕組みも変わった？","id":"h17-008","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"1947年施行の日本国憲法は、国民主権・基本的人権の尊重・平和主義を三大原則とした。","id":"h17-009","role":"historical","matchedTerms":["日本国憲法"],"explanation":"日本国憲法：平和主義と基本的人権を規定"},{"speaker":"受験生","text":"今の憲法の基本だね。","id":"h17-010","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"国民主権って、何をすること？","role":"modern","kind":"story","id":"h17-011","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"国の政治のあり方を最終的に決める力は国民にある、という考え方だ。選挙で代表を選ぶことにもつながる。","role":"historical","kind":"story","id":"h17-012","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"人権を守る、戦争を放棄する、国民が政治の主役になる。この3つを一緒に覚える！","role":"modern","kind":"story","id":"h17-013","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"1945年の選挙法の改正で女性にも国政選挙の投票権などが認められ、翌1946年の総選挙で初めて女性が投票した。","id":"h17-014","role":"historical","matchedTerms":["選挙法の改正"],"explanation":"選挙法の改正：女性参政権を認めた制度改革"},{"speaker":"受験生","text":"女性も政治に参加できるようになったんだ。","id":"h17-015","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"戦前に考え方を取り締まっていた治安維持法の廃止も行われた。","id":"h17-016","role":"historical","matchedTerms":["治安維持法の廃止"],"explanation":"治安維持法の廃止：思想の自由を確立するための施策"},{"speaker":"AI先生","text":"経済では財閥解体で巨大企業集団の集中を弱め、1947年の独占禁止法で公正な競争を守ろうとした。","id":"h17-017","role":"historical","matchedTerms":["財閥解体","独占禁止法"],"explanation":"財閥解体：経済の独占を防ぐための改革\n独占禁止法：市場競争を保つための法律"},{"speaker":"受験生","text":"一部の大きな会社に力が集まりすぎないようにしたんだ。","id":"h17-018","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"農地改革では、地主から土地を借りていた農民が自分の土地を持てるようになった。","id":"h17-019","role":"historical","matchedTerms":["農地改革"],"explanation":"農地改革：小作農に土地を分配し自作農を増加"},{"speaker":"受験生","text":"農村の人たちの暮らしも変えたんだね。","id の会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"1858年の日米修好通商条約では貿易を認めたが、治外法権や関税自主権がないなど日本に不利な内容だった。","id":"h24-007","role":"historical","matchedTerms":["日米修好通商条約"],"explanation":"日米修好通商条約：不平等条約として知られる条約"},{"speaker":"受験生","text":"和親は開港、修好通商は貿易と不平等。違いがわかった。","id":"h24-008","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"和親条約から4年で、通商条約に進んだの？","role":"modern","kind":"story","id":"h24-009","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"そう。1853年のペリー来航をきっかけに、1854年に船の寄港を認め、1858年には貿易を認める条約を結んだ。","role":"historical","kind":"story","id":"h24-010","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"受験生","text":"でも不平等だったから、明治時代の条約改正につながっていくわけだ。","role":"modern","kind":"story","id":"h24-011","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"1895年、日清戦争の後に結ばれた下関条約。清は台湾などを日本に譲り、賠償金を支払った。","id":"h24-012","role":"historical","matchedTerms":["下関条約"],"explanation":"下関条約：日清戦争の講和条約で多くの領土を得る"},{"speaker":"受験生","text":"でも遼東半島は三国干渉で返したんだね。","id":"h24-013","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"1905年の日露戦争後には、アメリカの仲介でポーツマス条約が結ばれた。日本は南樺太などを得たが、賠償金は得られなかった。","id":"h24-014","role":"historical","matchedTerms":["ポーツマス条約"],"explanation":"ポーツマス条約：日露戦争の講和条約で仲裁はアメリカ"},{"speaker":"受験生","text":"同じ戦争後の条約でも内容が違うんだ。","id":"h24-015","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"1951年のサンフランシスコ平和条約では、多くの国と講和して日本の独立回復への道が開かれ、1952年に発効した。","id":"h24-016","role":"historical","matchedTerms":["サンフランシスコ平和条約"],"explanation":"サンフランシスコ平和条約：日本の独立回復を認めた条約"},{"speaker":"AI先生","text":"同じ1951年に日米安全保障条約も結ばれ、日本にアメリカ軍が駐留する仕組みが続いた。","id":"h24-017","role":"historical","matchedTerms":["日米安全保障条約"],"explanation":"日米安全保障条約：1951年に締結した条約。1960年に新条約が結ば ．桃山\n8．元禄\n9．化政\n10．文明開化","role":"historical","kind":"index","id":"h27-002","matchedTerms":["飛鳥","天平","国風","鎌倉","北山","東山","桃山","元禄","化政","文明開化"],"explanation":"飛鳥：仏教が伝来し文化が発展した時代\n天平：奈良時代の仏教や唐などの文化の影響が強い文化。\n国風：平安時代にかな文字や日本風の文学などが発展した文化。\n鎌倉：武士文化や禅宗が広がった時代\n北山：金閣寺に代表される豪華な文化\n東山：銀閣寺に代表される侘び寂びの文化\n桃山：城郭建築や華麗な文化が栄えた時代\n元禄：町人文化や歌舞伎が広がった時代\n化政：江戸後期の浮世絵や文学が栄えた時代\n文明開化：明治期の近代化を象徴する文化"},{"speaker":"AI先生","text":"何を信じ、誰が文化を楽しんだかで追ってみよう。飛鳥文化は仏教の広まりと関係が深く、法隆寺などが有名だ。","id":"h27-003","role":"historical","matchedTerms":["飛鳥"],"explanation":"飛鳥：仏教が伝来し文化が発展した時代"},{"speaker":"受験生","text":"最初は仏教の建物なんだ。","id":"h27-004","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"奈良の天平文化は、唐などの影響が強く、正倉院の宝物や東大寺が代表例。","id":"h27-005","role":"historical","matchedTerms":["天平"],"explanation":"天平：奈良時代の仏教や唐などの文化の影響が強い文化。"},{"speaker":"受験生","text":"外国の文化を取り入れているね。","id":"h27-006","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"紫式部","text":"平安時代の国風文化では、かな文字が広まり、日本らしい文学が生まれました。","id":"h27-007","role":"historical","matchedTerms":["国風"],"explanation":"国風：平安時代にかな文字や日本風の文学などが発展した文化。"},{"speaker":"受験生","text":"『源氏物語』だね！","id":"h27-008","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"AI先生","text":"武士が力をつけた鎌倉文化は、力強い仏像や新しい仏教が特徴だ。","id":"h27-009","role":"historical","matchedTerms":["鎌倉"],"explanation":"鎌倉：武士文化や禅宗が広がった時代"},{"speaker":"受験生","text":"貴族の文化から武士の文化へ。","id":"h27-010","role":"modern","matchedTerms":[],"explanation":"この発言は、歴史のつながりを理解するための会話です。前後の吹き出しを続けて読んでみよう。"},{"speaker":"足利義満","text":"室町時代の北山文化は金閣で知られる。金色の建物が印象的だろう。","id":"h27-011","role":"historical","matchedTerms":["北山"],"explanation":"北山：金閣寺に代表される豪華な文化"},{"speaker":"AI先生","text":"室町後期の東山文化は銀閣や書院造、水墨画など。質素で落ち着いた美しさも広まった。","id":"h27-012","role":"historical","matchedTerms":["東山"],"explanation":"東山：銀閣寺に代表される侘び寂びの文化"},{"speaker":"雪舟","text":"室町時代には水墨画も発展した。墨の濃さや薄さで山や川  const meta=state.people[sp]||{};
 const node=document.createElement('span');node.className='h202-avatar';node.setAttribute('aria-hidden','true');
 if(meta.image){const img=document.createElement('img');img.src=meta.image;img.alt='';img.loading='lazy';img.onerror=()=>{img.remove();node.textContent=meta.icon||AVATAR_FALLBACK[sp]||'👤'};node.append(img)}else node.textContent=meta.icon||AVATAR_FALLBACK[sp]||'👤';
 return node;
}
function setExplanation(msg,element){
 const same=state.activeBubble?.dataset.id===msg.id;
 if(state.activeBubble)state.activeBubble.classList.remove('is-selected');
 if(same){state.activeBubble=null;guide.hidden=false;expl.hidden=true;expl.textContent='';return;}
 state.activeBubble=element;element.classList.add('is-selected');
 guide.hidden=true;expl.hidden=false;expl.textContent=msg.explanation||'この発言に対応する追加の説明はありません。';
 $('h202-explain').scrollTop=0;
}
function clearExplanation(){state.activeBubble?.classList.remove('is-selected');state.activeBubble=null;guide.hidden=false;expl.hidden=true;expl.textContent=''}
function addBubble(stack,msg){
 const b=document.createElement('button');b.type='button';b.className='h202-bubble'+(msg.kind==='index'||msg.kind==='recap'?' h202-bubble--'+msg.kind:'');b.dataset.id=msg.id;b.textContent=msg.text;b.setAttribute('aria-label',msg.speaker+'の発言。タップで解説。'+msg.text);
 b.addEventListener('click',()=>setExplanation(msg,b));
 stack.append(b);return b;
}
function render(){
 const ci=Math.max(0,Math.min(state.selected-1,state.chapters.length-1)),ch=state.chapters[ci];if(!ch)return;
 $('h202-chapter-num').textContent='第'+ch.id+'話';$('h202-chapter-title').textContent=ch.title;
 $('h202-total-caption').textContent='31話・202重要事項';
 const all=visibleMessages(ch,ci);
 const filtered=state.filter?all.filter(m=>(m.text+' '+m.speaker+' '+m.explanation).toLocaleLowerCase('ja').includes(state.filter)):all;
 $('h202-search-count').textContent=state.filter?filtered.length+'件':'';
 clearExplanation();box.replaceChildren();
 const head=document.createElement('div');head.className='h202-episode-heading';
 const label=document.createElement('div');label.textContent=`第${ch.id}話　${ch.category}（${ch.count}項目）`;
 const h=document.createElement('strong');h.textContent=ch.title;
 const sub=document.createElement('p');sub.textContent=ch.subtitle;
 head.append(label,h,sub);box.append(head);
 if(filtered.length===0){const p=document.createElement('p');p.className='h202-status';p.textContent=state.filter?'一致する発言がありません。':(state.config.mode==='broadcast'&&!isPreview?'配信されると、この話の発言が表示されます。':'発言がありません。');box.append(p);return;}
 let currentSpeaker=null,stack=null;
 for(const msg of filtered){
  if(currentSpeaker!==msg.speaker){
   const group=document.createElement('div');group.className='h202-msg-group'+(msg.role==='modern'?' is-modern':'');
   group.append(iconFor(msg.speaker));stack=document.createElement('div');stack.className='h202-msg-stack';
   if(msg.role!=='modern'){const name=document.createElement('div');name.className='h202-speaker';name.textContent=msg.speaker;stack.append(name)}
   group.append(stack);box.append(group);currentSpeaker=msg.speaker;
  }
  addBubble(stack,msg);
 }
 const bottom=document.createElement('p');bottom.className='h202-story-marker';bottom.textContent=state.config.mode==='broadcast'&&!isPreview?'配信中の発言はここまで':'この話はここまで。目次から別の話も読めます。';box.append(bottom);
}
function setChapter(id,restore=false){
 const ch=state.chapters.find(x=>x.id===id);if(!ch)return;
 state.selected=ch.id;state.filter='';searchInput.value='';search.hidden=true;
 try{localStorage.setItem('history202-last-chapter',String(id))}catch(_){}
 render();renderIndex();layer.hidden=true;
 if(restore){try{scroll.scrollTop=Number(localStorage.getItem(LS_PREFIX+id))||0}catch(_){scroll.scrollTop=0}}else scroll.scrollTop=0;
}
function renderIndex(){list.replaceChildren();for(const ch of state.chapters){
 const item=document.createElement('button');item.type='button';item.className='h202-index-item'+(ch.id===state.selected?' is-current':'');
 const no=document.createElement('span');no.className='h202-index-number';no.textContent='第'+ch.id+'話';
 const main=document.createElement('span');main.className='h202-index-main';
 const title=document.createElement('strong');title.textContent=ch.title;
 const subtitle=document.createElement('small');subtitle.textContent=ch.category+'・'+ch.subtitle;
 main.append(title,subtitle);
 const count=document.createElement('span');count.className='h202-index-count';count.textContent=ch.count+'項目';
 item.append(no,main,count);item.addEventListener('click',()=>setChapter(ch.id));list.append(item);
}}
let saveTimeout=null;
scroll.addEventListener('scroll',()=>{if(saveTimeout)clearTimeout(saveTimeout);saveTimeout=setTimeout(()=>{try{localStorage.setItem(LS_PREFIX+state.selected,String(scroll.scrollTop))}catch(_){}},350)},{passive:true});
async function load(){
 try{
  const response=await Promise.all(['history202/chapters.json','history202/participants.json','history202/config.json'].map(x=>fetch(x,{cache:'no-store'})));
  for(const r of response)if(!r.ok)throw Error('読み込み失敗: '+r.url+' '+r.status);
  const [script,people,config]=await Promise.all(response.map(r=>r.json()));
  if(!Array.isArray(script.chapters)||script.chapters.length!==31||script.chapters.reduce((n,c)=>n+c.entries.length,0)!==202)throw Error('31カテゴリー・202項目の整合性を確認できません。');
  const ids=new Set();let count=0;
  for(const ch of script.chapters){if(!ch.messages?.length)throw Error('会話なし: '+ch.id);for(const m of ch.messages){if(ids.has(m.id)||!m.text||!m.speaker)throw Error('会話データ不正: '+m.id);ids.add(m.id);count++;}}
  state.chapters=script.chapters;state.people=people;state.config=config;
  let saved=1;try{saved=Number(localStorage.getItem('history202-last-chapter'))||1}catch(_){}
  setChapter(saved,true);
 }catch(err){box.replaceChildren();const p=document.createElement('p');p.className='h202-status';p.textContent='会話の読み込みに失敗しました。\n'+String(err.message||err);box.append(p);console.error(err)}
}
load();
// One-way clock update only for common broadcast mode; no personal replay controls.
setInterval(()=>{if(!document.hidden&&state.config.mode==='broadcast'&&state.chapters.length&&!isPreview){let count=visibleMessages(state.chapters[state.selected-1],state.selected-1).length;if(count!==box.querySelectorAll('.h202-bubble').length&&!state.filter){const before=scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight;render();if(before<90)scroll.scrollTop=scroll.scrollHeight}}},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.config.mode==='broadcast'&&!isPreview&&state.chapters.length)render()});
})();
</script>
</body>
</html>
