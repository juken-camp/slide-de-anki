 <script id="sengoku-theme-before-paint">
 // Choose the parent app's real outfit before fetching CSS, eliminating the temporary Nekopon palette.
 (()=>{
   let mode='';
   try {if(window.parent!==window && window.parent.location.origin===location.origin)
     mode=window.parent.document.documentElement.dataset.persona||'';} catch(_){}
   if(mode!=='cyber'&&mode!=='neko'){
     try {mode=localStorage.getItem('nekopon-character-theme-v1')||'';}catch(_){}
   }
   mode=mode==='cyber'?'cyber':'neko';
   document.documentElement.dataset.persona=mode;
   document.documentElement.style.colorScheme=mode==='cyber'?'dark':'light';
   document.querySelector('meta[name="theme-color"]')?.setAttribute('content',mode==='cyber'?'#080d20':'#fffcf7');
 })();
 </script>

<style id="sengoku-members-himiko-style-20261107">
/* Group members: same card / section / type hierarchy as Himiko's group view. */
#group-members .members-header{display:grid;grid-template-columns:32px minmax(0,1fr) 73px;gap:6px 8px;padding:10px 12px;align-items:center}
#group-members .members-heading{grid-column:2;display:flex;align-items:center;gap:9px;min-width:0}
#group-members .group-members-avatar{width:42px;height:42px;flex:none}
#group-members .members-title{display:flex;align-items:center;min-width:0;margin:0;font-size:16px;font-weight:900;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#group-members .members-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:12px 12px calc(18px + env(safe-area-inset-bottom,0px))}
#group-members #group-member-list{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
#group-members #group-member-list .membership-section-title{font-family:inherit;font-size:14px;font-weight:700;line-height:1.6;margin:18px 0 12px;color:var(--text-main,#60412f)}
#group-members #group-member-list .membership-section-title:first-child{margin-top:16px}
html[data-persona="cyber"] #group-members #group-member-list .membership-section-title{color:#b9dff3}
#group-members .sengoku-member-card{display:block;width:100%;font-family:inherit;animation:none;text-align:left;cursor:pointer;background:#fff;border:2px solid #f1f5f9;border-radius:16px;padding:13px 15px;box-shadow:0 1px 6px rgba(0,0,0,.05);min-height:72px}
#group-members .sengoku-member-card .card-inner{display:flex;align-items:center;gap:12px}
#group-members .sengoku-member-card .avatar{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;flex:none;overflow:hidden;font-size:22px;background:#f3d3a9}
#group-members .sengoku-member-card .avatar img{display:block;width:100%;height:100%;object-fit:cover}
#group-members .sengoku-member-card .card-info{min-width:0;flex:1}
#group-members .sengoku-member-card .member-name-row{display:flex;align-items:center;gap:7px;min-width:0}
#group-members .sengoku-member-card .member-name{font-size:16px;font-weight:900;color:#1e293b;line-height:1.4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#group-members .sengoku-member-card .member-presence{display:inline-block;flex:none;margin-left:0;white-space:nowrap;font-size:10px;font-weight:800;line-height:1.4;padding:2px 7px;border-radius:100px}
#group-members .sengoku-member-card .member-period{display:block;margin-top:3px;max-width:100%;font-size:11px;font-weight:500;line-height:1.5;color:#a08069;overflow-wrap:anywhere}
#group-members .sengoku-member-card.sengoku-member-static{cursor:default}
#group-members .sengoku-member-card.sengoku-member-static:hover{transform:none;box-shadow:0 1px 6px rgba(0,0,0,.05)}
#group-members .sengoku-member-card:focus-visible,.sengoku-profile-button:focus-visible,.sengoku-name-profile:focus-visible{outline:2px solid #03cadc;outline-offset:3px}
html[data-persona="cyber"] #group-members .sengoku-member-card{background:#101b35;border-color:#315576!important;box-shadow:none!important}
html[data-persona="cyber"] #group-members .sengoku-member-card .member-name{color:#e0eaff}
html[data-persona="cyber"] #group-members .sengoku-member-card .member-period{color:#8eaec4}
html[data-persona="cyber"] #group-members .sengoku-member-card .avatar{background:#253956}
#group-messages .sengoku-profile-button{appearance:none;-webkit-appearance:none;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;cursor:pointer;touch-action:manipulation;flex-shrink:0}
#group-messages .sengoku-profile-button img{display:block;width:100%;height:100%;object-fit:cover}
#group-messages .sengoku-name-profile{appearance:none;-webkit-appearance:none;margin:0;padding:0;background:transparent;border:0;border-radius:0;color:inherit;font:inherit;font-size:inherit;font-weight:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
@media(max-width:390px){#group-members .group-members-avatar{width:38px;height:38px}}
</style>

<style id="sengoku-speaker-layout-fix-20261107">
/* Himiko's #group-view .group-reply-name intentionally has width:0. Its direct
   span.group-name-label supplies intrinsic width; a bare button does not.
   Keep the clickable name INSIDE this span, never as the direct grid child. */
#group-view #group-messages .group-reply-name > span.group-name-label{
 display:block; width:max-content; max-width:calc(100vw - 90px);
 white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
 overflow-wrap:normal; line-height:16px;
}
#group-view #group-messages .group-reply-name .sengoku-name-profile{
 display:inline; width:auto; min-width:0; max-width:none;
 white-space:nowrap; line-height:inherit; vertical-align:baseline;
}
#group-view #group-messages .group-reply-name .group-reply-period{
 display:inline; max-width:none; white-space:nowrap; overflow-wrap:normal;
 vertical-align:baseline;
}
#group-view #group-search-close svg{width:20px;height:20px;display:block}
#group-view #group-search-clear svg{width:16px;height:16px;display:block}
</style>
<style id="sengoku-initial-theme-background">
 html,body{background:#fffcf7!important}
 html[data-persona="cyber"],html[data-persona="cyber"] body{background:#080d20!important}
 </style>
<style id="sengoku-bottom-alignment-20261107">
/* Himiko group already reserves bottom space in the messages scroller itself.
   Sengoku added a second 24px inset to messages-inner, leaving its last bubble
   noticeably higher. Remove only that duplicate inset. The explanation bar
   retains its existing height and scrolling behavior. */
#group-view #group-messages > #group-messages-inner{padding-bottom:0!important}
</style>
</head>
