<!doctype html>
<html lang="ja" data-chat-open="true" data-group-open="true" data-persona="neko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
 <meta name="referrer" content="same-origin">
 <meta name="theme-color" content="#fffcf7">
 <title>戦国の反省会 | JUKEN CAMP</title>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
 <link rel="stylesheet" href="sengoku-chat/original-chat.css?v=1">
 <link rel="stylesheet" href="sengoku-chat/room.css?v=ui20261107-2">
 <script src="sengoku-chat/schedule-core.js?v=1" defer></script>
 <script src="sengoku-chat/room.js?v=ui20261107-2" defer></script>
</head>
<body>
<section id="group-view" aria-label="戦国の反省会・閲覧専用">
 <header class="chat-header">
  <button type="button" id="back" class="back-btn" aria-label="グルチャ一覧に戻る">＜</button>
  <div class="group-heading">
   <span id="group-header-avatar" class="chat-avatar sengoku-avatar-placeholder" aria-hidden="true"></span>
   <div class="group-heading-text"><span id="group-title">戦国の反省会</span><span id="sengoku-period-badge">期間限定</span></div>
  </div>
  <div class="group-header-actions">
   <button type="button" id="group-search-toggle" class="chat-reset" aria-label="会話を検索" title="会話を検索" aria-expanded="false" aria-controls="group-search-form"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
   <button type="button" id="group-members-direct" class="chat-reset" aria-label="参加者一覧" title="参加者一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="7.5" cy="8" r=".8" stroke="none" fill="currentColor"/><circle cx="7.5" cy="12" r=".8" stroke="none" fill="currentColor"/><circle cx="7.5" cy="16" r=".8" stroke="none" fill="currentColor"/><path d="M11 8h6M11 12h6M11 16h6"/></svg></button>
  </div>
  <form id="group-search-form" class="group-search-header" role="search" aria-label="会話を検索" hidden>
   <div class="group-search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input type="search" id="group-search-input" placeholder="会話を検索" enterkeyhint="search" aria-label="検索キーワード"><button type="button" id="group-search-clear" class="group-search-icon-button" aria-label="検索語を消す" hidden>×</button></div>
   <button type="button" id="group-search-close" class="group-search-icon-button" aria-label="検索を閉じる">×</button>
  </form>
 </header>
 <div id="sengoku-preview-controls" hidden aria-label="台本テスト再生">
  <button type="button" id="sengoku-preview-play">▶ 自動再生</button><button type="button" id="sengoku-preview-next">次の1件</button><button type="button" id="sengoku-preview-reset">最初へ</button>
  <button type="button" id="sengoku-preview-day1">Day 1まで</button><button type="button" id="sengoku-preview-day2">Day 2まで</button><button type="button" id="sengoku-preview-day3">Day 3まで</button><button type="button" id="sengoku-preview-all">全314件</button><span id="sengoku-preview-progress" aria-live="polite"></span>
 </div>
 <div id="group-messages" class="messages" role="log" aria-live="polite" tabindex="0"><div id="group-messages-inner" class="messages-inner"><p id="sengoku-empty">会話はこれから始まるぜ！</p></div></div>
 <div id="sengoku-explanation" role="region" aria-label="選択した発言の解説"><div id="sengoku-explanation-text" aria-live="polite"></div></div>
 <!-- There is intentionally NO input-area, textarea, form or send button. -->
 <div id="group-members" hidden>
  <header class="members-header"><button id="group-members-back" class="back-btn" type="button" aria-label="チャットに戻る">＜</button><div class="members-heading"><span class="group-members-avatar sengoku-avatar-placeholder" aria-hidden="true"></span><h2 class="members-title">戦国の反省会</h2></div></header>
  <div class="members-scroll"><div id="group-member-list"></div></div>
 </div>
</section>
</body>
</html>
